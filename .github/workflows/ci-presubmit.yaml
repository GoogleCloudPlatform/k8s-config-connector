      - name: "Verify container shards completion"
        run: |
          if [[ "${PREPARE_RESULT}" != "success" ]]; then
            echo "ERROR: prepare-test-matrix ended with result: ${PREPARE_RESULT}"
            exit 1
          fi
          if [[ "${PRIORITY_RESULT}" != "success" && "${PRIORITY_RESULT}" != "skipped" ]]; then
            echo "ERROR: priority-e2e-fixtures ended with result: ${PRIORITY_RESULT}"
            exit 1
          fi
          if [[ "${MATRIX_RESULT}" != "success" && "${MATRIX_RESULT}" != "skipped" ]]; then
            echo "ERROR: tests-e2e-fixtures-matrix ended with result: ${MATRIX_RESULT}"
            exit 1
