        run: chmod +x bin/* || true
      - uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2.1.4
        with:
          version: '546.0.0'
          install_components: 'alpha,beta'
      - name: "Run scenario test for ${{ matrix.suite }}"
        run: |
          ./dev/ci/presubmits/tests-scenarios-suite "${TARGET_SUITE}"
        env:
          TARGET_SUITE: ${{ matrix.suite }}
          ARTIFACTS: /tmp/artifacts
      - name: "Upload artifacts"
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: ${{ !cancelled() }}
        with:
          name: artifacts-tests-scenarios-${{ matrix.suite }}
          path: /tmp/artifacts/

  unit-tests-matrix:
    name: "unit-tests-${{ matrix.shard }}"
    runs-on: ubuntu-latest
    needs: prepare-test-matrix
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare-test-matrix.outputs.unit_tests_json) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free up disk space
        run: dev/tasks/free-disk-space-on-github-actions-runner
# zizmor: ignore[unpinned-uses]
      - uses: ./dev/actions/cache-go
      - uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2.1.4
        with:
          version: '546.0.0'
          install_components: 'alpha,beta'
      - name: "Run dev/ci/presubmits/unit-tests"
        run: |
          ./dev/ci/presubmits/unit-tests "${{ matrix.shard }}"
        env:
          ARTIFACTS: /tmp/artifacts
      - name: "Upload artifacts"
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: ${{ !cancelled() }}
        with:
          name: artifacts-unit-tests-${{ matrix.shard }}
          path: /tmp/artifacts/

  # Note: Collector job added to satisfy GitHub Branch Protection required check name for unit-tests (mostly a hack for branch protection)
  unit-tests:
    name: "unit-tests"
    runs-on: ubuntu-latest
    needs: unit-tests-matrix
    if: ${{ !cancelled() && !contains(needs.unit-tests-matrix.result, 'failure') }}
    steps:
      - name: "Verify unit-tests completion"
        run: echo "All unit-test matrix shards completed successfully."

  unit-tests-operator-matrix:
    name: "unit-tests-operator-${{ matrix.shard }}"
    runs-on: ubuntu-latest
    needs: prepare-test-matrix
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare-test-matrix.outputs.unit_tests_operator_json) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free up disk space
        run: dev/tasks/free-disk-space-on-github-actions-runner
# zizmor: ignore[unpinned-uses]
      - uses: ./dev/actions/cache-go
      - uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2.1.4
        with:
          version: '546.0.0'
          install_components: 'alpha,beta'
      - name: "Run dev/ci/presubmits/unit-tests-operator"
        run: |
          ./dev/ci/presubmits/unit-tests-operator "${{ matrix.shard }}"
        env:
          ARTIFACTS: /tmp/artifacts
      - name: "Upload artifacts"
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: ${{ !cancelled() }}
        with:
          name: artifacts-unit-tests-operator-${{ matrix.shard }}
          path: /tmp/artifacts/

  # Note: Collector job added to satisfy GitHub Branch Protection required check name for unit-tests-operator (mostly a hack for branch protection)
  unit-tests-operator:
    name: "unit-tests-operator"
    runs-on: ubuntu-latest
    needs: unit-tests-operator-matrix
    if: ${{ !cancelled() && !contains(needs.unit-tests-operator-matrix.result, 'failure') }}
    steps:
      - name: "Verify unit-tests-operator completion"
        run: echo "All unit-tests-operator matrix shards completed successfully."

  validate-ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
# zizmor: ignore[unpinned-uses]
      - uses: ./dev/actions/cache-go
      - name: "Run dev/ci/presubmits/validate-ensure"
        run: |
          ./dev/ci/presubmits/validate-ensure
        env:
