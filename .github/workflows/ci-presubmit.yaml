      - name: "Upload artifacts"
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: ${{ !cancelled() }}
        with:
          name: artifacts-validate-resource-docs
          path: /tmp/artifacts/


  validate-untested-fields:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: "Run dev/ci/presubmits/validate-untested-fields"
        run: |
          ./dev/ci/presubmits/validate-untested-fields
        env:
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          ARTIFACTS: /tmp/artifacts
      - name: "Upload artifacts"
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: ${{ !cancelled() }}
        with:
          name: artifacts-validate-untested-fields
          path: /tmp/artifacts/


  presubmit-gatekeeper:
    name: presubmit-gatekeeper
    needs:
      - prepare-test-matrix
      - capture-pprof
      - fuzz-roundtrippers-matrix
      - fuzz-roundtrippers
      - golangci-lint
      - license-lint
      - run-linters
      - smoketest-with-kind-matrix
      - smoketest-with-kind
      - test-mockgcp-matrix
      - test-mockgcp
      - test-pause
      - tests-e2e-direct-iam
      - priority-e2e-fixtures
      - tests-e2e-fixtures-matrix
      - tests-e2e-fixtures-compute
      - tests-e2e-fixtures-sql
      - tests-e2e-fixtures-container
      - tests-e2e-fixtures-bigquery
      - tests-e2e-samples-matrix
      - tests-gcptracker
      - tests-preview
      - tests-scenarios-matrix
      - unit-tests-matrix
      - unit-tests
      - unit-tests-operator-matrix
      - unit-tests-operator
      - validate-ensure
      - validate-fmt
      - validate-generated-files
      - validate-github-actions
      - validate-manifests
      - validate-resource-docs
      - validate-untested-fields
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }} # Ensure this runs even if some dependencies fail, but not if the workflow is cancelled
    steps:
      - name: Verify all checks succeeded
        run: |
          echo "Analyzing job results..."

          # Find any job whose result is 'failure' or 'cancelled' (ignoring 'success' and 'skipped')
          failures=$(echo "$NEEDS_RESULTS" | jq '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")]')
          
          if [ "$(echo "$failures" | jq '. | length')" -ne 0 ]; then
            echo "ERROR: One or more checks failed or were cancelled:"
            echo "$failures" | jq '.[] | {job: .key, result: .value.result}'
            exit 1
          fi
          echo "All checks completed successfully or were skipped safely!"
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
