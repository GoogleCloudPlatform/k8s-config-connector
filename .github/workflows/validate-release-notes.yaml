name: validate-release-notes

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-release-notes:
    name: Validate PR Release Note
    runs-on: ubuntu-latest
    steps:
      - name: Validate Release Note Block
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const pr = context.payload.pull_request;
            const sender = context.payload.sender?.login || '';

            // 1. Bypass validation for automated bots
            if (sender.endsWith('[bot]') || ['k8s-infra-cherrypick-robot', 'google-cla'].includes(sender)) {
              console.log(`Bypassing release note check for automated bot: ${sender}`);
              return;
            }

            const body = pr.body || '';

            // 2. Extract ```release-note ... ``` block
            const match = body.match(/```release-note\s*([\s\S]*?)\s*```/i);
            if (!match) {
              core.setFailed(
                'Pull Request description is missing a ```release-note code block.\n' +
                'Please fill in the release note block or specify "NONE" in the PR description.'
              );
              return;
            }

            // 3. Strip HTML comments (which are instruction comments from the template)
            const content = match[1].replace(/<!--[\s\S]*?-->/g, '').trim();

            // 4. Validate non-empty content
            if (content.length === 0) {
              core.setFailed(
                'The ```release-note code block is empty.\n' +
                'Please provide a release note describing your changes, or specify "NONE" (or "None") if no release note is needed.'
              );
              return;
            }

            console.log(`Release note validation succeeded:\n${content}`);

  validate-release-notes-files:
    name: Validate Release Notes Docs & Links
    runs-on: ubuntu-latest
    steps:
      - name: Check Changed Release Notes Files
        id: changes
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const activePaths = files
              .filter(f => f.status !== 'removed')
              .map(f => f.filename);
            const noteFiles = activePaths.filter(p =>
              /^docs\/releasenotes\/release-.*\.md$/.test(p)
            );
            const toolTouched = activePaths.some(p =>
              /^dev\/tasks\/gather[-_]release[-_]notes/.test(p) ||
              p === '.github/workflows/validate-release-notes.yaml'
            );
            core.setOutput('run_checks', (noteFiles.length > 0 || toolTouched) ? 'true' : 'false');
            core.setOutput('note_files', noteFiles.join('\n'));

      - name: Checkout Repository
        if: steps.changes.outputs.run_checks == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run gather_release_notes Unit Tests
        if: steps.changes.outputs.run_checks == 'true'
        run: python3 -B dev/tasks/gather_release_notes_test.py -v

      - name: Check Drafted Release Notes Files
        if: steps.changes.outputs.note_files != ''
        env:
          NOTE_FILES: ${{ steps.changes.outputs.note_files }}
        run: |
          set -euo pipefail
          while IFS= read -r note_file; do
            [[ -z "${note_file}" ]] && continue
            ver="${note_file#docs/releasenotes/release-}"
            ver="${ver%.md}"
            target_ref=""
            if git rev-parse --verify --quiet "refs/tags/v${ver}" >/dev/null; then
              target_ref="v${ver}"
            else
              target_ref="$(git tag --list "v${ver}.*" --sort=-v:refname | head -n 1)"
            fi
            if [[ -z "${target_ref}" ]]; then
              target_ref="HEAD"
            fi
            echo "Validating ${note_file} against ${target_ref}..."
            ./dev/tasks/gather-release-notes "${target_ref}" "${target_ref}" --check-notes "${note_file}"
          done <<< "${NOTE_FILES}"
