# Issue graph for onboarding a KCC greenfield resource Kind to a
# production-ready direct controller at v1alpha1.
#
# Replaces .agents/workflows/kcc-greenfield.txt (an LLM-driven
# `mode: workflow`). The factory watch graph reconciler opens one sub-issue
# per step, in order, as the previous one closes; no orchestrator sandbox,
# journal branch or precondition script is involved. See
# https://github.com/gke-labs/gemini-for-kubernetes-development/blob/main/factory/design/issue-graph.md
#
# Start a graph by filing a parent issue (trigger-labelled or assigned to
# the bot) whose body contains:
#
#   ```factory-graph
#   graph: kcc-greenfield
#   params:
#     kind: SpannerInstanceConfig
#   ```
#
# If the Kind is already prepopulated on master (it has an open
# `untriaged-bulk-generation` entry in apis/<service>/judgement_queue.yaml),
# use `graph: kcc-greenfield-prepopulated` instead. It starts at Step 1b, so no
# agent has to decide to skip Step 1a. Keep the steps the two files share in
# sync.
#
# Validate changes with: factory graph validate .agents/graphs/kcc-greenfield.yaml
apiVersion: factory.gemini.google.com/v1alpha1
kind: IssueGraph
metadata:
  name: kcc-greenfield
  description: >-
    Drive a KCC greenfield resource Kind to a production-ready direct
    controller at v1alpha1: types and identity, controller and fuzzer,
    MockGCP, MockGCP/RealGCP alignment, then release.
spec:
  params:
    - name: kind
      description: CamelCase KCC Kind (for example SpannerInstanceConfig)
      pattern: '^[A-Z][A-Za-z0-9]{1,62}$'
      example: SpannerInstanceConfig

  # One step at a time: each step builds on the previous step's merged PR.
  maxActive: 1

  # The deployment's trigger label (overseer) is always added by the
  # reconciler; a step's `review` adds the review label (overseer/review).
  defaults:
    labels: [greenfield]

  steps:
    # Step 1a. Only for Kinds not yet prepopulated on master; the others use
    # kcc-greenfield-prepopulated.
    - id: prepopulate
      title: 'Greenfield: Prepopulate direct KRM types, identity, and judgement queue for {{ .Params.kind }}'
      labels: [step/gen-types]
      review: |
        Use .gemini/skills/reviewgen-greenfield-new-types/SKILL.md to conduct the review.
      body: |
        Prepopulate the initial direct KRM types, identity, and `judgement_queue.yaml` for {{ .Params.kind }}.

        **First, check that {{ .Params.kind }} isn't already prepopulated**: your checkout is already the latest `master`, so search it: `grep -n "kind: {{ .Params.kind }}$" apis/*/judgement_queue.yaml`. If that finds it, don't change anything: make no commit, and say that {{ .Params.kind }} is already prepopulated (naming the file). A maintainer will close this issue.

        Otherwise:

        Please follow the skill `.gemini/skills/kcc-direct-greenfield-types-implementer/SKILL.md` (Step 1a: `prepopulate/SKILL.md`, using `--prepopulate-resource`) for prepopulating types and `judgement_queue.yaml` for {{ .Params.kind }}.
        Please follow the skill `.gemini/skills/kcc-identity-reference/SKILL.md` for generating identity for {{ .Params.kind }}.

        Validate your changes locally by running `scripts/validate-prereqs.sh`. If it fails, its output contains hints for fixing the errors.

        Don't edit any `SKILL.md` in this PR. Put general learnings in a "Workflow feedback" section of the PR description, and service-specific notes in `.gemini/journals/<service_name>.md` (Tier 2 of `.gemini/skills/kcc-agentic-journaler/SKILL.md`).

        When creating the PR, include the release note block set to NONE:
        ```release-note
        NONE
        ```

    # Step 1b.
    - id: types-judgement
      after: [prepopulate]
      title: 'Greenfield: Triage judgement queue and finalize direct KRM types and identity for {{ .Params.kind }}'
      labels: [step/types-judgement]
      review: |
        Use .gemini/skills/reviewgen-greenfield-new-types/SKILL.md to conduct the review.
      body: |
        {{ .Params.kind }} is prepopulated on `master` (by bulk prepopulation, or by the previous step). Triage `apis/<service>/judgement_queue.yaml` and finalize the KRM types, identity files, and reference files (plus the generated controller and fuzzer if already present on `master`) for {{ .Params.kind }}.

        **First, check that this step applies**: if `apis/<service>/v1alpha1/<kind_lowercase>_types.go` exists in your checkout but `apis/<service>/judgement_queue.yaml` has no `open` `untriaged-bulk-generation` entry for {{ .Params.kind }}, it was finalized by a legacy Step 1 PR. Then don't change anything: make no commit, and say so (naming the types file). A maintainer will close this issue.

        Otherwise:

        Please follow the skill `.gemini/skills/kcc-direct-greenfield-types-implementer/SKILL.md` (which routes to `judgement/SKILL.md`) to triage `judgement_queue.yaml` and finalize direct KRM types for {{ .Params.kind }}.
        Please follow the skill `.gemini/skills/kcc-identity-reference/SKILL.md` for verifying and finalizing identity and reference types for {{ .Params.kind }}.
        If {{ .Params.kind }} is a child resource, model its parent as one required, immutable `spec.parentRef`, reusing the parent's existing `<ParentKind>Ref` from wherever it is under `apis/` (`judgement/references/PARENT_AND_IDENTITY.md`, Case B).

        Validate your changes locally by running `scripts/validate-prereqs.sh`. If it fails, its output contains hints for fixing the errors.

        Don't edit any `SKILL.md` in this PR. Put general learnings in a "Workflow feedback" section of the PR description, and service-specific notes in `.gemini/journals/<service_name>.md` (Tier 2 of `.gemini/skills/kcc-agentic-journaler/SKILL.md`).

        When creating the PR, include the release note block set to NONE:
        ```release-note
        NONE
        ```

    # Step 2.
    - id: controller
      after: [types-judgement]
      title: 'Greenfield: Implement direct controller, E2E fixtures, and fuzzer for {{ .Params.kind }}'
      labels: [step/controller]
      review: |
        Use .gemini/skills/reviewgen-greenfield-controller/SKILL.md to conduct the review.
      body: |
        Please follow the skill `.gemini/skills/kcc-direct-controller-logic-greenfield-implementer/SKILL.md` to autogenerate (or verify) the direct controller and fuzzer via `apis/<service>/generate.sh` (`--prepopulate-resource`) and record/verify E2E fixtures against real GCP for {{ .Params.kind }}.

        Don't edit any `SKILL.md` in this PR. Put general learnings in a "Workflow feedback" section of the PR description, and service-specific notes in `.gemini/journals/<service_name>.md` (Tier 2 of `.gemini/skills/kcc-agentic-journaler/SKILL.md`).

        When creating the PR, include the release note block set to NONE:
        ```release-note
        NONE
        ```

    # Step 3.
    - id: mockgcp
      after: [controller]
      title: 'Greenfield: Implement MockGCP and Alignment for {{ .Params.kind }}'
      labels: [step/mockgcp]
      review: |
        Use .gemini/skills/reviewgen-greenfield-mockgcp/SKILL.md to conduct the review.
      body: |
        Please follow the skill `.gemini/skills/kcc-direct-mockgcp-implementer/SKILL.md` to implement Phase 3 (MockGCP and Alignment) for {{ .Params.kind }} to verify behavioral correctness against the simulated GCP services.

        The direct controller and E2E fixtures were added in #{{ (step "controller").Issue }}.

        When creating the PR, include the release note block set to NONE (the release step adds the new-resource note):
        ```release-note
        NONE
        ```

    # Step 4.
    - id: mockgcp-alignment
      after: [mockgcp]
      title: 'Greenfield: Align MockGCP logs with RealGCP for {{ .Params.kind }}'
      labels: [step/mockgcp-alignment]
      review: |
        Use .gemini/skills/reviewgen-greenfield-mockgcp/SKILL.md to conduct the review.
      body: |
        Please follow the skill `.gemini/skills/match-mockgcp-with-realgcp/SKILL.md` to align the MockGCP logs with the RealGCP output for {{ .Params.kind }}.

        MockGCP for {{ .Params.kind }} was implemented in #{{ (step "mockgcp").Issue }}.

        When creating the PR, include the release note block set to NONE:
        ```release-note
        NONE
        ```

  # Created once every other step is done: ships the Kind.
  finally:
    title: 'Greenfield: Release {{ .Params.kind }} (remove it from BLOCKED_KINDS)'
    labels: [step/release]
    review: |
      Use .gemini/skills/reviewgen-greenfield-release/SKILL.md to conduct the review.
    body: |
      Every other step for {{ .Params.kind }} is done. Release it:

      1. Check that every fixture of {{ .Params.kind }} under `pkg/test/resourcefixture/testdata/basic/` has a real-GCP `_http.log`, an `_audit_probe.log` and an `_http_mock.log`. If any is missing, don't change anything: make no commit, and list what's missing.
      2. Remove `"{{ .Params.kind }}"` from the `BLOCKED_KINDS=( ... )` array in `dev/tasks/build-release-bundle`. Change nothing else.

      When creating the PR, include this release note block:
      ```release-note
      New Alpha Resources (Direct Reconciler): `{{ .Params.kind }}`
      ```
