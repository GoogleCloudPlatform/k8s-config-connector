# Issue graph for validating one Kind's controller the way a person would, against real GCP,
# focused on what changed in a window of master. The children of a "Verify changed Kinds" batch
# (opened on a schedule by .agents/verify-changes.md from hack/manual-validate/changed_kinds.py) start it:
#
#   ```factory-graph
#   graph: kcc-manual-validate
#   params:
#     kind: "SQLBlueGreenDeployment"
#     change: "**SQLBlueGreenDeployment** - new: direct controller added in the window (#16145)"
#     base: "<sha>"
#     head: "<sha>"
#   ```
#
# The step writes or extends hack/manual-validate/<kind>/validate.sh (the reusable artifact) and
# runs it; the receipts stay in artifactz/ (gitignored) and only the report summary is posted.
#
# Validate changes with: factory graph validate .agents/graphs/kcc-manual-validate.yaml
apiVersion: factory.gemini.google.com/v1alpha1
kind: IssueGraph
metadata:
  name: kcc-manual-validate
  description: >-
    Validate one Kind's controller against real GCP the way a person would - kubectl apply,
    then check every step out of band with gcloud/bq, REST and audit logs - for what changed
    in a window of master.
spec:
  params:
    - name: kind
      description: CamelCase KCC Kind (for example SQLBlueGreenDeployment)
      pattern: '^[A-Z][A-Za-z0-9]{1,62}$'
      example: SQLBlueGreenDeployment
    - name: change
      description: >-
        What changed for the Kind in the window, as the change scout wrote it (its item line:
        letters, digits, spaces and * : ; , . ( ) # _ / - only)
      pattern: '^[A-Za-z0-9 *:;,.()#_/-]{0,400}$'
      required: false
      default: ""
      example: "**SQLBlueGreenDeployment** - new: direct controller added in the window (#16145)"
    - name: base
      description: Start of the window on master (exclusive), a full commit SHA
      pattern: '^([0-9a-f]{40})?$'
      required: false
      default: ""
      example: 96cfbe9d6cd6c776909d409e220d8c9cbfee3bdc
    - name: head
      description: End of the window on master, a full commit SHA
      pattern: '^([0-9a-f]{40})?$'
      required: false
      default: ""
      example: 9bd78726f503cd7cce86bf3cc9b7ca19cda31928

  maxActive: 1

  defaults:
    labels: [validate]

  steps:
    - id: validate
      # The Kind's script already covers the change and passes: no commit; the step's issue is
      # closed with the report in the closing comment.
      no-change: ok
      title: 'Manual validation: {{ .Params.kind }} against real GCP'
      labels: [step/manual-validate]
      review: |
        Review the Kind's hack/manual-validate/<kind lowercase>/validate.sh with
        .gemini/skills/manual-validate-controller/SKILL.md: every check must compare the applied
        object with a value read from GCP outside KCC (REST, gcloud/bq, audit logs), never KCC
        status; the change named in the PR description must be covered; cleanup must leak-check.
        The tests are cumulative: compare with the script and fixtures/ on master - no existing
        check or fixture variant may be removed or weakened, unless the API itself removed or
        changed what it checks and the PR description says so. The PR's report must cover the
        default fixture and every variant under fixtures/.
        The PR must not touch the controller, the types, or any test fixture or golden file.
      body: |
        Validate the {{ .Params.kind }} controller against real GCP, the way a person would, and
        leave a reusable script. Follow `.gemini/skills/manual-validate-controller/SKILL.md`; the
        reference script is `hack/manual-validate/bigqueryrowaccesspolicy/validate.sh`.

        **What changed** (master {{ .Params.base }}..{{ .Params.head }}): {{ .Params.change }}

        **First, check the harness is here**: if `hack/manual-validate/lib.sh` or the skill is
        missing from your checkout, stop: change nothing and answer with `blocked: true`, saying
        the manual-validation harness is not on master yet.

        Then:

        1. **Read the change.** `git log --oneline {{ .Params.base }}..{{ .Params.head }} -- apis pkg/controller/direct`
           and `git diff {{ .Params.base }}..{{ .Params.head }}` on {{ .Params.kind }}'s files
           (its `*_types.go`, controller, mapper, identity). Note every spec field added, removed or
           changed, and any changed behaviour (create, update, delete, how a field is sent).
        2. **Write or extend the script** `hack/manual-validate/<kind lowercase>/validate.sh`:
           - It does not exist: write it from the Kind's `-maximal` (or `-full`) fixture under
             `pkg/test/resourcefixture/testdata/`, as the skill describes.
           - It exists: extend it so the change is checked - a new or changed field is set in the
             manifest the script applies (a fixture variant under
             `hack/manual-validate/<kind lowercase>/fixtures/` if the test fixture does not set it),
             compared to the value read from GCP after create, and changed in the update phase if it
             is mutable. A removed field: check the script no longer sets it and the resource still
             works.
           - **The tests are cumulative: add, never replace.** Keep every existing check and every
             fixture variant under `fixtures/` as it is. Change or remove one only when the API itself
             removed or changed what it checks (a field removed in this change), and say which and
             why in the PR description. Previous batches built this script; it must still check
             everything it checked before, plus this change.
           - Never edit test fixtures, golden files, `_http.log`, the controller or the types.
        3. **Run it** from a clean start, in this sandbox's project, once with the default fixture
           and once per variant under `hack/manual-validate/<kind lowercase>/fixtures/`:
           ```bash
           GCP_PROJECT_ID="${GCP_PROJECT_ID}" hack/manual-validate/<kind lowercase>/validate.sh
           for v in hack/manual-validate/<kind lowercase>/fixtures/*/; do
             [ -d "$v" ] || continue
             FIXTURE_DIR="$v" GCP_PROJECT_ID="${GCP_PROJECT_ID}" hack/manual-validate/<kind lowercase>/validate.sh
           done
           ```
           (allow 30 minutes or more per run). Each run writes its own
           `artifactz/manual-validation/<Kind>/<time>/REPORT.md`.
           A failure caused by the script (wrong URL, jq path, eventual consistency) is yours to fix
           and re-run, at most 3 times. A failure caused by the controller is a finding: keep the
           check, do not weaken it.
        4. **Report.** Commit only the script and any fixture variants (never `artifactz/` or
           `.build/`). Put the summary in the PR description (or, with no commit, in your answer):
           - `Verdict: PASS|FAIL - N passed, M failed` for each run (the default fixture and each
             variant, by name), with its start and end time; the overall verdict is FAIL if any run
             failed;
           - each run's REPORT table rows (phase, check, result, detail), with email addresses and
             the project number removed;
           - which checks and variants are new for this change, and any existing check changed or
             removed because the API changed (with why);
           - **Controller bugs**: each failure the controller caused, with the check and the values
             it saw; or "none";
           - what could not be checked out of band, and why.
           If the controller is broken for this change, say so plainly; do not fix it here.

        When creating the PR, include the release note block set to NONE:
        ```release-note
        NONE
        ```
