# Files the controller bugs and script mistakes a validate-kind PR's failures show. A PR graded
# overseer/assessment/poor (its clean re-run had a FAIL, skipped a variant, or
# changed files outside its Kind's directory) gets the file-validate-bug recipe:
# a session that did not write the test reads the receipts and classes each
# failure - a controller bug, the script's own mistake, or a limit of the
# environment or service - and files the controller bugs (validate-kind/bug)
# and the script mistakes (validate-kind/bug plus overseer/validate-kind, which
# the validate-kind rule picks up to fix and re-run the script), once per key
# (factory's open-issues: an open issue with the key gets a comment instead).
# An environment limit is only said in the comment. The PR gets one comment listing what was filed and why the
# rest was not. Once per head.
name: file-validate-bug
description: File the controller bugs and script mistakes a validate-kind PR's failing checks show, once per bug
on: pr
order: 74
when:
  author: pool
  labels:
    all: [overseer/validate-kind, overseer/assessment/poor]
    none: [overseer/stop, do-not-merge/hold]
run:
  recipe: file-validate-bug
  apply: open-issues
policy:
  dedupe: head
  cooldown:
    failure: 1h
  give-up:
    attempts: 3
    since: [head, pause]
    failed: true
    comment: Pausing after 3 failed attempts to file this validation's bugs. Take overseer/stop off to try again.
