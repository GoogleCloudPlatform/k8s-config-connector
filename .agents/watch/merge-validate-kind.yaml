# Merges a validate-kind PR (a Kind's validation script from a verification batch) that is opted
# in and graded good. The validate-kind recipe grades it mechanically from its clean re-run:
# overseer/assessment/good only if every run passed with no failure, every fixture variant ran,
# and the PR changes nothing but that Kind's hack/manual-validate/<kind>/ files. A FAIL - a
# controller finding - is graded poor and left to people. overseer/auto-merge comes from the
# batch (hack/manual-validate/open-batch.sh; AUTO_MERGE=0 leaves it off).
name: merge-validate-kind
description: Merge a validate-kind PR opted in and graded good by its clean re-run, with green checks
on: pr
order: 82
when:
  labels:
    all: [overseer/auto-merge, overseer/validate-kind, overseer/ready-for-human, overseer/assessment/good]
    none: [do-not-merge/hold, overseer/stop]
  checks: green
  mergeable: true
  draft: false
  changes-requested: false
run:
  recipe: merge
  inputs:
    # The approving review. prow reads commands in it, one per line, at the start of the line.
    message: |
      /lgtm
      /approve

      Approved for merge by the overseer: this validation PR meets the criteria for approval - its clean re-run passed every check (graded good by validate-kind), it changes only its Kind's hack/manual-validate files, its checks are green, and it is mergeable.
policy:
  # As merge-controller: no dedupe, so a merge the queue drops runs again after the cooldown; a new
  # head ends the wait at once; give up after 6 runs at one head.
  cooldown:
    success: 30m
    failure: 20m
    reset-on: [head]
  give-up:
    attempts: 6
    since: [head, pause]
    comment: Pausing auto-merge after 6 attempts at this head. Take overseer/stop off to let the overseer try again, or merge it by hand.
