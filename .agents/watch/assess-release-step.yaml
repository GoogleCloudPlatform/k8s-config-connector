# assess-release-step: a greenfield release PR whose Kind's controller was
# merged earlier (the graph's controller step was done outside it, or closed
# needing no change), so no step/controller PR of this graph carries a grade,
# is graded on the same real-GCP evidence as a controller step: the
# assess-controller recipe reads the Kind's fixtures, the Cloud Audit Log
# entries for the mutations they record, and the audit probe markers, from
# the base branch's scripts, and labels the PR good, fair or poor. With good,
# merge-release (and overseer/auto-merge) merges it.
#
# Not a PR that also carries the controller's work (step/controller): its
# controller step's assessment stands (assess-controller-step). Nor one that
# carries the types-judgement step's (step/types-judgement, a grouped graph
# with no gate): assess-types-judgement grades that one, so a PR is never
# graded twice.
name: assess-release-step
description: Grade a greenfield release PR without a controller step of its own on the Kind's real-GCP evidence
on: pr
order: 73
when:
  author: pool
  labels:
    all: [step/release, greenfield]
    none: [step/controller, step/types-judgement]
  mergeable: true
  checks: green
  feedback: none
  any-of:
    - reviewed-at-head: true
      changes-requested: false
    - labels: {all: [overseer/ready-for-human]}
run:
  recipe: assess-controller
  apply: [comment, label]
  on-start:
    unlabel: [overseer/assessment/good, overseer/assessment/fair, overseer/assessment/poor]
policy:
  dedupe: head
  cooldown:
    success: 1h
    failure: 1h
