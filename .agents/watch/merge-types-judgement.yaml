# merge-types-judgement: a greenfield Step 1b PR (step/types-judgement) that
# the overseer handed to people and assess-types-judgement graded good is
# merged by the merger once its checks are green, it is mergeable, not a
# draft, not held, and nobody asked for changes: factory's merge recipe
# approves it - the review's text carries prow's /lgtm and /approve - and
# sets auto-merge at the head it checked, which the merge queue takes.
#
# Opt-in: only a PR labelled overseer/auto-merge is merged; take the label
# off to keep a PR for a person.
#
# Retries: the merge queue can drop a PR after auto-merge is set. The rule
# then runs again an hour after its last run, and gives up (overseer/stop
# and a comment) after 6 runs at one head.
#
# Order 80: after factory's PR rules and the assessments (70, 71), which
# put the grade on first.
name: merge-types-judgement
description: Merge a Step 1b PR opted in (overseer/auto-merge) and graded good, with green checks
on: pr
order: 80
when:
  labels:
    all: [overseer/auto-merge, step/types-judgement, greenfield, overseer/ready-for-human, overseer/assessment/good]
    none: [do-not-merge/hold, overseer/stop]
  checks: green
  mergeable: true
  draft: false
  changes-requested: false
run:
  recipe: merge
  inputs:
    # The approving review. prow reads commands in it, one per line, at
    # the start of the line.
    message: |
      /lgtm
      /approve

      Approved for merge by the overseer: this Step 1b PR meets the criteria for approval - assess-types-judgement graded it good, its checks are green, and it is mergeable.
policy:
  # No dedupe: an auto-merge the queue drops (a flaky check, a conflict)
  # leaves the PR open with this rule's when still holding, so it runs
  # again once the success cooldown is over. The merge recipe approves
  # once per head and re-sets auto-merge, which puts the PR back in the
  # queue. A PR in the queue gets nothing from any rule.
  # A merge run that fails is almost always transient: the PR conflicted
  # (another merged first) or a check was pending when it ran. A new head -
  # care-rebase, a fix - ends any wait at once; at the same head the merge is
  # tried again after 20m (a failure) or 30m (the queue dropped it). The
  # give-up below still stops a PR after 6 runs at one head.
  cooldown:
    success: 30m
    failure: 20m
    reset-on: [head]
  give-up:
    attempts: 6
    since: [head, pause]
    comment: Pausing auto-merge after 6 attempts at this head. Take overseer/stop off to let the overseer try again, or merge it by hand.
