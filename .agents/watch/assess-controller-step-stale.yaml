# assess-controller-step-stale: the assessment label assess-controller-step
# added is for the head it graded. When a new head arrives while the
# controller is still the PR's latest step (no step/mockgcp yet), the
# automated reviewer has not reviewed it yet (reviewed-at-head: false):
# the label comes off, so the graph's mockgcp step (which requires good or
# fair) waits, and assess-controller-step grades the new head once it is
# green and reviewed again.
#
# Once mockgcp has started on the PR (step/mockgcp), later pushes are its
# work, and the controller's assessment stays.
name: assess-controller-step-stale
description: Take a controller step's assessment label off when its PR moves to a new head
on: pr
order: 72
when:
  author: pool
  labels:
    all: [step/controller, greenfield]
    any: [overseer/assessment/good, overseer/assessment/fair, overseer/assessment/poor]
    none: [step/mockgcp]
  reviewed-at-head: false
run:
  unlabel: [overseer/assessment/good, overseer/assessment/fair, overseer/assessment/poor]
