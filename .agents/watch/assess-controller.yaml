# assess-controller: a greenfield Step 2 PR (step/controller) that the
# overseer has handed to people (overseer/ready-for-human) is graded on
# whether its E2E fixtures were really recorded against real GCP and tell
# the truth about that run (Cloud Audit Logs and the harness's audit probe
# markers, captured by a script), then on the review points maintainers
# raise: the assess-controller recipe comments its findings and adds one
# label, overseer/assessment/good, overseer/assessment/fair or
# overseer/assessment/poor. Once per head: a new head takes ready-for-human
# off (ready-unreview), and the next time it is handed over it is graded
# again, its old label taken off first.
#
# Order 71: after factory's PR rules (ready is 50, ready-unreview 60) and
# assess-types-judgement (70).
name: assess-controller
description: Grade a ready step/controller PR on real-GCP evidence and how likely it is to be approved as it is
on: pr
order: 71
when:
  labels:
    all: [step/controller, overseer/ready-for-human]
run:
  recipe: assess-controller
  apply: [comment, label]
  on-start:
    unlabel: [overseer/assessment/good, overseer/assessment/fair, overseer/assessment/poor]
policy:
  dedupe: head
  cooldown:
    success: 1h
    failure: 1h
