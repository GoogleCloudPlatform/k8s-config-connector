# brownfield-triage: a brownfield migration issue (direct-migration or
# workflow/migrate, excluding step/* child issues) labelled overseer/triage
# is checked for skip/access-gate patterns (shut down/sunset, deprecated or
# scheduled shutdown, deprecated with in-product replacement, duplicated in
# KCC, Early Access/allowlist-only) and migration readiness (API usability,
# proto/SDK availability, quota, fixtures/dependencies, lifecycle, state on
# master: the brownfield-triage recipe), and the result is commented on it:
# overseer/stop is added when it is skipped, blocked, or when the agent could
# not tell (the comment says what a person must check or why to close); when
# it is ready, overseer/graph is added, which starts its graph. Once the
# triage is posted, overseer/triage comes off and overseer/triaged goes on
# (it stays, to show the issue was triaged); adding overseer/triage again
# triages again.
#
# The trigger label (overseer) comes off too. A fan-out labels each child it
# starts overseer and counts it in flight while it has the label; once
# triaged, a ready child is its graph's parent (the graph does not need
# overseer, and fix leaves a graph's parent alone) and a blocked/skipped one
# waits under overseer/stop, so neither should hold a slot of the fan-out's
# window. The fan-out does not label a child it started again.
#
# To triage a stopped issue again, once its blocker is cleared: take
# overseer/stop off and add overseer/triage (the overseer skips an issue
# labelled overseer/stop), or add overseer/graph to start it straight away.
#
# Order 3: before factory's issue rules (workflow-missing is 5), so a
# triage asked for runs before anything else takes the issue. The
# overseer's gates skip an issue labelled overseer/stop. Needs a factory
# whose rules take a list under apply (gke-labs/gemini-for-kubernetes-development#2240).
name: brownfield-triage
description: Check whether a brownfield kind should be migrated, and comment and label it
on: issue
order: 4
when:
  labels:
    all: [overseer/triage, workflow/brownfield]
run:
  recipe: brownfield-triage
  apply: [comment, label]
  on-success:
    unlabel: [overseer/triage, "{{trigger}}"]
    label: [overseer/triaged]
policy:
  cooldown:
    success: 1h
    failure: 1h