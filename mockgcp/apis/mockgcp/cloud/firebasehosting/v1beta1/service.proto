service ProjectsServer {
}

service ProjectsSitesServer {

  // Creates a new Hosting Site in the specified parent Firebase project. Note that Hosting sites can take several minutes to propagate through Firebase systems.
  rpc CreateProjectsSite(CreateProjectsSiteRequest) returns (Site) {
    option (google.api.http) = {
      post: "/v1beta1/{parent=projects/*}/sites"
      body: "projects_site"
    };
  };

  // Deletes the specified Hosting Site from the specified parent Firebase project.
  rpc DeleteProjectsSite(DeleteProjectsSiteRequest) returns (Empty) {
    option (google.api.http) = {
      delete: "/v1beta1/{name=projects/*/sites/*}"
    };
  };

  // Gets the specified Hosting Site.
  rpc GetProjectsSite(GetProjectsSiteRequest) returns (Site) {
    option (google.api.http) = {
      get: "/v1beta1/{name=projects/*/sites/*}"
    };
  };

  // Gets the Hosting metadata for a specific site.
  rpc GetConfigProjectsSite(GetConfigProjectsSiteRequest) returns (SiteConfig) {
    option (google.api.http) = {
      get: "/v1beta1/{name=projects/*/sites/*/config}"
    };
  };

  // Lists each Hosting Site associated with the specified parent Firebase project.
  rpc ListProjectsSites(ListProjectsSitesRequest) returns (ListSitesResponse) {
    option (google.api.http) = {
      get: "/v1beta1/{parent=projects/*}/sites"
    };
  };

  // Updates attributes of the specified Hosting Site.
  rpc PatchProjectsSite(PatchProjectsSiteRequest) returns (Site) {
    option (google.api.http) = {
      patch: "/v1beta1/{name=projects/*/sites/*}"
      body: "projects_site"
    };
  };

  // Sets the Hosting metadata for a specific site.
  rpc UpdateConfigProjectsSite(UpdateConfigProjectsSiteRequest) returns (SiteConfig) {
    option (google.api.http) = {
      patch: "/v1beta1/{name=projects/*/sites/*/config}"
      body: "projects_site"
    };
  };
}

