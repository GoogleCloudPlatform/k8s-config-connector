  optional ActingUser delete_user = 5 [json_name="deleteUser"];
  // Output only. The total number of files associated with the version. This value is calculated after a version is `FINALIZED`.
  optional int64 file_count = 6 [json_name="fileCount"];
  // Output only. The time at which the version was `FINALIZED`.
  optional .google.protobuf.Timestamp finalize_time = 7 [json_name="finalizeTime"];
  // Output only. Identifies the user who `FINALIZED` the version.
  optional ActingUser finalize_user = 8 [json_name="finalizeUser"];
  // The labels used for extra metadata and/or filtering.
  map<string, string> labels = 9 [json_name="labels"];
  // The fully-qualified resource name for the version, in the format: sites/ SITE_ID/versions/VERSION_ID This name is provided in the response body when you call [`CreateVersion`](sites.versions/create).
  optional string name = 10 [json_name="name"];
  // The deploy status of the version. For a successful deploy, call [`CreateVersion`](sites.versions/create) to make a new version (`CREATED` status), [upload all desired files](sites.versions/populateFiles) to the version, then [update](sites.versions/patch) the version to the `FINALIZED` status. Note that if you leave the version in the `CREATED` state for more than 12 hours, the system will automatically mark the version as `ABANDONED`. You can also change the status of a version to `DELETED` by calling [`DeleteVersion`](sites.versions/delete).
  optional string status = 11 [json_name="status"];
  // Output only. The total stored bytesize of the version. This value is calculated after a version is `FINALIZED`.
  optional int64 version_bytes = 12 [json_name="versionBytes"];
}

// A static content file that is part of a version.
message VersionFile {
  // The SHA256 content hash of the file.
  optional string hash = 1 [json_name="hash"];
  // The URI at which the file's content should display.
  optional string path = 2 [json_name="path"];
  // Output only. The current status of a particular file in the specified version. The value will be either `pending upload` or `uploaded`.
  optional string status = 3 [json_name="status"];
}

