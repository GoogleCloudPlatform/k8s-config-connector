syntax = "proto2";
package mockgcp.cloud.firebasedatabase.v1beta;
import "google/api/annotations.proto";
option go_package = "github.com/GoogleCloudPlatform/k8s-config-connector/mockgcp/generated/mockgcp/cloud/firebasedatabase/v1beta;firebasedatabasepb";

service ProjectsServer {
}

service ProjectsLocationsServer {
}

service ProjectsLocationsInstancesServer {

  // Requests that a new DatabaseInstance be created. The state of a successfully created DatabaseInstance is ACTIVE. Only available for projects on the Blaze plan. Projects can be upgraded using the Cloud Billing API https://cloud.google.com/billing/reference/rest/v1/projects/updateBillingInfo. Note that it might take a few minutes for billing enablement state to propagate to Firebase systems.
  rpc CreateProjectsLocationsInstance(CreateProjectsLocationsInstanceRequest) returns (DatabaseInstance) {
    option (google.api.http) = {
      post: "/v1beta/{parent=projects/*/locations/*}/instances"
      body: "projects_locations_instance"
    };
  };

  // Marks a DatabaseInstance to be deleted. The DatabaseInstance will be set to the DELETED state for 20 days, and will be purged within 30 days. The default database cannot be deleted. IDs for deleted database instances may never be recovered or re-used. The Database may only be deleted if it is already in a DISABLED state.
  rpc DeleteProjectsLocationsInstance(DeleteProjectsLocationsInstanceRequest) returns (DatabaseInstance) {
    option (google.api.http) = {
      delete: "/v1beta/{name=projects/*/locations/*/instances/*}"
    };
  };

  // Disables a DatabaseInstance. The database can be re-enabled later using ReenableDatabaseInstance. When a database is disabled, all reads and writes are denied, including view access in the Firebase console.
  rpc DisableProjectsLocationsInstance(DisableProjectsLocationsInstanceRequest) returns (DatabaseInstance) {
    option (google.api.http) = {
      post: "/v1beta/{name=projects/*/locations/*/instances/*}:disable"
      body: "projects_locations_instance"
    };
  };

  // Gets the DatabaseInstance identified by the specified resource name.
  rpc GetProjectsLocationsInstance(GetProjectsLocationsInstanceRequest) returns (DatabaseInstance) {
    option (google.api.http) = {
      get: "/v1beta/{name=projects/*/locations/*/instances/*}"
    };
  };

  // Lists each DatabaseInstance associated with the specified parent project. The list items are returned in no particular order, but will be a consistent view of the database instances when additional requests are made with a `pageToken`. The resulting list contains instances in any STATE. The list results may be stale by a few seconds. Use GetDatabaseInstance for consistent reads.
  rpc ListProjectsLocationsInstances(ListProjectsLocationsInstancesRequest) returns (ListDatabaseInstancesResponse) {
    option (google.api.http) = {
      get: "/v1beta/{parent=projects/*/locations/*}/instances"
    };
  };

  // Enables a DatabaseInstance. The database must have been disabled previously using DisableDatabaseInstance. The state of a successfully reenabled DatabaseInstance is ACTIVE.
  rpc ReenableProjectsLocationsInstance(ReenableProjectsLocationsInstanceRequest) returns (DatabaseInstance) {
    option (google.api.http) = {
      post: "/v1beta/{name=projects/*/locations/*/instances/*}:reenable"
      body: "projects_locations_instance"
    };
  };

  // Restores a DatabaseInstance that was previously marked to be deleted. After the delete method is used, DatabaseInstances are set to the DELETED state for 20 days, and will be purged within 30 days. Databases in the DELETED state can be undeleted without losing any data. This method may only be used on a DatabaseInstance in the DELETED state. Purged DatabaseInstances may not be recovered.
  rpc UndeleteProjectsLocationsInstance(UndeleteProjectsLocationsInstanceRequest) returns (DatabaseInstance) {
    option (google.api.http) = {
      post: "/v1beta/{name=projects/*/locations/*/instances/*}:undelete"
      body: "projects_locations_instance"
    };
  };
}

// Representation of a Realtime Database instance. Details on interacting with contents of a DatabaseInstance can be found at: https://firebase.google.com/docs/database/rest/start.
message DatabaseInstance {
  // Output only. Output Only. The globally unique hostname of the database.
  optional string database_url = 1 [json_name="databaseUrl"];
  // The fully qualified resource name of the database instance, in the form: `projects/{project-number}/locations/{location-id}/instances/{database-id}`.
  optional string name = 2 [json_name="name"];
  // Output only. The resource name of the project this instance belongs to. For example: `projects/{project-number}`.
  optional string project = 3 [json_name="project"];
  // Output only. The database's lifecycle state. Read-only.
  optional string state = 4 [json_name="state"];
  // Immutable. The database instance type. On creation only USER_DATABASE is allowed, which is also the default when omitted.
  optional string type = 5 [json_name="type"];
}

// The request sent to the DisableDatabaseInstance method.
message DisableDatabaseInstanceRequest {
}

// The response from the ListDatabaseInstances method.
message ListDatabaseInstancesResponse {
  // List of each DatabaseInstance that is in the parent Firebase project.
  repeated DatabaseInstance instances = 1 [json_name="instances"];
  // If the result list is too large to fit in a single response, then a token is returned. If the string is empty, then this response is the last page of results. This token can be used in a subsequent call to `ListDatabaseInstances` to find the next group of database instances. Page tokens are short-lived and should not be persisted.
  optional string next_page_token = 2 [json_name="nextPageToken"];
}

// The request sent to the ReenableDatabaseInstance method.
message ReenableDatabaseInstanceRequest {
}

// The request sent to UndeleteDatabaseInstance method.
message UndeleteDatabaseInstanceRequest {
}

message CreateProjectsLocationsInstanceRequest {
  optional string database_id = 1;
  optional string parent = 2;
  optional bool validate_only = 3;
  optional DatabaseInstance projects_locations_instance = 4;
}

message DeleteProjectsLocationsInstanceRequest {
  optional string name = 1;
}

message DisableProjectsLocationsInstanceRequest {
  optional string name = 1;
  optional DisableDatabaseInstanceRequest projects_locations_instance = 2;
}

message GetProjectsLocationsInstanceRequest {
  optional string name = 1;
}

message ListProjectsLocationsInstancesRequest {
  optional int32 page_size = 1;
  optional string page_token = 2;
  optional string parent = 3;
  optional bool show_deleted = 4;
}

message ReenableProjectsLocationsInstanceRequest {
  optional string name = 1;
  optional ReenableDatabaseInstanceRequest projects_locations_instance = 2;
}

message UndeleteProjectsLocationsInstanceRequest {
  optional string name = 1;
  optional UndeleteDatabaseInstanceRequest projects_locations_instance = 2;
}
