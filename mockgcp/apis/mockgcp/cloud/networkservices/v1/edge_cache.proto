syntax = "proto3";

package mockgcp.cloud.networkservices.v1;

import "google/api/annotations.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/GoogleCloudPlatform/k8s-config-connector/mockgcp/generated/mockgcp/cloud/networkservices/v1;networkservicespb";

service EdgeCacheServicesServer {
  rpc CreateEdgeCacheService(CreateEdgeCacheServiceRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/locations/*}/edgeCacheServices"
      body: "edge_cache_service"
    };
  }

  rpc GetEdgeCacheService(GetEdgeCacheServiceRequest) returns (EdgeCacheService) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/edgeCacheServices/*}"
    };
  }

  rpc PatchEdgeCacheService(PatchEdgeCacheServiceRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{edge_cache_service.name=projects/*/locations/*/edgeCacheServices/*}"
      body: "edge_cache_service"
      additional_bindings {
        patch: "/v1/{name=projects/*/locations/*/edgeCacheServices/*}"
        body: "edge_cache_service"
      }
    };
  }

  rpc DeleteEdgeCacheService(DeleteEdgeCacheServiceRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      delete: "/v1/{name=projects/*/locations/*/edgeCacheServices/*}"
    };
  }

  rpc ListEdgeCacheServices(ListEdgeCacheServicesRequest) returns (ListEdgeCacheServicesResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*}/edgeCacheServices"
    };
  }
}

service EdgeCacheOriginsServer {
  rpc CreateEdgeCacheOrigin(CreateEdgeCacheOriginRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/locations/*}/edgeCacheOrigins"
      body: "edge_cache_origin"
    };
  }

  rpc GetEdgeCacheOrigin(GetEdgeCacheOriginRequest) returns (EdgeCacheOrigin) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/edgeCacheOrigins/*}"
    };
  }

  rpc PatchEdgeCacheOrigin(PatchEdgeCacheOriginRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{edge_cache_origin.name=projects/*/locations/*/edgeCacheOrigins/*}"
      body: "edge_cache_origin"
      additional_bindings {
        patch: "/v1/{name=projects/*/locations/*/edgeCacheOrigins/*}"
        body: "edge_cache_origin"
      }
    };
  }

  rpc DeleteEdgeCacheOrigin(DeleteEdgeCacheOriginRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      delete: "/v1/{name=projects/*/locations/*/edgeCacheOrigins/*}"
    };
  }

  rpc ListEdgeCacheOrigins(ListEdgeCacheOriginsRequest) returns (ListEdgeCacheOriginsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*}/edgeCacheOrigins"
    };
  }
}

service EdgeCacheKeysetsServer {
  rpc CreateEdgeCacheKeyset(CreateEdgeCacheKeysetRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/locations/*}/edgeCacheKeysets"
      body: "edge_cache_keyset"
    };
  }

  rpc GetEdgeCacheKeyset(GetEdgeCacheKeysetRequest) returns (EdgeCacheKeyset) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/edgeCacheKeysets/*}"
    };
  }

  rpc PatchEdgeCacheKeyset(PatchEdgeCacheKeysetRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{edge_cache_keyset.name=projects/*/locations/*/edgeCacheKeysets/*}"
      body: "edge_cache_keyset"
      additional_bindings {
        patch: "/v1/{name=projects/*/locations/*/edgeCacheKeysets/*}"
        body: "edge_cache_keyset"
      }
    };
  }

  rpc DeleteEdgeCacheKeyset(DeleteEdgeCacheKeysetRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      delete: "/v1/{name=projects/*/locations/*/edgeCacheKeysets/*}"
    };
  }

  rpc ListEdgeCacheKeysets(ListEdgeCacheKeysetsRequest) returns (ListEdgeCacheKeysetsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*}/edgeCacheKeysets"
    };
  }
}

message EdgeCacheService {
  string name = 1;
  google.protobuf.Timestamp create_time = 2;
  google.protobuf.Timestamp update_time = 3;
  map<string, string> labels = 4;
  string description = 5;
  bool disable_quic = 6;
  bool disable_http2 = 7;
  bool require_tls = 8;
  string edge_security_policy = 9;
  string ssl_policy = 10;
  repeated string edge_ssl_certificates = 11;
  repeated string ipv4_addresses = 12;
  repeated string ipv6_addresses = 13;
  EdgeCacheServiceLogConfig log_config = 14;
  EdgeCacheServiceRouting routing = 15;
}

message EdgeCacheServiceLogConfig {
  bool enable = 1;
  double sample_rate = 2;
}

message EdgeCacheServiceRouting {
  repeated EdgeCacheServiceHostRule host_rules = 1;
  repeated EdgeCacheServicePathMatcher path_matchers = 2;
}

message EdgeCacheServiceHostRule {
  string description = 1;
  repeated string hosts = 2;
  string path_matcher = 3;
}

message EdgeCacheServicePathMatcher {
  string name = 1;
  string description = 2;
  repeated EdgeCacheServiceRouteRule route_rules = 3;
}

message EdgeCacheServiceRouteRule {
  string priority = 1;
  string description = 2;
  string origin = 3;
  repeated EdgeCacheServiceMatchRule match_rules = 4;
  EdgeCacheServiceHeaderAction header_action = 5;
  EdgeCacheServiceRouteAction route_action = 6;
  EdgeCacheServiceRouteMethods route_methods = 7;
  EdgeCacheServiceUrlRedirect url_redirect = 8;
}

message EdgeCacheServiceMatchRule {
  string prefix_match = 1;
  string full_path_match = 2;
  string path_template_match = 3;
  bool ignore_case = 4;
  repeated EdgeCacheServiceHeaderMatch header_matches = 5;
  repeated EdgeCacheServiceQueryParameterMatch query_parameter_matches = 6;
}

message EdgeCacheServiceHeaderMatch {
  string header_name = 1;
  string exact_match = 2;
  string prefix_match = 3;
  string suffix_match = 4;
  bool present_match = 5;
  bool invert_match = 6;
}

message EdgeCacheServiceQueryParameterMatch {
  string name = 1;
  string exact_match = 2;
  bool present_match = 3;
}

message EdgeCacheServiceHeaderAction {
  repeated EdgeCacheServiceHeader request_headers_to_add = 1;
  repeated EdgeCacheServiceHeaderToRemove request_headers_to_remove = 2;
  repeated EdgeCacheServiceHeader response_headers_to_add = 3;
  repeated EdgeCacheServiceHeaderToRemove response_headers_to_remove = 4;
}

message EdgeCacheServiceHeader {
  string header_name = 1;
  string header_value = 2;
  bool replace = 3;
}

message EdgeCacheServiceHeaderToRemove {
  string header_name = 1;
}

message EdgeCacheServiceRouteAction {
  EdgeCacheServiceCdnPolicy cdn_policy = 1;
  string compression_mode = 2;
  EdgeCacheServiceCorsPolicy cors_policy = 3;
  EdgeCacheServiceUrlRewrite url_rewrite = 4;
}

message EdgeCacheServiceRouteMethods {
  repeated string allowed_methods = 1;
}

message EdgeCacheServiceCdnPolicy {
  string cache_mode = 1;
  string client_ttl = 2;
  string default_ttl = 3;
  string max_ttl = 4;
  bool negative_caching = 5;
  map<string, string> negative_caching_policy = 6;
  string signed_request_mode = 7;
  string signed_request_keyset = 8;
  string signed_request_maximum_expiration_ttl = 9;
  EdgeCacheServiceAddSignatures add_signatures = 10;
  EdgeCacheServiceCacheKeyPolicy cache_key_policy = 11;
  EdgeCacheServiceSignedTokenOptions signed_token_options = 12;
}

message EdgeCacheServiceAddSignatures {
  repeated string actions = 1;
  string keyset = 2;
  string token_query_parameter = 3;
  string token_ttl = 4;
  repeated string copied_parameters = 5;
}

message EdgeCacheServiceCacheKeyPolicy {
  bool include_protocol = 1;
  bool exclude_host = 2;
  bool exclude_query_string = 3;
  repeated string included_query_parameters = 4;
  repeated string excluded_query_parameters = 5;
  repeated string included_header_names = 6;
  repeated string included_cookie_names = 7;
}

message EdgeCacheServiceSignedTokenOptions {
  string token_query_parameter = 1;
  repeated string allowed_signature_algorithms = 2;
}

message EdgeCacheServiceCorsPolicy {
  string max_age = 1;
  repeated string allow_origins = 2;
  repeated string allow_methods = 3;
  repeated string allow_headers = 4;
  repeated string expose_headers = 5;
  bool allow_credentials = 6;
  bool disabled = 7;
}

message EdgeCacheServiceUrlRedirect {
  string host_redirect = 1;
  string path_redirect = 2;
  string prefix_redirect = 3;
  string redirect_response_code = 4;
  bool https_redirect = 5;
  bool strip_query = 6;
}

message EdgeCacheServiceUrlRewrite {
  string host_rewrite = 1;
  string path_prefix_rewrite = 2;
  string path_template_rewrite = 3;
}

message CreateEdgeCacheServiceRequest {
  string parent = 1;
  string edge_cache_service_id = 2;
  EdgeCacheService edge_cache_service = 3;
}

message GetEdgeCacheServiceRequest {
  string name = 1;
}

message PatchEdgeCacheServiceRequest {
  string name = 1;
  EdgeCacheService edge_cache_service = 2;
  google.protobuf.FieldMask update_mask = 3;
}

message DeleteEdgeCacheServiceRequest {
  string name = 1;
}

message ListEdgeCacheServicesRequest {
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
  string filter = 4;
  string order_by = 5;
}

message ListEdgeCacheServicesResponse {
  repeated EdgeCacheService edge_cache_services = 1;
  string next_page_token = 2;
}

message EdgeCacheOrigin {
  string name = 1;
  google.protobuf.Timestamp create_time = 2;
  google.protobuf.Timestamp update_time = 3;
  map<string, string> labels = 4;
  string description = 5;
  string origin_address = 6;
  string protocol = 7;
  int32 port = 8;
  int32 max_attempts = 9;
  EdgeCacheOriginTimeout timeout = 10;
  repeated string retry_conditions = 11;
  EdgeCacheOriginAwsV4Authentication aws_v4_authentication = 12;
  EdgeCacheOriginOverrideAction origin_override_action = 13;
}

message EdgeCacheOriginTimeout {
  string connect_timeout = 1;
  string max_attempts_timeout = 2;
  string response_timeout = 3;
  string read_timeout = 4;
}

message EdgeCacheOriginAwsV4Authentication {
  string access_key_id = 1;
  string secret_access_key_version = 2;
  string origin_region = 3;
}

message EdgeCacheOriginOverrideAction {
  EdgeCacheOriginOverrideActionUrlRewrite url_rewrite = 1;
  EdgeCacheServiceHeaderAction header_action = 2;
}

message EdgeCacheOriginOverrideActionUrlRewrite {
  string host_rewrite = 1;
}

message CreateEdgeCacheOriginRequest {
  string parent = 1;
  string edge_cache_origin_id = 2;
  EdgeCacheOrigin edge_cache_origin = 3;
}

message GetEdgeCacheOriginRequest {
  string name = 1;
}

message PatchEdgeCacheOriginRequest {
  string name = 1;
  EdgeCacheOrigin edge_cache_origin = 2;
  google.protobuf.FieldMask update_mask = 3;
}

message DeleteEdgeCacheOriginRequest {
  string name = 1;
}

message ListEdgeCacheOriginsRequest {
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
  string filter = 4;
  string order_by = 5;
}

message ListEdgeCacheOriginsResponse {
  repeated EdgeCacheOrigin edge_cache_origins = 1;
  string next_page_token = 2;
}

message EdgeCacheKeyset {
  string name = 1;
  google.protobuf.Timestamp create_time = 2;
  google.protobuf.Timestamp update_time = 3;
  map<string, string> labels = 4;
  string description = 5;
  repeated EdgeCacheKeysetPublicKey public_keys = 6;
  repeated EdgeCacheKeysetValidationSharedKey validation_shared_keys = 7;
}

message EdgeCacheKeysetPublicKey {
  string id = 1;
  string value = 2;
  bool managed = 3;
}

message EdgeCacheKeysetValidationSharedKey {
  string secret_version = 1;
}

message CreateEdgeCacheKeysetRequest {
  string parent = 1;
  string edge_cache_keyset_id = 2;
  EdgeCacheKeyset edge_cache_keyset = 3;
}

message GetEdgeCacheKeysetRequest {
  string name = 1;
}

message PatchEdgeCacheKeysetRequest {
  string name = 1;
  EdgeCacheKeyset edge_cache_keyset = 2;
  google.protobuf.FieldMask update_mask = 3;
}

message DeleteEdgeCacheKeysetRequest {
  string name = 1;
}

message ListEdgeCacheKeysetsRequest {
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
  string filter = 4;
  string order_by = 5;
}

message ListEdgeCacheKeysetsResponse {
  repeated EdgeCacheKeyset edge_cache_keysets = 1;
  string next_page_token = 2;
}
