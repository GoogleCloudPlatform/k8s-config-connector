syntax = "proto3";

package google.cloud.discoveryengine.v1alpha;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/GoogleCloudPlatform/k8s-config-connector/pkg/controller/direct/discoveryengine/pb;discoveryenginealphapb";

// The DataConnector resource.
message DataConnector {
  option (google.api.resource) = {
    type: "discoveryengine.googleapis.com/DataConnector"
    pattern: "projects/{project}/locations/{location}/collections/{collection}/dataConnector"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string data_source = 2 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.Struct params = 3;
  string refresh_interval = 4;
  bool auto_run_disabled = 5;
  ActionConfig action_config = 6;
  repeated DestinationConfig destination_configs = 7;
  repeated string blocking_reasons = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  enum SyncMode {
    SYNC_MODE_UNSPECIFIED = 0;
    FULL = 1;
    INCREMENTAL = 2;
  }
  SyncMode sync_mode = 9;

  bool incremental_sync_disabled = 10;
  string incremental_refresh_interval = 11;
  DataProtectionPolicy data_protection_policy = 12;
  ConnectorMetadata connector_metadata = 13;
  RealtimeSyncConfig realtime_sync_config = 14;
  ConnectorRun last_run = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
  string kms_key_name = 16;
}

message ActionConfig {
  string service_name = 1;
  google.protobuf.Struct action_params = 2;
  bool create_bap_connection = 3;
}

message DestinationConfig {
  string destination_type = 1;
  google.protobuf.Struct params = 2;
}

message DataProtectionPolicy {
  string policy_type = 1;
}

message ConnectorMetadata {
  string title = 1;
  string short_description = 2;
  string description = 3;
  string author = 4;
  string note = 5;
}

message RealtimeSyncConfig {
  string streaming_error = 1;
}

message ConnectorRun {
  string name = 1;
  string state = 2;
}
