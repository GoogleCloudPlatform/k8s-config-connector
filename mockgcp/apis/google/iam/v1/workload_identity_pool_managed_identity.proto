syntax = "proto3";

package google.iam.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "cloud.google.com/go/iam/apiv1/iampb;iampb";
option java_multiple_files = true;
option java_outer_classname = "WorkloadIdentityPoolManagedIdentityProto";
option java_package = "com.google.iam.v1";

// Manages WorkloadIdentityPoolManagedIdentities.
service WorkloadIdentityPoolManagedIdentities {
  option (google.api.default_host) = "iam.googleapis.com";
  option (google.api.oauth_scopes) = "https://www.googleapis.com/auth/cloud-platform";

  // Gets an individual WorkloadIdentityPoolManagedIdentity.
  rpc GetWorkloadIdentityPoolManagedIdentity(GetWorkloadIdentityPoolManagedIdentityRequest) returns (WorkloadIdentityPoolManagedIdentity) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/workloadIdentityPools/*/namespaces/*/managedIdentities/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Creates a new WorkloadIdentityPoolManagedIdentity in a WorkloadIdentityPoolNamespace.
  rpc CreateWorkloadIdentityPoolManagedIdentity(CreateWorkloadIdentityPoolManagedIdentityRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/locations/*/workloadIdentityPools/*/namespaces/*}/managedIdentities"
      body: "workload_identity_pool_managed_identity"
    };
    option (google.api.method_signature) = "parent,workload_identity_pool_managed_identity,workload_identity_pool_managed_identity_id";
    option (google.longrunning.operation_info) = {
      response_type: "WorkloadIdentityPoolManagedIdentity"
      metadata_type: "WorkloadIdentityPoolOperationMetadata"
    };
  }

  // Updates an existing WorkloadIdentityPoolManagedIdentity in a WorkloadIdentityPoolNamespace.
  rpc UpdateWorkloadIdentityPoolManagedIdentity(UpdateWorkloadIdentityPoolManagedIdentityRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{workload_identity_pool_managed_identity.name=projects/*/locations/*/workloadIdentityPools/*/namespaces/*/managedIdentities/*}"
      body: "workload_identity_pool_managed_identity"
    };
    option (google.api.method_signature) = "workload_identity_pool_managed_identity,update_mask";
    option (google.longrunning.operation_info) = {
      response_type: "WorkloadIdentityPoolManagedIdentity"
      metadata_type: "WorkloadIdentityPoolOperationMetadata"
    };
  }

  // Deletes a WorkloadIdentityPoolManagedIdentity.
  rpc DeleteWorkloadIdentityPoolManagedIdentity(DeleteWorkloadIdentityPoolManagedIdentityRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      delete: "/v1/{name=projects/*/locations/*/workloadIdentityPools/*/namespaces/*/managedIdentities/*}"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "WorkloadIdentityPoolManagedIdentity"
      metadata_type: "WorkloadIdentityPoolOperationMetadata"
    };
  }

  // Undeletes a WorkloadIdentityPoolManagedIdentity, as long as it was deleted fewer than 30 days ago.
  rpc UndeleteWorkloadIdentityPoolManagedIdentity(UndeleteWorkloadIdentityPoolManagedIdentityRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/locations/*/workloadIdentityPools/*/namespaces/*/managedIdentities/*}:undelete"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "WorkloadIdentityPoolManagedIdentity"
      metadata_type: "WorkloadIdentityPoolOperationMetadata"
    };
  }

  // Lists all non-deleted WorkloadIdentityPoolManagedIdentities in a workload identity pool namespace.
  rpc ListWorkloadIdentityPoolManagedIdentities(ListWorkloadIdentityPoolManagedIdentitiesRequest) returns (ListWorkloadIdentityPoolManagedIdentitiesResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*/workloadIdentityPools/*/namespaces/*}/managedIdentities"
    };
    option (google.api.method_signature) = "parent";
  }
}

// Represents a managed identity for a workload identity pool namespace.
message WorkloadIdentityPoolManagedIdentity {
  option (google.api.resource) = {
    type: "iam.googleapis.com/WorkloadIdentityPoolManagedIdentity"
    pattern: "projects/{project}/locations/{location}/workloadIdentityPools/{workload_identity_pool}/namespaces/{workload_identity_pool_namespace}/managedIdentities/{workload_identity_pool_managed_identity}"
  };

  // The current state of the managed identity.
  enum State {
    // State unspecified.
    STATE_UNSPECIFIED = 0;

    // The managed identity is active.
    ACTIVE = 1;

    // The managed identity is soft-deleted. Soft-deleted managed identities are permanently deleted after approximately 30 days.
    DELETED = 2;
  }

  // Identifier. The resource name of the managed identity.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional. A description of the managed identity. Cannot exceed 256 characters.
  string description = 2 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The state of the managed identity.
  State state = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Whether the managed identity is disabled.
  bool disabled = 4 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Time after which the managed identity will be permanently purged and cannot be recovered.
  google.protobuf.Timestamp expire_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for GetWorkloadIdentityPoolManagedIdentity.
message GetWorkloadIdentityPoolManagedIdentityRequest {
  // Required. The name of the managed identity to retrieve.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "iam.googleapis.com/WorkloadIdentityPoolManagedIdentity"
    }
  ];
}

// Request message for CreateWorkloadIdentityPoolManagedIdentity.
message CreateWorkloadIdentityPoolManagedIdentityRequest {
  // Required. The parent resource to create the managed identity in.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "iam.googleapis.com/WorkloadIdentityPoolNamespace"
    }
  ];

  // Required. The managed identity to create.
  WorkloadIdentityPoolManagedIdentity workload_identity_pool_managed_identity = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. The ID to use for the managed identity.
  string workload_identity_pool_managed_identity_id = 3 [(google.api.field_behavior) = REQUIRED];
}

// Request message for UpdateWorkloadIdentityPoolManagedIdentity.
message UpdateWorkloadIdentityPoolManagedIdentityRequest {
  // Required. The managed identity to update.
  WorkloadIdentityPoolManagedIdentity workload_identity_pool_managed_identity = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request message for DeleteWorkloadIdentityPoolManagedIdentity.
message DeleteWorkloadIdentityPoolManagedIdentityRequest {
  // Required. The name of the managed identity to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "iam.googleapis.com/WorkloadIdentityPoolManagedIdentity"
    }
  ];
}

// Request message for UndeleteWorkloadIdentityPoolManagedIdentity.
message UndeleteWorkloadIdentityPoolManagedIdentityRequest {
  // Required. The name of the managed identity to undelete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "iam.googleapis.com/WorkloadIdentityPoolManagedIdentity"
    }
  ];
}

// Request message for ListWorkloadIdentityPoolManagedIdentities.
message ListWorkloadIdentityPoolManagedIdentitiesRequest {
  // Required. The parent resource to list managed identities for.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "iam.googleapis.com/WorkloadIdentityPoolNamespace"
    }
  ];

  // The maximum number of managed identities to return.
  int32 page_size = 2;

  // A page token, received from a previous `ListWorkloadIdentityPoolManagedIdentities` call.
  string page_token = 3;

  // Whether to return soft-deleted managed identities.
  bool show_deleted = 4;
}

// Response message for ListWorkloadIdentityPoolManagedIdentities.
message ListWorkloadIdentityPoolManagedIdentitiesResponse {
  // A list of managed identities.
  repeated WorkloadIdentityPoolManagedIdentity workload_identity_pool_managed_identities = 1;

  // A token, which can be sent as `page_token` to retrieve the next page.
  string next_page_token = 2;
}

// Metadata for long-running WorkloadIdentityPool operations.
message WorkloadIdentityPoolOperationMetadata {}
