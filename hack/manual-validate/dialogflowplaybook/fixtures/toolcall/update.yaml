apiVersion: dialogflow.cnrm.cloud.google.com/v1alpha1
kind: DialogflowPlaybook
metadata:
  name: dialogflowplaybook-${uniqueId}
spec:
  parentRef:
    name: dialogflowcxagent-${uniqueId}
  displayName: Updated ToolCall Playbook ${uniqueId}
  goal: Updated goal for toolcall playbook test
  instruction:
    guidelines: Always test updated toolcall fields.
    steps:
      - text: Trigger updated toolcall handler.
  handlers:
    - lifecycleHandler:
        lifecycleStage: playbook-start
        fulfillment:
          messages:
            - toolCall:
                action: updatedQueryAction
                inputParameters:
                  city: Portland
                tool: projects/${projectId}/locations/global/agents/00000000-0000-0000-0000-000000000000/tools/11111111-1111-1111-1111-111111111111
