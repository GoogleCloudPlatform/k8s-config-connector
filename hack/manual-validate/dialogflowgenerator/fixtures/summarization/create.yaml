apiVersion: dialogflow.cnrm.cloud.google.com/v1alpha1
kind: DialogflowGenerator
metadata:
  name: dialogflowgenerator-sum-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: global
  description: "Summarization Dialogflow Generator ${uniqueId}"
  triggerEvent: END_OF_UTTERANCE
  publishedModel: text-bison
  inferenceParameter:
    maxOutputTokens: 200
    temperature: 0.5
    topK: 30
    topP: 0.9
  summarizationContext:
    version: "6.0"
    summarizationSections:
      - key: my_issue
        definition: the issue described by customer
        type: CUSTOMER_DEFINED
    fewShotExamples:
      - conversationContext:
          messageEntries:
            - role: END_USER
              text: "Hello, I need help"
            - role: HUMAN_AGENT
              text: "I can help you with that"
        output:
          freeFormSuggestion:
            response: "Here is a suggested free form response ${uniqueId}"
      - conversationContext:
          messageEntries:
            - role: END_USER
              text: "My order is delayed"
            - role: HUMAN_AGENT
              text: "Let me look into your order"
        summarizationSectionList:
          summarizationSections:
            - key: my_issue
              definition: the issue described by customer
              type: CUSTOMER_DEFINED
        output:
          summarySuggestion:
            summarySections:
              - section: my_issue
                summary: "Customer order is delayed ${uniqueId}"
