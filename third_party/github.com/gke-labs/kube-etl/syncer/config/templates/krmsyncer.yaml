# Sample KRMSyncer CR that replicates Config Connector (KCC) resources from the
# source cluster. The rules mirror getDesiredRules() and
# syncerGVKsWithServiceGeneratedIDs in KCC's
# pkg/controller/kccmanager/syncer_integration.go and syncer_exceptions.go
# (GoogleCloudPlatform/k8s-config-connector#6919).
#
# deploy.sh --sync-mode selects the replication mode:
# - status (default): the wildcard rule syncs only "status". In addition,
#   deploy.sh appends a [status, spec.resourceID] rule for each GVK in
#   service-generated-resource-id-gvks.yaml (resources whose ID is
#   generated by the GCP service; KCC writes the generated ID back into the
#   spec). The rules are appended to the end of this file, so spec.rules must
#   remain the LAST field.
# - full: the wildcard rule syncs [spec, status] and nothing is appended. (An
#   appended [status, spec.resourceID] rule applied after the full spec would
#   make SSA drop every other spec field.)
#
# IMPORTANT: keep the wildcard rule FIRST. The controller applies every matching
# rule in order with the same SSA field manager, so a status-only apply that
# runs after a spec.resourceID rule would drop spec.resourceID again.
#
# The controller expands the glob using the source cluster's API discovery;
# globs are only supported for KCC groups with version and kind both set to
# "*". The '*' values must be quoted in YAML.
# The source cluster is referenced directly; the controller looks up its
# endpoint and CA through the GKE API and authenticates with Workload Identity.
# Placeholders are filled in by render_template in deploy.sh;
# ${SYNC_FIELDS} is "[status]" or "[spec, status]" depending on --sync-mode.
apiVersion: syncer.gkelabs.io/v1alpha1
kind: KRMSyncer
metadata:
  name: ${SYNC_CONFIG_NAME}
  namespace: ${NAMESPACE}
spec:
  mode: pull
  suspend: false
  remote:
    gkeCluster:
      project: ${SOURCE_PROJECT}
      location: ${SOURCE_LOCATION}
      name: ${SOURCE_CLUSTER}
      endpoint: ${SOURCE_ENDPOINT}
  rules:
  - group: "*.cnrm.cloud.google.com"
    version: "*"
    kind: "*"
    syncFields: ${SYNC_FIELDS}
