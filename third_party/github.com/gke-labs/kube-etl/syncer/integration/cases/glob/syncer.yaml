apiVersion: syncer.gkelabs.io/v1alpha1
kind: KRMSyncer
metadata:
  name: glob-syncer
  namespace: default
spec:
  mode: push
  remote:
    gkeCluster:
      project: test-project
      location: us-central1
      name: cluster-b
  rules:
  - group: "*.cnrm.cloud.google.com"
    version: "*"
    kind: "*"
    syncFields:
    - "status"
