apiVersion: firestore.cnrm.cloud.google.com/v1beta1
kind: FirestoreDatabase
metadata:
  name: firestoreindex-acquire-db-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  resourceID: firestoreindex-acquire-db-${uniqueId}
  locationID: us-west2
  type: FIRESTORE_NATIVE
  concurrencyMode: PESSIMISTIC
  pointInTimeRecoveryEnablement: POINT_IN_TIME_RECOVERY_DISABLED
  deleteProtectionState: DELETE_PROTECTION_DISABLED

---
apiVersion: firestore.cnrm.cloud.google.com/v1beta1
kind: FirestoreIndex
metadata:
  annotations:
    alpha.cnrm.cloud.google.com/reconciler: direct
    cnrm.cloud.google.com/project-id: ${projectId}
  name: firestoreindex-acquire-${uniqueId}
spec:
  database: firestoreindex-acquire-db-${uniqueId}
  collection: Customer-${uniqueId}
  queryScope: COLLECTION_GROUP
  fields:
  - fieldPath: email
    order: ASCENDING
  - fieldPath: createdAt
    order: DESCENDING

---
TEST: ABANDON-AND-REACQUIRE-WITH-GENERATED-ID
apiVersion: firestore.cnrm.cloud.google.com/v1beta1
kind: FirestoreIndex
metadata:
  annotations:
    alpha.cnrm.cloud.google.com/reconciler: direct
    cnrm.cloud.google.com/project-id: ${projectId}
  name: firestoreindex-acquire-${uniqueId}
spec:
  resourceID: ${TEST_GENERATED_ID}
  database: firestoreindex-acquire-db-${uniqueId}
  collection: Customer-${uniqueId}
  queryScope: COLLECTION_GROUP
  fields:
  - fieldPath: email
    order: ASCENDING
  - fieldPath: createdAt
    order: DESCENDING
