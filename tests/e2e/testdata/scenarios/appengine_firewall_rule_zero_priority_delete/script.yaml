# Step 0: A pre-existing or newly applied CR with invalid priority "0" and controller finalizer
# fails Create with invalid priority (sending 0 POST requests) and halts retries cleanly.
TEST: APPLY-10-SEC-NO-EXPORT
apiVersion: appengine.cnrm.cloud.google.com/v1alpha1
kind: AppEngineFirewallRule
metadata:
  name: appenginefirewallrule-zero-${uniqueId}
  annotations:
    cnrm.cloud.google.com/backoff-max-delay-in-seconds: "0"
  finalizers:
    - cnrm.cloud.google.com/finalizer
spec:
  resourceID: "0"
  project: "${projectId}"
  action: ALLOW
  sourceRange: "192.0.2.0/24"
---
# Step 1: Deleting the CR resolves identity, observes 404 on Find, and removes the finalizer cleanly.
TEST: DELETE
apiVersion: appengine.cnrm.cloud.google.com/v1alpha1
kind: AppEngineFirewallRule
metadata:
  name: appenginefirewallrule-zero-${uniqueId}
