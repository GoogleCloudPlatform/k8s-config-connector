# spec.resourceID must be a repository ID. A value that is a child path
# ("<repo>/packages/<pkg>") is rejected before any GCP call, so KCC never
# reads, updates or deletes the package.
apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
kind: ArtifactRegistryRepository
metadata:
  name: artifactregistryrepository-${uniqueId}
  annotations:
    alpha.cnrm.cloud.google.com/reconciler: direct
spec:
  format: GENERIC
  location: us-central1
  resourceID: artifactregistryrepository-${uniqueId}/packages/package-${uniqueId}
TEST: APPLY-10-SEC-NO-EXPORT
---
apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
kind: ArtifactRegistryRepository
metadata:
  name: artifactregistryrepository-${uniqueId}
TEST: DELETE
