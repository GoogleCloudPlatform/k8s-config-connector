# Step 0: Apply invalid LoggingLogMetric without backoff-max-delay-in-seconds annotation
# Reconcile fails against GCP and retries exponentially over the 10-second sleep window
TEST: APPLY-10-SEC-NO-EXPORT
apiVersion: logging.cnrm.cloud.google.com/v1beta1
kind: LoggingLogMetric
metadata:
  name: logginglogmetric-${uniqueId}
  annotations:
    cnrm.cloud.google.com/state-into-spec: absent
spec:
  filter: "severity ="
  projectRef:
    external: "projects/${projectId}"
---
# Step 1: Add backoff-max-delay-in-seconds: "0"
# Annotation change triggers 1 reconciliation attempt and halts retries. Zero additional retries over 10 seconds.
TEST: APPLY-10-SEC-NO-EXPORT
apiVersion: logging.cnrm.cloud.google.com/v1beta1
kind: LoggingLogMetric
metadata:
  name: logginglogmetric-${uniqueId}
  annotations:
    cnrm.cloud.google.com/backoff-max-delay-in-seconds: "0"
    cnrm.cloud.google.com/state-into-spec: absent
spec:
  filter: "severity ="
  projectRef:
    external: "projects/${projectId}"
---
# Step 2: Fix .spec to trigger immediate reconciliation and recovery to Ready=True
apiVersion: logging.cnrm.cloud.google.com/v1beta1
kind: LoggingLogMetric
metadata:
  name: logginglogmetric-${uniqueId}
  annotations:
    cnrm.cloud.google.com/backoff-max-delay-in-seconds: "0"
    cnrm.cloud.google.com/state-into-spec: absent
spec:
  filter: "resource.type=gae_app AND severity<=ERROR"
  projectRef:
    external: "projects/${projectId}"
---
# Step 3: Teardown
TEST: DELETE
apiVersion: logging.cnrm.cloud.google.com/v1beta1
kind: LoggingLogMetric
metadata:
  name: logginglogmetric-${uniqueId}
