# step 0
apiVersion: core.cnrm.cloud.google.com/v1beta1
kind: ConfigConnectorContext
metadata:
  name: configconnectorcontext.core.cnrm.cloud.google.com
spec:
  googleServiceAccount: "kcc@${projectId}.iam.gserviceaccount.com"
---
# step 1
apiVersion: core.cnrm.cloud.google.com/v1beta1
kind: ConfigConnector
metadata:
  name: configconnector.core.cnrm.cloud.google.com
spec:
  mode: namespaced
---
# step 2
apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
kind: ArtifactRegistryRepository
metadata:
  name: artifactregistryrepository-sample-${uniqueId}
  labels:
    label-one: "value-one"
spec:
  format: DOCKER
  location: us-west1
  description: "description 1"
---
# step 3
apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
kind: ArtifactRegistryRepository
metadata:
  name: artifactregistryrepository-sample-${uniqueId}
  labels:
    label-one: "value-one"
  annotations:
    unrelated-annotation: "some-value"
spec:
  format: DOCKER
  location: us-west1
  description: "description 1"
---
# step 4
apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
kind: ArtifactRegistryRepository
metadata:
  name: artifactregistryrepository-sample-${uniqueId}
  labels:
    label-one: "value-one"
  annotations:
    unrelated-annotation: "some-value"
    cnrm.cloud.google.com/actuation-mode: "Paused"
spec:
  format: DOCKER
  location: us-west1
  description: "description 1"
---
# step 5
TEST: APPLY-NO-WAIT
apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
kind: ArtifactRegistryRepository
metadata:
  name: artifactregistryrepository-sample-${uniqueId}
  labels:
    label-one: "value-one"
  annotations:
    unrelated-annotation: "some-value"
    cnrm.cloud.google.com/actuation-mode: "Paused"
spec:
  format: DOCKER
  location: us-west1
  description: "description 2"
---
# step 6
TEST: WAIT-FOR-HTTP-REQUEST
VALUE_PRESENT: "description 2"
apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
kind: ArtifactRegistryRepository
metadata:
  name: artifactregistryrepository-sample-${uniqueId}
  labels:
    label-one: "value-one"
  annotations:
    unrelated-annotation: "some-value"
    cnrm.cloud.google.com/actuation-mode: "Reconciling"
spec:
  format: DOCKER
  location: us-west1
  description: "description 2"
