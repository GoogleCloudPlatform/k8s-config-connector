# step 0: create upstream repository
apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
kind: ArtifactRegistryRepository
metadata:
  name: upstream-${uniqueId}
  annotations:
    alpha.cnrm.cloud.google.com/reconciler: direct
    cnrm.cloud.google.com/project-id: ${projectId}
spec:
  format: DOCKER
  location: us-central1
---
# step 1: create virtual repository referencing the upstream repository
apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
kind: ArtifactRegistryRepository
metadata:
  name: virtual-${uniqueId}
  annotations:
    alpha.cnrm.cloud.google.com/reconciler: direct
    cnrm.cloud.google.com/project-id: ${projectId}
spec:
  format: DOCKER
  location: us-central1
  mode: VIRTUAL_REPOSITORY
  virtualRepositoryConfig:
    upstreamPolicies:
    - id: upstream
      priority: 1
      repositoryRef:
        name: upstream-${uniqueId}
---
# step 2: abandon the upstream repository KCC CR
# This removes the upstream repository CR from Kubernetes while preserving the GCP resource,
# turning the virtual repository's upstream repositoryRef into a dangling/missing reference.
# spec.location and annotations are retained so the test harness can export the abandoned GCP resource.
TEST: ABANDON
apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
kind: ArtifactRegistryRepository
metadata:
  name: upstream-${uniqueId}
  annotations:
    alpha.cnrm.cloud.google.com/reconciler: direct
    cnrm.cloud.google.com/project-id: ${projectId}
spec:
  location: us-central1
---
# step 3: delete the virtual repository. Its upstream repositoryRef now points to a deleted object;
# the controller must still delete the GCP repository and remove the finalizer.
TEST: DELETE
apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
kind: ArtifactRegistryRepository
metadata:
  name: virtual-${uniqueId}
---
# step 4: clean up the abandoned upstream repository via direct GCP HTTP request
# Ensures live real-GCP runs do not leave behind orphan resources in the project.
kind: HTTPRequest
method: DELETE
url: https://artifactregistry.googleapis.com/v1/projects/${projectId}/locations/us-central1/repositories/upstream-${uniqueId}
waitForOperation: true
