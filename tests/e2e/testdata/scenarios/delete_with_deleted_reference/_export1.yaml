apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
kind: ArtifactRegistryRepository
metadata:
  annotations:
    cnrm.cloud.google.com/project-id: ${projectId}
  labels:
    managed-by-cnrm: "true"
  name: virtual-${uniqueId}
spec:
  format: DOCKER
  location: us-central1
  mode: VIRTUAL_REPOSITORY
  resourceID: virtual-${uniqueId}
  virtualRepositoryConfig:
    upstreamPolicies:
    - id: upstream
      priority: 1
      repositoryRef:
        external: projects/${projectId}/locations/us-central1/repositories/upstream-${uniqueId}