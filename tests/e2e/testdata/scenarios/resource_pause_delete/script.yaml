# step 0: create resource
apiVersion: logging.cnrm.cloud.google.com/v1beta1
kind: LoggingLogMetric
metadata:
  name: logginglogmetric-${uniqueId}
spec:
  description: "A sample log metric"
  filter: "resource.type=gae_app AND severity<=ERROR"
  projectRef:
    external: "projects/${projectId}"
---
# step 1: pause the resource
# Note: Actuation is skipped by the controller during pause (no mutation requests).
# The single GET call in _http01.log is generated by the scenario test framework
# exporting the live GCP resource state to verify it still exists.
apiVersion: logging.cnrm.cloud.google.com/v1beta1
kind: LoggingLogMetric
metadata:
  name: logginglogmetric-${uniqueId}
  annotations:
    cnrm.cloud.google.com/actuation-mode: "Paused"
spec:
  description: "A sample log metric"
  filter: "resource.type=gae_app AND severity<=ERROR"
  projectRef:
    external: "projects/${projectId}"
---
# step 2: delete the paused resource without waiting for deletion (should remain terminating)
# Note: Actuation deletion against GCP is halted while paused.
# The single GET call in _http02.log is generated by the scenario test framework
# exporting the live GCP resource state to verify it still exists on GCP.
TEST: DELETE-NO-WAIT
apiVersion: logging.cnrm.cloud.google.com/v1beta1
kind: LoggingLogMetric
metadata:
  name: logginglogmetric-${uniqueId}
---
# step 3: unpause the resource (actuation resumes and deletes the resource)
TEST: APPLY-NO-WAIT
apiVersion: logging.cnrm.cloud.google.com/v1beta1
kind: LoggingLogMetric
metadata:
  name: logginglogmetric-${uniqueId}
  annotations:
    cnrm.cloud.google.com/actuation-mode: "Reconciling"
spec:
  description: "A sample log metric"
  filter: "resource.type=gae_app AND severity<=ERROR"
  projectRef:
    external: "projects/${projectId}"
---
# step 4: wait for deletion to complete
TEST: DELETE
apiVersion: logging.cnrm.cloud.google.com/v1beta1
kind: LoggingLogMetric
metadata:
  name: logginglogmetric-${uniqueId}
