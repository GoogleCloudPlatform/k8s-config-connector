# Step 00: Create Primary with failoverDrReplicaRef but without annotation.
# Expected: Fails to reconcile (DependencyNotReady).
TEST: APPLY-10-SEC
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-primary-${uniqueId}
spec:
  databaseVersion: MYSQL_8_0
  region: us-west1
  replicationCluster:
    failoverDrReplicaRef:
      name: sqlinstance-replica-${uniqueId}
  settings:
    locationPreference:
      zone: us-west1-a
    tier: db-perf-optimized-N-2
    edition: ENTERPRISE_PLUS
    backupConfiguration:
      enabled: true
      binaryLogEnabled: true
      startTime: "12:00"
      backupRetentionSettings:
        retainedBackups: 15
        retentionUnit: COUNT
      transactionLogRetentionDays: 14
---
# Step 01: Create Replica with masterInstanceRef but without annotation.
# Expected: Fails to reconcile (DependencyNotReady).
TEST: APPLY-10-SEC
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-replica-${uniqueId}
spec:
  databaseVersion: MYSQL_8_0
  instanceType: READ_REPLICA_INSTANCE
  masterInstanceRef:
    name: sqlinstance-primary-${uniqueId}
  region: us-east1
  settings:
    locationPreference:
      zone: us-east1-c
    tier: db-perf-optimized-N-2
    edition: ENTERPRISE_PLUS
---
# Step 02: Update Primary with advanced-dr annotation enabled.
# Expected: Unblocks creation; Primary reconciles to Ready=True on GCP.
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-primary-${uniqueId}
  annotations:
    cnrm.cloud.google.com/sqlinstance-advanced-dr: "enabled"
spec:
  databaseVersion: MYSQL_8_0
  region: us-west1
  replicationCluster:
    failoverDrReplicaRef:
      name: sqlinstance-replica-${uniqueId}
  settings:
    locationPreference:
      zone: us-west1-a
    tier: db-perf-optimized-N-2
    edition: ENTERPRISE_PLUS
    backupConfiguration:
      enabled: true
      binaryLogEnabled: true
      startTime: "12:00"
      backupRetentionSettings:
        retainedBackups: 15
        retentionUnit: COUNT
      transactionLogRetentionDays: 14
---
# Step 03: Update Replica with advanced-dr annotation enabled.
# Expected: Replica reconciles to Ready=True, observes drReplica: true.
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-replica-${uniqueId}
  annotations:
    cnrm.cloud.google.com/sqlinstance-advanced-dr: "enabled"
spec:
  databaseVersion: MYSQL_8_0
  instanceType: READ_REPLICA_INSTANCE
  masterInstanceRef:
    name: sqlinstance-primary-${uniqueId}
  region: us-east1
  settings:
    locationPreference:
      zone: us-east1-c
    tier: db-perf-optimized-N-2
    edition: ENTERPRISE_PLUS
---
# Step 04: Read Primary instance to verify replication cluster is established.
# Expected: Primary is Ready=True with failoverDRReplicaName populated in status.observedState.
TEST: READ-OBJECT
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-primary-${uniqueId}
