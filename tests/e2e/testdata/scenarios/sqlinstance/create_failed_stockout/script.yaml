# Regression test for https://github.com/GoogleCloudPlatform/k8s-config-connector/issues/13788
#
# When a Cloud SQL create operation fails asynchronously (for example with ERROR_STOCKOUT),
# GCP finishes the operation with status DONE plus an error, and keeps the instance in
# FAILED state. Config Connector must surface the error, must never report the SQLInstance
# as Ready, must not send updates to the FAILED instance, and must still be able to delete it.
#
# Real GCP can't be made to stock out on demand, so the failure is injected through the
# mockgcp backdoor; this scenario is only meaningful against mockgcp.

# step 0: make the next Cloud SQL instance creation fail with ERROR_STOCKOUT
kind: MockGCPBackdoor
service: sqladmin.googleapis.com
verb: FailNextInstanceCreateWithStockout

---

# step 1: create the instance. The create operation fails, so the SQLInstance must report
# the error and must not become Ready.
TEST: APPLY-10-SEC
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-stockout-${uniqueId}
spec:
  databaseVersion: MYSQL_8_0
  region: us-central1
  settings:
    tier: db-perf-optimized-N-2
    edition: ENTERPRISE_PLUS
    backupConfiguration:
      enabled: true
      binaryLogEnabled: true
      startTime: "12:00"
      transactionLogRetentionDays: 14

---

# step 2: change the spec. Config Connector must not send any update to the FAILED instance
# (GCP would reject it with HTTP 409) and the SQLInstance must still not be Ready.
TEST: APPLY-10-SEC
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-stockout-${uniqueId}
spec:
  databaseVersion: MYSQL_8_0
  region: us-central1
  settings:
    tier: db-perf-optimized-N-2
    edition: ENTERPRISE_PLUS
    backupConfiguration:
      enabled: true
      binaryLogEnabled: true
      startTime: "12:00"
      transactionLogRetentionDays: 14
      backupRetentionSettings:
        retainedBackups: 24
        retentionUnit: COUNT

---

# step 3: delete the SQLInstance. Deleting the failed instance is the recovery path, so it
# must still work.
TEST: DELETE
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-stockout-${uniqueId}
