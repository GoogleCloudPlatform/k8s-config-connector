apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  annotations:
    cnrm.cloud.google.com/last-changed-cookie: normalized-cookie
    cnrm.cloud.google.com/project-id: ${projectId}
    cnrm.cloud.google.com/sqlinstance-advanced-dr: enabled
    test.cnrm.cloud.google.com/reconcile-cookie: (removed)
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    restored: primary-aligned
  name: sqlinstance-primary-${uniqueId}
  namespace: ${projectId}
spec:
  databaseVersion: MYSQL_8_0
  region: us-west1
  replicationCluster:
    failoverDrReplicaRef:
      name: sqlinstance-replica-${uniqueId}
  settings:
    backupConfiguration:
      backupRetentionSettings:
        retainedBackups: 15
        retentionUnit: COUNT
      binaryLogEnabled: true
      enabled: true
      startTime: "12:00"
      transactionLogRetentionDays: 14
    edition: ENTERPRISE_PLUS
    locationPreference:
      zone: us-west1-a
    tier: db-perf-optimized-N-2
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  connectionName: ${projectId}:us-west1:sqlinstance-primary-${uniqueId}
  firstIpAddress: 10.1.2.3
  instanceType: CLOUD_SQL_INSTANCE
  ipAddress: 10.1.2.3
  observedGeneration: 1
  observedState:
    replicationCluster:
      drReplica: false
      failoverDRReplicaName: sqlinstance-replica-${uniqueId}
  publicIpAddress: 10.1.2.3
  selfLink: https://sqladmin.googleapis.com/sql/v1beta4/projects/${projectId}/instances/sqlinstance-primary-${uniqueId}
  serverCaCert:
    cert: |
      -----BEGIN CERTIFICATE-----
      -----END CERTIFICATE-----
    commonName: common-name
    createTime: "1970-01-01T00:00:00Z"
    expirationTime: "1970-01-01T00:00:00Z"
    sha1Fingerprint: "12345678"
  serviceAccountEmailAddress: p${projectNumber}-abcdef@gcp-sa-cloud-sql.iam.gserviceaccount.com
