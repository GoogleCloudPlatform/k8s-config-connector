# Step 00: Provision Primary instance with advanced DR enabled.
# Expected: Ready=True on GCP.
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-primary-${uniqueId}
  annotations:
    cnrm.cloud.google.com/sqlinstance-advanced-dr: "enabled"
spec:
  databaseVersion: MYSQL_8_0
  region: us-west1
  replicationCluster:
    failoverDrReplicaRef:
      name: sqlinstance-replica-${uniqueId}
  settings:
    locationPreference:
      zone: us-west1-a
    tier: db-perf-optimized-N-2
    edition: ENTERPRISE_PLUS
    backupConfiguration:
      enabled: true
      binaryLogEnabled: true
      startTime: "12:00"
      backupRetentionSettings:
        retainedBackups: 15
        retentionUnit: COUNT
      transactionLogRetentionDays: 14
---
# Step 01: Provision DR Replica in secondary region with advanced DR enabled.
# Expected: Ready=True on GCP.
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-replica-${uniqueId}
  annotations:
    cnrm.cloud.google.com/sqlinstance-advanced-dr: "enabled"
spec:
  databaseVersion: MYSQL_8_0
  instanceType: READ_REPLICA_INSTANCE
  masterInstanceRef:
    name: sqlinstance-primary-${uniqueId}
  region: us-east1
  settings:
    locationPreference:
      zone: us-east1-c
    tier: db-perf-optimized-N-2
    edition: ENTERPRISE_PLUS
---
# Step 02: Read Primary instance to verify replication cluster is established.
# Expected: Ready=True with failoverDRReplicaName populated in status.observedState.
TEST: READ-OBJECT
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-primary-${uniqueId}
---
# Step 03: Execute out-of-band switchover via HTTPRequest against real GCP.
# Expected: GCP executes switchover and LRO completes.
kind: HTTPRequest
method: POST
url: https://sqladmin.googleapis.com/sql/v1beta4/projects/${projectId}/instances/sqlinstance-replica-${uniqueId}/switchover
timeout: 10m
---
# Step 04: Trigger re-reconciliation on Primary in switched-over state.
# Expected: Reconciles to Ready=True (GCP mutations skipped).
TEST: TOUCH
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-primary-${uniqueId}
---
# Step 05: Trigger re-reconciliation on Replica in switched-over state.
# Expected: Reconciles to Ready=True (GCP mutations skipped).
TEST: TOUCH
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-replica-${uniqueId}
---
# Step 06: Read Primary instance to verify inverted status.
# Expected: Status reflects READ_REPLICA_INSTANCE and drReplica: true.
TEST: READ-OBJECT
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-primary-${uniqueId}
---
# Step 07: Read Replica instance to verify inverted status.
# Expected: Status reflects CLOUD_SQL_INSTANCE and failoverDRReplicaName.
TEST: READ-OBJECT
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-replica-${uniqueId}
---
# Step 08: Update non-role mutable field (userLabels) on Primary while switched over.
# Expected: Reconciles to Ready=True, but GCP mutation is skipped.
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-primary-${uniqueId}
  annotations:
    cnrm.cloud.google.com/sqlinstance-advanced-dr: "enabled"
  labels:
    switched-over: "primary-update"
spec:
  databaseVersion: MYSQL_8_0
  region: us-west1
  replicationCluster:
    failoverDrReplicaRef:
      name: sqlinstance-replica-${uniqueId}
  settings:
    locationPreference:
      zone: us-west1-a
    tier: db-perf-optimized-N-2
    edition: ENTERPRISE_PLUS
    backupConfiguration:
      enabled: true
      binaryLogEnabled: true
      startTime: "12:00"
      backupRetentionSettings:
        retainedBackups: 15
        retentionUnit: COUNT
      transactionLogRetentionDays: 14
---
# Step 09: Update non-role mutable field (userLabels) on Replica while switched over.
# Expected: Reconciles to Ready=True, but GCP mutation is skipped.
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-replica-${uniqueId}
  annotations:
    cnrm.cloud.google.com/sqlinstance-advanced-dr: "enabled"
  labels:
    switched-over: "replica-update"
spec:
  databaseVersion: MYSQL_8_0
  instanceType: READ_REPLICA_INSTANCE
  masterInstanceRef:
    name: sqlinstance-primary-${uniqueId}
  region: us-east1
  settings:
    locationPreference:
      zone: us-east1-c
    tier: db-perf-optimized-N-2
    edition: ENTERPRISE_PLUS
