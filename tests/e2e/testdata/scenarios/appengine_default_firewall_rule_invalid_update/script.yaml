# Step 0: Modifying sourceRange on default rule via metadata.name="2147483647" (without spec.resourceID)
# is rejected locally before sending any PATCH request to GCP, setting Ready=False (UpdateFailed).
TEST: APPLY-10-SEC-NO-EXPORT
apiVersion: appengine.cnrm.cloud.google.com/v1alpha1
kind: AppEngineFirewallRule
metadata:
  name: "2147483647"
  annotations:
    cnrm.cloud.google.com/backoff-max-delay-in-seconds: "0"
spec:
  project: "${projectId}"
  action: ALLOW
  sourceRange: "10.0.0.0/8"
---
# Step 1: Deleting the default rule CR succeeds as a no-op.
TEST: DELETE
apiVersion: appengine.cnrm.cloud.google.com/v1alpha1
kind: AppEngineFirewallRule
metadata:
  name: "2147483647"
