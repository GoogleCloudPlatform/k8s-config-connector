# 00: Create Master instance
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-master-${uniqueId}
  annotations:
    alpha.cnrm.cloud.google.com/reconciler: "direct"
spec:
  databaseVersion: MYSQL_5_7
  region: us-central1
  settings:
    backupConfiguration:
      binaryLogEnabled: true
      enabled: true
    locationPreference:
      zone: us-central1-a
    tier: db-custom-1-3840
  resourceID: sqlinstance-master-${uniqueId}
---
# 01: Create Read Replica with databaseReplicationEnabled omitted (unset)
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-replica-${uniqueId}
  annotations:
    alpha.cnrm.cloud.google.com/reconciler: "direct"
spec:
  databaseVersion: MYSQL_5_7
  instanceType: READ_REPLICA_INSTANCE
  masterInstanceRef:
    name: sqlinstance-master-${uniqueId}
  region: us-central1
  settings:
    locationPreference:
      zone: us-central1-b
    tier: db-custom-1-3840
  resourceID: sqlinstance-replica-${uniqueId}
---
# 02: Switch databaseReplicationEnabled from unset (which GCP actual has as true) to true
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-replica-${uniqueId}
  annotations:
    alpha.cnrm.cloud.google.com/reconciler: "direct"
spec:
  databaseVersion: MYSQL_5_7
  instanceType: READ_REPLICA_INSTANCE
  masterInstanceRef:
    name: sqlinstance-master-${uniqueId}
  region: us-central1
  settings:
    locationPreference:
      zone: us-central1-b
    tier: db-custom-1-3840
    databaseReplicationEnabled: true
  resourceID: sqlinstance-replica-${uniqueId}
