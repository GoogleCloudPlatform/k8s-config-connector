---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  labels:
    cnrm.cloud.google.com/managed-by-kcc: "true"
    cnrm.cloud.google.com/system: "true"
  name: computeforwardingrules.compute.cnrm.cloud.google.com
spec:
  group: compute.cnrm.cloud.google.com
  names:
    categories:
    - gcp
    kind: ComputeForwardingRule
    listKind: ComputeForwardingRuleList
    plural: computeforwardingrules
    shortNames:
    - gcpcomputeforwardingrule
    - gcpcomputeforwardingrules
    singular: computeforwardingrule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: When 'True', the most recent reconcile of the resource succeeded
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: The reason for the value in 'Ready'
      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Status
      type: string
    - description: The last transition time for the value in 'Status'
      jsonPath: .status.conditions[?(@.type=='Ready')].lastTransitionTime
      name: Status Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: ComputeForwardingRule is the Schema for the ComputeForwardingRule
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ComputeForwardingRuleSpec defines the desired state of ComputeForwardingRule
            properties:
              IPAddress:
                description: 'IP address for which this forwarding rule accepts traffic.
                  When a client sends traffic to this IP address, the forwarding rule
                  directs the traffic to the referenced target or backendService.
                  While creating a forwarding rule, specifying an IPAddress is required
                  under the following circumstances: - When the target is set to targetGrpcProxy
                  and validateForProxyless is set to true, the IPAddress should be
                  set to 0.0.0.0. - When the target is a Private Service Connect Google
                  APIs bundle, you must specify an IPAddress. Otherwise, you can optionally
                  specify an IP address that references an existing static (reserved)
                  IP address resource. When omitted, Google Cloud assigns an ephemeral
                  IP address. Use one of the following formats to specify an IP address
                  while creating a forwarding rule: * IP address number, as in `100.1.2.3`
                  * IPv6 address range, as in `2600:1234::/96` * Full resource URL,
                  as in https://www.googleapis.com/compute/v1/projects/ project_id/regions/region/addresses/address-name
                  * Partial URL or by name, as in: - projects/project_id/regions/region/addresses/address-name
                  - regions/region/addresses/address-name - global/addresses/address-name
                  - address-name The forwarding rule''s target or backendService,
                  and in most cases, also the loadBalancingScheme, determine the type
                  of IP address that you can use. For detailed information, see [IP
                  address specifications](https://cloud.google.com/load-balancing/docs/forwarding-rule-concepts#ip_address_specifications).
                  When reading an IPAddress, the API always returns the IP address
                  number.'
                type: string
              IPProtocol:
                description: |-
                  The IP protocol to which this rule applies. For protocol forwarding, valid options are TCP, UDP, ESP, AH, SCTP, ICMP and L3_DEFAULT. The valid IP protocols are different for different load balancing products as described in [Load balancing features](https://cloud.google.com/load-balancing/docs/features#protocols_from_the_load_balancer_to_the_backends).
                   Check the IPProtocolEnum enum for the list of possible values.
                type: string
              allPorts:
                description: 'The ports, portRange, and allPorts fields are mutually
                  exclusive. Only packets addressed to ports in the specified range
                  will be forwarded to the backends configured with this forwarding
                  rule. The allPorts field has the following limitations: - It requires
                  that the forwarding rule IPProtocol be TCP, UDP, SCTP, or L3_DEFAULT.
                  - It''s applicable only to the following products: internal passthrough
                  Network Load Balancers, backend service-based external passthrough
                  Network Load Balancers, and internal and external protocol forwarding.
                  - Set this field to true to allow packets addressed to any port
                  or packets lacking destination port information (for example, UDP
                  fragments after the first fragment) to be forwarded to the backends
                  configured with this forwarding rule. The L3_DEFAULT protocol requires
                  allPorts be set to true.'
                type: boolean
              allowGlobalAccess:
                description: If set to true, clients can access the internal passthrough
                  Network Load Balancers, the regional internal Application Load Balancer,
                  and the regional internal proxy Network Load Balancer from all regions.
                  If false, only allows access from the local region the load balancer
                  is located at. Note that for INTERNAL_MANAGED forwarding rules,
                  this field cannot be changed after the forwarding rule is created.
                type: boolean
              allowPSCGlobalAccess:
                description: This is used in PSC consumer ForwardingRule to control
                  whether the PSC endpoint can be accessed from another region.
                type: boolean
              backendService:
                description: Identifies the backend service to which the forwarding
                  rule sends traffic. Required for internal and external passthrough
                  Network Load Balancers; must be omitted for all other load balancer
                  types.
                type: string
              baseForwardingRule:
                description: '[Output Only] The URL for the corresponding base forwarding
                  rule. By base forwarding rule, we mean the forwarding rule that
                  has the same IP address, protocol, and port settings with the current
                  forwarding rule, but without sourceIPRanges specified. Always empty
                  if the current forwarding rule does not have sourceIPRanges specified.'
                type: string
              creationTimestamp:
                description: '[Output Only] Creation timestamp in RFC3339 text format.'
                type: string
              description:
                description: An optional description of this resource. Provide this
                  property when you create the resource.
                type: string
              externalManagedBackendBucketMigrationState:
                description: |-
                  Specifies the canary migration state for the backend buckets attached to this forwarding rule. Possible values are PREPARE, TEST_BY_PERCENTAGE, and TEST_ALL_TRAFFIC. To begin the migration from EXTERNAL to EXTERNAL_MANAGED, the state must be changed to PREPARE. The state must be changed to TEST_ALL_TRAFFIC before the loadBalancingScheme can be changed to EXTERNAL_MANAGED. Optionally, the TEST_BY_PERCENTAGE state can be used to migrate traffic to backend buckets attached to this forwarding rule by percentage using externalManagedBackendBucketMigrationTestingPercentage. Rolling back a migration requires the states to be set in reverse order. So changing the scheme from EXTERNAL_MANAGED to EXTERNAL requires the state to be set to TEST_ALL_TRAFFIC at the same time. Optionally, the TEST_BY_PERCENTAGE state can be used to migrate some traffic back to EXTERNAL or PREPARE can be used to migrate all traffic back to EXTERNAL.
                   Check the ExternalManagedBackendBucketMigrationState enum for the list of possible values.
                type: string
              externalManagedBackendBucketMigrationTestingPercentage:
                description: Determines the fraction of requests to backend buckets
                  that should be processed by the global external Application Load
                  Balancer. The value of this field must be in the range [0, 100].
                  This value can only be set if the loadBalancingScheme in the BackendService
                  is set to EXTERNAL (when using the classic Application Load Balancer)
                  and the migration state is TEST_BY_PERCENTAGE.
                type: number
              fingerprint:
                description: Fingerprint of this resource. A hash of the contents
                  stored in this object. This field is used in optimistic locking.
                  This field will be ignored when inserting a ForwardingRule. Include
                  the fingerprint in patch request to ensure that you do not overwrite
                  changes that were applied from another concurrent request. To see
                  the latest fingerprint, make a get() request to retrieve a ForwardingRule.
                type: string
              id:
                description: '[Output Only] The unique identifier for the resource.
                  This identifier is defined by the server.'
                format: int64
                type: integer
              ipCollection:
                description: 'Resource reference of a PublicDelegatedPrefix. The PDP
                  must be a sub-PDP in EXTERNAL_IPV6_FORWARDING_RULE_CREATION mode.
                  Use one of the following formats to specify a sub-PDP when creating
                  an IPv6 NetLB forwarding rule using BYOIP: Full resource URL, as
                  in https://www.googleapis.com/compute/v1/projects/project_id/regions/region
                  /publicDelegatedPrefixes/sub-pdp-name Partial URL, as in: - projects/project_id/regions/region/publicDelegatedPrefixes/sub-pdp-name
                  - regions/region/publicDelegatedPrefixes/sub-pdp-name'
                type: string
              ipVersion:
                description: |-
                  The IP Version that will be used by this forwarding rule. Valid options are IPV4 or IPV6.
                   Check the IpVersion enum for the list of possible values.
                type: string
              isMirroringCollector:
                description: Indicates whether or not this load balancer can be used
                  as a collector for packet mirroring. To prevent mirroring loops,
                  instances behind this load balancer will not have their traffic
                  mirrored even if a PacketMirroring rule applies to them. This can
                  only be set to true for load balancers that have their loadBalancingScheme
                  set to INTERNAL.
                type: boolean
              kind:
                description: '[Output Only] Type of the resource. Always compute#forwardingRule
                  for forwarding rule resources.'
                type: string
              labelFingerprint:
                description: A fingerprint for the labels being applied to this resource,
                  which is essentially a hash of the labels set used for optimistic
                  locking. The fingerprint is initially generated by Compute Engine
                  and changes after every request to modify or update labels. You
                  must always provide an up-to-date fingerprint hash in order to update
                  or change labels, otherwise the request will fail with error 412
                  conditionNotMet. To see the latest fingerprint, make a get() request
                  to retrieve a ForwardingRule.
                type: string
              labels:
                additionalProperties:
                  type: string
                description: Labels for this resource. These can only be added or
                  modified by the setLabels method. Each label key/value pair must
                  comply with RFC1035. Label values may be empty.
                type: object
              loadBalancingScheme:
                description: |-
                  Specifies the forwarding rule type. For more information about forwarding rules, refer to Forwarding rule concepts.
                   Check the LoadBalancingScheme enum for the list of possible values.
                type: string
              location:
                description: The location of this resource.
                type: string
              metadataFilters:
                description: Opaque filter criteria used by load balancer to restrict
                  routing configuration to a limited set of xDS compliant clients.
                  In their xDS requests to load balancer, xDS clients present node
                  metadata. When there is a match, the relevant configuration is made
                  available to those proxies. Otherwise, all the resources (e.g. TargetHttpProxy,
                  UrlMap) referenced by the ForwardingRule are not visible to those
                  proxies. For each metadataFilter in this list, if its filterMatchCriteria
                  is set to MATCH_ANY, at least one of the filterLabels must match
                  the corresponding label provided in the metadata. If its filterMatchCriteria
                  is set to MATCH_ALL, then all of its filterLabels must match with
                  corresponding labels provided in the metadata. If multiple metadataFilters
                  are specified, all of them need to be satisfied in order to be considered
                  a match. metadataFilters specified here will be applifed before
                  those specified in the UrlMap that this ForwardingRule references.
                  metadataFilters only applies to Loadbalancers that have their loadBalancingScheme
                  set to INTERNAL_SELF_MANAGED.
                items:
                  properties:
                    filterLabels:
                      description: The list of label value pairs that must match labels
                        in the provided metadata based on filterMatchCriteria This
                        list must not be empty and can have at the most 64 entries.
                      items:
                        properties:
                          name:
                            description: Name of metadata label. The name can have
                              a maximum length of 1024 characters and must be at least
                              1 character long.
                            type: string
                          value:
                            description: The value of the label must match the specified
                              value. value can have a maximum length of 1024 characters.
                            type: string
                        type: object
                      type: array
                    filterMatchCriteria:
                      description: |-
                        Specifies how individual filter label matches within the list of filterLabels and contributes toward the overall metadataFilter match. Supported values are: - MATCH_ANY: at least one of the filterLabels must have a matching label in the provided metadata. - MATCH_ALL: all filterLabels must have matching labels in the provided metadata.
                         Check the FilterMatchCriteria enum for the list of possible values.
                      type: string
                  type: object
                type: array
              network:
                description: This field is not used for global external load balancing.
                  For internal passthrough Network Load Balancers, this field identifies
                  the network that the load balanced IP should belong to for this
                  forwarding rule. If the subnetwork is specified, the network of
                  the subnetwork will be used. If neither subnetwork nor this field
                  is specified, the default network will be used. For Private Service
                  Connect forwarding rules that forward traffic to Google APIs, a
                  network must be provided.
                type: string
              networkTier:
                description: |-
                  This signifies the networking tier used for configuring this load balancer and can only take the following values: PREMIUM, STANDARD. For regional ForwardingRule, the valid values are PREMIUM and STANDARD. For GlobalForwardingRule, the valid value is PREMIUM. If this field is not specified, it is assumed to be PREMIUM. If IPAddress is specified, this value must be equal to the networkTier of the Address.
                   Check the NetworkTier enum for the list of possible values.
                type: string
              noAutomateDNSZone:
                description: This is used in PSC consumer ForwardingRule to control
                  whether it should try to auto-generate a DNS zone or not. Non-PSC
                  forwarding rules do not use this field. Once set, this field is
                  not mutable.
                type: boolean
              portRange:
                description: 'The ports, portRange, and allPorts fields are mutually
                  exclusive. Only packets addressed to ports in the specified range
                  will be forwarded to the backends configured with this forwarding
                  rule. The portRange field has the following limitations: - It requires
                  that the forwarding rule IPProtocol be TCP, UDP, or SCTP, and -
                  It''s applicable only to the following products: external passthrough
                  Network Load Balancers, internal and external proxy Network Load
                  Balancers, internal and external Application Load Balancers, external
                  protocol forwarding, and Classic VPN. - Some products have restrictions
                  on what ports can be used. See port specifications for details.
                  For external forwarding rules, two or more forwarding rules cannot
                  use the same [IPAddress, IPProtocol] pair, and cannot have overlapping
                  portRanges. For internal forwarding rules within the same VPC network,
                  two or more forwarding rules cannot use the same [IPAddress, IPProtocol]
                  pair, and cannot have overlapping portRanges. @pattern: \\d+(?:-\\d+)?'
                type: string
              ports:
                description: 'The ports, portRange, and allPorts fields are mutually
                  exclusive. Only packets addressed to ports in the specified range
                  will be forwarded to the backends configured with this forwarding
                  rule. The ports field has the following limitations: - It requires
                  that the forwarding rule IPProtocol be TCP, UDP, or SCTP, and -
                  It''s applicable only to the following products: internal passthrough
                  Network Load Balancers, backend service-based external passthrough
                  Network Load Balancers, and internal protocol forwarding. - You
                  can specify a list of up to five ports by number, separated by commas.
                  The ports can be contiguous or discontiguous. For external forwarding
                  rules, two or more forwarding rules cannot use the same [IPAddress,
                  IPProtocol] pair if they share at least one port number. For internal
                  forwarding rules within the same VPC network, two or more forwarding
                  rules cannot use the same [IPAddress, IPProtocol] pair if they share
                  at least one port number. @pattern: \\d+(?:-\\d+)?'
                items:
                  type: string
                type: array
              projectRef:
                description: The project that this resource belongs to.
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              pscConnectionID:
                description: '[Output Only] The PSC connection id of the PSC forwarding
                  rule.'
                format: int64
                type: integer
              pscConnectionStatus:
                description: Check the PscConnectionStatus enum for the list of possible
                  values.
                type: string
              region:
                description: '[Output Only] URL of the region where the regional forwarding
                  rule resides. This field is not applicable to global forwarding
                  rules. You must specify this field as part of the HTTP request URL.
                  It is not settable as a field in the request body.'
                type: string
              resourceID:
                description: The ComputeForwardingRule name. If not given, the metadata.name
                  will be used.
                type: string
              selfLink:
                description: '[Output Only] Server-defined URL for the resource.'
                type: string
              selfLinkWithID:
                description: '[Output Only] Server-defined URL for this resource with
                  the resource id.'
                type: string
              serviceDirectoryRegistrations:
                description: Service Directory resources to register this forwarding
                  rule with. Currently, only supports a single Service Directory resource.
                items:
                  properties:
                    namespace:
                      description: Service Directory namespace to register the forwarding
                        rule under.
                      type: string
                    service:
                      description: Service Directory service to register the forwarding
                        rule under.
                      type: string
                    serviceDirectoryRegion:
                      description: '[Optional] Service Directory region to register
                        this global forwarding rule under. Default to "us-central1".
                        Only used for PSC for Google APIs. All PSC for Google APIs
                        forwarding rules on the same network should use the same Service
                        Directory region.'
                      type: string
                  type: object
                type: array
              serviceLabel:
                description: An optional prefix to the service name for this forwarding
                  rule. If specified, the prefix is the first label of the fully qualified
                  service name. The label must be 1-63 characters long, and comply
                  with RFC1035. Specifically, the label must be 1-63 characters long
                  and match the regular expression `[a-z]([-a-z0-9]*[a-z0-9])?` which
                  means the first character must be a lowercase letter, and all following
                  characters must be a dash, lowercase letter, or digit, except the
                  last character, which cannot be a dash. This field is only used
                  for internal load balancing.
                type: string
              serviceName:
                description: '[Output Only] The internal fully qualified service name
                  for this forwarding rule. This field is only used for internal load
                  balancing.'
                type: string
              sourceIPRanges:
                description: If not empty, this forwarding rule will only forward
                  the traffic when the source IP address matches one of the IP addresses
                  or CIDR ranges set here. Note that a forwarding rule can only have
                  up to 64 source IP ranges, and this field can only be used with
                  a regional forwarding rule whose scheme is EXTERNAL. Each source_ip_range
                  entry should be either an IP address (for example, 1.2.3.4) or a
                  CIDR range (for example, 1.2.3.0/24).
                items:
                  type: string
                type: array
              subnetwork:
                description: This field identifies the subnetwork that the load balanced
                  IP should belong to for this forwarding rule, used with internal
                  load balancers and external passthrough Network Load Balancers with
                  IPv6. If the network specified is in auto subnet mode, this field
                  is optional. However, a subnetwork must be specified if the network
                  is in custom subnet mode or when creating external forwarding rule
                  with IPv6.
                type: string
              target:
                description: 'The URL of the target resource to receive the matched
                  traffic. For regional forwarding rules, this target must be in the
                  same region as the forwarding rule. For global forwarding rules,
                  this target must be a global load balancing resource. The forwarded
                  traffic must be of a type appropriate to the target object. - For
                  load balancers, see the "Target" column in [Port specifications](https://cloud.google.com/load-balancing/docs/forwarding-rule-concepts#ip_address_specifications).
                  - For Private Service Connect forwarding rules that forward traffic
                  to Google APIs, provide the name of a supported Google API bundle:
                  - vpc-sc - APIs that support VPC Service Controls. - all-apis -
                  All supported Google APIs. - For Private Service Connect forwarding
                  rules that forward traffic to managed services, the target must
                  be a service attachment. The target is not mutable once set as a
                  service attachment.'
                type: string
            required:
            - location
            type: object
          status:
            description: ComputeForwardingRuleStatus defines the config connector
              machine state of ComputeForwardingRule
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: |-
                        Unique, one-word, CamelCase reason for the condition's last
                        transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: A unique specifier for the ComputeForwardingRule resource
                  in GCP.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the Config Connector controller.
                  If this is equal to metadata.generation, then that means that the
                  current reported status reflects the most recent desired state of
                  the resource.
                format: int64
                type: integer
              observedState:
                description: ObservedState is the state of the resource as most recently
                  observed in GCP.
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
