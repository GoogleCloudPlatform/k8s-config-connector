    name: v1beta1
    schema:
      openAPIV3Schema:
        description: ComputeRouterNAT is the Schema for the ComputeRouterNAT API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ComputeRouterNATSpec defines the desired state of ComputeRouterNAT
            properties:
              autoNetworkTier:
                description: |-
                  The network tier to use when automatically reserving NAT IP addresses. Must be one of: PREMIUM, STANDARD. If not specified, then the current project-level default tier is used.
                   Check the AutoNetworkTier enum for the list of possible values.
                type: string
              drainNATIps:
                description: A list of URLs of the IP resources to be drained. These
                  IPs must be valid static external IPs that have been assigned to
                  the NAT. These IPs should be used for updating/patching a NAT only.
                items:
                  type: string
                type: array
              enableDynamicPortAllocation:
                description: Enable Dynamic Port Allocation. If not specified, it
                  is disabled by default. If set to true, - Dynamic Port Allocation
                  will be enabled on this NAT config. - enableEndpointIndependentMapping
                  cannot be set to true. - If minPorts is set, minPortsPerVm must
                  be set to a power of two greater than or equal to 32. If minPortsPerVm
                  is not set, a minimum of 32 ports will be allocated to a VM from
                  this NAT config.
                type: boolean
              enableEndpointIndependentMapping:
                type: boolean
              endpointTypes:
                description: |-
                  List of NAT-ted endpoint types supported by the Nat Gateway. If the list is empty, then it will be equivalent to include ENDPOINT_TYPE_VM
                   Check the EndpointTypes enum for the list of possible values.
                items:
                  type: string
                type: array
              icmpIdleTimeoutSec:
                description: Timeout (in seconds) for ICMP connections. Defaults to
                  30s if not set.
                format: int32
                type: integer
              location:
                description: The location of this resource.
                type: string
              logConfig:
                description: Configure logging on this NAT.
                properties:
                  enable:
                    description: Indicates whether or not to export logs. This is
                      false by default.
                    type: boolean
                  filter:
                    description: |-
                      Specify the desired filtering of logs on this NAT. If unspecified, logs are exported for all connections handled by this NAT. This option can take one of the following values: - ERRORS_ONLY: Export logs only for connection failures. - TRANSLATIONS_ONLY: Export logs only for successful connections. - ALL: Export logs for all connections, successful and unsuccessful.
                       Check the Filter enum for the list of possible values.
                    type: string
                type: object
              maxPortsPerVM:
                description: Maximum number of ports allocated to a VM from this NAT
                  config when Dynamic Port Allocation is enabled. If Dynamic Port
                  Allocation is not enabled, this field has no effect. If Dynamic
                  Port Allocation is enabled, and this field is set, it must be set
                  to a power of two greater than minPortsPerVm, or 64 if minPortsPerVm
                  is not set. If Dynamic Port Allocation is enabled and this field
                  is not set, a maximum of 65536 ports will be allocated to a VM from
                  this NAT config.
                format: int32
                type: integer
              minPortsPerVM:
                description: Minimum number of ports allocated to a VM from this NAT
                  config. If not set, a default number of ports is allocated to a
                  VM. This is rounded up to the nearest power of 2. For example, if
                  the value of this field is 50, at least 64 ports are allocated to
                  a VM.
                format: int32
                type: integer
              nat64Subnetworks:
                description: List of Subnetwork resources whose traffic should be
                  translated by NAT64 Gateway. It is used only when LIST_OF_IPV6_SUBNETWORKS
                  is selected for the SubnetworkIpRangeToNat64Option above.
                items:
                  properties:
                    name:
                      description: URL for the subnetwork resource that will use NAT64.
                      type: string
                  type: object
                type: array
              natIPAllocateOption:
                description: |-
                  Specify the NatIpAllocateOption, which can take one of the following values: - MANUAL_ONLY: Uses only Nat IP addresses provided by customers. When there are not enough specified Nat IPs, the Nat service fails for new VMs. - AUTO_ONLY: Nat IPs are allocated by Google Cloud Platform; customers can't specify any Nat IPs. When choosing AUTO_ONLY, then nat_ip should be empty.
                   Check the NatIpAllocateOption enum for the list of possible values.
                type: string
              natIps:
                description: A list of URLs of the IP resources used for this Nat
                  service. These IP addresses must be valid static external IP addresses
                  assigned to the project.
                items:
                  type: string
                type: array
              projectRef:
                description: The project that this resource belongs to.
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              resourceID:
                description: The ComputeRouterNAT name. If not given, the metadata.name
                  will be used.
                type: string
              rules:
                description: A list of rules associated with this NAT.
                items:
                  properties:
                    action:
                      description: The action to be enforced for traffic that matches
                        this rule.
                      properties:
                        sourceNATActiveIps:
                          description: A list of URLs of the IP resources used for
                            this NAT rule. These IP addresses must be valid static
                            external IP addresses assigned to the project. This field
                            is used for public NAT.
                          items:
                            type: string
                          type: array
                        sourceNATActiveRanges:
                          description: A list of URLs of the subnetworks used as source
                            ranges for this NAT Rule. These subnetworks must have
                            purpose set to PRIVATE_NAT. This field is used for private
                            NAT.
                          items:
                            type: string
                          type: array
                        sourceNATDrainIps:
                          description: A list of URLs of the IP resources to be drained.
                            These IPs must be valid static external IPs that have
                            been assigned to the NAT. These IPs should be used for
                            updating/patching a NAT rule only. This field is used
                            for public NAT.
                          items:
                            type: string
                          type: array
                        sourceNATDrainRanges:
                          description: A list of URLs of subnetworks representing
                            source ranges to be drained. This is only supported on
                            patch/update, and these subnetworks must have previously
                            been used as active ranges in this NAT Rule. This field
                            is used for private NAT.
                          items:
                            type: string
                          type: array
                      type: object
                    description:
                      description: An optional description of this rule.
                      type: string
                    match:
                      description: 'CEL expression that specifies the match condition
                        that egress traffic from a VM is evaluated against. If it
                        evaluates to true, the corresponding `action` is enforced.
                        The following examples are valid match expressions for public
                        NAT: `inIpRange(destination.ip, ''1.1.0.0/16'') || inIpRange(destination.ip,
                        ''2.2.0.0/16'')` `destination.ip == ''1.1.0.1'' || destination.ip
                        == ''8.8.8.8''` The following example is a valid match expression
                        for private NAT: `nexthop.hub == ''//networkconnectivity.googleapis.com/projects/my-project/locations/global/hubs/hub-1''`'
                      type: string
                    ruleNumber:
                      description: An integer uniquely identifying a rule in the list.
                        The rule number must be a positive value between 0 and 65000,
                        and must be unique among rules within a NAT.
                      format: int32
                      type: integer
                  type: object
                type: array
              sourceSubnetworkIPRangesToNAT:
                description: |-
                  Specify the Nat option, which can take one of the following values: - ALL_SUBNETWORKS_ALL_IP_RANGES: All of the IP ranges in every Subnetwork are allowed to Nat. - ALL_SUBNETWORKS_ALL_PRIMARY_IP_RANGES: All of the primary IP ranges in every Subnetwork are allowed to Nat. - LIST_OF_SUBNETWORKS: A list of Subnetworks are allowed to Nat (specified in the field subnetwork below) The default is SUBNETWORK_IP_RANGE_TO_NAT_OPTION_UNSPECIFIED. Note that if this field contains ALL_SUBNETWORKS_ALL_IP_RANGES then there should not be any other Router.Nat section in any Router for this network in this region.
                   Check the SourceSubnetworkIpRangesToNat enum for the list of possible values.
                type: string
              sourceSubnetworkIPRangesToNat64:
                description: |-
                  Specify the Nat option for NAT64, which can take one of the following values: - ALL_IPV6_SUBNETWORKS: All of the IP ranges in every Subnetwork are allowed to Nat. - LIST_OF_IPV6_SUBNETWORKS: A list of Subnetworks are allowed to Nat (specified in the field nat64_subnetwork below) The default is NAT64_OPTION_UNSPECIFIED. Note that if this field contains NAT64_ALL_V6_SUBNETWORKS no other Router.Nat section in this region can also enable NAT64 for any Subnetworks in this network. Other Router.Nat sections can still be present to enable NAT44 only.
                   Check the SourceSubnetworkIpRangesToNat64 enum for the list of possible values.
                type: string
              subnetworks:
                description: A list of Subnetwork resources whose traffic should be
                  translated by NAT Gateway. It is used only when LIST_OF_SUBNETWORKS
                  is selected for the SubnetworkIpRangeToNatOption above.
                items:
                  properties:
                    name:
                      description: URL for the subnetwork resource that will use NAT.
                      type: string
                    secondaryIPRangeNames:
                      description: A list of the secondary ranges of the Subnetwork
                        that are allowed to use NAT. This can be populated only if
                        "LIST_OF_SECONDARY_IP_RANGES" is one of the values in source_ip_ranges_to_nat.
                      items:
                        type: string
                      type: array
                    sourceIPRangesToNAT:
                      description: |-
                        Specify the options for NAT ranges in the Subnetwork. All options of a single value are valid except NAT_IP_RANGE_OPTION_UNSPECIFIED. The only valid option with multiple values is: ["PRIMARY_IP_RANGE", "LIST_OF_SECONDARY_IP_RANGES"] Default: [ALL_IP_RANGES]
                         Check the SourceIpRangesToNat enum for the list of possible values.
                      items:
                        type: string
                      type: array
                  type: object
                type: array
              tcpEstablishedIdleTimeoutSec:
                description: Timeout (in seconds) for TCP established connections.
                  Defaults to 1200s if not set.
                format: int32
                type: integer
              tcpTimeWaitTimeoutSec:
                description: Timeout (in seconds) for TCP connections that are in
                  TIME_WAIT state. Defaults to 120s if not set.
                format: int32
                type: integer
              tcpTransitoryIdleTimeoutSec:
                description: Timeout (in seconds) for TCP transitory connections.
                  Defaults to 30s if not set.
                format: int32
                type: integer
              type:
                description: |-
                  Indicates whether this NAT is used for public or private IP translation. If unspecified, it defaults to PUBLIC.
                   Check the Type enum for the list of possible values.
                type: string
              udpIdleTimeoutSec:
                description: Timeout (in seconds) for UDP connections. Defaults to
                  30s if not set.
                format: int32
                type: integer
            required:
            - location
            type: object
          status:
            description: ComputeRouterNATStatus defines the config connector machine
              state of ComputeRouterNAT
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: |-
                        Unique, one-word, CamelCase reason for the condition's last
                        transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: A unique specifier for the ComputeRouterNAT resource
                  in GCP.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the Config Connector controller.
                  If this is equal to metadata.generation, then that means that the
                  current reported status reflects the most recent desired state of
                  the resource.
                format: int64
                type: integer
              observedState:
                description: ObservedState is the state of the resource as most recently
                  observed in GCP.
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
