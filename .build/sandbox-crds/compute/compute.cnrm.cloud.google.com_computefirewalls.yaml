                      : "xyz"} Note: * Invalid combinations of ID & namespaced format
                      is not supported. For instance: {"123/environment" : "tagValues/444"}
                      is invalid.'
                    type: object
                type: object
              priority:
                description: Priority for this rule. This is an integer between `0`
                  and `65535`, both inclusive. The default value is `1000`. Relative
                  priorities determine which rule takes effect if multiple rules apply.
                  Lower values indicate higher priority. For example, a rule with
                  priority `0` has higher precedence than a rule with priority `1`.
                  DENY rules take precedence over ALLOW rules if they have equal priority.
                  Note that VPC networks have implied rules with a priority of `65535`.
