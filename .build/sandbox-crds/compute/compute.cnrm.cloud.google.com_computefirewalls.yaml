                  ranges must be expressed in CIDR format. One or both of sourceRanges
                  and sourceTags may be set. If both fields are set, the rule applies
                  to traffic that has a source IP address within sourceRanges OR a
                  source IP from a resource with a matching tag listed in the sourceTags
                  field. The connection does not need to match both fields for the
                  rule to apply. Both IPv4 and IPv6 are supported.
                items:
                  type: string
                type: array
              sourceServiceAccounts:
                description: If source service accounts are specified, the firewall
                  rules apply only to traffic originating from an instance with a
                  service account in this list. Source service accounts cannot be
                  used to control traffic to an instance's external IP address because
                  service accounts are associated with an instance, not an IP address.
                  sourceRanges can be set at the same time as sourceServiceAccounts.
                  If both are set, the firewall applies to traffic that has a source
                  IP address within the sourceRanges OR a source IP that belongs to
                  an instance with service account listed in sourceServiceAccount.
                  The connection does not need to match both fields for the firewall
                  to apply. sourceServiceAccounts cannot be used at the same time
                  as sourceTags or targetTags.
                items:
                  type: string
                type: array
              sourceTags:
                description: If source tags are specified, the firewall rule applies
                  only to traffic with source IPs that match the primary network interfaces
                  of VM instances that have the tag and are in the same VPC network.
                  Source tags cannot be used to control traffic to an instance's external
                  IP address, it only applies to traffic between instances in the
                  same virtual network. Because tags are associated with instances,
                  not IP addresses. One or both of sourceRanges and sourceTags may
                  be set. If both fields are set, the firewall applies to traffic
                  that has a source IP address within sourceRanges OR a source IP
                  from a resource with a matching tag listed in the sourceTags field.
                  The connection does not need to match both fields for the firewall
