              IPv4Range:
                description: 'Deprecated in favor of subnet mode networks. The range
                  of internal addresses that are legal on this network. This range
                  is a CIDR specification, for example: 192.168.0.0/16. Provided by
                  the client when the network is created.'
                type: string
              autoCreateSubnetworks:
                description: Must be set to create a VPC network. If not set, a legacy
                  network is created. When set to true, the VPC network is created
                  in auto mode. When set to false, the VPC network is created in custom
                  mode. An auto mode VPC network starts with one subnet per region.
                  Each subnet has a predetermined range as described in Auto mode
                  VPC network IP ranges. For custom mode VPC networks, you can add
                  subnets using the subnetworks insert method.
                type: boolean
              creationTimestamp:
                description: '[Output Only] Creation timestamp in RFC3339 text format.'
