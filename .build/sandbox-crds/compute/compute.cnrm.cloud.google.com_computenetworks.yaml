                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              resourceID:
                description: The ComputeNetwork name. If not given, the metadata.name
                  will be used.
                type: string
              routingConfig:
                description: The network-level routing configuration for this network.
                  Used by Cloud Router to determine what type of network-wide routing
                  behavior to enforce.
                properties:
                  bgpAlwaysCompareMed:
                    description: Enable comparison of Multi-Exit Discriminators (MED)
                      across routes with different neighbor ASNs when using the STANDARD
                      BGP best path selection algorithm.
                    type: boolean
                  bgpBestPathSelectionMode:
                    description: |-
                      The BGP best path selection algorithm to be employed within this network for dynamic routes learned by Cloud Routers. Can be LEGACY (default) or STANDARD.
                       Check the BgpBestPathSelectionMode enum for the list of possible values.
                    type: string
                  bgpInterRegionCost:
                    description: |-
                      Allows to define a preferred approach for handling inter-region cost in the selection process when using the STANDARD BGP best path selection algorithm. Can be DEFAULT or ADD_COST_TO_MED.
                       Check the BgpInterRegionCost enum for the list of possible values.
                    type: string
                  effectiveBGPAlwaysCompareMed:
                    description: '[Output Only] Effective value of the bgp_always_compare_med
                      field.'
                    type: boolean
                  effectiveBGPInterRegionCost:
                    description: |-
                      [Output Only] Effective value of the bgp_inter_region_cost field.
                       Check the EffectiveBgpInterRegionCost enum for the list of possible values.
                    type: string
                  routingMode:
                    description: |-
                      The network-wide routing mode to use. If set to REGIONAL, this network's Cloud Routers will only advertise routes with subnets of this network in the same region as the router. If set to GLOBAL, this network's Cloud Routers will advertise routes with all subnets of this network, across regions.
                       Check the RoutingMode enum for the list of possible values.
                    type: string
                type: object
              selfLink:
