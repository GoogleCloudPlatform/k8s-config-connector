              description:
                description: An optional description of this resource. Provide this
                  field when you create the resource.
                type: string
              enableUlaInternalIPV6:
                description: Enable ULA internal ipv6 on this network. Enabling this
                  feature will assign a /48 from google defined ULA prefix fd20::/20.
                  .
                type: boolean
              firewallPolicy:
                description: '[Output Only] URL of the firewall policy the network
                  is associated with.'
                type: string
              gatewayIPv4:
                description: '[Output Only] The gateway address for default routing
                  out of the network, selected by Google Cloud.'
                type: string
              id:
