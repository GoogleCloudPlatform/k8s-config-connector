                    format: int32
                    type: integer
                  verifying:
                    description: '[Output Only] The number of instances in the managed
                      instance group that are being verified. See the managedInstances[].currentAction
                      property in the listManagedInstances method documentation.'
                    format: int32
                    type: integer
                type: object
              description:
