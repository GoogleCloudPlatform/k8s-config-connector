                format: int64
                type: integer
              instanceFlexibilityPolicy:
                description: Instance flexibility allowing MIG to create VMs from
                  multiple types of machines. Instance flexibility configuration on
                  MIG overrides instance template configuration.
                type: object
              instanceGroup:
                description: '[Output Only] The URL of the Instance Group resource.'
