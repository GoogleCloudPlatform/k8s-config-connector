                    format: int32
                    type: integer
                  restarting:
                    description: '[Output Only] The number of instances in the managed
                      instance group that are scheduled to be restarted or are currently
                      being restarted.'
                    format: int32
                    type: integer
                  resuming:
                    description: '[Output Only] The number of instances in the managed
                      instance group that are scheduled to be resumed or are currently
                      being resumed.'
                    format: int32
                    type: integer
                  starting:
                    description: '[Output Only] The number of instances in the managed
