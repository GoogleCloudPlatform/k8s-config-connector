                  You can specify only one value.
                items:
                  properties:
                    healthCheck:
                      description: The URL for the health check that signals autohealing.
                      type: string
                    initialDelaySec:
                      description: The initial delay is the number of seconds that
                        a new VM takes to initialize and run its startup script. During
                        a VM's initial delay period, the MIG ignores unsuccessful
                        health checks because the VM might be in the startup process.
                        This prevents the MIG from prematurely recreating a VM. If
                        the health check receives a healthy response during the initial
                        delay, it indicates that the startup process is complete and
