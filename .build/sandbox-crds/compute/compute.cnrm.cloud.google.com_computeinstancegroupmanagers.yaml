                        0 and 3600 seconds. The default value is 0.
                      format: int32
                      type: integer
                  type: object
                type: array
              baseInstanceName:
                description: The base instance name is a prefix that you want to attach
                  to the names of all VMs in a MIG. The maximum character length is
                  58 and the name must comply with RFC1035 format. When a VM is created
                  in the group, the MIG appends a hyphen and a random four-character
                  string to the base instance name. If you want the MIG to assign
                  sequential numbers instead of a random string, then end the base
                  instance name with a hyphen followed by one or more hash symbols.
                  The hash symbols indicate the number of digits. For example, a base
                  instance name of "vm-###" results in "vm-001" as a VM name. @pattern
                  [a-z](([-a-z0-9]{0,57})|([-a-z0-9]{0,51}-#{1,10}(\\[[0-9]{1,10}\\])?))
                type: string
              creationTimestamp:
