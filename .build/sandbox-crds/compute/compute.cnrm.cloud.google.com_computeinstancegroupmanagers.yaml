                  method.'
                format: int32
                type: integer
              targetSuspendedSize:
                description: 'The target number of suspended instances for this managed
                  instance group. This number changes when you: - Suspend instance
                  using the suspendInstances method or resume instances using the
                  resumeInstances method. - Manually change the targetSuspendedSize
                  using the update method.'
                format: int32
                type: integer
              updatePolicy:
                description: The update policy for this managed instance group.
                properties:
                  instanceRedistributionType:
                    description: |-
                      The instance redistribution policy for regional managed instance groups. Valid values are: - PROACTIVE (default): The group attempts to maintain an even distribution of VM instances across zones in the region. - NONE: For non-autoscaled groups, proactive redistribution is disabled.
                       Check the InstanceRedistributionType enum for the list of possible values.
                    type: string
                  maxSurge:
                    description: The maximum number of instances that can be created
                      above the specified targetSize during the update process. This
                      value can be either a fixed number or, if the group has 10 or
                      more instances, a percentage. If you set a percentage, the number
                      of instances is rounded if necessary. The default value for
                      maxSurge is a fixed value equal to the number of zones in which
                      the managed instance group operates. At least one of either
                      maxSurge or maxUnavailable must be greater than 0. Learn more
                      about maxSurge.
                    properties:
                      calculated:
                        description: '[Output Only] Absolute value of VM instances
                          calculated based on the specific mode. - If the value is
                          fixed, then the calculated value is equal to the fixed value.
                          - If the value is a percent, then the calculated value is
                          percent/100 * targetSize. For example, the calculated value
                          of a 80% of a managed instance group with 150 instances
                          would be (80/100 * 150) = 120 VM instances. If there is
                          a remainder, the number is rounded.'
                        format: int32
                        type: integer
                      fixed:
                        description: Specifies a fixed number of VM instances. This
                          must be a positive integer.
                        format: int32
                        type: integer
                      percent:
                        description: Specifies a percentage of instances between 0
                          to 100%, inclusive. For example, specify 80 for 80%.
                        format: int32
                        type: integer
                    type: object
                  maxUnavailable:
                    description: 'The maximum number of instances that can be unavailable
                      during the update process. An instance is considered available
                      if all of the following conditions are satisfied: - The instance''s
                      status is RUNNING. - If there is a health check on the instance
                      group, the instance''s health check status must be HEALTHY at
                      least once. If there is no health check on the group, then the
                      instance only needs to have a status of RUNNING to be considered
                      available. This value can be either a fixed number or, if the
                      group has 10 or more instances, a percentage. If you set a percentage,
                      the number of instances is rounded if necessary. The default
                      value for maxUnavailable is a fixed value equal to the number
                      of zones in which the managed instance group operates. At least
                      one of either maxSurge or maxUnavailable must be greater than
                      0. Learn more about maxUnavailable.'
                    properties:
                      calculated:
                        description: '[Output Only] Absolute value of VM instances
                          calculated based on the specific mode. - If the value is
                          fixed, then the calculated value is equal to the fixed value.
                          - If the value is a percent, then the calculated value is
                          percent/100 * targetSize. For example, the calculated value
                          of a 80% of a managed instance group with 150 instances
                          would be (80/100 * 150) = 120 VM instances. If there is
                          a remainder, the number is rounded.'
                        format: int32
                        type: integer
                      fixed:
                        description: Specifies a fixed number of VM instances. This
                          must be a positive integer.
                        format: int32
                        type: integer
                      percent:
                        description: Specifies a percentage of instances between 0
                          to 100%, inclusive. For example, specify 80 for 80%.
                        format: int32
                        type: integer
                    type: object
                  minimalAction:
                    description: |-
                      Minimal action to be taken on an instance. Use this option to minimize disruption as much as possible or to apply a more disruptive action than is necessary. - To limit disruption as much as possible, set the minimal action to REFRESH. If your update requires a more disruptive action, Compute Engine performs the necessary action to execute the update. - To apply a more disruptive action than is strictly necessary, set the minimal action to RESTART or REPLACE. For example, Compute Engine does not need to restart a VM to change its metadata. But if your application reads instance metadata only when a VM is restarted, you can set the minimal action to RESTART in order to pick up metadata changes.
                       Check the MinimalAction enum for the list of possible values.
                    type: string
                  mostDisruptiveAllowedAction:
                    description: |-
                      Most disruptive action that is allowed to be taken on an instance. You can specify either NONE to forbid any actions, REFRESH to avoid restarting the VM and to limit disruption as much as possible. RESTART to allow actions that can be applied without instance replacing or REPLACE to allow all possible actions. If the Updater determines that the minimal update action needed is more disruptive than most disruptive allowed action you specify it will not perform the update at all.
                       Check the MostDisruptiveAllowedAction enum for the list of possible values.
                    type: string
                  replacementMethod:
                    description: |-
                      What action should be used to replace instances. See minimal_action.REPLACE
                       Check the ReplacementMethod enum for the list of possible values.
                    type: string
                  type:
                    description: |-
                      The type of update process. You can specify either PROACTIVE so that the MIG automatically updates VMs to the latest configurations or OPPORTUNISTIC so that you can select the VMs that you want to update.
                       Check the Type enum for the list of possible values.
                    type: string
                type: object
              versions:
                description: Specifies the instance templates used by this managed
                  instance group to create instances. Each version is defined by an
                  instanceTemplate and a name. Every version can appear at most once
                  per instance group. This field overrides the top-level instanceTemplate
                  field. Read more about the relationships between these fields. Exactly
                  one version must leave the targetSize field unset. That version
                  will be applied to all remaining instances. For more information,
                  read about canary updates.
                items:
                  properties:
                    instanceTemplate:
                      description: The URL of the instance template that is specified
                        for this managed instance group. The group uses this template
                        to create new instances in the managed instance group until
                        the `targetSize` for this version is reached. The templates
                        for existing instances in the group do not change unless you
                        run recreateInstances, run applyUpdatesToInstances, or set
                        the group's updatePolicy.type to PROACTIVE; in those cases,
                        existing instances are updated until the `targetSize` for
                        this version is reached.
                      type: string
                    name:
                      description: Name of the version. Unique among all versions
                        in the scope of this managed instance group.
                      type: string
                    targetSize:
                      description: 'Specifies the intended number of instances to
                        be created from the instanceTemplate. The final number of
                        instances created from the template will be equal to: - If
                        expressed as a fixed number, the minimum of either targetSize.fixed
                        or instanceGroupManager.targetSize is used. - if expressed
                        as a percent, the targetSize would be (targetSize.percent/100
                        * InstanceGroupManager.targetSize) If there is a remainder,
                        the number is rounded. If unset, this version will update
                        any remaining instances not updated by another version. Read
                        Starting a canary update for more information.'
                      properties:
                        calculated:
                          description: '[Output Only] Absolute value of VM instances
                            calculated based on the specific mode. - If the value
                            is fixed, then the calculated value is equal to the fixed
                            value. - If the value is a percent, then the calculated
                            value is percent/100 * targetSize. For example, the calculated
                            value of a 80% of a managed instance group with 150 instances
                            would be (80/100 * 150) = 120 VM instances. If there is
                            a remainder, the number is rounded.'
                          format: int32
                          type: integer
                        fixed:
                          description: Specifies a fixed number of VM instances. This
                            must be a positive integer.
                          format: int32
                          type: integer
                        percent:
                          description: Specifies a percentage of instances between
                            0 to 100%, inclusive. For example, specify 80 for 80%.
                          format: int32
                          type: integer
                      type: object
                  type: object
                type: array
              zone:
                description: '[Output Only] The URL of a zone where the managed instance
                  group is located (for zonal resources).'
                type: string
            required:
