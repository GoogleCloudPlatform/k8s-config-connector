                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              propagatedConnectionLimit:
                description: The number of consumer spokes that connected Private
                  Service Connect endpoints can be propagated to through Network Connectivity
                  Center. This limit lets the service producer limit how many propagated
                  Private Service Connect connections can be established to this service
                  attachment from a single consumer. If the connection preference
                  of the service attachment is ACCEPT_MANUAL, the limit applies to
                  each project or network that is listed in the consumer accept list.
                  If the connection preference of the service attachment is ACCEPT_AUTOMATIC,
                  the limit applies to each project that contains a connected endpoint.
                  If unspecified, the default propagated connection limit is 250.
                format: int32
                type: integer
              pscServiceAttachmentID:
