                  service attachment.'
                properties:
                  high:
                    format: int64
                    type: integer
                  low:
                    format: int64
                    type: integer
                type: object
              reconcileConnections:
                description: This flag determines whether a consumer accept/reject
                  list change can reconcile the statuses of existing ACCEPTED or REJECTED
                  PSC endpoints. - If false, connection policy update will only affect
                  existing PENDING PSC endpoints. Existing ACCEPTED/REJECTED endpoints
                  will remain untouched regardless how the connection policy is modified
                  . - If true, update will affect both PENDING and ACCEPTED/REJECTED
                  PSC endpoints. For example, an ACCEPTED PSC endpoint will be moved
                  to REJECTED if its project is added to the reject list. For newly
                  created service attachment, this boolean defaults to false.
                type: boolean
              region:
