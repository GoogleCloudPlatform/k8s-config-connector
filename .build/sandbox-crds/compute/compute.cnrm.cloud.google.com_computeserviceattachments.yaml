                   Check the ConnectionPreference enum for the list of possible values.
                type: string
              consumerAcceptLists:
                description: Specifies which consumer projects or networks are allowed
                  to connect to the service attachment. Each project or network has
                  a connection limit. A given service attachment can manage connections
                  at either the project or network level. Therefore, both the accept
                  and reject lists for a given service attachment must contain either
                  only projects or only networks or only endpoints.
                items:
                  properties:
                    connectionLimit:
