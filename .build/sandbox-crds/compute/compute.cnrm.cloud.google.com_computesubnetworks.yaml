    name: v1beta1
    schema:
      openAPIV3Schema:
        description: ComputeSubnetwork is the Schema for the ComputeSubnetwork API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ComputeSubnetworkSpec defines the desired state of ComputeSubnetwork
            properties:
              creationTimestamp:
                description: '[Output Only] Creation timestamp in RFC3339 text format.'
                type: string
              description:
                description: An optional description of this resource. Provide this
                  property when you create the resource. This field can be set only
                  at resource creation time.
                type: string
              enableFlowLogs:
                description: Whether to enable flow logging for this subnetwork. If
                  this field is not explicitly set, it will not appear in get listings.
                  If not set the default behavior is determined by the org policy,
                  if there is no org policy specified, then it will default to disabled.
                  This field isn't supported if the subnet purpose field is set to
                  REGIONAL_MANAGED_PROXY.
                type: boolean
              externalIPV6Prefix:
                description: The external IPv6 address range that is owned by this
                  subnetwork.
                type: string
              fingerprint:
                description: Fingerprint of this resource. A hash of the contents
                  stored in this object. This field is used in optimistic locking.
                  This field will be ignored when inserting a Subnetwork. An up-to-date
                  fingerprint must be provided in order to update the Subnetwork,
                  otherwise the request will fail with error 412 conditionNotMet.
                  To see the latest fingerprint, make a get() request to retrieve
                  a Subnetwork.
                type: string
              gatewayAddress:
                description: '[Output Only] The gateway address for default routes
                  to reach destination addresses outside this subnetwork.'
                type: string
              id:
                description: '[Output Only] The unique identifier for the resource.
                  This identifier is defined by the server.'
                format: int64
                type: integer
              internalIPV6Prefix:
                description: The internal IPv6 address range that is owned by this
                  subnetwork.
                type: string
              ipCIDRRange:
                description: The range of internal addresses that are owned by this
                  subnetwork. Provide this property when you create the subnetwork.
                  For example, 10.0.0.0/8 or 100.64.0.0/10. Ranges must be unique
                  and non-overlapping within a network. Only IPv4 is supported. This
                  field is set at resource creation time. The range can be any range
                  listed in the Valid ranges list. The range can be expanded after
                  creation using expandIpCidrRange.
                type: string
              ipCollection:
                description: 'Reference to the source of IP, like a PublicDelegatedPrefix
                  (PDP) for BYOIP. The PDP must be a sub-PDP in EXTERNAL_IPV6_SUBNETWORK_CREATION
                  mode. Use one of the following formats to specify a sub-PDP when
                  creating a dual stack subnetwork with external access using BYOIP:
                  - Full resource URL, as in https://www.googleapis.com/compute/v1/projects/projectId/regions/region
                  /publicDelegatedPrefixes/sub-pdp-name - Partial URL, as in - projects/projectId/regions/region/publicDelegatedPrefixes/
                  sub-pdp-name - regions/region/publicDelegatedPrefixes/sub-pdp-name'
                type: string
              ipv6AccessType:
                description: |-
                  The access type of IPv6 address this subnet holds. It's immutable and can only be specified during creation or the first time the subnet is updated into IPV4_IPV6 dual stack.
                   Check the Ipv6AccessType enum for the list of possible values.
                type: string
              ipv6CIDRRange:
                description: '[Output Only] This field is for internal use.'
                type: string
              ipv6GCEEndpoint:
                description: |-
                  [Output Only] Possible endpoints of this subnetwork. It can be one of the following: - VM_ONLY: The subnetwork can be used for creating instances and IPv6 addresses with VM endpoint type. Such a subnetwork gets external IPv6 ranges from a public delegated prefix and cannot be used to create NetLb. - VM_AND_FR: The subnetwork can be used for creating both VM instances and Forwarding Rules. It can also be used to reserve IPv6 addresses with both VM and FR endpoint types. Such a subnetwork gets its IPv6 range from Google IP Pool directly.
                   Check the Ipv6GceEndpoint enum for the list of possible values.
                type: string
              kind:
                description: '[Output Only] Type of the resource. Always compute#subnetwork
                  for Subnetwork resources.'
                type: string
              location:
                description: The location of this resource.
                type: string
              logConfig:
                description: This field denotes the VPC flow logging options for this
                  subnetwork. If logging is enabled, logs are exported to Cloud Logging.
                properties:
                  aggregationInterval:
                    description: |-
                      Can only be specified if VPC flow logging for this subnetwork is enabled. Toggles the aggregation interval for collecting flow logs. Increasing the interval time will reduce the amount of generated flow logs for long lasting connections. Default is an interval of 5 seconds per connection.
                       Check the AggregationInterval enum for the list of possible values.
                    type: string
                  enable:
                    description: Whether to enable flow logging for this subnetwork.
                      If this field is not explicitly set, it will not appear in get
                      listings. If not set the default behavior is determined by the
                      org policy, if there is no org policy specified, then it will
                      default to disabled. Flow logging isn't supported if the subnet
                      purpose field is set to REGIONAL_MANAGED_PROXY.
                    type: boolean
                  filterExpr:
                    description: Can only be specified if VPC flow logs for this subnetwork
                      is enabled. The filter expression is used to define which VPC
                      flow logs should be exported to Cloud Logging.
                    type: string
                  flowSampling:
                    description: Can only be specified if VPC flow logging for this
                      subnetwork is enabled. The value of the field must be in [0,
                      1]. Set the sampling rate of VPC flow logs within the subnetwork
                      where 1.0 means all collected logs are reported and 0.0 means
                      no logs are reported. Default is 0.5 unless otherwise specified
                      by the org policy, which means half of all collected logs are
                      reported.
                    type: number
                  metadata:
                    description: |-
                      Can only be specified if VPC flow logs for this subnetwork is enabled. Configures whether all, none or a subset of metadata fields should be added to the reported VPC flow logs. Default is EXCLUDE_ALL_METADATA.
                       Check the Metadata enum for the list of possible values.
                    type: string
                  metadataFields:
                    description: Can only be specified if VPC flow logs for this subnetwork
                      is enabled and "metadata" was set to CUSTOM_METADATA.
                    items:
                      type: string
                    type: array
                type: object
              network:
                description: The URL of the network to which this subnetwork belongs,
                  provided by the client when initially creating the subnetwork. This
                  field can be set only at resource creation time.
                type: string
              params:
                description: Input only. [Input Only] Additional params passed with
                  the request, but not persisted as part of resource payload.
                properties:
                  resourceManagerTags:
                    additionalProperties:
                      type: string
                    description: 'Tag keys/values directly bound to this resource.
                      Tag keys and values have the same definition as resource manager
                      tags. The field is allowed for INSERT only. The keys/values
                      to set on the resource should be specified in either ID { :
                      } or Namespaced format { : }. For example the following are
                      valid inputs: * {"tagKeys/333" : "tagValues/444", "tagKeys/123"
                      : "tagValues/456"} * {"123/environment" : "production", "345/abc"
                      : "xyz"} Note: * Invalid combinations of ID & namespaced format
                      is not supported. For instance: {"123/environment" : "tagValues/444"}
                      is invalid.'
                    type: object
                type: object
              privateIPGoogleAccess:
                description: Whether the VMs in this subnet can access Google services
                  without assigned external IP addresses. This field can be both set
                  at resource creation time and updated using setPrivateIpGoogleAccess.
                type: boolean
              privateIPV6GoogleAccess:
                description: |-
                  This field is for internal use. This field can be both set at resource creation time and updated using patch.
                   Check the PrivateIpv6GoogleAccess enum for the list of possible values.
                type: string
              projectRef:
                description: The project that this resource belongs to.
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              purpose:
                description: Check the Purpose enum for the list of possible values.
                type: string
              region:
                description: URL of the region where the Subnetwork resides. This
                  field can be set only at resource creation time.
                type: string
              reservedInternalRange:
                description: The URL of the reserved internal range.
                type: string
              resourceID:
                description: The ComputeSubnetwork name. If not given, the metadata.name
                  will be used.
                type: string
              role:
                description: |-
                  The role of subnetwork. Currently, this field is only used when purpose is set to GLOBAL_MANAGED_PROXY or REGIONAL_MANAGED_PROXY. The value can be set to ACTIVE or BACKUP. An ACTIVE subnetwork is one that is currently being used for Envoy-based load balancers in a region. A BACKUP subnetwork is one that is ready to be promoted to ACTIVE or is currently draining. This field can be updated with a patch request.
                   Check the Role enum for the list of possible values.
                type: string
              secondaryIPRanges:
                description: An array of configurations for secondary IP ranges for
                  VM instances contained in this subnetwork. The primary IP of such
                  VM must belong to the primary ipCidrRange of the subnetwork. The
                  alias IPs may belong to either primary or secondary ranges. This
                  field can be updated with a patch request.
                items:
                  properties:
                    ipCIDRRange:
                      description: The range of IP addresses belonging to this subnetwork
                        secondary range. Provide this property when you create the
                        subnetwork. Ranges must be unique and non-overlapping with
                        all primary and secondary IP ranges within a network. Only
                        IPv4 is supported. The range can be any range listed in the
                        Valid ranges list.
                      type: string
                    rangeName:
                      description: The name associated with this subnetwork secondary
                        range, used when adding an alias IP range to a VM instance.
                        The name must be 1-63 characters long, and comply with RFC1035.
                        The name must be unique within the subnetwork.
                      type: string
                    reservedInternalRange:
                      description: The URL of the reserved internal range.
                      type: string
                  type: object
                type: array
              selfLink:
                description: '[Output Only] Server-defined URL for the resource.'
                type: string
              stackType:
                description: |-
                  The stack type for the subnet. If set to IPV4_ONLY, new VMs in the subnet are assigned IPv4 addresses only. If set to IPV4_IPV6, new VMs in the subnet can be assigned both IPv4 and IPv6 addresses. If not specified, IPV4_ONLY is used. This field can be both set at resource creation time and updated using patch.
                   Check the StackType enum for the list of possible values.
                type: string
              state:
                description: |-
                  [Output Only] The state of the subnetwork, which can be one of the following values: READY: Subnetwork is created and ready to use DRAINING: only applicable to subnetworks that have the purpose set to INTERNAL_HTTPS_LOAD_BALANCER and indicates that connections to the load balancer are being drained. A subnetwork that is draining cannot be used or modified until it reaches a status of READY
                   Check the State enum for the list of possible values.
                type: string
              systemReservedExternalIPV6Ranges:
                description: Output only. [Output Only] The array of external IPv6
                  network ranges reserved from the subnetwork's external IPv6 range
                  for system use.
                items:
                  type: string
                type: array
              systemReservedInternalIPV6Ranges:
                description: Output only. [Output Only] The array of internal IPv6
                  network ranges reserved from the subnetwork's internal IPv6 range
                  for system use.
                items:
                  type: string
                type: array
            required:
            - location
            type: object
          status:
            description: ComputeSubnetworkStatus defines the config connector machine
              state of ComputeSubnetwork
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: |-
                        Unique, one-word, CamelCase reason for the condition's last
                        transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: A unique specifier for the ComputeSubnetwork resource
                  in GCP.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the Config Connector controller.
                  If this is equal to metadata.generation, then that means that the
                  current reported status reflects the most recent desired state of
                  the resource.
                format: int64
                type: integer
              observedState:
                description: ObservedState is the state of the resource as most recently
                  observed in GCP.
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
