                      When the cache mode is set to FORCE_CACHE_ALL, negative caching
                      applies to all responses with the specified response code, and
                      override any caching headers. By default, Cloud CDN will apply
                      the following default TTLs to these status codes: HTTP 300 (Multiple
                      Choice), 301, 308 (Permanent Redirects): 10m HTTP 404 (Not Found),
                      410 (Gone), 451 (Unavailable For Legal Reasons): 120s HTTP 405
                      (Method Not Found), 421 (Misdirected Request), 501 (Not Implemented):
                      60s. These defaults can be overridden in negative_caching_policy.'
                    type: boolean
                  negativeCachingPolicy:
                    description: Sets a cache TTL for the specified HTTP status code.
                      negative_caching must be enabled to configure negative_caching_policy.
                      Omitting the policy and leaving negative_caching enabled will
                      use Cloud CDN's default cache TTLs. Note that when specifying
