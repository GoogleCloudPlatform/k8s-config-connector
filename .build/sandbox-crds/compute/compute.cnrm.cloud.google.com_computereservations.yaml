                type: string
              shareSettings:
                description: Specify share-settings to create a shared reservation.
                  This property is optional. For more information about the syntax
                  and options for this field and its subfields, see the guide for
                  creating a shared reservation.
                properties:
                  shareType:
                    description: |-
                      Type of sharing for this shared-reservation
                       Check the ShareType enum for the list of possible values.
                    type: string
                type: object
              specificReservation:
                description: Reservation for instances with specific machine shapes.
                properties:
                  assuredCount:
                    description: '[Output Only] Indicates how many instances are actually
                      usable currently.'
                    format: int64
                    type: integer
                  count:
                    description: Specifies the number of resources that are allocated.
                    format: int64
                    type: integer
                  inUseCount:
                    description: '[Output Only] Indicates how many instances are in
                      use.'
                    format: int64
                    type: integer
                  instanceProperties:
                    description: The instance properties for the reservation.
                    properties:
                      guestAccelerators:
                        description: Specifies accelerator type and count.
                        items:
                          properties:
                            acceleratorCount:
                              description: The number of the guest accelerator cards
                                exposed to this instance.
                              format: int32
                              type: integer
                            acceleratorType:
                              description: 'Full or partial URL of the accelerator
                                type resource to attach to this instance. For example:
                                projects/my-project/zones/us-central1-c/acceleratorTypes/nvidia-tesla-p100
                                If you are creating an instance template, specify
                                only the accelerator name. See GPUs on Compute Engine
                                for a full list of accelerator types.'
                              type: string
                          type: object
                        type: array
                      localSsds:
                        description: Specifies amount of local ssd to reserve with
                          each instance. The type of disk is local-ssd.
                        items:
                          properties:
                            diskSizeGB:
                              description: Specifies the size of the disk in base-2
                                GB.
                              format: int64
                              type: integer
                            interface:
                              description: |-
                                Specifies the disk interface to use for attaching this disk, which is either SCSI or NVME. The default is SCSI. For performance characteristics of SCSI over NVMe, see Local SSD performance.
                                 Check the Interface enum for the list of possible values.
                              type: string
                          type: object
                        type: array
                      locationHint:
                        description: An opaque location hint used to place the allocation
                          close to other resources. This field is for use by internal
                          tools that use the public API.
                        type: string
                      machineType:
                        description: Specifies type of machine (name only) which has
                          fixed number of vCPUs and fixed amount of memory. This also
                          includes specifying custom machine type following custom-NUMBER_OF_CPUS-AMOUNT_OF_MEMORY
                          pattern.
                        type: string
                      minCPUPlatform:
                        description: Minimum cpu platform the reservation.
                        type: string
                    type: object
                  sourceInstanceTemplate:
                    description: 'Specifies the instance template to create the reservation.
                      If you use this field, you must exclude the instanceProperties
                      field. This field is optional, and it can be a full or partial
                      URL. For example, the following are all valid URLs to an instance
                      template: - https://www.googleapis.com/compute/v1/projects/project
                      /global/instanceTemplates/instanceTemplate - projects/project/global/instanceTemplates/instanceTemplate
                      - global/instanceTemplates/instanceTemplate'
                    type: string
                type: object
              specificReservationRequired:
                description: Indicates whether the reservation can be consumed by
