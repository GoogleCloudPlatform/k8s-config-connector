                        type: string
                      healthyBlockCount:
                        description: The number of reservation blocks that are healthy.
                        format: int32
                        type: integer
                    type: object
                  reservationBlockCount:
                    description: The number of reservation blocks associated with
                      this reservation.
                    format: int32
                    type: integer
                  reservationMaintenance:
