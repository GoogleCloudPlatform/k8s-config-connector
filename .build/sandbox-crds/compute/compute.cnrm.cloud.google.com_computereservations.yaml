                              type: string
                            type: array
                          maintenanceStatus:
                            description: Check the MaintenanceStatus enum for the
                              list of possible values.
                            type: string
                          type:
                            description: |-
                              Defines the type of maintenance.
                               Check the Type enum for the list of possible values.
                            type: string
                          windowEndTime:
                            description: The time by which the maintenance disruption
                              will be completed. This timestamp value is in RFC3339
                              text format.
                            type: string
                          windowStartTime:
                            description: The current start time of the maintenance
                              window. This timestamp value is in RFC3339 text format.
                            type: string
                        type: object
