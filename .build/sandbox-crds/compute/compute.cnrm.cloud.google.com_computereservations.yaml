              deploymentType:
                description: |-
                  Specifies the deployment strategy for this reservation.
                   Check the DeploymentType enum for the list of possible values.
                type: string
              description:
                description: An optional description of this resource. Provide this
                  property when you create the resource.
                type: string
              enableEmergentMaintenance:
                description: Indicates whether Compute Engine allows unplanned maintenance
                  for your VMs; for example, to fix hardware errors.
                type: boolean
              id:
                description: '[Output Only] The unique identifier for the resource.
                  This identifier is defined by the server.'
                format: int64
                type: integer
              kind:
                description: '[Output Only] Type of the resource. Always compute#reservations
                  for reservations.'
                type: string
              linkedCommitments:
                description: '[Output Only] Full or partial URL to parent commitments.
                  This field displays for reservations that are tied to multiple commitments.'
                items:
                  type: string
                type: array
              location:
                description: The location of this resource.
                type: string
              projectRef:
                description: The project that this resource belongs to.
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
