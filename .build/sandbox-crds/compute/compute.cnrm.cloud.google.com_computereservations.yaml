                      computed from: 60 sec/min * 60 min/hr * 24 hr/day * 365.25 days/year
                      * 10000 years'
                    format: int64
                    type: integer
                type: object
              deleteAtTime:
                description: Absolute time in future when the reservation will be
                  auto-deleted by Compute Engine. Timestamp is represented in RFC3339
                  text format.
