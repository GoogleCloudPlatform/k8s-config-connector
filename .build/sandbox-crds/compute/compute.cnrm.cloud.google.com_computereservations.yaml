                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              reservationSharingPolicy:
                description: Specify the reservation sharing policy. If unspecified,
                  the reservation will not be shared with Google Cloud managed services.
                properties:
                  serviceShareType:
                    description: |-
                      Sharing config for all Google Cloud services.
                       Check the ServiceShareType enum for the list of possible values.
                    type: string
                type: object
              resourceID:
                description: The ComputeReservation name. If not given, the metadata.name
                  will be used.
                type: string
              resourcePolicies:
                additionalProperties:
                  type: string
                description: Resource policies to be added to this reservation. The
