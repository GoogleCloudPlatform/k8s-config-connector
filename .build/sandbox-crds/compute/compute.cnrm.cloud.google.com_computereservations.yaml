    name: v1beta1
    schema:
      openAPIV3Schema:
        description: ComputeReservation is the Schema for the ComputeReservation API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ComputeReservationSpec defines the desired state of ComputeReservation
            properties:
              advancedDeploymentControl:
                description: Advanced control for cluster management, applicable only
                  to DENSE deployment type reservations.
                properties:
                  reservationOperationalMode:
                    description: |-
                      Indicates chosen reservation operational mode for the reservation.
                       Check the ReservationOperationalMode enum for the list of possible values.
                    type: string
                type: object
              aggregateReservation:
                description: Reservation for aggregated resources, providing shape
                  flexibility.
                properties:
                  inUseResources:
                    description: '[Output only] List of resources currently in use.'
                    items:
                      properties:
                        accelerator:
                          description: Properties of accelerator resources in this
                            reservation.
                          properties:
                            acceleratorCount:
                              description: Number of accelerators of specified type.
                              format: int32
                              type: integer
                            acceleratorType:
                              description: Full or partial URL to accelerator type.
                                e.g. "projects/{PROJECT}/zones/{ZONE}/acceleratorTypes/ct4l"
                              type: string
                          type: object
                      type: object
                    type: array
                  reservedResources:
                    description: List of reserved resources (CPUs, memory, accelerators).
                    items:
                      properties:
                        accelerator:
                          description: Properties of accelerator resources in this
                            reservation.
                          properties:
                            acceleratorCount:
                              description: Number of accelerators of specified type.
                              format: int32
                              type: integer
                            acceleratorType:
                              description: Full or partial URL to accelerator type.
                                e.g. "projects/{PROJECT}/zones/{ZONE}/acceleratorTypes/ct4l"
                              type: string
                          type: object
                      type: object
                    type: array
                  vmFamily:
                    description: |-
                      The VM family that all instances scheduled against this reservation must belong to.
