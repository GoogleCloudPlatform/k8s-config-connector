                        format: int32
                        type: integer
                      instanceMaintenancePendingCount:
                        description: Describes number of instances that have pending
                          maintenance.
                        format: int32
                        type: integer
                      maintenanceOngoingCount:
                        description: Progress for ongoing maintenance for this group
                          of VMs/hosts. Describes number of hosts in the block that
                          have ongoing maintenance.
                        format: int32
                        type: integer
                      maintenancePendingCount:
                        description: Progress for ongoing maintenance for this group
                          of VMs/hosts. Describes number of hosts in the block that
                          have pending maintenance.
                        format: int32
                        type: integer
                      schedulingType:
                        description: |-
                          The type of maintenance for the reservation.
                           Check the SchedulingType enum for the list of possible values.
                        type: string
                      subblockInfraMaintenanceOngoingCount:
                        description: Describes number of subblock Infrastructure that
                          has ongoing maintenance. Here, Subblock Infrastructure Maintenance
                          pertains to upstream hardware contained in the Subblock
                          that is necessary for a VM Family(e.g. NVLink Domains).
                          Not all VM Families will support this field.
                        format: int32
                        type: integer
                      subblockInfraMaintenancePendingCount:
                        description: Describes number of subblock Infrastructure that
                          has pending maintenance. Here, Subblock Infrastructure Maintenance
                          pertains to upstream hardware contained in the Subblock
                          that is necessary for a VM Family (e.g. NVLink Domains).
                          Not all VM Families will support this field.
                        format: int32
                        type: integer
                      upcomingGroupMaintenance:
                        description: Maintenance information on this group of VMs.
