apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    cnrm.cloud.google.com/version: 0.0.0-dev
  creationTimestamp: null
  labels:
    cnrm.cloud.google.com/managed-by-kcc: "true"
    cnrm.cloud.google.com/system: "true"
  name: alloydbinstances.alloydb.cnrm.cloud.google.com
spec:
  group: alloydb.cnrm.cloud.google.com
  names:
    categories:
    - gcp
    kind: AlloyDBInstance
    listKind: AlloyDBInstanceList
    plural: alloydbinstances
    shortNames:
    - gcpalloydbinstance
    - gcpalloydbinstances
    singular: alloydbinstance
  preserveUnknownFields: false
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: When 'True', the most recent reconcile of the resource succeeded
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: The reason for the value in 'Ready'
      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Status
      type: string
    - description: The last transition time for the value in 'Status'
      jsonPath: .status.conditions[?(@.type=='Ready')].lastTransitionTime
      name: Status Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: AlloyDBInstance is the Schema for the AlloyDBInstance API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: AlloyDBInstanceSpec defines the desired state of AlloyDBInstance
            properties:
              activationPolicy:
                description: Optional. Specifies whether an instance needs to spin
                  up. Once the instance is active, the activation policy can be updated
                  to the `NEVER` to stop the instance. Likewise, the activation policy
                  can be updated to `ALWAYS` to start the instance. There are restrictions
                  around when an instance can/cannot be activated (for example, a
                  read pool instance should be stopped before stopping primary etc.).
                  Please refer to the API documentation for more details.
                type: string
              annotations:
                additionalProperties:
                  type: string
                description: Annotations to allow client tools to store small amount
                  of arbitrary data. This is distinct from labels. https://google.aip.dev/128
                type: object
              availabilityType:
                description: Availability type of an Instance. If empty, defaults
                  to REGIONAL for primary instances. For read pools, availability_type
                  is always UNSPECIFIED. Instances in the read pools are evenly distributed
                  across available zones within the region (i.e. read pools with more
                  than one node will have a node in at least two zones).
                type: string
              clientConnectionConfig:
                description: Optional. Client connection specific configurations
                properties:
                  requireConnectors:
                    description: 'Optional. Configuration to enforce connectors only
                      (ex: AuthProxy) connections to the database.'
                    type: boolean
                  sslConfig:
                    description: Optional. SSL configuration option for this instance.
                    properties:
                      caSource:
                        description: Optional. Certificate Authority (CA) source.
                          Only CA_SOURCE_MANAGED is supported currently, and is the
                          default value.
                        type: string
                      sslMode:
                        description: Optional. SSL mode. Specifies client-server SSL/TLS
                          connection behavior.
                        type: string
                    type: object
                type: object
              connectionPoolConfig:
                description: Optional. The configuration for Managed Connection Pool
                  (MCP).
                properties:
                  enabled:
                    description: Optional. Whether to enable Managed Connection Pool
                      (MCP).
                    type: boolean
                  flags:
                    additionalProperties:
                      type: string
                    description: 'Optional. Connection Pool flags, as a list of "key":
                      "value" pairs.'
                    type: object
                type: object
              databaseFlags:
                additionalProperties:
                  type: string
                description: |-
                  Database flags. Set at the instance level.
                   They are copied from the primary instance on secondary instance creation.
                   Flags that have restrictions default to the value at primary
                   instance on read instances during creation. Read instances can set new
                   flags or override existing flags that are relevant for reads, for example,
                   for enabling columnar cache on a read instance. Flags set on read instance
                   might or might not be present on the primary instance.

                   This is a list of "key": "value" pairs.
                   "key": The name of the flag. These flags are passed at instance setup time,
                   so include both server options and system variables for Postgres. Flags are
                   specified with underscores, not hyphens.
                   "value": The value of the flag. Booleans are set to **on** for true
                   and **off** for false. This field must be omitted if the flag
                   doesn't take a value.
                type: object
              displayName:
                description: User-settable and human-readable display name for the
                  Instance.
                type: string
              etag:
                description: For Resource freshness validation (https://google.aip.dev/154)
                type: string
              gceZone:
                description: The Compute Engine zone that the instance should serve
                  from, per https://cloud.google.com/compute/docs/regions-zones This
                  can ONLY be specified for ZONAL instances. If present for a REGIONAL
                  instance, an error will be thrown. If this is absent for a ZONAL
                  instance, instance is created in a random zone with available capacity.
                type: string
              geminiConfig:
                description: Optional. Deprecated and unused. This field will be removed
                  in the near future.
                type: object
              instanceType:
                description: Required. The type of the instance. Specified at creation
                  time.
                type: string
              labels:
                additionalProperties:
                  type: string
                description: Labels as key value pairs
                type: object
              location:
                description: The location of this resource.
                type: string
              machineConfig:
                description: Configurations for the machines that host the underlying
                  database engine.
                properties:
                  cpuCount:
                    description: The number of CPU's in the VM instance.
                    format: int32
                    type: integer
                  machineType:
                    description: Machine type of the VM instance. E.g. "n2-highmem-4",
                      "n2-highmem-8", "c4a-highmem-4-lssd". cpu_count must match the
                      number of vCPUs in the machine type.
                    type: string
                type: object
              networkConfig:
                description: Optional. Instance-level network configuration.
                properties:
                  allocatedIPRangeOverride:
                    description: 'Optional. Name of the allocated IP range for the
                      private IP AlloyDB instance, for example: "google-managed-services-default".
                      If set, the instance IPs will be created from this allocated
                      range and will override the IP range used by the parent cluster.
                      The range name must comply with [RFC 1035](http://datatracker.ietf.org/doc/html/rfc1035).
                      Specifically, the name must be 1-63 characters long and match
                      the regular expression [a-z]([-a-z0-9]*[a-z0-9])?.'
                    type: string
                  authorizedExternalNetworks:
                    description: Optional. A list of external network authorized to
                      access this instance.
                    items:
                      properties:
                        cidrRange:
                          description: CIDR range for one authorzied network of the
                            instance.
                          type: string
                      type: object
                    type: array
                  enableOutboundPublicIP:
                    description: Optional. Enabling an outbound public IP address
                      to support a database server sending requests out into the internet.
                    type: boolean
                  enablePublicIP:
                    description: Optional. Enabling public ip for the instance.
                    type: boolean
                type: object
              observabilityConfig:
                description: Configuration for observability.
                properties:
                  assistiveExperiencesEnabled:
                    description: Whether assistive experiences are enabled for this
                      AlloyDB instance.
                    type: boolean
                  enabled:
                    description: Observability feature status for an instance. This
                      flag is turned "off" by default.
                    type: boolean
                  maxQueryStringLength:
                    description: Query string length. The default value is 10k.
                    format: int32
                    type: integer
                  preserveComments:
                    description: Preserve comments in query string for an instance.
                      This flag is turned "off" by default.
                    type: boolean
                  queryPlansPerMinute:
                    description: Number of query execution plans captured by Insights
                      per minute for all queries combined. The default value is 200.
                      Any integer between 0 to 200 is considered valid.
                    format: int32
                    type: integer
                  recordApplicationTags:
                    description: Record application tags for an instance. This flag
                      is turned "off" by default.
                    type: boolean
                  trackActiveQueries:
                    description: Track actively running queries on the instance. If
                      not set, this flag is "off" by default.
                    type: boolean
                  trackClientAddress:
                    description: Track client address for an instance. If not set,
                      default value is "off".
                    type: boolean
                  trackWaitEvents:
                    description: Track wait events during query execution for an instance.
                      This flag is turned "on" by default but tracking is enabled
                      only after observability enabled flag is also turned on.
                    type: boolean
                type: object
              projectRef:
                description: The project that this resource belongs to.
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              pscInstanceConfig:
                description: Optional. The configuration for Private Service Connect
                  (PSC) for the instance.
                properties:
                  allowedConsumerProjects:
                    description: Optional. List of consumer projects that are allowed
                      to create PSC endpoints to service-attachments to this instance.
                    items:
                      type: string
                    type: array
                  pscAutoConnections:
                    description: Optional. Configurations for setting up PSC service
                      automation.
                    items:
                      properties:
                        consumerNetwork:
                          description: 'The consumer network for the PSC service automation,
                            example: "projects/vpc-host-project/global/networks/default".
                            The consumer network might be hosted a different project
                            than the consumer project.'
                          type: string
                        consumerProject:
                          description: The consumer project to which the PSC service
                            automation endpoint will be created.
                          type: string
                      type: object
                    type: array
                  pscInterfaceConfigs:
                    description: Optional. Configurations for setting up PSC interfaces
                      attached to the instance which are used for outbound connectivity.
                      Only primary instances can have PSC interface attached. Currently
                      we only support 0 or 1 PSC interface.
                    items:
                      properties:
                        networkAttachmentResource:
                          description: 'The network attachment resource created in
                            the consumer network to which the PSC interface will be
                            linked. This is of the format: "projects/${CONSUMER_PROJECT}/regions/${REGION}/networkAttachments/${NETWORK_ATTACHMENT_NAME}".
                            The network attachment must be in the same region as the
                            instance.'
                          type: string
                      type: object
                    type: array
                type: object
              queryInsightsConfig:
                description: Configuration for query insights.
                properties:
                  queryPlansPerMinute:
                    description: Number of query execution plans captured by Insights
                      per minute for all queries combined. The default value is 5.
                      Any integer between 0 and 20 is considered valid.
                    format: int32
                    type: integer
                  queryStringLength:
                    description: Query string length. The default value is 1024. Any
                      integer between 256 and 4500 is considered valid.
                    format: int32
                    type: integer
                  recordApplicationTags:
                    description: Record application tags for an instance. This flag
                      is turned "on" by default.
                    type: boolean
                  recordClientAddress:
                    description: Record client address for an instance. Client address
                      is PII information. This flag is turned "on" by default.
                    type: boolean
                type: object
              readPoolConfig:
                description: Read pool instance configuration. This is required if
                  the value of instanceType is READ_POOL.
                properties:
                  nodeCount:
                    description: Read capacity, i.e. number of nodes in a read pool
                      instance.
                    format: int32
                    type: integer
                type: object
              resourceID:
                description: The AlloyDBInstance name. If not given, the metadata.name
                  will be used.
                type: string
              updatePolicy:
                description: Update policy that will be applied during instance update.
                  This field is not persisted when you update the instance. To use
                  a non-default update policy, you must specify explicitly specify
                  the value in each update request.
                properties:
                  mode:
                    description: Mode for updating the instance.
                    type: string
                type: object
            required:
            - location
            type: object
          status:
            description: AlloyDBInstanceStatus defines the config connector machine
              state of AlloyDBInstance
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: Unique, one-word, CamelCase reason for the condition's
                        last transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: A unique specifier for the AlloyDBInstance resource in
                  GCP.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the Config Connector controller.
                  If this is equal to metadata.generation, then that means that the
                  current reported status reflects the most recent desired state of
                  the resource.
                format: int64
                type: integer
              observedState:
                description: ObservedState is the state of the resource as most recently
                  observed in GCP.
                properties:
                  createTime:
                    description: Output only. Create time stamp
                    type: string
                  deleteTime:
                    description: Output only. Delete time stamp
                    type: string
                  gcaConfig:
                    description: Output only. Configuration parameters related to
                      Gemini Cloud Assist.
                    properties:
                      gcaEntitlement:
                        description: Output only. Represents the GCA entitlement state
                          of the instance.
                        type: string
                    type: object
                  ipAddress:
                    description: Output only. The IP address for the Instance. This
                      is the connection endpoint for an end-user application.
                    type: string
                  nodes:
                    description: Output only. List of available read-only VMs in this
                      instance, including the standby for a PRIMARY instance.
                    items:
                      properties:
                        id:
                          description: Output only. The identifier of the VM e.g.
                            "test-read-0601-407e52be-ms3l".
                          type: string
                        ip:
                          description: Output only. The private IP address of the
                            VM e.g. "10.57.0.34".
                          type: string
                        state:
                          description: 'Output only. Determined by state of the compute
                            VM and postgres-service health. Compute VM state can have
                            values listed in https://cloud.google.com/compute/docs/instances/instance-life-cycle
                            and postgres-service health can have values: HEALTHY and
                            UNHEALTHY.'
                          type: string
                        zoneID:
                          description: Output only. The Compute Engine zone of the
                            VM e.g. "us-central1-b".
                          type: string
                      type: object
                    type: array
                  outboundPublicIPAddresses:
                    description: Output only. All outbound public IP addresses configured
                      for the instance.
                    items:
                      type: string
                    type: array
                  publicIPAddress:
                    description: Output only. The public IP addresses for the Instance.
                      This is available ONLY when enable_public_ip is set. This is
                      the connection endpoint for an end-user application.
                    type: string
                  reconciling:
                    description: Output only. Reconciling (https://google.aip.dev/128#reconciliation).
                      Set to true if the current state of Instance does not match
                      the user's intended state, and the service is actively updating
                      the resource to reconcile them. This can happen due to user-triggered
                      updates or system actions like failover or maintenance.
                    type: boolean
                  satisfiesPzs:
                    description: Output only. Reserved for future use.
                    type: boolean
                  state:
                    description: Output only. The current serving state of the instance.
                    type: string
                  uid:
                    description: Output only. The system-generated UID of the resource.
                      The UID is assigned when the resource is created, and it is
                      retained until it is deleted.
                    type: string
                  updateTime:
                    description: Output only. Update time stamp
                    type: string
                  writableNode:
                    description: Output only. This is set for the read-write VM of
                      the PRIMARY instance only.
                    properties:
                      id:
                        description: Output only. The identifier of the VM e.g. "test-read-0601-407e52be-ms3l".
                        type: string
                      ip:
                        description: Output only. The private IP address of the VM
                          e.g. "10.57.0.34".
                        type: string
                      state:
                        description: 'Output only. Determined by state of the compute
                          VM and postgres-service health. Compute VM state can have
                          values listed in https://cloud.google.com/compute/docs/instances/instance-life-cycle
                          and postgres-service health can have values: HEALTHY and
                          UNHEALTHY.'
                        type: string
                      zoneID:
                        description: Output only. The Compute Engine zone of the VM
                          e.g. "us-central1-b".
                        type: string
                    type: object
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
