      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Status
      type: string
    - description: The last transition time for the value in 'Status'
      jsonPath: .status.conditions[?(@.type=='Ready')].lastTransitionTime
      name: Status Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: AlloyDBCluster is the Schema for the AlloyDBCluster API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: AlloyDBClusterSpec defines the desired state of AlloyDBCluster
            properties:
              annotations:
                additionalProperties:
                  type: string
                description: Annotations to allow client tools to store small amount
                  of arbitrary data. This is distinct from labels. https://google.aip.dev/128
                type: object
              automatedBackupPolicy:
                description: |-
                  The automated backup policy for this cluster.

                   If no policy is provided then the default policy will be used. If backups
                   are supported for the cluster, the default policy takes one backup a day,
                   has a backup window of 1 hour, and retains backups for 14 days.
                   For more information on the defaults, consult the
                   documentation for the message type.
                properties:
                  backupWindow:
                    description: |-
                      The length of the time window during which a backup can be
                       taken. If a backup does not succeed within this time window, it will be
                       canceled and considered failed.

                       The backup window must be at least 5 minutes long. There is no upper bound
                       on the window. If not set, it defaults to 1 hour.
                    type: string
                  enabled:
                    description: Whether automated automated backups are enabled.
                      If not set, defaults to true.
                    type: boolean
                  encryptionConfig:
                    description: Optional. The encryption config can be specified
                      to encrypt the backups with a customer-managed encryption key
                      (CMEK). When this field is not specified, the backup will use
                      the cluster's encryption config.
                    properties:
                      kmsKeyName:
                        description: 'The fully-qualified resource name of the KMS
                          key. Each Cloud KMS key is regionalized and has the following
                          format: projects/[PROJECT]/locations/[REGION]/keyRings/[RING]/cryptoKeys/[KEY_NAME]'
                        type: string
                    type: object
                  labels:
                    additionalProperties:
                      type: string
                    description: Labels to apply to backups created using this configuration.
                    type: object
                  location:
                    description: |-
                      The location where the backup will be stored. Currently, the only supported
                       option is to store the backup in the same region as the cluster.

                       If empty, defaults to the region of the cluster.
                    type: string
                  quantityBasedRetention:
                    description: Quantity-based Backup retention policy to retain
                      recent backups.
                    properties:
                      count:
                        description: The number of backups to retain.
                        format: int32
                        type: integer
                    type: object
                  timeBasedRetention:
                    description: Time-based Backup retention policy.
                    properties:
                      retentionPeriod:
                        description: The retention period.
                        type: string
                    type: object
                  weeklySchedule:
                    description: Weekly schedule for the Backup.
                    properties:
                      daysOfWeek:
                        description: |-
                          The days of the week to perform a backup.

                           If this field is left empty, the default of every day of the week is
                           used.
                        items:
                          type: string
                        type: array
                      startTimes:
                        description: |-
                          The times during the day to start a backup. The start times are assumed
                           to be in UTC and to be an exact hour (e.g., 04:00:00).

                           If no start times are provided, a single fixed start time is chosen
                           arbitrarily.
                        items:
                          properties:
                            hours:
                              description: Hours of day in 24 hour format. Should
                                be from 0 to 23. An API may choose to allow the value
                                "24:00:00" for scenarios like business closing time.
                              format: int32
                              type: integer
                            minutes:
                              description: Minutes of hour of day. Must be from 0
                                to 59.
                              format: int32
                              type: integer
                            nanos:
                              description: Fractions of seconds in nanoseconds. Must
                                be from 0 to 999,999,999.
                              format: int32
                              type: integer
                            seconds:
                              description: Seconds of minutes of the time. Must normally
                                be from 0 to 59. An API may allow the value 60 if
                                it allows leap-seconds.
                              format: int32
                              type: integer
                          type: object
                        type: array
                    type: object
                type: object
              continuousBackupConfig:
                description: Optional. Continuous backup configuration for this cluster.
                properties:
                  enabled:
                    description: Whether ContinuousBackup is enabled.
                    type: boolean
                  encryptionConfig:
                    description: The encryption config can be specified to encrypt
                      the backups with a customer-managed encryption key (CMEK). When
                      this field is not specified, the backup will use the cluster's
                      encryption config.
                    properties:
                      kmsKeyName:
                        description: 'The fully-qualified resource name of the KMS
                          key. Each Cloud KMS key is regionalized and has the following
                          format: projects/[PROJECT]/locations/[REGION]/keyRings/[RING]/cryptoKeys/[KEY_NAME]'
                        type: string
                    type: object
                  recoveryWindowDays:
                    description: The number of days that are eligible to restore from
                      using PITR. To support the entire recovery window, backups and
                      logs are retained for one day more than the recovery window.
                      If not set, defaults to 14 days.
                    format: int32
                    type: integer
                type: object
              databaseVersion:
                description: Optional. The database engine major version. This is
                  an optional field and it is populated at the Cluster creation time.
                  If a database version is not supplied at cluster creation time,
                  then a default database version will be used.
                type: string
              displayName:
                description: User-settable and human-readable display name for the
                  Cluster.
                type: string
              encryptionConfig:
                description: Optional. The encryption config can be specified to encrypt
                  the data disks and other persistent data resources of a cluster
                  with a customer-managed encryption key (CMEK). When this field is
                  not specified, the cluster will then use default encryption scheme
                  to protect the user data.
                properties:
                  kmsKeyName:
                    description: 'The fully-qualified resource name of the KMS key.
                      Each Cloud KMS key is regionalized and has the following format:
                      projects/[PROJECT]/locations/[REGION]/keyRings/[RING]/cryptoKeys/[KEY_NAME]'
                    type: string
                type: object
              etag:
                description: For Resource freshness validation (https://google.aip.dev/154)
                type: string
              geminiConfig:
                description: Optional. Deprecated and unused. This field will be removed
                  in the near future.
                type: object
              initialUser:
                description: Input only. Initial user to setup during cluster creation.
                  Required. If used in `RestoreCluster` this is ignored.
                properties:
                  password:
                    description: The initial password for the user.
                    type: string
                  user:
                    description: The database username.
                    type: string
                type: object
              labels:
                additionalProperties:
                  type: string
                description: Labels as key value pairs
                type: object
              location:
                description: The location of this resource.
                type: string
              maintenanceUpdatePolicy:
                description: Optional. The maintenance update policy determines when
                  to allow or deny updates.
                properties:
                  denyMaintenancePeriods:
                    description: Periods to deny maintenance. Currently limited to
                      1.
                    items:
                      properties:
                        endDate:
                          description: 'Deny period end date. This can be: * A full
                            date, with non-zero year, month and day values OR * A
                            month and day value, with a zero year for recurring'
                          properties:
                            day:
                              description: Day of a month. Must be from 1 to 31 and
                                valid for the year and month, or 0 to specify a year
                                by itself or a year and month where the day isn't
                                significant.
                              format: int32
                              type: integer
                            month:
                              description: Month of a year. Must be from 1 to 12,
                                or 0 to specify a year without a month and day.
                              format: int32
                              type: integer
                            year:
                              description: Year of the date. Must be from 1 to 9999,
                                or 0 to specify a date without a year.
                              format: int32
                              type: integer
                          type: object
                        startDate:
                          description: 'Deny period start date. This can be: * A full
                            date, with non-zero year, month and day values OR * A
                            month and day value, with a zero year for recurring'
                          properties:
                            day:
                              description: Day of a month. Must be from 1 to 31 and
                                valid for the year and month, or 0 to specify a year
                                by itself or a year and month where the day isn't
                                significant.
                              format: int32
                              type: integer
                            month:
                              description: Month of a year. Must be from 1 to 12,
                                or 0 to specify a year without a month and day.
                              format: int32
                              type: integer
                            year:
                              description: Year of the date. Must be from 1 to 9999,
                                or 0 to specify a date without a year.
                              format: int32
                              type: integer
                          type: object
                        time:
                          description: 'Time in UTC when the deny period starts on
                            start_date and ends on end_date. This can be: * Full time
                            OR * All zeros for 00:00:00 UTC'
                          properties:
                            hours:
                              description: Hours of day in 24 hour format. Should
                                be from 0 to 23. An API may choose to allow the value
                                "24:00:00" for scenarios like business closing time.
                              format: int32
                              type: integer
                            minutes:
                              description: Minutes of hour of day. Must be from 0
                                to 59.
                              format: int32
                              type: integer
                            nanos:
                              description: Fractions of seconds in nanoseconds. Must
                                be from 0 to 999,999,999.
                              format: int32
                              type: integer
                            seconds:
                              description: Seconds of minutes of the time. Must normally
                                be from 0 to 59. An API may allow the value 60 if
                                it allows leap-seconds.
                              format: int32
                              type: integer
                          type: object
                      type: object
                    type: array
                  maintenanceWindows:
                    description: Preferred windows to perform maintenance. Currently
                      limited to 1.
                    items:
                      properties:
                        day:
                          description: Preferred day of the week for maintenance,
                            e.g. MONDAY, TUESDAY, etc.
                          type: string
                        startTime:
                          description: Preferred time to start the maintenance operation
                            on the specified day. Maintenance will start within 1
                            hour of this time.
                          properties:
                            hours:
                              description: Hours of day in 24 hour format. Should
                                be from 0 to 23. An API may choose to allow the value
                                "24:00:00" for scenarios like business closing time.
                              format: int32
                              type: integer
                            minutes:
                              description: Minutes of hour of day. Must be from 0
                                to 59.
                              format: int32
                              type: integer
                            nanos:
                              description: Fractions of seconds in nanoseconds. Must
                                be from 0 to 999,999,999.
                              format: int32
                              type: integer
                            seconds:
                              description: Seconds of minutes of the time. Must normally
                                be from 0 to 59. An API may allow the value 60 if
                                it allows leap-seconds.
                              format: int32
                              type: integer
                          type: object
                      type: object
                    type: array
                type: object
              network:
                description: 'Required. The resource link for the VPC network in which
                  cluster resources are created and from which they are accessible
                  via Private IP. The network must belong to the same project as the
                  cluster. It is specified in the form: `projects/{project}/global/networks/{network_id}`.
                  This is required to create a cluster. Deprecated, use network_config.network
                  instead.'
                type: string
              networkConfig:
                properties:
                  allocatedIPRange:
                    description: 'Optional. Name of the allocated IP range for the
                      private IP AlloyDB cluster, for example: "google-managed-services-default".
                      If set, the instance IPs for this cluster will be created in
                      the allocated range. The range name must comply with RFC 1035.
                      Specifically, the name must be 1-63 characters long and match
                      the regular expression `[a-z]([-a-z0-9]*[a-z0-9])?`. Field name
                      is intended to be consistent with Cloud SQL.'
                    type: string
                  network:
                    description: 'Optional. The resource link for the VPC network
                      in which cluster resources are created and from which they are
                      accessible via Private IP. The network must belong to the same
                      project as the cluster. It is specified in the form: `projects/{project_number}/global/networks/{network_id}`.
                      This is required to create a cluster.'
                    type: string
                type: object
              projectRef:
                description: The project that this resource belongs to.
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              pscConfig:
                description: Optional. The configuration for Private Service Connect
                  (PSC) for the cluster.
                properties:
                  pscEnabled:
                    description: Optional. Create an instance that allows connections
                      from Private Service Connect endpoints to the instance.
                    type: boolean
                type: object
              resourceID:
                description: The AlloyDBCluster name. If not given, the metadata.name
                  will be used.
                type: string
              secondaryConfig:
                description: Cross Region replication config specific to SECONDARY
                  cluster.
                properties:
                  primaryClusterName:
                    description: 'The name of the primary cluster name with the format:
                      * projects/{project}/locations/{region}/clusters/{cluster_id}'
                    type: string
                type: object
              sslConfig:
                description: SSL configuration for this AlloyDB cluster.
                properties:
                  caSource:
                    description: Optional. Certificate Authority (CA) source. Only
                      CA_SOURCE_MANAGED is supported currently, and is the default
                      value.
                    type: string
                  sslMode:
                    description: Optional. SSL mode. Specifies client-server SSL/TLS
                      connection behavior.
                    type: string
                type: object
              subscriptionType:
                description: Optional. Subscription type of the cluster.
                type: string
              tags:
                additionalProperties:
                  type: string
                description: 'Optional. Input only. Immutable. Tag keys/values directly
                  bound to this resource. For example: ``` "123/environment": "production",
                  "123/costCenter": "marketing" ```'
                type: object
            required:
            - location
            type: object
          status:
            description: AlloyDBClusterStatus defines the config connector machine
              state of AlloyDBCluster
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: Unique, one-word, CamelCase reason for the condition's
                        last transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: A unique specifier for the AlloyDBCluster resource in
                  GCP.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the Config Connector controller.
                  If this is equal to metadata.generation, then that means that the
                  current reported status reflects the most recent desired state of
                  the resource.
                format: int64
                type: integer
              observedState:
                description: ObservedState is the state of the resource as most recently
                  observed in GCP.
                properties:
                  backupSource:
                    description: Output only. Cluster created from backup.
                    properties:
                      backupName:
                        description: 'Required. The name of the backup resource with
                          the format: * projects/{project}/locations/{region}/backups/{backup_id}'
                        type: string
                      backupUid:
                        description: Output only. The system-generated UID of the
                          backup which was used to create this resource. The UID is
                          generated when the backup is created, and it is retained
                          until the backup is deleted.
                        type: string
                    type: object
                  cloudsqlBackupRunSource:
                    description: Output only. Cluster created from CloudSQL snapshot.
                    properties:
                      backupRunID:
                        description: Required. The CloudSQL backup run ID.
                        format: int64
                        type: integer
                      instanceID:
                        description: Required. The CloudSQL instance ID.
                        type: string
                      project:
                        description: The project ID of the source CloudSQL instance.
                          This should be the same as the AlloyDB cluster's project.
                        type: string
                    type: object
                  clusterType:
                    description: Output only. The type of the cluster. This is an
                      output-only field and it's populated at the Cluster creation
                      time or the Cluster promotion time. The cluster type is determined
                      by which RPC was used to create the cluster (i.e. `CreateCluster`
                      vs. `CreateSecondaryCluster`
                    type: string
                  continuousBackupInfo:
                    description: Output only. Continuous backup properties for this
                      cluster.
                    properties:
                      earliestRestorableTime:
                        description: Output only. The earliest restorable time that
                          can be restored to. If continuous backups and recovery was
                          recently enabled, the earliest restorable time is the creation
                          time of the earliest eligible backup within this cluster's
                          continuous backup recovery window. After a cluster has had
                          continuous backups enabled for the duration of its recovery
                          window, the earliest restorable time becomes "now minus
                          the recovery window". For example, assuming a point in time
                          recovery is attempted at 04/16/2025 3:23:00PM with a 14d
                          recovery window, the earliest restorable time would be 04/02/2025
                          3:23:00PM. This field is only visible if the CLUSTER_VIEW_CONTINUOUS_BACKUP
                          cluster view is provided.
                        type: string
                      enabledTime:
                        description: Output only. When ContinuousBackup was most recently
                          enabled. Set to null if ContinuousBackup is not enabled.
                        type: string
                      encryptionInfo:
                        description: Output only. The encryption information for the
                          WALs and backups required for ContinuousBackup.
                        properties:
                          encryptionType:
                            description: Output only. Type of encryption.
                            type: string
                          kmsKeyVersions:
                            description: Output only. Cloud KMS key versions that
                              are being used to protect the database or the backup.
                            items:
                              type: string
                            type: array
                        type: object
                      schedule:
                        description: Output only. Days of the week on which a continuous
                          backup is taken.
                        items:
                          type: string
                        type: array
                    type: object
                  createTime:
                    description: Output only. Create time stamp
                    type: string
                  deleteTime:
                    description: Output only. Delete time stamp
                    type: string
                  encryptionInfo:
                    description: Output only. The encryption information for the cluster.
                    properties:
                      encryptionType:
                        description: Output only. Type of encryption.
                        type: string
                      kmsKeyVersions:
                        description: Output only. Cloud KMS key versions that are
                          being used to protect the database or the backup.
                        items:
                          type: string
                        type: array
                    type: object
                  maintenanceSchedule:
                    description: Output only. The maintenance schedule for the cluster,
                      generated for a specific rollout if a maintenance window is
                      set.
                    properties:
                      startTime:
                        description: Output only. The scheduled start time for the
                          maintenance.
                        type: string
                    type: object
                  migrationSource:
                    description: Output only. Cluster created via DMS migration.
                    properties:
                      hostPort:
                        description: Output only. The host and port of the on-premises
                          instance in host:port format
                        type: string
                      referenceID:
                        description: Output only. Place holder for the external source
                          identifier(e.g DMS job name) that created the cluster.
                        type: string
                      sourceType:
                        description: Output only. Type of migration source.
                        type: string
                    type: object
                  primaryConfig:
                    description: Output only. Cross Region replication config specific
                      to PRIMARY cluster.
                    properties:
                      secondaryClusterNames:
                        description: Output only. Names of the clusters that are replicating
                          from this cluster.
                        items:
                          type: string
                        type: array
                    type: object
                  reconciling:
                    description: Output only. Reconciling (https://google.aip.dev/128#reconciliation).
                      Set to true if the current state of Cluster does not match the
                      user's intended state, and the service is actively updating
                      the resource to reconcile them. This can happen due to user-triggered
                      updates or system actions like failover or maintenance.
                    type: boolean
                  satisfiesPzs:
                    description: Output only. Reserved for future use.
                    type: boolean
                  serviceAccountEmail:
                    description: Output only. AlloyDB per-cluster service agent email.
                      This service account is created per-cluster per-project, and
                      is different from that of the primary service agent which is
                      created per-project. The service account naming format is subject
                      to change.
                    type: string
                  state:
                    description: Output only. The current serving state of the cluster.
                    type: string
                  trialMetadata:
                    description: Output only. Metadata for free trial clusters
                    properties:
                      endTime:
                        description: End time of the trial cluster.
                        type: string
                      graceEndTime:
                        description: grace end time of the cluster.
                        type: string
                      startTime:
                        description: start time of the trial cluster.
                        type: string
                      upgradeTime:
                        description: Upgrade time of trial cluster to Standard cluster.
                        type: string
                    type: object
                  uid:
                    description: Output only. The system-generated UID of the resource.
                      The UID is assigned when the resource is created, and it is
                      retained until it is deleted.
                    type: string
                  updateTime:
                    description: Output only. Update time stamp
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
