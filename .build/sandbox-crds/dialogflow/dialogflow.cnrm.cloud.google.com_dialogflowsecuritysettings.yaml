        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: DialogflowSecuritySettingsSpec defines the desired state
              of DialogflowSecuritySettings
            properties:
              audioExportSettings:
                description: |-
                  Controls audio export settings for post-conversation analytics when
                   ingesting audio to conversations via [Participants.AnalyzeContent][] or
                   [Participants.StreamingAnalyzeContent][].

                   If
                   [retention_strategy][google.cloud.dialogflow.cx.v3.SecuritySettings.retention_strategy]
                   is set to REMOVE_AFTER_CONVERSATION or [audio_export_settings.gcs_bucket][]
                   is empty, audio export is disabled.

                   If audio export is enabled, audio is recorded and saved to
                   [audio_export_settings.gcs_bucket][], subject to retention policy of
                   [audio_export_settings.gcs_bucket][].

                   This setting won't effect audio input for implicit sessions via
                   [Sessions.DetectIntent][google.cloud.dialogflow.cx.v3.Sessions.DetectIntent]
                   or
                   [Sessions.StreamingDetectIntent][google.cloud.dialogflow.cx.v3.Sessions.StreamingDetectIntent].
                properties:
                  audioExportPattern:
                    description: Filename pattern for exported audio.
                    type: string
                  audioFormat:
                    description: File format for exported audio file. Currently only
                      in telephony recordings.
                    type: string
                  enableAudioRedaction:
                    description: Enable audio redaction if it is true. Note that this
                      only redacts end-user audio data; Synthesised audio from the
                      virtual agent is not redacted.
                    type: boolean
                  gcsBucket:
                    description: Cloud Storage bucket to export audio record to. Setting
                      this field would grant the Storage Object Creator role to the
                      Dialogflow Service Agent. API caller that tries to modify this
                      field should have the permission of storage.buckets.setIamPolicy.
                    type: string
                  storeTtsAudio:
                    description: Whether to store TTS audio. By default, TTS audio
                      from the virtual agent is not exported.
                    type: boolean
                type: object
              deidentifyTemplate:
                description: |-
                  [DLP](https://cloud.google.com/dlp/docs) deidentify template name. Use this
                   template to define de-identification configuration for the content.

                   The `DLP De-identify Templates Reader` role is needed on the Dialogflow
                   service identity service account (has the form
                   `service-PROJECT_NUMBER@gcp-sa-dialogflow.iam.gserviceaccount.com`)
                   for your agent's project.

                   If empty, Dialogflow replaces sensitive info with `[redacted]` text.

                   The template name will have one of the following formats:
                   `projects/<ProjectID>/locations/<LocationID>/deidentifyTemplates/<TemplateID>`
                   OR
                   `organizations/<OrganizationID>/locations/<LocationID>/deidentifyTemplates/<TemplateID>`

                   Note: `deidentify_template` must be located in the same region as the
                   `SecuritySettings`.
                type: string
              displayName:
                description: Required. The human-readable name of the security settings,
                  unique within the location.
                type: string
              insightsExportSettings:
                description: |-
                  Controls conversation exporting settings to Insights after conversation is
                   completed.

                   If
                   [retention_strategy][google.cloud.dialogflow.cx.v3.SecuritySettings.retention_strategy]
                   is set to REMOVE_AFTER_CONVERSATION, Insights export is disabled no matter
                   what you configure here.
                properties:
                  enableInsightsExport:
                    description: If enabled, we will automatically exports conversations
                      to Insights and Insights runs its analyzers.
                    type: boolean
                type: object
              inspectTemplate:
                description: |-
                  [DLP](https://cloud.google.com/dlp/docs) inspect template name. Use this
                   template to define inspect base settings.

                   The `DLP Inspect Templates Reader` role is needed on the Dialogflow
                   service identity service account (has the form
                   `service-PROJECT_NUMBER@gcp-sa-dialogflow.iam.gserviceaccount.com`)
                   for your agent's project.

                   If empty, we use the default DLP inspect config.

                   The template name will have one of the following formats:
                   `projects/<ProjectID>/locations/<LocationID>/inspectTemplates/<TemplateID>`
                   OR
                   `organizations/<OrganizationID>/locations/<LocationID>/inspectTemplates/<TemplateID>`

                   Note: `inspect_template` must be located in the same region as the
                   `SecuritySettings`.
                type: string
              location:
                description: The location of this resource.
                type: string
              projectRef:
                description: The project that this resource belongs to.
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              purgeDataTypes:
                description: List of types of data to remove when retention settings
                  triggers purge.
                items:
                  type: string
                type: array
              redactionScope:
                description: Defines the data for which Dialogflow applies redaction.
                  Dialogflow does not redact data that it does not have access to
                  – for example, Cloud logging.
                type: string
              redactionStrategy:
                description: Strategy that defines how we do redaction.
                type: string
              resourceID:
                description: The DialogflowSecuritySettings name. If not given, the
                  metadata.name will be used.
                type: string
              retentionStrategy:
                description: Specifies the retention behavior defined by [SecuritySettings.RetentionStrategy][google.cloud.dialogflow.cx.v3.SecuritySettings.RetentionStrategy].
                type: string
              retentionWindowDays:
                description: Retains the data for the specified number of days. User
                  must set a value lower than Dialogflow's default 365d TTL (30 days
                  for Agent Assist traffic), higher value will be ignored and use
                  default. Setting a value higher than that has no effect. A missing
                  value or setting to 0 also means we use default TTL. When data retention
                  configuration is changed, it only applies to the data created after
                  the change; the TTL of existing data created before the change stays
                  intact.
                format: int32
                type: integer
            required:
            - location
            type: object
          status:
            description: DialogflowSecuritySettingsStatus defines the config connector
              machine state of DialogflowSecuritySettings
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: Unique, one-word, CamelCase reason for the condition's
                        last transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: A unique specifier for the DialogflowSecuritySettings
                  resource in GCP.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the Config Connector controller.
                  If this is equal to metadata.generation, then that means that the
                  current reported status reflects the most recent desired state of
                  the resource.
                format: int64
                type: integer
              observedState:
                description: ObservedState is the state of the resource as most recently
                  observed in GCP.
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
