apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    cnrm.cloud.google.com/version: 0.0.0-dev
  creationTimestamp: null
  labels:
    cnrm.cloud.google.com/managed-by-kcc: "true"
    cnrm.cloud.google.com/system: "true"
  name: discoveryenginedatastores.discoveryengine.cnrm.cloud.google.com
spec:
  group: discoveryengine.cnrm.cloud.google.com
  names:
    categories:
    - gcp
    kind: DiscoveryEngineDataStore
    listKind: DiscoveryEngineDataStoreList
    plural: discoveryenginedatastores
    shortNames:
    - gcpdiscoveryenginedatastore
    - gcpdiscoveryenginedatastores
    singular: discoveryenginedatastore
  preserveUnknownFields: false
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: When 'True', the most recent reconcile of the resource succeeded
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: The reason for the value in 'Ready'
      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Status
      type: string
    - description: The last transition time for the value in 'Status'
      jsonPath: .status.conditions[?(@.type=='Ready')].lastTransitionTime
      name: Status Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DiscoveryEngineDataStore is the Schema for the DiscoveryEngineDataStore
          API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: DiscoveryEngineDataStoreSpec defines the desired state of
              DiscoveryEngineDataStore
            properties:
              aclEnabled:
                description: |-
                  Immutable. Whether data in the
                   [DataStore][google.cloud.discoveryengine.v1.DataStore] has ACL information.
                   If set to `true`, the source data must have ACL. ACL will be ingested when
                   data is ingested by
                   [DocumentService.ImportDocuments][google.cloud.discoveryengine.v1.DocumentService.ImportDocuments]
                   methods.

                   When ACL is enabled for the
                   [DataStore][google.cloud.discoveryengine.v1.DataStore],
                   [Document][google.cloud.discoveryengine.v1.Document] can't be accessed by
                   calling
                   [DocumentService.GetDocument][google.cloud.discoveryengine.v1.DocumentService.GetDocument]
                   or
                   [DocumentService.ListDocuments][google.cloud.discoveryengine.v1.DocumentService.ListDocuments].

                   Currently ACL is only supported in `GENERIC` industry vertical with
                   non-`PUBLIC_WEBSITE` content config.
                type: boolean
              advancedSiteSearchConfig:
                description: Optional. Configuration for advanced site search.
                properties:
                  disableAutomaticRefresh:
                    description: If set true, automatic refresh is disabled for the
                      DataStore.
                    type: boolean
                  disableInitialIndex:
                    description: If set true, initial indexing is disabled for the
                      DataStore.
                    type: boolean
                type: object
              contentConfig:
                description: Immutable. The content config of the data store. If this
                  field is unset, the server behavior defaults to [ContentConfig.NO_CONTENT][google.cloud.discoveryengine.v1.DataStore.ContentConfig.NO_CONTENT].
                type: string
              displayName:
                description: |-
                  Required. The data store display name.

                   This field must be a UTF-8 encoded string with a length limit of 128
                   characters. Otherwise, an INVALID_ARGUMENT error is returned.
                type: string
              documentProcessingConfig:
                description: Configuration for Document understanding and enrichment.
                properties:
                  chunkingConfig:
                    description: Whether chunking mode is enabled.
                    properties:
                      layoutBasedChunkingConfig:
                        description: Configuration for the layout based chunking.
                        properties:
                          chunkSize:
                            description: |-
                              The token size limit for each chunk.

                               Supported values: 100-500 (inclusive).
                               Default value: 500.
                            format: int32
                            type: integer
                          includeAncestorHeadings:
                            description: |-
                              Whether to include appending different levels of headings to chunks
                               from the middle of the document to prevent context loss.

                               Default value: False.
                            type: boolean
                        type: object
                    type: object
                  defaultParsingConfig:
                    description: Configurations for default Document parser. If not
                      specified, we will configure it as default DigitalParsingConfig,
                      and the default parsing config will be applied to all file types
                      for Document parsing.
                    properties:
                      digitalParsingConfig:
                        description: Configurations applied to digital parser.
                        type: object
                      layoutParsingConfig:
                        description: Configurations applied to layout parser.
                        properties:
                          enableImageAnnotation:
                            description: Optional. If true, the LLM based annotation
                              is added to the image during parsing.
                            type: boolean
                          enableTableAnnotation:
                            description: Optional. If true, the LLM based annotation
                              is added to the table during parsing.
                            type: boolean
                          excludeHTMLClasses:
                            description: Optional. List of HTML classes to exclude
                              from the parsed content.
                            items:
                              type: string
                            type: array
                          excludeHTMLElements:
                            description: Optional. List of HTML elements to exclude
                              from the parsed content.
                            items:
                              type: string
                            type: array
                          excludeHTMLIds:
                            description: Optional. List of HTML ids to exclude from
                              the parsed content.
                            items:
                              type: string
                            type: array
                          structuredContentTypes:
                            description: |-
                              Optional. Contains the required structure types to extract from the
                               document. Supported values:

                               * `shareholder-structure`
                            items:
                              type: string
                            type: array
                        type: object
                      ocrParsingConfig:
                        description: Configurations applied to OCR parser. Currently
                          it only applies to PDFs.
                        properties:
                          enhancedDocumentElements:
                            description: '[DEPRECATED] This field is deprecated. To
                              use the additional enhanced document elements processing,
                              please switch to `layout_parsing_config`.'
                            items:
                              type: string
                            type: array
                          useNativeText:
                            description: If true, will use native text instead of
                              OCR text on pages containing native text.
                            type: boolean
                        type: object
                    type: object
                  name:
                    description: 'The full resource name of the Document Processing
                      Config. Format: `projects/*/locations/*/collections/*/dataStores/*/documentProcessingConfig`.'
                    type: string
                type: object
              healthcareFhirConfig:
                description: Optional. Configuration for `HEALTHCARE_FHIR` vertical.
                properties:
                  enableConfigurableSchema:
                    description: |-
                      Whether to enable configurable schema for `HEALTHCARE_FHIR` vertical.

                       If set to `true`, the predefined healthcare fhir schema can be extended
                       for more customized searching and filtering.
                    type: boolean
                  enableStaticIndexingForBatchIngestion:
                    description: |-
                      Whether to enable static indexing for `HEALTHCARE_FHIR` batch
                       ingestion.

                       If set to `true`, the batch ingestion will be processed in a static
                       indexing mode which is slower but more capable of handling larger
                       volume.
                    type: boolean
                type: object
              identityMappingStore:
                description: 'Immutable. The fully qualified resource name of the
                  associated [IdentityMappingStore][google.cloud.discoveryengine.v1.IdentityMappingStore].
                  This field can only be set for acl_enabled DataStores with `THIRD_PARTY`
                  or `GSUITE` IdP. Format: `projects/{project}/locations/{location}/identityMappingStores/{identity_mapping_store}`.'
                type: string
              industryVertical:
                description: Immutable. The industry vertical that the data store
                  registers.
                type: string
              kmsKeyName:
                description: |-
                  Input only. The KMS key to be used to protect this DataStore at creation
                   time.

                   Must be set for requests that need to comply with CMEK Org Policy
                   protections.

                   If this field is set and processed successfully, the DataStore will be
                   protected by the KMS key, as indicated in the cmek_config field.
                type: string
              location:
                description: The location of this resource.
                type: string
              naturalLanguageQueryUnderstandingConfig:
                description: Optional. Configuration for Natural Language Query Understanding.
                properties:
                  mode:
                    description: Mode of Natural Language Query Understanding. If
                      this field is unset, the behavior defaults to [NaturalLanguageQueryUnderstandingConfig.Mode.DISABLED][google.cloud.discoveryengine.v1.NaturalLanguageQueryUnderstandingConfig.Mode.DISABLED].
                    type: string
                type: object
              projectRef:
                description: The project that this resource belongs to.
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              resourceID:
                description: The DiscoveryEngineDataStore name. If not given, the
                  metadata.name will be used.
                type: string
              solutionTypes:
                description: |-
                  The solutions that the data store enrolls. Available solutions for each
                   [industry_vertical][google.cloud.discoveryengine.v1.DataStore.industry_vertical]:

                   * `MEDIA`: `SOLUTION_TYPE_RECOMMENDATION` and `SOLUTION_TYPE_SEARCH`.
                   * `SITE_SEARCH`: `SOLUTION_TYPE_SEARCH` is automatically enrolled. Other
                     solutions cannot be enrolled.
                items:
                  type: string
                type: array
              startingSchema:
                description: |-
                  The start schema to use for this
                   [DataStore][google.cloud.discoveryengine.v1.DataStore] when provisioning
                   it. If unset, a default vertical specialized schema will be used.

                   This field is only used by
                   [CreateDataStore][google.cloud.discoveryengine.v1.DataStoreService.CreateDataStore]
                   API, and will be ignored if used in other APIs. This field will be omitted
                   from all API responses including
                   [CreateDataStore][google.cloud.discoveryengine.v1.DataStoreService.CreateDataStore]
                   API. To retrieve a schema of a
                   [DataStore][google.cloud.discoveryengine.v1.DataStore], use
                   [SchemaService.GetSchema][google.cloud.discoveryengine.v1.SchemaService.GetSchema]
                   API instead.

                   The provided schema will be validated against certain rules on schema.
                   Learn more from [this
                   doc](https://cloud.google.com/generative-ai-app-builder/docs/provide-schema).
                properties:
                  jsonSchema:
                    description: The JSON representation of the schema.
                    type: string
                  name:
                    description: |-
                      Immutable. The full resource name of the schema, in the format of
                       `projects/{project}/locations/{location}/collections/{collection}/dataStores/{data_store}/schemas/{schema}`.

                       This field must be a UTF-8 encoded string with a length limit of 1024
                       characters.
                    type: string
                  structSchema:
                    description: The structured representation of the schema.
                    x-kubernetes-preserve-unknown-fields: true
                type: object
              workspaceConfig:
                description: Config to store data store type configuration for workspace
                  data. This must be set when [DataStore.content_config][google.cloud.discoveryengine.v1.DataStore.content_config]
                  is set as [DataStore.ContentConfig.GOOGLE_WORKSPACE][google.cloud.discoveryengine.v1.DataStore.ContentConfig.GOOGLE_WORKSPACE].
                properties:
                  dasherCustomerID:
                    description: Obfuscated Dasher customer ID.
                    type: string
                  superAdminEmailAddress:
                    description: Optional. The super admin email address for the workspace
                      that will be used for access token generation. For now we only
                      use it for Native Google Drive connector data ingestion.
                    type: string
                  superAdminServiceAccount:
                    description: Optional. The super admin service account for the
                      workspace that will be used for access token generation. For
                      now we only use it for Native Google Drive connector data ingestion.
                    type: string
                  type:
                    description: The Google Workspace data source.
                    type: string
                type: object
            required:
            - location
            type: object
          status:
            description: DiscoveryEngineDataStoreStatus defines the config connector
              machine state of DiscoveryEngineDataStore
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: Unique, one-word, CamelCase reason for the condition's
                        last transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: A unique specifier for the DiscoveryEngineDataStore resource
                  in GCP.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the Config Connector controller.
                  If this is equal to metadata.generation, then that means that the
                  current reported status reflects the most recent desired state of
                  the resource.
                format: int64
                type: integer
              observedState:
                description: ObservedState is the state of the resource as most recently
                  observed in GCP.
                properties:
                  billingEstimation:
                    description: Output only. Data size estimation for billing.
                    properties:
                      structuredDataSize:
                        description: Data size for structured data in terms of bytes.
                        format: int64
                        type: integer
                      structuredDataUpdateTime:
                        description: Last updated timestamp for structured data.
                        type: string
                      unstructuredDataSize:
                        description: Data size for unstructured data in terms of bytes.
                        format: int64
                        type: integer
                      unstructuredDataUpdateTime:
                        description: Last updated timestamp for unstructured data.
                        type: string
                      websiteDataSize:
                        description: Data size for websites in terms of bytes.
                        format: int64
                        type: integer
                      websiteDataUpdateTime:
                        description: Last updated timestamp for websites.
                        type: string
                    type: object
                  cmekConfig:
                    description: Output only. CMEK-related information for the DataStore.
                    properties:
                      isDefault:
                        description: Output only. The default CmekConfig for the Customer.
                        type: boolean
                      kmsKey:
                        description: KMS key resource name which will be used to encrypt
                          resources `projects/{project}/locations/{location}/keyRings/{keyRing}/cryptoKeys/{keyId}`.
                        type: string
                      kmsKeyVersion:
                        description: KMS key version resource name which will be used
                          to encrypt resources `<kms_key>/cryptoKeyVersions/{keyVersion}`.
                        type: string
                      lastRotationTimestampMicros:
                        description: Output only. The timestamp of the last key rotation.
                        format: int64
                        type: integer
                      name:
                        description: Required. The name of the CmekConfig of the form
                          `projects/{project}/locations/{location}/cmekConfig` or
                          `projects/{project}/locations/{location}/cmekConfigs/{cmek_config}`.
                        type: string
                      notebooklmState:
                        description: Output only. Whether the NotebookLM Corpus is
                          ready to be used.
                        type: string
                      singleRegionKeys:
                        description: Optional. Single-regional CMEKs that are required
                          for some VAIS features.
                        items:
                          properties:
                            kmsKey:
                              description: Required. Single-regional kms key resource
                                name which will be used to encrypt resources `projects/{project}/locations/{location}/keyRings/{keyRing}/cryptoKeys/{keyId}`.
                              type: string
                          type: object
                        type: array
                      state:
                        description: Output only. The states of the CmekConfig.
                        type: string
                    type: object
                  createTime:
                    description: Output only. Timestamp the [DataStore][google.cloud.discoveryengine.v1.DataStore]
                      was created at.
                    type: string
                  defaultSchemaID:
                    description: Output only. The id of the default [Schema][google.cloud.discoveryengine.v1.Schema]
                      associated to this data store.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
