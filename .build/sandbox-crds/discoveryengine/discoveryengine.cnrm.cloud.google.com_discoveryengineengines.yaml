apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    cnrm.cloud.google.com/version: 0.0.0-dev
  creationTimestamp: null
  labels:
    cnrm.cloud.google.com/managed-by-kcc: "true"
    cnrm.cloud.google.com/system: "true"
  name: discoveryengineengines.discoveryengine.cnrm.cloud.google.com
spec:
  group: discoveryengine.cnrm.cloud.google.com
  names:
    categories:
    - gcp
    kind: DiscoveryEngineEngine
    listKind: DiscoveryEngineEngineList
    plural: discoveryengineengines
    shortNames:
    - gcpdiscoveryengineengine
    - gcpdiscoveryengineengines
    singular: discoveryengineengine
  preserveUnknownFields: false
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: When 'True', the most recent reconcile of the resource succeeded
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: The reason for the value in 'Ready'
      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Status
      type: string
    - description: The last transition time for the value in 'Status'
      jsonPath: .status.conditions[?(@.type=='Ready')].lastTransitionTime
      name: Status Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DiscoveryEngineEngine is the Schema for the DiscoveryEngineEngine
          API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: DiscoveryEngineEngineSpec defines the desired state of DiscoveryEngineEngine
            properties:
              chatEngineConfig:
                description: Configurations for the Chat Engine. Only applicable if
                  [solution_type][google.cloud.discoveryengine.v1.Engine.solution_type]
                  is [SOLUTION_TYPE_CHAT][google.cloud.discoveryengine.v1.SolutionType.SOLUTION_TYPE_CHAT].
                properties:
                  agentCreationConfig:
                    description: |-
                      The configurationt generate the Dialogflow agent that is associated to
                       this Engine.

                       Note that these configurations are one-time consumed by
                       and passed to Dialogflow service. It means they cannot be retrieved using
                       [EngineService.GetEngine][google.cloud.discoveryengine.v1.EngineService.GetEngine]
                       or
                       [EngineService.ListEngines][google.cloud.discoveryengine.v1.EngineService.ListEngines]
                       API after engine creation.
                    properties:
                      business:
                        description: Name of the company, organization or other entity
                          that the agent represents. Used for knowledge connector
                          LLM prompt and for knowledge search.
                        type: string
                      defaultLanguageCode:
                        description: Required. The default language of the agent as
                          a language tag. See [Language Support](https://cloud.google.com/dialogflow/docs/reference/language)
                          for a list of the currently supported language codes.
                        type: string
                      location:
                        description: 'Agent location for Agent creation, supported
                          values: global/us/eu. If not provided, us Engine will create
                          Agent using us-central-1 by default; eu Engine will create
                          Agent using eu-west-1 by default.'
                        type: string
                      timeZone:
                        description: Required. The time zone of the agent from the
                          [time zone database](https://www.iana.org/time-zones), e.g.,
                          America/New_York, Europe/Paris.
                        type: string
                    type: object
                  allowCrossRegion:
                    description: |-
                      Optional. If the flag set to true, we allow the agent and engine are in
                       different locations, otherwise the agent and engine are required to be in
                       the same location. The flag is set to false by default.

                       Note that the `allow_cross_region` are one-time consumed by and
                       passed to
                       [EngineService.CreateEngine][google.cloud.discoveryengine.v1.EngineService.CreateEngine].
                       It means they cannot be retrieved using
                       [EngineService.GetEngine][google.cloud.discoveryengine.v1.EngineService.GetEngine]
                       or
                       [EngineService.ListEngines][google.cloud.discoveryengine.v1.EngineService.ListEngines]
                       API after engine creation.
                    type: boolean
                  dialogflowAgentToLink:
                    description: |-
                      The resource name of an exist Dialogflow agent to link to this Chat
                       Engine. Customers can either provide `agent_creation_config` to create
                       agent or provide an agent name that links the agent with the Chat engine.

                       Format: `projects/<Project ID>/locations/<Location ID>/agents/<Agent
                       ID>`.

                       Note that the `dialogflow_agent_to_link` are one-time consumed by and
                       passed to Dialogflow service. It means they cannot be retrieved using
                       [EngineService.GetEngine][google.cloud.discoveryengine.v1.EngineService.GetEngine]
                       or
                       [EngineService.ListEngines][google.cloud.discoveryengine.v1.EngineService.ListEngines]
                       API after engine creation. Use
                       [ChatEngineMetadata.dialogflow_agent][google.cloud.discoveryengine.v1.Engine.ChatEngineMetadata.dialogflow_agent]
                       for actual agent association after Engine is created.
                    type: string
                type: object
              commonConfig:
                description: Common config spec that specifies the metadata of the
                  engine.
                properties:
                  companyName:
                    description: The name of the company, business or entity that
                      is associated with the engine. Setting this may help improve
                      LLM related features.
                    type: string
                type: object
              dataStoreIds:
                description: |-
                  Optional. The data stores associated with this engine.

                   For
                   [SOLUTION_TYPE_SEARCH][google.cloud.discoveryengine.v1.SolutionType.SOLUTION_TYPE_SEARCH]
                   and
                   [SOLUTION_TYPE_RECOMMENDATION][google.cloud.discoveryengine.v1.SolutionType.SOLUTION_TYPE_RECOMMENDATION]
                   type of engines, they can only associate with at most one data store.

                   If [solution_type][google.cloud.discoveryengine.v1.Engine.solution_type] is
                   [SOLUTION_TYPE_CHAT][google.cloud.discoveryengine.v1.SolutionType.SOLUTION_TYPE_CHAT],
                   multiple [DataStore][google.cloud.discoveryengine.v1.DataStore]s in the
                   same [Collection][google.cloud.discoveryengine.v1.Collection] can be
                   associated here.

                   Note that when used in
                   [CreateEngineRequest][google.cloud.discoveryengine.v1.CreateEngineRequest],
                   one DataStore id must be provided as the system will use it for necessary
                   initializations.
                items:
                  type: string
                type: array
              disableAnalytics:
                description: Optional. Whether to disable analytics for searches performed
                  on this engine.
                type: boolean
              displayName:
                description: Required. The display name of the engine. Should be human
                  readable. UTF-8 encoded string with limit of 1024 characters.
                type: string
              industryVertical:
                description: 'Optional. The industry vertical that the engine registers.
                  The restriction of the Engine industry vertical is based on [DataStore][google.cloud.discoveryengine.v1.DataStore]:
                  Vertical on Engine has to match vertical of the DataStore linked
                  to the engine.'
                type: string
              location:
                description: The location of this resource.
                type: string
              mediaRecommendationEngineConfig:
                description: Configurations for the Media Engine. Only applicable
                  on the data stores with [solution_type][google.cloud.discoveryengine.v1.Engine.solution_type]
                  [SOLUTION_TYPE_RECOMMENDATION][google.cloud.discoveryengine.v1.SolutionType.SOLUTION_TYPE_RECOMMENDATION]
                  and [IndustryVertical.MEDIA][google.cloud.discoveryengine.v1.IndustryVertical.MEDIA]
                  vertical.
                properties:
                  engineFeaturesConfig:
                    description: Optional. Additional engine features config.
                    properties:
                      mostPopularConfig:
                        description: Most popular engine feature config.
                        properties:
                          timeWindowDays:
                            description: The time window of which the engine is queried
                              at training and prediction time. Positive integers only.
                              The value translates to the last X days of events. Currently
                              required for the `most-popular-items` engine.
                            format: int64
                            type: integer
                        type: object
                      recommendedForYouConfig:
                        description: Recommended for you engine feature config.
                        properties:
                          contextEventType:
                            description: 'The type of event with which the engine
                              is queried at prediction time. If set to `generic`,
                              only `view-item`, `media-play`,and `media-complete`
                              will be used as `context-event` in engine training.
                              If set to `view-home-page`, `view-home-page` will also
                              be used as `context-events` in addition to `view-item`,
                              `media-play`, and `media-complete`. Currently supported
                              for the `recommended-for-you` engine. Currently supported
                              values: `view-home-page`, `generic`.'
                            type: string
                        type: object
                    type: object
                  optimizationObjective:
                    description: |-
                      The optimization objective. e.g., `cvr`.

                       This field together with
                       [optimization_objective][google.cloud.discoveryengine.v1.Engine.MediaRecommendationEngineConfig.type]
                       describe engine metadata to use to control engine training and serving.

                       Currently supported
                       values: `ctr`, `cvr`.

                        If not specified, we choose default based on engine type.
                       Default depends on type of recommendation:

                       `recommended-for-you` => `ctr`

                       `others-you-may-like` => `ctr`
                    type: string
                  optimizationObjectiveConfig:
                    description: Name and value of the custom threshold for cvr optimization_objective.
                      For target_field `watch-time`, target_field_value must be an
                      integer value indicating the media progress time in seconds
                      between (0, 86400] (excludes 0, includes 86400) (e.g., 90).
                      For target_field `watch-percentage`, the target_field_value
                      must be a valid float value between (0, 1.0] (excludes 0, includes
                      1.0) (e.g., 0.5).
                    properties:
                      targetField:
                        description: 'Required. The name of the field to target. Currently
                          supported values: `watch-percentage`, `watch-time`.'
                        type: string
                      targetFieldValueFloat:
                        description: Required. The threshold to be applied to the
                          target (e.g., 0.5).
                        type: number
                    type: object
                  trainingState:
                    description: |-
                      The training state that the engine is in (e.g.
                       `TRAINING` or `PAUSED`).

                       Since part of the cost of running the service
                       is frequency of training - this can be used to determine when to train
                       engine in order to control cost. If not specified: the default value for
                       `CreateEngine` method is `TRAINING`. The default value for
                       `UpdateEngine` method is to keep the state the same as before.
                    type: string
                  type:
                    description: |-
                      Required. The type of engine. e.g., `recommended-for-you`.

                       This field together with
                       [optimization_objective][google.cloud.discoveryengine.v1.Engine.MediaRecommendationEngineConfig.optimization_objective]
                       describe engine metadata to use to control engine training and serving.

                       Currently supported values: `recommended-for-you`, `others-you-may-like`,
                       `more-like-this`, `most-popular-items`.
                    type: string
                type: object
              projectRef:
                description: The project that this resource belongs to.
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              resourceID:
                description: The DiscoveryEngineEngine name. If not given, the metadata.name
                  will be used.
                type: string
              searchEngineConfig:
                description: Configurations for the Search Engine. Only applicable
                  if [solution_type][google.cloud.discoveryengine.v1.Engine.solution_type]
                  is [SOLUTION_TYPE_SEARCH][google.cloud.discoveryengine.v1.SolutionType.SOLUTION_TYPE_SEARCH].
                properties:
                  searchAddOns:
                    description: The add-on that this search engine enables.
                    items:
                      type: string
                    type: array
                  searchTier:
                    description: |-
                      The search feature tier of this engine.

                       Different tiers might have different
                       pricing. To learn more, check the pricing documentation.

                       Defaults to
                       [SearchTier.SEARCH_TIER_STANDARD][google.cloud.discoveryengine.v1.SearchTier.SEARCH_TIER_STANDARD]
                       if not specified.
                    type: string
                type: object
              solutionType:
                description: Required. The solutions of the engine.
                type: string
            required:
            - location
            type: object
          status:
            description: DiscoveryEngineEngineStatus defines the config connector
              machine state of DiscoveryEngineEngine
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: Unique, one-word, CamelCase reason for the condition's
                        last transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: A unique specifier for the DiscoveryEngineEngine resource
                  in GCP.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the Config Connector controller.
                  If this is equal to metadata.generation, then that means that the
                  current reported status reflects the most recent desired state of
                  the resource.
                format: int64
                type: integer
              observedState:
                description: ObservedState is the state of the resource as most recently
                  observed in GCP.
                properties:
                  chatEngineMetadata:
                    description: Output only. Additional information of the Chat Engine.
                      Only applicable if [solution_type][google.cloud.discoveryengine.v1.Engine.solution_type]
                      is [SOLUTION_TYPE_CHAT][google.cloud.discoveryengine.v1.SolutionType.SOLUTION_TYPE_CHAT].
                    properties:
                      dialogflowAgent:
                        description: |-
                          The resource name of a Dialogflow agent, that this Chat Engine refers
                           to.

                           Format: `projects/<Project ID>/locations/<Location ID>/agents/<Agent
                           ID>`.
                        type: string
                    type: object
                  createTime:
                    description: Output only. Timestamp the Recommendation Engine
                      was created at.
                    type: string
                  updateTime:
                    description: Output only. Timestamp the Recommendation Engine
                      was last updated.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
