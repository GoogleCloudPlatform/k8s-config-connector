                                    correct. See http://cldr.unicode.org/ and http://www.unicode.org/cldr/charts/30/supplemental/territory_information.html
                                    for details. Example: "CH" for Switzerland.'
                                  type: string
                                revision:
                                  description: |-
                                    The schema revision of the `PostalAddress`. This must be set to 0, which is
                                     the latest revision.

