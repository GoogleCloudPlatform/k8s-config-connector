---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  labels:
    cnrm.cloud.google.com/managed-by-kcc: "true"
    cnrm.cloud.google.com/system: "true"
  name: notebooksexecutions.notebooks.cnrm.cloud.google.com
spec:
  group: notebooks.cnrm.cloud.google.com
  names:
    categories:
    - gcp
    kind: NotebooksExecution
    listKind: NotebooksExecutionList
    plural: notebooksexecutions
    shortNames:
    - gcpnotebooksexecution
    - gcpnotebooksexecutions
    singular: notebooksexecution
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: When 'True', the most recent reconcile of the resource succeeded
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: The reason for the value in 'Ready'
      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Status
      type: string
    - description: The last transition time for the value in 'Status'
      jsonPath: .status.conditions[?(@.type=='Ready')].lastTransitionTime
      name: Status Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NotebooksExecution is the Schema for the NotebooksExecution API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NotebooksExecutionSpec defines the desired state of NotebooksExecution
            properties:
              description:
                description: A brief description of this execution.
                type: string
              executionTemplate:
                description: execute metadata including name, hardware spec, region,
                  labels, etc.
                properties:
                  acceleratorConfig:
                    description: |-
                      Configuration (count and accelerator type) for hardware running notebook
                       execution.
                    properties:
                      coreCount:
                        description: Count of cores of this accelerator.
                        format: int64
                        type: integer
                      type:
                        description: Type of this accelerator.
                        type: string
                    type: object
                  containerImageURI:
                    description: |-
                      Container Image URI to a DLVM
                       Example: 'gcr.io/deeplearning-platform-release/base-cu100'
                       More examples can be found at:
                       https://cloud.google.com/ai-platform/deep-learning-containers/docs/choosing-container
                    type: string
                  dataprocParameters:
                    description: Parameters used in Dataproc JobType executions.
                    properties:
                      cluster:
                        description: |-
                          URI for cluster used to run Dataproc execution.
                           Format: `projects/{PROJECT_ID}/regions/{REGION}/clusters/{CLUSTER_NAME}`
                        type: string
                    type: object
                  inputNotebookFile:
                    description: |-
                      Path to the notebook file to execute.
                       Must be in a Google Cloud Storage bucket.
                       Format: `gs://{bucket_name}/{folder}/{notebook_file_name}`
                       Ex: `gs://notebook_user/scheduled_notebooks/sentiment_notebook.ipynb`
                    type: string
                  jobType:
                    description: The type of Job to be used on this execution.
                    type: string
                  kernelSpec:
                    description: |-
                      Name of the kernel spec to use. This must be specified if the
                       kernel spec name on the execution target does not match the name in the
                       input notebook file.
                    type: string
                  labels:
                    additionalProperties:
                      type: string
                    description: |-
                      Labels for execution.
                       If execution is scheduled, a field included will be 'nbs-scheduled'.
                       Otherwise, it is an immediate execution, and an included field will be
                       'nbs-immediate'. Use fields to efficiently index between various types of
                       executions.
                    type: object
                  masterType:
                    description: |-
                      Specifies the type of virtual machine to use for your training
                       job's master worker. You must specify this field when `scaleTier` is set to
                       `CUSTOM`.

                       You can use certain Compute Engine machine types directly in this field.
                       The following types are supported:

                       - `n1-standard-4`
                       - `n1-standard-8`
                       - `n1-standard-16`
                       - `n1-standard-32`
                       - `n1-standard-64`
                       - `n1-standard-96`
                       - `n1-highmem-2`
                       - `n1-highmem-4`
                       - `n1-highmem-8`
                       - `n1-highmem-16`
                       - `n1-highmem-32`
                       - `n1-highmem-64`
                       - `n1-highmem-96`
                       - `n1-highcpu-16`
                       - `n1-highcpu-32`
                       - `n1-highcpu-64`
                       - `n1-highcpu-96`

                       Alternatively, you can use the following legacy machine types:

                       - `standard`
                       - `large_model`
                       - `complex_model_s`
                       - `complex_model_m`
                       - `complex_model_l`
                       - `standard_gpu`
                       - `complex_model_m_gpu`
                       - `complex_model_l_gpu`
                       - `standard_p100`
                       - `complex_model_m_p100`
                       - `standard_v100`
                       - `large_model_v100`
                       - `complex_model_m_v100`
                       - `complex_model_l_v100`

                       Finally, if you want to use a TPU for training, specify `cloud_tpu` in this
                       field. Learn more about the [special configuration options for training
                       with
                       TPU](https://cloud.google.com/ai-platform/training/docs/using-tpus#configuring_a_custom_tpu_machine).
                    type: string
                  outputNotebookFolder:
                    description: |-
                      Path to the notebook folder to write to.
                       Must be in a Google Cloud Storage bucket path.
                       Format: `gs://{bucket_name}/{folder}`
                       Ex: `gs://notebook_user/scheduled_notebooks`
                    type: string
                  parameters:
                    description: Parameters used within the 'input_notebook_file'
                      notebook.
                    type: string
                  paramsYamlFile:
                    description: |-
                      Parameters to be overridden in the notebook during execution.
                       Ref https://papermill.readthedocs.io/en/latest/usage-parameterize.html on
                       how to specifying parameters in the input notebook and pass them here
                       in an YAML file.
                       Ex: `gs://notebook_user/scheduled_notebooks/sentiment_notebook_params.yaml`
                    type: string
                  scaleTier:
                    description: |-
                      Required. Scale tier of the hardware used for notebook execution.
                       DEPRECATED Will be discontinued. As right now only CUSTOM is supported.
                    type: string
                  serviceAccount:
                    description: |-
                      The email address of a service account to use when running the execution.
                       You must have the `iam.serviceAccounts.actAs` permission for the specified
                       service account.
                    type: string
                  tensorboard:
                    description: |-
                      The name of a Vertex AI [Tensorboard] resource to which this execution
                       will upload Tensorboard logs.
                       Format:
                       `projects/{project}/locations/{location}/tensorboards/{tensorboard}`
                    type: string
                  vertexAiParameters:
                    description: Parameters used in Vertex AI JobType executions.
                    properties:
                      env:
                        additionalProperties:
                          type: string
                        description: |-
                          Environment variables.
                           At most 100 environment variables can be specified and unique.
                           Example: `GCP_BUCKET=gs://my-bucket/samples/`
                        type: object
                      network:
                        description: |-
                          The full name of the Compute Engine
                           [network](https://cloud.google.com/compute/docs/networks-and-firewalls#networks)
                           to which the Job should be peered. For example,
                           `projects/12345/global/networks/myVPC`.
                           [Format](https://cloud.google.com/compute/docs/reference/rest/v1/networks/insert)
                           is of the form `projects/{project}/global/networks/{network}`.
                           Where `{project}` is a project number, as in `12345`, and `{network}` is
                           a network name.

                           Private services access must already be configured for the network. If
                           left unspecified, the job is not peered with any network.
                        type: string
                    type: object
                type: object
              outputNotebookFile:
                description: Output notebook file generated by this execution
                type: string
              projectRef:
                description: The project that this resource belongs to.
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              resourceID:
                description: The NotebooksExecution name. If not given, the metadata.name
                  will be used.
                type: string
            type: object
          status:
            description: NotebooksExecutionStatus defines the config connector machine
              state of NotebooksExecution
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: |-
                        Unique, one-word, CamelCase reason for the condition's last
                        transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: A unique specifier for the NotebooksExecution resource
                  in GCP.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the Config Connector controller.
                  If this is equal to metadata.generation, then that means that the
                  current reported status reflects the most recent desired state of
                  the resource.
                format: int64
                type: integer
              observedState:
                description: ObservedState is the state of the resource as most recently
                  observed in GCP.
                properties:
                  createTime:
                    description: Output only. Time the Execution was instantiated.
                    type: string
                  displayName:
                    description: |-
                      Output only. Name used for UI purposes.
                       Name can only contain alphanumeric characters and underscores '_'.
                    type: string
                  jobURI:
                    description: Output only. The URI of the external job used to
                      execute the notebook.
                    type: string
                  state:
                    description: Output only. State of the underlying AI Platform
                      job.
                    type: string
                  updateTime:
                    description: Output only. Time the Execution was last updated.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
