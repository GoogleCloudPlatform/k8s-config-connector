                            selector:
                              description: The selector is a comma-separated list
                                of patterns for any element such as a method, a field,
                                an enum value. Each pattern is a qualified name of
                                the element which may end in "*", indicating a wildcard.
                                Wildcards are only allowed at the end and for a whole
                                component of the qualified name, i.e. "foo.*" is ok,
                                but not "foo.b*" or "foo.*.bar". A wildcard will match
                                one or more components. To specify a default for all
                                applicable elements, the whole pattern "*" is used.
                              type: string
                          type: object
                        type: array
