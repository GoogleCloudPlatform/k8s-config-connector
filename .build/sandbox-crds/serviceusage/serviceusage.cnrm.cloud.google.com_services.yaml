                              type: string
                            name:
                              description: 'The name of the page. It will be used
                                as an identity of the page to generate URI of the
                                page, text of the link to this page in navigation,
                                etc. The full page name (start from the root page
                                name to this page concatenated with `.`) can be used
                                as reference to the page in your documentation. For
                                example: <pre><code>pages: - name: Tutorial content:
                                &#40;== include tutorial.md ==&#41; subpages: - name:
                                Java content: &#40;== include tutorial_java.md ==&#41;
                                </code></pre> You can reference `Java` page using
                                Markdown reference link syntax: `[Java][Tutorial.Java]`.'
                              type: string
                            subpages:
