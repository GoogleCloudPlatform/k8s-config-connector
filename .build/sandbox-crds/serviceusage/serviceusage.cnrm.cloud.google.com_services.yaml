                  authentication:
                    description: Auth configuration. Contains only the OAuth rules.
                    properties:
                      providers:
                        description: Defines a set of authentication providers that
                          a service supports.
                        items:
                          properties:
                            audiences:
                              description: |-
                                The list of JWT
                                 [audiences](https://tools.ietf.org/html/draft-ietf-oauth-json-web-token-32#section-4.1.3).
                                 that are allowed to access. A JWT containing any of these audiences will
                                 be accepted. When this setting is absent, JWTs with audiences:
                                   - "https://[service.name]/[google.protobuf.Api.name]"
                                   - "https://[service.name]/"
                                 will be accepted.
                                 For example, if no audiences are in the setting, LibraryService API will
                                 accept JWTs with the following audiences:
                                   -
                                   https://library-example.googleapis.com/google.example.library.v1.LibraryService
                                   - https://library-example.googleapis.com/

                                 Example:

                                     audiences: bookstore_android.apps.googleusercontent.com,
                                                bookstore_web.apps.googleusercontent.com
                              type: string
                            authorizationURL:
                              description: Redirect URL if JWT token is required but
                                not present or is expired. Implement authorizationUrl
                                of securityDefinitions in OpenAPI spec.
                              type: string
                            id:
                              description: |-
                                The unique identifier of the auth provider. It will be referred to by
                                 `AuthRequirement.provider_id`.

                                 Example: "bookstore_auth".
                              type: string
                            issuer:
                              description: |-
                                Identifies the principal that issued the JWT. See
                                 https://tools.ietf.org/html/draft-ietf-oauth-json-web-token-32#section-4.1.1
                                 Usually a URL or an email address.

                                 Example: https://securetoken.google.com
                                 Example: 1234567-compute@developer.gserviceaccount.com
                              type: string
                            jwksURI:
                              description: |-
                                URL of the provider's public key set to validate signature of the JWT. See
                                 [OpenID
                                 Discovery](https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata).
                                 Optional if the key set document:
                                  - can be retrieved from
                                    [OpenID
                                    Discovery](https://openid.net/specs/openid-connect-discovery-1_0.html)
                                    of the issuer.
                                  - can be inferred from the email domain of the issuer (e.g. a Google
                                  service account).

                                 Example: https://www.googleapis.com/oauth2/v1/certs
                              type: string
                            jwtLocations:
                              description: |-
                                Defines the locations to extract the JWT.  For now it is only used by the
                                 Cloud Endpoints to store the OpenAPI extension [x-google-jwt-locations]
                                 (https://cloud.google.com/endpoints/docs/openapi/openapi-extensions#x-google-jwt-locations)

                                 JWT locations can be one of HTTP headers, URL query parameters or
                                 cookies. The rule is that the first match wins.

                                 If not specified,  default to use following 3 locations:
                                    1) Authorization: Bearer
                                    2) x-goog-iap-jwt-assertion
                                    3) access_token query parameter

                                 Default locations can be specified as followings:
                                    jwt_locations:
                                    - header: Authorization
                                      value_prefix: "Bearer "
                                    - header: x-goog-iap-jwt-assertion
                                    - query: access_token
                              items:
                                properties:
                                  cookie:
                                    description: Specifies cookie name to extract
                                      JWT token.
                                    type: string
                                  header:
                                    description: Specifies HTTP header name to extract
                                      JWT token.
                                    type: string
                                  query:
                                    description: Specifies URL query parameter name
                                      to extract JWT token.
                                    type: string
                                  valuePrefix:
                                    description: |-
                                      The value prefix. The value format is "value_prefix{token}"
                                       Only applies to "in" header type. Must be empty for "in" query type.
                                       If not empty, the header value has to match (case sensitive) this prefix.
                                       If not matched, JWT will not be extracted. If matched, JWT will be
                                       extracted after the prefix is removed.

                                       For example, for "Authorization: Bearer {JWT}",
                                       value_prefix="Bearer " with a space at the end.
                                    type: string
                                type: object
                              type: array
                          type: object
                        type: array
                      rules:
                        description: |-
