                    type: string
                type: object
              resourceID:
                description: The AppOptimizeReport name. If not given, the metadata.name
                  will be used.
                type: string
              scopes:
                description: Optional. The resource containers for which to fetch
                  data. Default is the project specified in the report's parent.
                items:
                  properties:
                    application:
                      description: |-
                        Required. An App Hub Application to fetch data from.

