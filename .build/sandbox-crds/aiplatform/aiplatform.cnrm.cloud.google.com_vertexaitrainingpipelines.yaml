---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  labels:
    cnrm.cloud.google.com/managed-by-kcc: "true"
    cnrm.cloud.google.com/system: "true"
  name: vertexaitrainingpipelines.aiplatform.cnrm.cloud.google.com
spec:
  group: aiplatform.cnrm.cloud.google.com
  names:
    categories:
    - gcp
    kind: VertexAITrainingPipeline
    listKind: VertexAITrainingPipelineList
    plural: vertexaitrainingpipelines
    shortNames:
    - gcpvertexaitrainingpipeline
    - gcpvertexaitrainingpipelines
    singular: vertexaitrainingpipeline
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: When 'True', the most recent reconcile of the resource succeeded
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: The reason for the value in 'Ready'
      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Status
      type: string
    - description: The last transition time for the value in 'Status'
      jsonPath: .status.conditions[?(@.type=='Ready')].lastTransitionTime
      name: Status Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VertexAITrainingPipeline is the Schema for the VertexAITrainingPipeline
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VertexAITrainingPipelineSpec defines the desired state of
              VertexAITrainingPipeline
            properties:
              displayName:
                description: Required. The user-defined name of this TrainingPipeline.
                type: string
              encryptionSpec:
                description: |-
                  Customer-managed encryption key spec for a TrainingPipeline. If set, this
                   TrainingPipeline will be secured by this key.

                   Note: Model trained by this TrainingPipeline is also secured by this key if
                   [model_to_upload][google.cloud.aiplatform.v1.TrainingPipeline.encryption_spec]
                   is not set separately.
                properties:
                  kmsKeyName:
                    description: |-
                      Required. The Cloud KMS resource identifier of the customer managed
                       encryption key used to protect a resource. Has the form:
                       `projects/my-project/locations/my-region/keyRings/my-kr/cryptoKeys/my-key`.
                       The key needs to be in the same region as where the compute resource is
                       created.
                    type: string
                type: object
              inputDataConfig:
                description: |-
                  Specifies Vertex AI owned input data that may be used for training the
                   Model. The TrainingPipeline's
                   [training_task_definition][google.cloud.aiplatform.v1.TrainingPipeline.training_task_definition]
                   should make clear whether this config is used and if there are any special
                   requirements on how it should be filled. If nothing about this config is
                   mentioned in the
                   [training_task_definition][google.cloud.aiplatform.v1.TrainingPipeline.training_task_definition],
                   then it should be assumed that the TrainingPipeline does not depend on this
                   configuration.
                properties:
                  annotationSchemaURI:
                    description: |-
                      Applicable only to custom training with Datasets that have DataItems and
                       Annotations.

                       Cloud Storage URI that points to a YAML file describing the annotation
                       schema. The schema is defined as an OpenAPI 3.0.2 [Schema
                       Object](https://github.com/OAI/OpenAPI-Specification/blob/main/versions/3.0.2.md#schemaObject).
                       The schema files that can be used here are found in
                       gs://google-cloud-aiplatform/schema/dataset/annotation/ , note that the
                       chosen schema must be consistent with
                       [metadata][google.cloud.aiplatform.v1.Dataset.metadata_schema_uri] of the
                       Dataset specified by
                       [dataset_id][google.cloud.aiplatform.v1.InputDataConfig.dataset_id].

                       Only Annotations that both match this schema and belong to DataItems not
                       ignored by the split method are used in respectively training, validation
                       or test role, depending on the role of the DataItem they are on.

                       When used in conjunction with
                       [annotations_filter][google.cloud.aiplatform.v1.InputDataConfig.annotations_filter],
                       the Annotations used for training are filtered by both
                       [annotations_filter][google.cloud.aiplatform.v1.InputDataConfig.annotations_filter]
                       and
                       [annotation_schema_uri][google.cloud.aiplatform.v1.InputDataConfig.annotation_schema_uri].
                    type: string
                  annotationsFilter:
                    description: |-
                      Applicable only to Datasets that have DataItems and Annotations.

                       A filter on Annotations of the Dataset. Only Annotations that both
                       match this filter and belong to DataItems not ignored by the split method
                       are used in respectively training, validation or test role, depending on
                       the role of the DataItem they are on (for the auto-assigned that role is
                       decided by Vertex AI). A filter with same syntax as the one used in
                       [ListAnnotations][google.cloud.aiplatform.v1.DatasetService.ListAnnotations]
                       may be used, but note here it filters across all Annotations of the
                       Dataset, and not just within a single DataItem.
                    type: string
                  bigqueryDestination:
                    description: |-
                      Only applicable to custom training with tabular Dataset with BigQuery
                       source.

                       The BigQuery project location where the training data is to be written
                       to. In the given project a new dataset is created with name
                       `dataset_<dataset-id>_<annotation-type>_<timestamp-of-training-call>`
                       where timestamp is in YYYY_MM_DDThh_mm_ss_sssZ format. All training
                       input data is written into that dataset. In the dataset three
                       tables are created, `training`, `validation` and `test`.

                       * AIP_DATA_FORMAT = "bigquery".
                       * AIP_TRAINING_DATA_URI  =
                       "bigquery_destination.dataset_<dataset-id>_<annotation-type>_<time>.training"

                       * AIP_VALIDATION_DATA_URI =
                       "bigquery_destination.dataset_<dataset-id>_<annotation-type>_<time>.validation"

                       * AIP_TEST_DATA_URI =
                       "bigquery_destination.dataset_<dataset-id>_<annotation-type>_<time>.test"
                    properties:
                      outputURI:
                        description: |-
                          Required. BigQuery URI to a project or table, up to 2000 characters long.

                           When only the project is specified, the Dataset and Table is created.
                           When the full table reference is specified, the Dataset must exist and
                           table must not exist.

                           Accepted forms:

                           *  BigQuery path. For example:
                           `bq://projectId` or `bq://projectId.bqDatasetId` or
                           `bq://projectId.bqDatasetId.bqTableId`.
                        type: string
                    type: object
                  datasetID:
                    description: |-
                      Required. The ID of the Dataset in the same Project and Location which data
                       will be used to train the Model. The Dataset must use schema compatible
                       with Model being trained, and what is compatible should be described in the
                       used TrainingPipeline's [training_task_definition]
                       [google.cloud.aiplatform.v1.TrainingPipeline.training_task_definition].
                       For tabular Datasets, all their data is exported to training, to pick
                       and choose from.
                    type: string
                  filterSplit:
                    description: Split based on the provided filters for each set.
                    properties:
                      testFilter:
                        description: |-
                          Required. A filter on DataItems of the Dataset. DataItems that match
                           this filter are used to test the Model. A filter with same syntax
                           as the one used in
                           [DatasetService.ListDataItems][google.cloud.aiplatform.v1.DatasetService.ListDataItems]
                           may be used. If a single DataItem is matched by more than one of the
                           FilterSplit filters, then it is assigned to the first set that applies to
                           it in the training, validation, test order.
                        type: string
                      trainingFilter:
                        description: |-
                          Required. A filter on DataItems of the Dataset. DataItems that match
                           this filter are used to train the Model. A filter with same syntax
                           as the one used in
                           [DatasetService.ListDataItems][google.cloud.aiplatform.v1.DatasetService.ListDataItems]
                           may be used. If a single DataItem is matched by more than one of the
                           FilterSplit filters, then it is assigned to the first set that applies to
                           it in the training, validation, test order.
                        type: string
                      validationFilter:
                        description: |-
                          Required. A filter on DataItems of the Dataset. DataItems that match
                           this filter are used to validate the Model. A filter with same syntax
                           as the one used in
                           [DatasetService.ListDataItems][google.cloud.aiplatform.v1.DatasetService.ListDataItems]
                           may be used. If a single DataItem is matched by more than one of the
                           FilterSplit filters, then it is assigned to the first set that applies to
                           it in the training, validation, test order.
                        type: string
                    type: object
                  fractionSplit:
                    description: Split based on fractions defining the size of each
                      set.
                    properties:
                      testFraction:
                        description: The fraction of the input data that is to be
                          used to evaluate the Model.
                        type: number
                      trainingFraction:
                        description: The fraction of the input data that is to be
                          used to train the Model.
                        type: number
                      validationFraction:
                        description: The fraction of the input data that is to be
                          used to validate the Model.
                        type: number
                    type: object
                  gcsDestination:
                    description: |-
                      The Cloud Storage location where the training data is to be
                       written to. In the given directory a new directory is created with
                       name:
                       `dataset-<dataset-id>-<annotation-type>-<timestamp-of-training-call>`
                       where timestamp is in YYYY-MM-DDThh:mm:ss.sssZ ISO-8601 format.
                       All training input data is written into that directory.

                       The Vertex AI environment variables representing Cloud Storage
                       data URIs are represented in the Cloud Storage wildcard
                       format to support sharded data. e.g.: "gs://.../training-*.jsonl"

                       * AIP_DATA_FORMAT = "jsonl" for non-tabular data, "csv" for tabular data
                       * AIP_TRAINING_DATA_URI =
                       "gcs_destination/dataset-<dataset-id>-<annotation-type>-<time>/training-*.${AIP_DATA_FORMAT}"

                       * AIP_VALIDATION_DATA_URI =
                       "gcs_destination/dataset-<dataset-id>-<annotation-type>-<time>/validation-*.${AIP_DATA_FORMAT}"

                       * AIP_TEST_DATA_URI =
                       "gcs_destination/dataset-<dataset-id>-<annotation-type>-<time>/test-*.${AIP_DATA_FORMAT}"
                    properties:
                      outputURIPrefix:
                        description: |-
                          Required. Google Cloud Storage URI to output directory. If the uri doesn't
                           end with
                           '/', a '/' will be automatically appended. The directory is created if it
                           doesn't exist.
                        type: string
                    type: object
                  persistMlUseAssignment:
                    description: Whether to persist the ML use assignment to data
                      item system labels.
                    type: boolean
                  predefinedSplit:
                    description: |-
                      Supported only for tabular Datasets.

                       Split based on a predefined key.
                    properties:
                      key:
                        description: |-
                          Required. The key is a name of one of the Dataset's data columns.
                           The value of the key (either the label's value or value in the column)
                           must be one of {`training`, `validation`, `test`}, and it defines to which
                           set the given piece of data is assigned. If for a piece of data the key
                           is not present or has an invalid value, that piece is ignored by the
                           pipeline.
                        type: string
                    type: object
                  savedQueryID:
                    description: |-
                      Only applicable to Datasets that have SavedQueries.

                       The ID of a SavedQuery (annotation set) under the Dataset specified by
                       [dataset_id][google.cloud.aiplatform.v1.InputDataConfig.dataset_id] used
                       for filtering Annotations for training.

                       Only Annotations that are associated with this SavedQuery are used in
                       respectively training. When used in conjunction with
                       [annotations_filter][google.cloud.aiplatform.v1.InputDataConfig.annotations_filter],
                       the Annotations used for training are filtered by both
                       [saved_query_id][google.cloud.aiplatform.v1.InputDataConfig.saved_query_id]
                       and
                       [annotations_filter][google.cloud.aiplatform.v1.InputDataConfig.annotations_filter].

                       Only one of
                       [saved_query_id][google.cloud.aiplatform.v1.InputDataConfig.saved_query_id]
                       and
                       [annotation_schema_uri][google.cloud.aiplatform.v1.InputDataConfig.annotation_schema_uri]
                       should be specified as both of them represent the same thing: problem type.
                    type: string
                  stratifiedSplit:
                    description: |-
                      Supported only for tabular Datasets.

                       Split based on the distribution of the specified column.
                    properties:
                      key:
                        description: |-
                          Required. The key is a name of one of the Dataset's data columns.
                           The key provided must be for a categorical column.
                        type: string
                      testFraction:
                        description: The fraction of the input data that is to be
                          used to evaluate the Model.
                        type: number
                      trainingFraction:
                        description: The fraction of the input data that is to be
                          used to train the Model.
                        type: number
                      validationFraction:
                        description: The fraction of the input data that is to be
                          used to validate the Model.
                        type: number
                    type: object
                  timestampSplit:
                    description: |-
                      Supported only for tabular Datasets.

                       Split based on the timestamp of the input data pieces.
                    properties:
                      key:
                        description: |-
                          Required. The key is a name of one of the Dataset's data columns.
                           The values of the key (the values in the column) must be in RFC 3339
                           `date-time` format, where `time-offset` = `"Z"`
                           (e.g. 1985-04-12T23:20:50.52Z). If for a piece of data the key is not
                           present or has an invalid value, that piece is ignored by the pipeline.
                        type: string
                      testFraction:
                        description: The fraction of the input data that is to be
                          used to evaluate the Model.
                        type: number
                      trainingFraction:
                        description: The fraction of the input data that is to be
                          used to train the Model.
                        type: number
                      validationFraction:
                        description: The fraction of the input data that is to be
                          used to validate the Model.
                        type: number
                    type: object
                type: object
              labels:
                additionalProperties:
                  type: string
                description: |-
                  The labels with user-defined metadata to organize TrainingPipelines.

                   Label keys and values can be no longer than 64 characters
                   (Unicode codepoints), can only contain lowercase letters, numeric
                   characters, underscores and dashes. International characters are allowed.

                   See https://goo.gl/xmQnxf for more information and examples of labels.
                type: object
              location:
                description: The location of this resource.
                type: string
              modelID:
                description: |-
                  Optional. The ID to use for the uploaded Model, which will become the final
                   component of the model resource name.

                   This value may be up to 63 characters, and valid characters are
                   `[a-z0-9_-]`. The first character cannot be a number or hyphen.
                type: string
              modelToUpload:
                description: |-
                  Describes the Model that may be uploaded (via
                   [ModelService.UploadModel][google.cloud.aiplatform.v1.ModelService.UploadModel])
                   by this TrainingPipeline. The TrainingPipeline's
                   [training_task_definition][google.cloud.aiplatform.v1.TrainingPipeline.training_task_definition]
                   should make clear whether this Model description should be populated, and
                   if there are any special requirements regarding how it should be filled. If
                   nothing is mentioned in the
                   [training_task_definition][google.cloud.aiplatform.v1.TrainingPipeline.training_task_definition],
                   then it should be assumed that this field should not be filled and the
                   training task either uploads the Model without a need of this information,
                   or that training task does not support uploading a Model as part of the
                   pipeline. When the Pipeline's state becomes `PIPELINE_STATE_SUCCEEDED` and
                   the trained Model had been uploaded into Vertex AI, then the
                   model_to_upload's resource [name][google.cloud.aiplatform.v1.Model.name] is
                   populated. The Model is always uploaded into the Project and Location in
                   which this pipeline is.
              parentModel:
                description: |-
                  Optional. When specify this field, the `model_to_upload` will not be
                   uploaded as a new model, instead, it will become a new version of this
                   `parent_model`.
                type: string
              projectRef:
                description: The project that this resource belongs to.
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              resourceID:
                description: The VertexAITrainingPipeline name. If not given, the
                  metadata.name will be used.
                type: string
              trainingTaskDefinition:
                description: |-
                  Required. A Google Cloud Storage path to the YAML file that defines the
                   training task which is responsible for producing the model artifact, and
                   may also include additional auxiliary work. The definition files that can
                   be used here are found in
                   gs://google-cloud-aiplatform/schema/trainingjob/definition/.
                   Note: The URI given on output will be immutable and probably different,
                   including the URI scheme, than the one given on input. The output URI will
                   point to a location where the user only has a read access.
                type: string
              trainingTaskInputs:
                description: |-
                  Required. The training task's parameter(s), as specified in the
                   [training_task_definition][google.cloud.aiplatform.v1.TrainingPipeline.training_task_definition]'s
                   `inputs`.
                properties:
                  boolValue:
                    description: Represents a boolean value.
                    type: boolean
                  nullValue:
                    description: Represents a null value.
                    type: string
                  numberValue:
                    description: Represents a double value.
                    type: number
                  stringValue:
                    description: Represents a string value.
                    type: string
                  structValue:
                    description: Represents a structured value.
                    x-kubernetes-preserve-unknown-fields: true
                type: object
            required:
            - location
            type: object
          status:
            description: VertexAITrainingPipelineStatus defines the config connector
              machine state of VertexAITrainingPipeline
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: |-
                        Unique, one-word, CamelCase reason for the condition's last
                        transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: A unique specifier for the VertexAITrainingPipeline resource
                  in GCP.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the Config Connector controller.
                  If this is equal to metadata.generation, then that means that the
                  current reported status reflects the most recent desired state of
                  the resource.
                format: int64
                type: integer
              observedState:
                description: ObservedState is the state of the resource as most recently
                  observed in GCP.
                properties:
                  createTime:
                    description: Output only. Time when the TrainingPipeline was created.
                    type: string
                  endTime:
                    description: |-
                      Output only. Time when the TrainingPipeline entered any of the following
                       states: `PIPELINE_STATE_SUCCEEDED`, `PIPELINE_STATE_FAILED`,
                       `PIPELINE_STATE_CANCELLED`.
                    type: string
                  error:
                    description: |-
                      Output only. Only populated when the pipeline's state is
                       `PIPELINE_STATE_FAILED` or `PIPELINE_STATE_CANCELLED`.
                    properties:
                      code:
                        description: |-
                          The status code, which should be an enum value of
                           [google.rpc.Code][google.rpc.Code].
                        format: int32
                        type: integer
                      message:
                        description: |-
                          A developer-facing error message, which should be in English. Any
                           user-facing error message should be localized and sent in the
                           [google.rpc.Status.details][google.rpc.Status.details] field, or localized
                           by the client.
                        type: string
                    type: object
                  startTime:
                    description: |-
                      Output only. Time when the TrainingPipeline for the first time entered the
                       `PIPELINE_STATE_RUNNING` state.
                    type: string
                  state:
                    description: Output only. The detailed state of the pipeline.
                    type: string
                  trainingTaskMetadata:
                    description: |-
                      Output only. The metadata information as specified in the
                       [training_task_definition][google.cloud.aiplatform.v1.TrainingPipeline.training_task_definition]'s
                       `metadata`. This metadata is an auxiliary runtime and final information
                       about the training task. While the pipeline is running this information is
                       populated only at a best effort basis. Only present if the
                       pipeline's
                       [training_task_definition][google.cloud.aiplatform.v1.TrainingPipeline.training_task_definition]
                       contains `metadata` object.
                    properties:
                      boolValue:
                        description: Represents a boolean value.
                        type: boolean
                      nullValue:
                        description: Represents a null value.
                        type: string
                      numberValue:
                        description: Represents a double value.
                        type: number
                      stringValue:
                        description: Represents a string value.
                        type: string
                      structValue:
                        description: Represents a structured value.
                        x-kubernetes-preserve-unknown-fields: true
                    type: object
                  updateTime:
                    description: Output only. Time when the TrainingPipeline was most
                      recently updated.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
