                properties:
                  authenticationTokenSecretVersion:
                    description: Optional. The name of the Secret Manager secret version
                      to use as an authentication token for Git operations. Must be
                      in the format `projects/*/secrets/*/versions/*`.
                    type: string
                  defaultBranch:
                    description: Required. The Git remote's default branch name.
                    type: string
                  sshAuthenticationConfig:
                    description: Optional. Authentication fields for remote uris using
                      SSH protocol.
                    properties:
                      hostPublicKey:
                        description: Required. Content of a public SSH key to verify
                          an identity of a remote Git host.
                        type: string
                      userPrivateKeySecretVersion:
                        description: Required. The name of the Secret Manager secret
                          version to use as a ssh private key for Git operations.
                          Must be in the format `projects/*/secrets/*/versions/*`.
                        type: string
                    type: object
                  url:
                    description: Required. The Git remote's URL.
                    type: string
