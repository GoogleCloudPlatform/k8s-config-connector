          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: DataformRepositorySpec defines the desired state of DataformRepository
            properties:
              containingFolder:
                description: 'Optional. The name of the containing folder of the repository.
                  The field is immutable and it can be modified via a MoveRepository
                  operation. Format: `projects/*/locations/*/folders/*`. or `projects/*/locations/*/teamFolders/*`.'
