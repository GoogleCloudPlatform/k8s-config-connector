                    type: object
                  internalMetadata:
                    description: 'Output only. All the metadata information that is
                      used internally to serve the resource. For example: timestamps,
                      flags, status fields, etc. The format of this field is a JSON
                      string.'
                    type: string
                  teamFolderName:
                    description: 'Output only. The resource name of the TeamFolder
