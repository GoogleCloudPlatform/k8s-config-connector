                              per second that the disk can handle. Note: This field
                              is only supported if boot_disk_type is hyperdisk-balanced.'
                            format: int64
                            type: integer
                          bootDiskProvisionedThroughput:
                            description: 'Optional. Indicates how much throughput
                              to provision for the disk. This sets the number of throughput
