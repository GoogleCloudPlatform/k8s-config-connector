                    items:
                      properties:
                        autoscalingSettings:
                          description: Settings for autoscaling of this WorkerPool.
                          properties:
                            algorithm:
                              description: The algorithm to use for autoscaling.
                              type: string
                            maxNumWorkers:
                              description: The maximum number of workers to cap scaling
                                at.
                              format: int32
                              type: integer
                          type: object
