                           Schemes other than `http`, `https` (or the empty scheme) might be
                           used with implementation specific semantics.
                        type: string
                      value:
                        description: Must be a valid serialized protocol buffer of
                          the above specified type.
                        format: byte
                        type: string
                    type: object
                  sdkPipelineOptions:
                    description: |-
                      The Cloud Dataflow SDK pipeline options specified by the user. These
                       options are passed through the service and are used to recreate the
                       SDK pipeline options on the worker in a language agnostic and platform
                       independent way.
                  serviceAccountEmail:
                    description: |-
                      Optional. Identity to run virtual machines as. Defaults to the default
                       account.
                    type: string
                  serviceKMSKeyName:
                    description: |-
                      Optional. If set, contains the Cloud KMS key identifier used to encrypt
                       data at rest, AKA a Customer Managed Encryption Key (CMEK).

                       Format:
                         projects/PROJECT_ID/locations/LOCATION/keyRings/KEY_RING/cryptoKeys/KEY
                    type: string
                  serviceOptions:
                    description: |-
                      Optional. The list of service options to enable. This field should be used
