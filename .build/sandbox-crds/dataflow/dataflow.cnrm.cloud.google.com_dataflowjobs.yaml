          metadata:
            type: object
          spec:
            description: DataflowJobSpec defines the desired state of DataflowJob
            properties:
              clientRequestID:
                description: |-
                  The client's unique identifier of the job, re-used across retried attempts.
                   If this field is set, the service will ensure its uniqueness.
                   The request to create a job will fail if the service has knowledge of a
                   previously submitted job with the same client's ID and job name.
                   The caller may use this field to ensure idempotence of job
                   creation across retried attempts to create a job.
                   By default, the field is empty and, in that case, the service ignores it.
                type: string
              createTime:
                description: |-
                  The timestamp when the job was initially created. Immutable and set by the
                   Cloud Dataflow service.
                type: string
              createdFromSnapshotID:
                description: |-
                  If this is specified, the job's initial state is populated from the given
                   snapshot.
                type: string
              currentState:
                description: |-
                  The current state of the job.

                   Jobs are created in the `JOB_STATE_STOPPED` state unless otherwise
                   specified.

                   A job in the `JOB_STATE_RUNNING` state may asynchronously enter a
                   terminal state. After a job has reached a terminal state, no
                   further state updates may be made.

                   This field might be mutated by the Dataflow service;
                   callers cannot mutate it.
                type: string
              currentStateTime:
                description: The timestamp associated with the current state.
                type: string
              environment:
                description: Optional. The environment for the job.
                properties:
                  clusterManagerAPIService:
                    description: |-
                      The type of cluster manager API to use.  If unknown or
                       unspecified, the service will attempt to choose a reasonable
                       default.  This should be in the form of the API service name,
                       e.g. "compute.googleapis.com".
                    type: string
                  dataset:
                    description: |-
                      Optional. The dataset for the current project where various workflow
                       related tables are stored.

                       The supported resource type is:

                       Google BigQuery:
                         bigquery.googleapis.com/{dataset}
                    type: string
                  debugOptions:
                    description: Optional. Any debugging options to be supplied to
                      the job.
                    properties:
                      dataSampling:
                        description: Configuration options for sampling elements from
                          a running pipeline.
                        properties:
                          behaviors:
                            description: |-
                              List of given sampling behaviors to enable. For example, specifying
                               behaviors = [ALWAYS_ON] samples in-flight elements but does not sample
                               exceptions. Can be used to specify multiple behaviors like,
                               behaviors = [ALWAYS_ON, EXCEPTIONS] for specifying periodic sampling and
                               exception sampling.

                               If DISABLED is in the list, then sampling will be disabled and ignore the
                               other given behaviors.

                               Ordering does not matter.
                            items:
                              type: string
                            type: array
                        type: object
                      enableHotKeyLogging:
                        description: |-
                          Optional. When true, enables the logging of the literal hot key to the
                           user's Cloud Logging.
                        type: boolean
                    type: object
                  experiments:
                    description: |-
                      The list of experiments to enable. This field should be used for SDK
                       related experiments and not for service related experiments. The proper
                       field for service related experiments is service_options.
                    items:
                      type: string
                    type: array
                  flexResourceSchedulingGoal:
                    description: Optional. Which Flexible Resource Scheduling mode
                      to run in.
                    type: string
                  internalExperiments:
                    description: Experimental settings.
                    properties:
                      typeURL:
                        description: |-
                          A URL/resource name that uniquely identifies the type of the serialized
                           protocol buffer message. This string must contain at least
                           one "/" character. The last segment of the URL's path must represent
                           the fully qualified name of the type (as in
                           `path/google.protobuf.Duration`). The name should be in a canonical form
                           (e.g., leading "." is not accepted).

                           In practice, teams usually precompile into the binary all types that they
                           expect it to use in the context of Any. However, for URLs which use the
                           scheme `http`, `https`, or no scheme, one can optionally set up a type
                           server that maps type URLs to message definitions as follows:

                           * If no scheme is provided, `https` is assumed.
                           * An HTTP GET on the URL must yield a [google.protobuf.Type][]
                             value in binary format, or produce an error.
                           * Applications are allowed to cache lookup results based on the
                             URL, or have them precompiled into a binary to avoid any
                             lookup. Therefore, binary compatibility needs to be preserved
