    name: v1beta1
    schema:
      openAPIV3Schema:
        description: FirestoreIndex is the Schema for the FirestoreIndex API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: FirestoreIndexSpec defines the desired state of FirestoreIndex
            properties:
              apiScope:
                description: The API scope supported by this index.
                type: string
              density:
                description: Immutable. The density configuration of the index.
                type: string
              fields:
                description: |-
                  The fields supported by this index.

                   For composite indexes, this requires a minimum of 2 and a maximum of 100
                   fields. The last field entry is always for the field path `__name__`. If,
                   on creation, `__name__` was not specified as the last field, it will be
                   added automatically with the same direction as that of the last field
                   defined. If the final field in a composite index is not directional, the
                   `__name__` will be ordered ASCENDING (unless explicitly specified).

                   For single field indexes, this will always be exactly one entry with a
                   field path equal to the field path of the associated field.
                items:
                  properties:
                    arrayConfig:
                      description: Indicates that this field supports operations on
                        `array_value`s.
                      type: string
                    fieldPath:
                      description: Can be __name__. For single field indexes, this
                        must match the name of the field or may be omitted.
                      type: string
                    order:
                      description: Indicates that this field supports ordering by
                        the specified order or comparing using =, !=, <, <=, >, >=.
                      type: string
                    vectorConfig:
                      description: Indicates that this field supports nearest neighbor
                        and distance operations on vector.
                      properties:
                        dimension:
                          description: |-
                            Required. The vector dimension this configuration applies to.

                             The resulting index will only include vectors of this dimension, and
                             can be used for vector search with the same dimension.
                          format: int32
                          type: integer
                        flat:
                          description: Indicates the vector index is a flat index.
                          type: object
                      type: object
                  type: object
                type: array
              multikey:
                description: |-
                  Optional. Whether the index is multikey. By default, the index is not
                   multikey. For non-multikey indexes, none of the paths in the index
                   definition reach or traverse an array, except via an explicit array index.
                   For multikey indexes, at most one of the paths in the index definition
                   reach or traverse an array, except via an explicit array index. Violations
                   will result in errors.

                   Note this field only applies to index with MONGODB_COMPATIBLE_API ApiScope.
                type: boolean
              projectRef:
                description: The project that this resource belongs to.
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              queryScope:
                description: |-
                  Indexes with a collection query scope specified allow queries
                   against a collection that is the child of a specific document, specified at
                   query time, and that has the same collection ID.

                   Indexes with a collection group query scope specified allow queries against
                   all collections descended from a specific document, specified at query
                   time, and that have the same collection ID as this index.
                type: string
              resourceID:
                description: The FirestoreIndex name. If not given, the metadata.name
                  will be used.
                type: string
              shardCount:
                description: Optional. The number of shards for the index.
                format: int32
                type: integer
              state:
                description: Output only. The serving state of the index.
                type: string
            type: object
