    name: v1beta1
    schema:
      openAPIV3Schema:
        description: BigQueryReservationReservation is the Schema for the BigQueryReservationReservation
          API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: BigQueryReservationReservationSpec defines the desired state
              of BigQueryReservationReservation
            properties:
              autoscale:
                description: The configuration parameters for the auto scaling feature.
                properties:
                  maxSlots:
                    description: Number of slots to be scaled when needed.
                    format: int64
                    type: integer
                type: object
              concurrency:
                description: 'Job concurrency target which sets a soft upper bound
                  on the number of jobs that can run concurrently in this reservation.
                  This is a soft target due to asynchronous nature of the system and
                  various optimizations for small queries. Default value is 0 which
                  means that concurrency target will be automatically computed by
                  the system. NOTE: this field is exposed as target job concurrency
                  in the Information Schema, DDL and BigQuery CLI.'
                format: int64
                type: integer
              edition:
                description: Edition of the reservation.
                type: string
              ignoreIdleSlots:
                description: If false, any query or pipeline job using this reservation
                  will use idle slots from other reservations within the same admin
                  project. If true, a query or pipeline job using this reservation
                  will execute with the slot capacity specified in the slot_capacity
                  field at most.
                type: boolean
              location:
                description: The location of this resource.
                type: string
              maxSlots:
                description: |-
                  Optional. The overall max slots for the reservation, covering slot_capacity
                   (baseline), idle slots (if ignore_idle_slots is false) and scaled slots.
                   If present, the reservation won't use more than the specified number of
                   slots, even if there is demand and supply (from idle slots).
                   NOTE: capping a reservation's idle slot usage is best effort and its
                   usage may exceed the max_slots value. However, in terms of
                   autoscale.current_slots (which accounts for the additional added slots), it
                   will never exceed the max_slots - baseline.

                   This field must be set together with the scaling_mode enum value.

                   If the max_slots and scaling_mode are set, the autoscale or
                   autoscale.max_slots field must be unset. However, the
                   autoscale field may still be in the output. The autopscale.max_slots will
                   always show as 0 and the autoscaler.current_slots will represent the
                   current slots from autoscaler excluding idle slots.
                   For example, if the max_slots is 1000 and scaling_mode is AUTOSCALE_ONLY,
                   then in the output, the autoscaler.max_slots will be 0 and the
                   autoscaler.current_slots may be any value between 0 and 1000.

                   If the max_slots is 1000, scaling_mode is ALL_SLOTS, the baseline is 100
                   and idle slots usage is 200, then in the output, the autoscaler.max_slots
                   will be 0 and the autoscaler.current_slots will not be higher than 700.

                   If the max_slots is 1000, scaling_mode is IDLE_SLOTS_ONLY, then in the
                   output, the autoscaler field will be null.

                   If the max_slots and scaling_mode are set, then the ignore_idle_slots field
                   must be aligned with the scaling_mode enum value.(See details in
                   ScalingMode comments).

                   Please note,  the max_slots is for user to manage the part of slots greater
                   than the baseline. Therefore, we don't allow users to set max_slots smaller
                   or equal to the baseline as it will not be meaningful. If the field is
                   present and slot_capacity>=max_slots.

                   Please note that if max_slots is set to 0, we will treat it as unset.
                   Customers can set max_slots to 0 and set scaling_mode to
                   SCALING_MODE_UNSPECIFIED to disable the max_slots feature.
                format: int64
                type: integer
              multiRegionAuxiliary:
                description: |-
                  Applicable only for reservations located within one of the BigQuery
                   multi-regions (US or EU).

                   If set to true, this reservation is placed in the organization's
                   secondary region which is designated for disaster recovery purposes.
                   If false, this reservation is placed in the organization's default region.

                   NOTE: this is a preview feature. Project must be allow-listed in order to
                   set this field.
                type: boolean
              projectRef:
                description: The project that this resource belongs to.
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              resourceID:
                description: The BigQueryReservationReservation name. If not given,
                  the metadata.name will be used.
                type: string
              scalingMode:
                description: Optional. The scaling mode for the reservation. If the
                  field is present but max_slots is not present.
                type: string
              secondaryLocation:
                description: Optional. The current location of the reservation's secondary
                  replica. This field is only set for reservations using the managed
                  disaster recovery feature. Users can set this in create reservation
                  calls to create a failover reservation or in update reservation
                  calls to convert a non-failover reservation to a failover reservation(or
                  vice versa).
                type: string
              slotCapacity:
                description: |-
                  Baseline slots available to this reservation. A slot is a unit of
                   computational power in BigQuery, and serves as the unit of parallelism.

                   Queries using this reservation might use more slots during runtime if
                   ignore_idle_slots is set to false, or autoscaling is enabled.

                   The total slot_capacity of the reservation and its siblings
                   may exceed the total slot_count of capacity commitments. In that case, the
                   exceeding slots will be charged with the autoscale SKU. You can increase
                   the number of baseline slots in a reservation every few minutes. If you
                   want to decrease your baseline slots, you are limited to once an hour if
                   you have recently changed your baseline slot capacity and your baseline
                   slots exceed your committed slots. Otherwise, you can decrease your
                   baseline slots every few minutes.
                format: int64
                type: integer
            required:
            - location
            type: object
          status:
            description: BigQueryReservationReservationStatus defines the config connector
              machine state of BigQueryReservationReservation
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: Unique, one-word, CamelCase reason for the condition's
                        last transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: A unique specifier for the BigQueryReservationReservation
                  resource in GCP.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the Config Connector controller.
                  If this is equal to metadata.generation, then that means that the
                  current reported status reflects the most recent desired state of
                  the resource.
                format: int64
                type: integer
              observedState:
                description: ObservedState is the state of the resource as most recently
                  observed in GCP.
                properties:
                  creationTime:
                    description: Output only. Creation time of the reservation.
                    type: string
                  originalPrimaryLocation:
                    description: Output only. The location where the reservation was
                      originally created. This is set only during the failover reservation's
                      creation. All billing charges for the failover reservation will
                      be applied to this location.
                    type: string
                  primaryLocation:
                    description: Output only. The current location of the reservation's
                      primary replica. This field is only set for reservations using
                      the managed disaster recovery feature.
                    type: string
                  replicationStatus:
                    description: Output only. The Disaster Recovery(DR) replication
                      status of the reservation. This is only available for the primary
                      replicas of DR/failover reservations and provides information
                      about the both the staleness of the secondary and the last error
                      encountered while trying to replicate changes from the primary
                      to the secondary. If this field is blank, it means that the
                      reservation is either not a DR reservation or the reservation
                      is a DR secondary or that any replication operations on the
                      reservation have succeeded.
                    properties:
                      error:
                        description: Output only. The last error encountered while
                          trying to replicate changes from the primary to the secondary.
                          This field is only available if the replication has not
                          succeeded since.
                        properties:
                          code:
                            description: The status code, which should be an enum
                              value of [google.rpc.Code][google.rpc.Code].
                            format: int32
                            type: integer
                          message:
                            description: A developer-facing error message, which should
                              be in English. Any user-facing error message should
                              be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details]
                              field, or localized by the client.
                            type: string
                        type: object
                      lastErrorTime:
                        description: Output only. The time at which the last error
                          was encountered while trying to replicate changes from the
                          primary to the secondary. This field is only available if
                          the replication has not succeeded since.
                        type: string
                      lastReplicationTime:
                        description: Output only. A timestamp corresponding to the
                          last change on the primary that was successfully replicated
                          to the secondary.
                        type: string
                    type: object
                  updateTime:
                    description: Output only. Last update time of the reservation.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
