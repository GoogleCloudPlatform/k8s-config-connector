                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: A unique specifier for the LoggingLogSink resource in
                  GCP.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the Config Connector controller.
                  If this is equal to metadata.generation, then that means that the
                  current reported status reflects the most recent desired state of
                  the resource.
                format: int64
                type: integer
              observedState:
                description: ObservedState is the state of the resource as most recently
                  observed in GCP.
                properties:
                  createTime:
                    description: |-
                      Output only. The creation timestamp of the sink.

                       This field may not be present for older sinks.
                    type: string
                  updateTime:
                    description: |-
                      Output only. The last update timestamp of the sink.

                       This field may not be present for older sinks.
                    type: string
                  writerIdentity:
                    description: |-
                      Output only. An IAM identity&mdash;a service account or group&mdash;under
                       which Cloud Logging writes the exported log entries to the sink's
                       destination. This field is either set by specifying
                       `custom_writer_identity` or set automatically by
                       [sinks.create][google.logging.v2.ConfigServiceV2.CreateSink] and
                       [sinks.update][google.logging.v2.ConfigServiceV2.UpdateSink] based on the
                       value of `unique_writer_identity` in those methods.

                       Until you grant this identity write-access to the destination, log entry
                       exports from this sink will fail. For more information, see [Granting
                       Access for a
                       Resource](https://cloud.google.com/iam/docs/granting-roles-to-service-accounts#granting_access_to_a_service_account_for_a_resource).
                       Consult the destination service's documentation to determine the
                       appropriate IAM roles to assign to the identity.

                       Sinks that have a destination that is a log bucket in the same project as
                       the sink cannot have a writer_identity and no additional permissions are
                       required.
                    type: string
                type: object
            type: object
        required:
