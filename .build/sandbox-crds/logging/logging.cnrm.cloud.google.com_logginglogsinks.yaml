    name: v1beta1
    schema:
      openAPIV3Schema:
        description: LoggingLogSink is the Schema for the LoggingLogSink API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LoggingLogSinkSpec defines the desired state of LoggingLogSink
            properties:
              bigqueryOptions:
                description: Optional. Options that affect sinks exporting data to
                  BigQuery.
                properties:
                  usePartitionedTables:
                    description: |-
                      Optional. Whether to use [BigQuery's partition
                       tables](https://cloud.google.com/bigquery/docs/partitioned-tables). By
                       default, Cloud Logging creates dated tables based on the log entries'
                       timestamps, e.g. syslog_20170523. With partitioned tables the date suffix
                       is no longer present and [special query
                       syntax](https://cloud.google.com/bigquery/docs/querying-partitioned-tables)
                       has to be used instead. In both cases, tables are sharded based on UTC
                       timezone.
                    type: boolean
                type: object
              description:
                description: |-
                  Optional. A description of this sink.

                   The maximum length of the description is 8000 characters.
                type: string
              destination:
                description: |-
                  Required. The export destination:

                       "storage.googleapis.com/[GCS_BUCKET]"
                       "bigquery.googleapis.com/projects/[PROJECT_ID]/datasets/[DATASET]"
                       "pubsub.googleapis.com/projects/[PROJECT_ID]/topics/[TOPIC_ID]"

                   The sink's `writer_identity`, set when the sink is created, must have
                   permission to write to the destination or else the log entries are not
                   exported. For more information, see
                   [Exporting Logs with
                   Sinks](https://cloud.google.com/logging/docs/api/tasks/exporting-logs).
                type: string
              disabled:
                description: |-
                  Optional. If set to true, then this sink is disabled and it does not export
                   any log entries.
                type: boolean
              exclusions:
                description: |-
                  Optional. Log entries that match any of these exclusion filters will not be
                   exported.

                   If a log entry is matched by both `filter` and one of `exclusion_filters`
                   it will not be exported.
                items: {}
                type: array
              filter:
                description: |-
                  Optional. An [advanced logs
                   filter](https://cloud.google.com/logging/docs/view/advanced-queries). The
                   only exported log entries are those that are in the resource owning the
                   sink and that match the filter.

                   For example:

                     `logName="projects/[PROJECT_ID]/logs/[LOG_ID]" AND severity>=ERROR`
                type: string
              includeChildren:
                description: |-
                  Optional. This field applies only to sinks owned by organizations and
                   folders. If the field is false, the default, only the logs owned by the
                   sink's parent resource are available for export. If the field is true, then
                   log entries from all the projects, folders, and billing accounts contained
                   in the sink's parent resource are also available for export. Whether a
                   particular log entry from the children is exported depends on the sink's
                   filter expression.

                   For example, if this field is true, then the filter
                   `resource.type=gce_instance` would export all Compute Engine VM instance
                   log entries from all projects in the sink's parent.

                   To only export entries from certain child projects, filter on the project
                   part of the log name:

                     logName:("projects/test-project1/" OR "projects/test-project2/") AND
                     resource.type=gce_instance
                type: boolean
              outputVersionFormat:
