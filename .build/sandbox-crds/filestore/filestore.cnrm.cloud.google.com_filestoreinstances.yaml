    name: v1beta1
    schema:
      openAPIV3Schema:
        description: FilestoreInstance is the Schema for the FilestoreInstance API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: FilestoreInstanceSpec defines the desired state of FilestoreInstance
            properties:
              deletionProtectionEnabled:
                description: Optional. Indicates whether the instance is protected
                  against deletion.
                type: boolean
              deletionProtectionReason:
                description: Optional. The reason for enabling deletion protection.
                type: string
              description:
                description: The description of the instance (2048 characters or less).
                type: string
              etag:
                description: Server-specified ETag for the instance resource to prevent
                  simultaneous updates from overwriting each other.
                type: string
              fileShares:
                description: File system shares on the instance. For this version,
                  only a single file share is supported.
                items:
                  properties:
                    capacityGB:
                      description: File share capacity in gigabytes (GB). Filestore
                        defines 1 GB as 1024^3 bytes.
                      format: int64
                      type: integer
                    name:
                      description: Required. The name of the file share. Must use
                        1-16 characters for the basic service tier and 1-63 characters
                        for all other service tiers. Must use lowercase letters, numbers,
                        or underscores `[a-z0-9_]`. Must start with a letter. Immutable.
                      type: string
                    nfsExportOptions:
                      description: Nfs Export Options. There is a limit of 10 export
                        options per file share.
                      items:
                        properties:
                          accessMode:
                            description: Either READ_ONLY, for allowing only read
                              requests on the exported directory, or READ_WRITE, for
                              allowing both read and write requests. The default is
                              READ_WRITE.
                            type: string
                          anonGid:
                            description: An integer representing the anonymous group
                              id with a default value of 65534. Anon_gid may only
                              be set with squash_mode of ROOT_SQUASH.  An error will
                              be returned if this field is specified for other squash_mode
                              settings.
                            format: int64
                            type: integer
                          anonUid:
                            description: An integer representing the anonymous user
                              id with a default value of 65534. Anon_uid may only
                              be set with squash_mode of ROOT_SQUASH.  An error will
                              be returned if this field is specified for other squash_mode
                              settings.
                            format: int64
                            type: integer
                          ipRanges:
                            description: List of either an IPv4 addresses in the format
                              `{octet1}.{octet2}.{octet3}.{octet4}` or CIDR ranges
                              in the format `{octet1}.{octet2}.{octet3}.{octet4}/{mask
                              size}` which may mount the file share. Overlapping IP
                              ranges are not allowed, both within and across NfsExportOptions.
                              An error will be returned. The limit is 64 IP ranges/addresses
                              for each FileShareConfig among all NfsExportOptions.
                            items:
                              type: string
                            type: array
                          squashMode:
                            description: Either NO_ROOT_SQUASH, for allowing root
                              access on the exported directory, or ROOT_SQUASH, for
                              not allowing root access. The default is NO_ROOT_SQUASH.
                            type: string
                        type: object
                      type: array
                    sourceBackup:
                      description: The resource name of the backup, in the format
                        `projects/{project_number}/locations/{location_id}/backups/{backup_id}`,
                        that this file share has been restored from.
                      type: string
                  type: object
                type: array
              kmsKeyName:
                description: KMS key name used for data encryption.
                type: string
              labels:
                additionalProperties:
                  type: string
                description: Resource labels to represent user provided metadata.
                type: object
              location:
                description: The location of this resource.
                type: string
              networks:
                description: VPC networks to which the instance is connected. For
                  this version, only a single network is supported.
                items:
                  properties:
                    connectMode:
                      description: The network connect mode of the Filestore instance.
                        If not provided, the connect mode defaults to DIRECT_PEERING.
                      type: string
                    modes:
                      description: Internet protocol versions for which the instance
                        has IP addresses assigned. For this version, only MODE_IPV4
                        is supported.
                      items:
                        type: string
                      type: array
                    network:
                      description: The name of the Google Compute Engine [VPC network](https://cloud.google.com/vpc/docs/vpc)
                        to which the instance is connected.
                      type: string
                    reservedIPRange:
                      description: |-
                        Optional, reserved_ip_range can have one of the following two types of
                         values.

                         * CIDR range value when using DIRECT_PEERING connect mode.
                         * [Allocated IP address
                         range](https://cloud.google.com/compute/docs/ip-addresses/reserve-static-internal-ip-address)
                         when using PRIVATE_SERVICE_ACCESS connect mode.

                         When the name of an allocated IP address range is specified, it must be one
                         of the ranges associated with the private service access connection.
                         When specified as a direct CIDR value, it must be a /29 CIDR block for
                         Basic tier, a /24 CIDR block for High Scale tier, or a /26 CIDR block for
                         Enterprise tier in one of the [internal IP address
                         ranges](https://www.arin.net/reference/research/statistics/address_filters/)
                         that identifies the range of IP addresses reserved for this instance. For
                         example, 10.0.0.0/29, 192.168.0.0/24 or 192.168.0.0/26, respectively. The
                         range you specify can't overlap with either existing subnets or assigned IP
                         address ranges for other Filestore instances in the selected VPC
                         network.
                      type: string
                  type: object
                type: array
              performanceConfig:
                description: Optional. Used to configure performance.
                properties:
                  fixedIops:
                    description: |-
                      Choose a fixed provisioned IOPS value for the instance, which will
                       remain constant regardless of instance capacity. Value must be a
                       multiple of 1000.

                       If the chosen value is outside the supported range for the instance's
                       capacity during instance creation, instance creation will fail with an
                       `InvalidArgument` error. Similarly, if an instance capacity update
                       would result in a value outside the supported range, the update will
                       fail with an `InvalidArgument` error.
                    properties:
                      maxIops:
                        description: Required. Maximum IOPS.
                        format: int64
                        type: integer
                    type: object
                  iopsPerTb:
                    description: |-
                      Provision IOPS dynamically based on the capacity of the instance.
                       Provisioned IOPS will be calculated by multiplying the capacity of the
                       instance in TiB by the `iops_per_tb` value. For example, for a 2 TiB
                       instance with an `iops_per_tb` value of 17000 the provisioned IOPS will
                       be 34000.

                       If the calculated value is outside the supported range for the
                       instance's capacity during instance creation, instance creation will
                       fail with an `InvalidArgument` error. Similarly, if an instance
                       capacity update would result in a value outside the supported range,
                       the update will fail with an `InvalidArgument` error.
                    properties:
                      maxIopsPerTb:
                        description: Required. Maximum IOPS per TiB.
                        format: int64
                        type: integer
                    type: object
                type: object
              projectRef:
                description: The project that this resource belongs to.
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              protocol:
                description: 'Immutable. The protocol indicates the access protocol
                  for all shares in the instance. This field is immutable and it cannot
                  be changed after the instance has been created. Default value: `NFS_V3`.'
                type: string
              replication:
                description: Optional. Replication configuration.
                properties:
                  replicas:
                    description: Optional. Replication configuration for the replica
                      instance associated with this instance. Only a single replica
                      is supported.
                    items:
                      properties:
                        peerInstance:
                          description: Optional. The peer instance.
                          type: string
                      type: object
                    type: array
                  role:
                    description: Optional. The replication role.
                    type: string
                type: object
              resourceID:
                description: The FilestoreInstance name. If not given, the metadata.name
                  will be used.
                type: string
              tags:
                additionalProperties:
                  type: string
                description: 'Optional. Input only. Immutable. Tag key-value pairs
                  bound to this resource. Each key must be a namespaced name and each
                  value a short name. Example: "123456789012/environment" : "production",
                  "123456789013/costCenter" : "marketing" See the documentation for
                  more information: - Namespaced name: https://cloud.google.com/resource-manager/docs/tags/tags-creating-and-managing#retrieving_tag_key
                  - Short name: https://cloud.google.com/resource-manager/docs/tags/tags-creating-and-managing#retrieving_tag_value'
                type: object
              tier:
                description: The service tier of the instance.
                type: string
            required:
            - location
            type: object
          status:
            description: FilestoreInstanceStatus defines the config connector machine
              state of FilestoreInstance
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: Unique, one-word, CamelCase reason for the condition's
                        last transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: A unique specifier for the FilestoreInstance resource
                  in GCP.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the Config Connector controller.
                  If this is equal to metadata.generation, then that means that the
                  current reported status reflects the most recent desired state of
                  the resource.
                format: int64
                type: integer
              observedState:
                description: ObservedState is the state of the resource as most recently
                  observed in GCP.
                properties:
                  createTime:
                    description: Output only. The time when the instance was created.
                    type: string
                  customPerformanceSupported:
                    description: Output only. Indicates whether this instance supports
                      configuring its performance. If true, the user can configure
                      the instance's performance by using the 'performance_config'
                      field.
                    type: boolean
                  performanceLimits:
                    description: Output only. Used for getting performance limits.
                    properties:
                      maxIops:
                        description: Output only. The max IOPS.
                        format: int64
                        type: integer
                      maxReadIops:
                        description: Output only. The max read IOPS.
                        format: int64
                        type: integer
                      maxReadThroughputBps:
                        description: Output only. The max read throughput in bytes
                          per second.
                        format: int64
                        type: integer
                      maxWriteIops:
                        description: Output only. The max write IOPS.
                        format: int64
                        type: integer
                      maxWriteThroughputBps:
                        description: Output only. The max write throughput in bytes
                          per second.
                        format: int64
                        type: integer
                    type: object
                  satisfiesPzi:
                    description: Output only. Reserved for future use.
                    type: boolean
                  satisfiesPzs:
                    description: Output only. Reserved for future use.
                    type: boolean
                  state:
                    description: Output only. The instance state.
                    type: string
                  statusMessage:
                    description: Output only. Additional information about the instance
                      state, if available.
                    type: string
                  suspensionReasons:
                    description: Output only. Field indicates all the reasons the
                      instance is in "SUSPENDED" state.
                    items:
                      type: string
                    type: array
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
