                        type: string
                    type: object
                  uid:
                    description: Output only. A system-generated, globally unique
                      ID for the metadata job. If the metadata job is deleted and
                      then re-created with the same name, this ID is different.
                    type: string
                  updateTime:
                    description: Output only. The time when the metadata job was updated.
                    type: string
                type: object
            type: object
