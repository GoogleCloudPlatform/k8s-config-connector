                            that are related to the subject and lifetime.
                          properties:
                            hexSerialNumber:
                              description: The serial number encoded in lowercase
                                hexadecimal.
                              type: string
                            lifetime:
                              description: For convenience, the actual lifetime of
                                an issued certificate.
                              type: string
                            notAfterTime:
                              description: The time after which the certificate is
                                expired. Per RFC 5280, the validity period for a certificate
                                is the period of time from not_before_time through
                                not_after_time, inclusive. Corresponds to 'not_before_time'
                                + 'lifetime' - 1 second.
                              type: string
                            notBeforeTime:
                              description: The time at which the certificate becomes
                                valid.
                              type: string
                            subject:
                              description: Contains distinguished name fields such
                                as the common name, location and / organization.
                              properties:
                                commonName:
                                  description: The "common name" of the subject.
                                  type: string
                                countryCode:
                                  description: The country code of the subject.
                                  type: string
                                locality:
                                  description: The locality or city of the subject.
                                  type: string
                                organization:
                                  description: The organization of the subject.
                                  type: string
                                organizationalUnit:
                                  description: The organizational_unit of the subject.
