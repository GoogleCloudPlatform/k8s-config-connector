                  must be a bucket name, without any prefixes (such as `gs://`) or
                  suffixes (such as `.googleapis.com`). For example, to use a bucket
                  named `my-bucket`, you would simply specify `my-bucket`. If not
                  specified, a managed bucket will be created.
                type: string
              keySpec:
                description: Required. Immutable. Used when issuing certificates for
                  this [CertificateAuthority][google.cloud.security.privateca.v1.CertificateAuthority].
                  If this [CertificateAuthority][google.cloud.security.privateca.v1.CertificateAuthority]
                  is a self-signed CertificateAuthority, this key is also used to
                  sign the self-signed CA certificate. Otherwise, it is used to sign
                  a CSR.
                properties:
                  algorithm:
