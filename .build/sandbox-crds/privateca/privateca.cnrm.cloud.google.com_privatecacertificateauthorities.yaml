                              with a leading period (e.g. `.example.com`) to indicate
                              all email addresses in that domain.
                            items:
                              type: string
                            type: array
                          excludedIPRanges:
                            description: Contains the excluded IP ranges. For IPv4
                              addresses, the ranges are expressed using CIDR notation
