                              are expressed in similar encoding as IPv4 addresses.
                            items:
                              type: string
                            type: array
                          excludedUris:
                            description: Contains the excluded URIs that apply to
                              the host part of the name. The value can be a hostname
                              or a domain with a leading period (like `.example.com`)
                            items:
                              type: string
                            type: array
                          permittedDNSNames:
