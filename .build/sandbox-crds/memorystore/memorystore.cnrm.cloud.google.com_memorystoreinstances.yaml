apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    cnrm.cloud.google.com/version: 0.0.0-dev
  creationTimestamp: null
  labels:
    cnrm.cloud.google.com/managed-by-kcc: "true"
    cnrm.cloud.google.com/system: "true"
  name: memorystoreinstances.memorystore.cnrm.cloud.google.com
spec:
  group: memorystore.cnrm.cloud.google.com
  names:
    categories:
    - gcp
    kind: MemorystoreInstance
    listKind: MemorystoreInstanceList
    plural: memorystoreinstances
    shortNames:
    - gcpmemorystoreinstance
    - gcpmemorystoreinstances
    singular: memorystoreinstance
  preserveUnknownFields: false
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: When 'True', the most recent reconcile of the resource succeeded
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: The reason for the value in 'Ready'
      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Status
      type: string
    - description: The last transition time for the value in 'Status'
      jsonPath: .status.conditions[?(@.type=='Ready')].lastTransitionTime
      name: Status Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: MemorystoreInstance is the Schema for the MemorystoreInstance
          API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: MemorystoreInstanceSpec defines the desired state of MemorystoreInstance
            properties:
              asyncInstanceEndpointsDeletionEnabled:
                description: Optional. If true, instance endpoints that are created
                  and registered by customers can be deleted asynchronously. That
                  is, such an instance endpoint can be de-registered before the forwarding
                  rules in the instance endpoint are deleted.
                type: boolean
              authorizationMode:
                description: Optional. Immutable. Authorization mode of the instance.
                type: string
              automatedBackupConfig:
                description: Optional. The automated backup config for the instance.
                properties:
                  automatedBackupMode:
                    description: Optional. The automated backup mode. If the mode
                      is disabled, the other fields will be ignored.
                    type: string
                  fixedFrequencySchedule:
                    description: Optional. Trigger automated backups at a fixed frequency.
                    properties:
                      startTime:
                        description: Required. The start time of every automated backup
                          in UTC. It must be set to the start of an hour. This field
                          is required.
                        properties:
                          hours:
                            description: Hours of day in 24 hour format. Should be
                              from 0 to 23. An API may choose to allow the value "24:00:00"
                              for scenarios like business closing time.
                            format: int32
                            type: integer
                          minutes:
                            description: Minutes of hour of day. Must be from 0 to
                              59.
                            format: int32
                            type: integer
                          nanos:
                            description: Fractions of seconds in nanoseconds. Must
                              be from 0 to 999,999,999.
                            format: int32
                            type: integer
                          seconds:
                            description: Seconds of minutes of the time. Must normally
                              be from 0 to 59. An API may allow the value 60 if it
                              allows leap-seconds.
                            format: int32
                            type: integer
                        type: object
                    type: object
                  retention:
                    description: Optional. How long to keep automated backups before
                      the backups are deleted. The value should be between 1 day and
                      365 days. If not specified, the default value is 35 days.
                    type: string
                type: object
              crossInstanceReplicationConfig:
                description: Optional. The config for cross instance replication.
                properties:
                  instanceRole:
                    description: Required. The role of the instance in cross instance
                      replication.
                    type: string
                  primaryInstance:
                    description: |-
                      Optional. Details of the primary instance that is used as the replication
                       source for this secondary instance.

                       This field is only set for a secondary instance.
                    properties:
                      instance:
                        description: 'Optional. The full resource path of the remote
                          instance in the format: projects/<project>/locations/<region>/instances/<instance-id>'
                        type: string
                    type: object
                  secondaryInstances:
                    description: |-
                      Optional. List of secondary instances that are replicating from this
                       primary instance.

                       This field is only set for a primary instance.
                    items:
                      properties:
                        instance:
                          description: 'Optional. The full resource path of the remote
                            instance in the format: projects/<project>/locations/<region>/instances/<instance-id>'
                          type: string
                      type: object
                    type: array
                type: object
              deletionProtectionEnabled:
                description: Optional. If set to true deletion of the instance will
                  fail.
                type: boolean
              endpoints:
                description: Optional. Endpoints for the instance.
                items:
                  properties:
                    connections:
                      description: Optional. A group of PSC connections. They are
                        created in the same VPC network, one for each service attachment
                        in the cluster.
                      items:
                        properties:
                          pscAutoConnection:
                            description: Immutable. Detailed information of a PSC
                              connection that is created through service connectivity
                              automation.
                            properties:
                              network:
                                description: Required. The network where the PSC endpoints
                                  are created, in the form of projects/{project_id}/global/networks/{network_id}.
                                type: string
                              port:
                                description: Optional. port will only be set for Primary/Reader
                                  or Discovery endpoint.
                                format: int32
                                type: integer
                              projectID:
                                description: Required. The consumer project_id where
                                  PSC connections are established. This should be
                                  the same project_id that the instance is being created
                                  in.
                                type: string
                            type: object
                          pscConnection:
                            description: Detailed information of a PSC connection
                              that is created by the user.
                            properties:
                              forwardingRule:
                                description: 'Required. The URI of the consumer side
                                  forwarding rule. Format: projects/{project}/regions/{region}/forwardingRules/{forwarding_rule}'
                                type: string
                              ipAddress:
                                description: Required. The IP allocated on the consumer
                                  network for the PSC forwarding rule.
                                type: string
                              network:
                                description: Required. The consumer network where
                                  the IP address resides, in the form of projects/{project_id}/global/networks/{network_id}.
                                type: string
                              port:
                                description: Optional. port will only be set for Primary/Reader
                                  or Discovery endpoint.
                                format: int32
                                type: integer
                              pscConnectionID:
                                description: Required. The PSC connection id of the
                                  forwarding rule connected to the service attachment.
                                type: string
                              serviceAttachment:
                                description: Required. The service attachment which
                                  is the target of the PSC connection, in the form
                                  of projects/{project-id}/regions/{region}/serviceAttachments/{service-attachment-id}.
                                type: string
                            type: object
                        type: object
                      type: array
                  type: object
                type: array
              engineConfigs:
                additionalProperties:
                  type: string
                description: Optional. User-provided engine configurations for the
                  instance.
                type: object
              engineVersion:
                description: Optional. Engine version of the instance.
                type: string
              gcsSource:
                description: Optional. Immutable. Backups that stored in Cloud Storage
                  buckets. The Cloud Storage buckets need to be the same region as
                  the instances. Read permission is required to import from the provided
                  Cloud Storage Objects.
                properties:
                  uris:
                    description: 'Optional. Example: gs://bucket1/object1, gs://bucket2/folder2/object2'
                    items:
                      type: string
                    type: array
                type: object
              labels:
                additionalProperties:
                  type: string
                description: Optional. Labels to represent user-provided metadata.
                type: object
              location:
                description: The location of this resource.
                type: string
              maintenancePolicy:
                description: Optional. The maintenance policy for the instance. If
                  not provided, the maintenance event will be performed based on Memorystore
                  internal rollout schedule.
                properties:
                  weeklyMaintenanceWindow:
                    description: Optional. Maintenance window that is applied to resources
                      covered by this policy. Minimum 1. For the current version,
                      the maximum number of weekly_window is expected to be one.
                    items:
                      properties:
                        day:
                          description: Optional. Allows to define schedule that runs
                            specified day of the week.
                          type: string
                        startTime:
                          description: Optional. Start time of the window in UTC.
                          properties:
                            hours:
                              description: Hours of day in 24 hour format. Should
                                be from 0 to 23. An API may choose to allow the value
                                "24:00:00" for scenarios like business closing time.
                              format: int32
                              type: integer
                            minutes:
                              description: Minutes of hour of day. Must be from 0
                                to 59.
                              format: int32
                              type: integer
                            nanos:
                              description: Fractions of seconds in nanoseconds. Must
                                be from 0 to 999,999,999.
                              format: int32
                              type: integer
                            seconds:
                              description: Seconds of minutes of the time. Must normally
                                be from 0 to 59. An API may allow the value 60 if
                                it allows leap-seconds.
                              format: int32
                              type: integer
                          type: object
                      type: object
                    type: array
                type: object
              managedBackupSource:
                description: Optional. Immutable. Backups that generated and managed
                  by memorystore service.
                properties:
                  backup:
                    description: 'Optional. Example: //memorystore.googleapis.com/projects/{project}/locations/{location}/backupCollections/{collection}/backups/{backup}
                      A shorter version (without the prefix) of the backup name is
                      also supported, like projects/{project}/locations/{location}/backupCollections/{collection}/backups/{backup_id}
                      In this case, it assumes the backup is under memorystore.googleapis.com.'
                    type: string
                type: object
              mode:
                description: Optional. The mode config for the instance.
                type: string
              nodeType:
                description: Optional. Machine type for individual nodes of the instance.
                type: string
              ondemandMaintenance:
                description: Optional. Input only. Ondemand maintenance for the instance.
                type: boolean
              persistenceConfig:
                description: Optional. Persistence configuration of the instance.
                properties:
                  aofConfig:
                    description: Optional. AOF configuration. This field will be ignored
                      if mode is not AOF.
                    properties:
                      appendFsync:
                        description: Optional. The fsync mode.
                        type: string
                    type: object
                  mode:
                    description: Optional. Current persistence mode.
                    type: string
                  rdbConfig:
                    description: Optional. RDB configuration. This field will be ignored
                      if mode is not RDB.
                    properties:
                      rdbSnapshotPeriod:
                        description: Optional. Period between RDB snapshots.
                        type: string
                      rdbSnapshotStartTime:
                        description: Optional. Time that the first snapshot was/will
                          be attempted, and to which future snapshots will be aligned.
                          If not provided, the current time will be used.
                        type: string
                    type: object
                type: object
              projectRef:
                description: The project that this resource belongs to.
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              pscAutoConnections:
                description: 'Optional. Immutable. Deprecated: Use the endpoints.connections.psc_auto_connection
                  value instead.'
                items:
                  properties:
                    network:
                      description: Required. The network where the PSC endpoints are
                        created, in the form of projects/{project_id}/global/networks/{network_id}.
                      type: string
                    port:
                      description: Optional. port will only be set for Primary/Reader
                        or Discovery endpoint.
                      format: int32
                      type: integer
                    projectID:
                      description: Required. The consumer project_id where PSC connections
                        are established. This should be the same project_id that the
                        instance is being created in.
                      type: string
                  type: object
                type: array
              replicaCount:
                description: Optional. Number of replica nodes per shard. If omitted
                  the default is 0 replicas.
                format: int32
                type: integer
              resourceID:
                description: The MemorystoreInstance name. If not given, the metadata.name
                  will be used.
                type: string
              shardCount:
                description: Optional. Number of shards for the instance.
                format: int32
                type: integer
              transitEncryptionMode:
                description: Optional. Immutable. In-transit encryption mode of the
                  instance.
                type: string
              zoneDistributionConfig:
                description: Optional. Immutable. Zone distribution configuration
                  of the instance for node allocation.
                properties:
                  mode:
                    description: Optional. Current zone distribution mode. Defaults
                      to MULTI_ZONE.
                    type: string
                  zone:
                    description: Optional. Defines zone where all resources will be
                      allocated with SINGLE_ZONE mode. Ignored for MULTI_ZONE mode.
                    type: string
                type: object
            required:
            - location
            type: object
          status:
            description: MemorystoreInstanceStatus defines the config connector machine
              state of MemorystoreInstance
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: Unique, one-word, CamelCase reason for the condition's
                        last transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: A unique specifier for the MemorystoreInstance resource
                  in GCP.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the Config Connector controller.
                  If this is equal to metadata.generation, then that means that the
                  current reported status reflects the most recent desired state of
                  the resource.
                format: int64
                type: integer
              observedState:
                description: ObservedState is the state of the resource as most recently
                  observed in GCP.
                properties:
                  backupCollection:
                    description: 'Output only. The backup collection full resource
                      name. Example: projects/{project}/locations/{location}/backupCollections/{collection}'
                    type: string
                  createTime:
                    description: Output only. Creation timestamp of the instance.
                    type: string
                  discoveryEndpoints:
                    description: 'Output only. Deprecated: Use the endpoints.connections.psc_auto_connection
                      or endpoints.connections.psc_connection values instead.'
                    items:
                      properties:
                        address:
                          description: Output only. IP address of the exposed endpoint
                            clients connect to.
                          type: string
                        network:
                          description: Output only. The network where the IP address
                            of the discovery endpoint will be reserved, in the form
                            of projects/{network_project}/global/networks/{network_id}.
                          type: string
                        port:
                          description: Output only. The port number of the exposed
                            endpoint.
                          format: int32
                          type: integer
                      type: object
                    type: array
                  maintenanceSchedule:
                    description: Output only. Published maintenance schedule.
                    properties:
                      endTime:
                        description: Output only. The end time of any upcoming scheduled
                          maintenance for this instance.
                        type: string
                      startTime:
                        description: Output only. The start time of any upcoming scheduled
                          maintenance for this instance.
                        type: string
                    type: object
                  nodeConfig:
                    description: Output only. Configuration of individual nodes of
                      the instance.
                    properties:
                      sizeGB:
                        description: Output only. Memory size in GB of the node.
                        type: number
                    type: object
                  pscAttachmentDetails:
                    description: Output only. Service attachment details to configure
                      PSC connections.
                    items:
                      properties:
                        connectionType:
                          description: Output only. Type of Psc endpoint.
                          type: string
                        serviceAttachment:
                          description: Output only. Service attachment URI which your
                            self-created PscConnection should use as target.
                          type: string
                      type: object
                    type: array
                  state:
                    description: Output only. Current state of the instance.
                    type: string
                  stateInfo:
                    description: Output only. Additional information about the state
                      of the instance.
                    properties:
                      updateInfo:
                        description: Output only. Describes ongoing update when instance
                          state is UPDATING.
                        properties:
                          targetEngineVersion:
                            description: Output only. Target engine version for the
                              instance.
                            type: string
                          targetNodeType:
                            description: Output only. Target node type for the instance.
                            type: string
                          targetReplicaCount:
                            description: Output only. Target number of replica nodes
                              per shard for the instance.
                            format: int32
                            type: integer
                          targetShardCount:
                            description: Output only. Target number of shards for
                              the instance.
                            format: int32
                            type: integer
                        type: object
                    type: object
                  uid:
                    description: Output only. System assigned, unique identifier for
                      the instance.
                    type: string
                  updateTime:
                    description: Output only. Latest update timestamp of the instance.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
