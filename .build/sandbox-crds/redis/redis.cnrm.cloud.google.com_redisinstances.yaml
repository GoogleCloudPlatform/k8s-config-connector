apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    cnrm.cloud.google.com/version: 0.0.0-dev
  creationTimestamp: null
  labels:
    cnrm.cloud.google.com/managed-by-kcc: "true"
    cnrm.cloud.google.com/system: "true"
  name: redisinstances.redis.cnrm.cloud.google.com
spec:
  group: redis.cnrm.cloud.google.com
  names:
    categories:
    - gcp
    kind: RedisInstance
    listKind: RedisInstanceList
    plural: redisinstances
    shortNames:
    - gcpredisinstance
    - gcpredisinstances
    singular: redisinstance
  preserveUnknownFields: false
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: When 'True', the most recent reconcile of the resource succeeded
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: The reason for the value in 'Ready'
      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Status
      type: string
    - description: The last transition time for the value in 'Status'
      jsonPath: .status.conditions[?(@.type=='Ready')].lastTransitionTime
      name: Status Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: RedisInstance is the Schema for the RedisInstance API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: RedisInstanceSpec defines the desired state of RedisInstance
            properties:
              alternativeLocationID:
                description: Optional. If specified, at least one node will be provisioned
                  in this zone in addition to the zone specified in location_id. Only
                  applicable to standard tier. If provided, it must be a different
                  zone from the one provided in [location_id]. Additional nodes beyond
                  the first 2 will be placed in zones selected by the service.
                type: string
              authEnabled:
                description: Optional. Indicates whether OSS Redis AUTH is enabled
                  for the instance. If set to "true" AUTH is enabled on the instance.
                  Default value is "false" meaning AUTH is disabled.
                type: boolean
              authorizedNetwork:
                description: Optional. The full name of the Google Compute Engine
                  [network](https://cloud.google.com/vpc/docs/vpc) to which the instance
                  is connected. If left unspecified, the `default` network will be
                  used.
                type: string
              availableMaintenanceVersions:
                description: Optional. The available maintenance versions that an
                  instance could update to.
                items:
                  type: string
                type: array
              connectMode:
                description: Optional. The network connect mode of the Redis instance.
                  If not provided, the connect mode defaults to DIRECT_PEERING.
                type: string
              customerManagedKey:
                description: Optional. The KMS key reference that the customer provides
                  when trying to create the instance.
                type: string
              displayName:
                description: An arbitrary and optional user-provided name for the
                  instance.
                type: string
              labels:
                additionalProperties:
                  type: string
                description: Resource labels to represent user provided metadata
                type: object
              location:
                description: The location of this resource.
                type: string
              locationID:
                description: Optional. The zone where the instance will be provisioned.
                  If not provided, the service will choose a zone from the specified
                  region for the instance. For standard tier, additional nodes will
                  be added across multiple zones for protection against zonal failures.
                  If specified, at least one node will be provisioned in this zone.
                type: string
              maintenancePolicy:
                description: Optional. The maintenance policy for the instance. If
                  not provided, maintenance events can be performed at any time.
                properties:
                  description:
                    description: Optional. Description of what this policy is for.
                      Create/Update methods return INVALID_ARGUMENT if the length
                      is greater than 512.
                    type: string
                  weeklyMaintenanceWindow:
                    description: Optional. Maintenance window that is applied to resources
                      covered by this policy. Minimum 1. For the current version,
                      the maximum number of weekly_window is expected to be one.
                    items:
                      properties:
                        day:
                          description: Required. The day of week that maintenance
                            updates occur.
                          type: string
                        startTime:
                          description: Required. Start time of the window in UTC time.
                          properties:
                            hours:
                              description: Hours of day in 24 hour format. Should
                                be from 0 to 23. An API may choose to allow the value
                                "24:00:00" for scenarios like business closing time.
                              format: int32
                              type: integer
                            minutes:
                              description: Minutes of hour of day. Must be from 0
                                to 59.
                              format: int32
                              type: integer
                            nanos:
                              description: Fractions of seconds in nanoseconds. Must
                                be from 0 to 999,999,999.
                              format: int32
                              type: integer
                            seconds:
                              description: Seconds of minutes of the time. Must normally
                                be from 0 to 59. An API may allow the value 60 if
                                it allows leap-seconds.
                              format: int32
                              type: integer
                          type: object
                      type: object
                    type: array
                type: object
              maintenanceVersion:
                description: Optional. The self service update maintenance version.
                  The version is date based such as "20210712_00_00".
                type: string
              memorySizeGB:
                description: Required. Redis memory size in GiB.
                format: int32
                type: integer
              persistenceConfig:
                description: Optional. Persistence configuration parameters
                properties:
                  persistenceMode:
                    description: Optional. Controls whether Persistence features are
                      enabled. If not provided, the existing value will be used.
                    type: string
                  rdbSnapshotPeriod:
                    description: Optional. Period between RDB snapshots. Snapshots
                      will be attempted every period starting from the provided snapshot
                      start time. For example, a start time of 01/01/2033 06:45 and
                      SIX_HOURS snapshot period will do nothing until 01/01/2033,
                      and then trigger snapshots every day at 06:45, 12:45, 18:45,
                      and 00:45 the next day, and so on. If not provided, TWENTY_FOUR_HOURS
                      will be used as default.
                    type: string
                  rdbSnapshotStartTime:
                    description: Optional. Date and time that the first snapshot was/will
                      be attempted, and to which future snapshots will be aligned.
                      If not provided, the current time will be used.
                    type: string
                type: object
              projectRef:
                description: The project that this resource belongs to.
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              readReplicasMode:
                description: Optional. Read replicas mode for the instance. Defaults
                  to READ_REPLICAS_DISABLED.
                type: string
              redisConfigs:
                additionalProperties:
                  type: string
                description: |-
                  Optional. Redis configuration parameters, according to
                   http://redis.io/topics/config. Currently, the only supported parameters
                   are:

                    Redis version 3.2 and newer:

                    *   maxmemory-policy
                    *   notify-keyspace-events

                    Redis version 4.0 and newer:

                    *   activedefrag
                    *   lfu-decay-time
                    *   lfu-log-factor
                    *   maxmemory-gb

                    Redis version 5.0 and newer:

                    *   stream-node-max-bytes
                    *   stream-node-max-entries
                type: object
              redisVersion:
                description: |-
                  Optional. The version of Redis software.
                   If not provided, latest supported version will be used. Currently, the
                   supported values are:

                    *   `REDIS_3_2` for Redis 3.2 compatibility
                    *   `REDIS_4_0` for Redis 4.0 compatibility (default)
                    *   `REDIS_5_0` for Redis 5.0 compatibility
                    *   `REDIS_6_X` for Redis 6.x compatibility
                type: string
              replicaCount:
                description: Optional. The number of replica nodes. The valid range
                  for the Standard Tier with read replicas enabled is [1-5] and defaults
                  to 2. If read replicas are not enabled for a Standard Tier instance,
                  the only valid value is 1 and the default is 1. The valid value
                  for basic tier is 0 and the default is also 0.
                format: int32
                type: integer
              reservedIPRange:
                description: Optional. For DIRECT_PEERING mode, the CIDR range of
                  internal addresses that are reserved for this instance. Range must
                  be unique and non-overlapping with existing subnets in an authorized
                  network. For PRIVATE_SERVICE_ACCESS mode, the name of one allocated
                  IP address ranges associated with this private service access connection.
                  If not provided, the service will choose an unused /29 block, for
                  example, 10.0.0.0/29 or 192.168.0.0/29.  For READ_REPLICAS_ENABLED
                  the default block size is /28.
                type: string
              resourceID:
                description: The RedisInstance name. If not given, the metadata.name
                  will be used.
                type: string
              secondaryIPRange:
                description: Optional. Additional IP range for node placement. Required
                  when enabling read replicas on an existing instance. For DIRECT_PEERING
                  mode value must be a CIDR range of size /28, or "auto". For PRIVATE_SERVICE_ACCESS
                  mode value must be the name of an allocated address range associated
                  with the private service access connection, or "auto".
                type: string
              suspensionReasons:
                description: Optional. reasons that causes instance in "SUSPENDED"
                  state.
                items:
                  type: string
                type: array
              tier:
                description: Required. The service tier of the instance.
                type: string
              transitEncryptionMode:
                description: Optional. The TLS mode of the Redis instance. If not
                  provided, TLS is disabled for the instance.
                type: string
            required:
            - location
            type: object
          status:
            description: RedisInstanceStatus defines the config connector machine
              state of RedisInstance
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: Unique, one-word, CamelCase reason for the condition's
                        last transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: A unique specifier for the RedisInstance resource in
                  GCP.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the Config Connector controller.
                  If this is equal to metadata.generation, then that means that the
                  current reported status reflects the most recent desired state of
                  the resource.
                format: int64
                type: integer
              observedState:
                description: ObservedState is the state of the resource as most recently
                  observed in GCP.
                properties:
                  createTime:
                    description: Output only. The time the instance was created.
                    type: string
                  currentLocationID:
                    description: Output only. The current zone where the Redis primary
                      node is located. In basic tier, this will always be the same
                      as [location_id]. In standard tier, this can be the zone of
                      any node in the instance.
                    type: string
                  host:
                    description: Output only. Hostname or IP address of the exposed
                      Redis endpoint used by clients to connect to the service.
                    type: string
                  maintenanceSchedule:
                    description: Output only. Date and time of upcoming maintenance
                      events which have been scheduled.
                    properties:
                      canReschedule:
                        description: If the scheduled maintenance can be rescheduled,
                          default is true.
                        type: boolean
                      endTime:
                        description: Output only. The end time of any upcoming scheduled
                          maintenance for this instance.
                        type: string
                      scheduleDeadlineTime:
                        description: Output only. The deadline that the maintenance
                          schedule start time can not go beyond, including reschedule.
                        type: string
                      startTime:
                        description: Output only. The start time of any upcoming scheduled
                          maintenance for this instance.
                        type: string
                    type: object
                  nodes:
                    description: Output only. Info per node.
                    items:
                      properties:
                        id:
                          description: Output only. Node identifying string. e.g.
                            'node-0', 'node-1'
                          type: string
                        zone:
                          description: Output only. Location of the node.
                          type: string
                      type: object
                    type: array
                  persistenceIAMIdentity:
                    description: Output only. Cloud IAM identity used by import /
                      export operations to transfer data to/from Cloud Storage. Format
                      is "serviceAccount:<service_account_email>". The value may change
                      over time for a given instance so should be checked before each
                      import/export operation.
                    type: string
                  port:
                    description: Output only. The port number of the exposed Redis
                      endpoint.
                    format: int32
                    type: integer
                  readEndpoint:
                    description: Output only. Hostname or IP address of the exposed
                      readonly Redis endpoint. Standard tier only. Targets all healthy
                      replica nodes in instance. Replication is asynchronous and replica
                      nodes will exhibit some lag behind the primary. Write requests
                      must target 'host'.
                    type: string
                  readEndpointPort:
                    description: Output only. The port number of the exposed readonly
                      redis endpoint. Standard tier only. Write requests should target
                      'port'.
                    format: int32
                    type: integer
                  serverCACerts:
                    description: Output only. List of server CA certificates for the
                      instance.
                    items:
                      properties:
                        cert:
                          description: PEM representation.
                          type: string
                        createTime:
                          description: Output only. The time when the certificate
                            was created in [RFC 3339](https://tools.ietf.org/html/rfc3339)
                            format, for example `2020-05-18T00:00:00.094Z`.
                          type: string
                        expireTime:
                          description: Output only. The time when the certificate
                            expires in [RFC 3339](https://tools.ietf.org/html/rfc3339)
                            format, for example `2020-05-18T00:00:00.094Z`.
                          type: string
                        serialNumber:
                          description: Serial number, as extracted from the certificate.
                          type: string
                        sha1Fingerprint:
                          description: Sha1 Fingerprint of the certificate.
                          type: string
                      type: object
                    type: array
                  state:
                    description: Output only. The current state of this instance.
                    type: string
                  statusMessage:
                    description: Output only. Additional information about the current
                      status of this instance, if available.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
