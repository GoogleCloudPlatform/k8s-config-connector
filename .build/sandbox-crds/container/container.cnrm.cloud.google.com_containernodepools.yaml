---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  labels:
    cnrm.cloud.google.com/managed-by-kcc: "true"
    cnrm.cloud.google.com/system: "true"
  name: containernodepools.container.cnrm.cloud.google.com
spec:
  group: container.cnrm.cloud.google.com
  names:
    categories:
    - gcp
    kind: ContainerNodePool
    listKind: ContainerNodePoolList
    plural: containernodepools
    shortNames:
    - gcpcontainernodepool
    - gcpcontainernodepools
    singular: containernodepool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: When 'True', the most recent reconcile of the resource succeeded
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: The reason for the value in 'Ready'
      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Status
      type: string
    - description: The last transition time for the value in 'Status'
      jsonPath: .status.conditions[?(@.type=='Ready')].lastTransitionTime
      name: Status Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: ContainerNodePool is the Schema for the ContainerNodePool API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ContainerNodePoolSpec defines the desired state of ContainerNodePool
            properties:
              autoscaling:
                description: |-
                  Autoscaler configuration for this NodePool. Autoscaler is enabled
                   only if a valid configuration is present.
                properties:
                  autoprovisioned:
                    description: Can this node pool be deleted automatically.
                    type: boolean
                  enabled:
                    description: Is autoscaling enabled for this node pool.
                    type: boolean
                  locationPolicy:
                    description: Location policy used when scaling up a nodepool.
                    type: string
                  maxNodeCount:
                    description: |-
                      Maximum number of nodes for one location in the node pool. Must be >=
                       min_node_count. There has to be enough quota to scale up the cluster.
                    format: int32
                    type: integer
                  minNodeCount:
                    description: |-
                      Minimum number of nodes for one location in the node pool. Must be greater
                       than or equal to 0 and less than or equal to max_node_count.
                    format: int32
                    type: integer
                  totalMaxNodeCount:
                    description: |-
                      Maximum number of nodes in the node pool. Must be greater than or equal to
                       total_min_node_count. There has to be enough quota to scale up the cluster.
                       The total_*_node_count fields are mutually exclusive with the *_node_count
                       fields.
                    format: int32
                    type: integer
                  totalMinNodeCount:
                    description: |-
                      Minimum number of nodes in the node pool. Must be greater than or equal
                       to 0 and less than or equal to total_max_node_count.
                       The total_*_node_count fields are mutually exclusive with the *_node_count
                       fields.
                    format: int32
                    type: integer
                type: object
              bestEffortProvisioning:
                description: Enable best effort provisioning for nodes
                properties:
                  enabled:
                    description: |-
                      When this is enabled, cluster/node pool creations will ignore non-fatal
                       errors like stockout to best provision as many nodes as possible right now
                       and eventually bring up all target number of nodes
                    type: boolean
                  minProvisionNodes:
                    description: |-
                      Minimum number of nodes to be provisioned to be considered as succeeded,
                       and the rest of nodes will be provisioned gradually and eventually when
                       stockout issue has been resolved.
                    format: int32
                    type: integer
                type: object
              conditions:
                description: Which conditions caused the current node pool state.
                items:
                  properties:
                    canonicalCode:
                      description: Canonical code of the condition.
                      type: string
                    code:
                      description: |-
                        Machine-friendly representation of the condition
                         Deprecated. Use canonical_code instead.
                      type: string
                    message:
                      description: Human-friendly representation of the condition
                      type: string
                  type: object
                type: array
              config:
                description: The node configuration of the pool.
                properties:
                  accelerators:
                    description: |-
                      A list of hardware accelerators to be attached to each node.
                       See
                       https://cloud.google.com/compute/docs/gpus
                       for more information about support for GPUs.
                    items:
                      properties:
                        acceleratorCount:
                          description: The number of the accelerator cards exposed
                            to an instance.
                          format: int64
                          type: integer
                        acceleratorType:
                          description: |-
                            The accelerator type resource name. List of supported accelerators
                             [here](https://cloud.google.com/compute/docs/gpus)
                          type: string
                        gpuDriverInstallationConfig:
                          description: The configuration for auto installation of
                            GPU driver.
                          properties:
                            gpuDriverVersion:
                              description: Mode for how the GPU driver is installed.
                              type: string
                          type: object
                        gpuPartitionSize:
                          description: |-
                            Size of partitions to create on the GPU. Valid values are described in the
                             NVIDIA [mig user
                             guide](https://docs.nvidia.com/datacenter/tesla/mig-user-guide/#partitioning).
                          type: string
                        gpuSharingConfig:
                          description: The configuration for GPU sharing options.
                          properties:
                            gpuSharingStrategy:
                              description: The type of GPU sharing strategy to enable
                                on the GPU node.
                              type: string
                            maxSharedClientsPerGpu:
                              description: The max number of containers that can share
                                a physical GPU.
                              format: int64
                              type: integer
                          type: object
                      type: object
                    type: array
                  advancedMachineFeatures:
                    description: Advanced features for the Compute Engine VM.
                    properties:
                      enableNestedVirtualization:
                        description: Whether or not to enable nested virtualization
                          (defaults to false).
                        type: boolean
                      performanceMonitoringUnit:
                        description: |-
                          Type of Performance Monitoring Unit (PMU) requested on node pool instances.
                           If unset, PMU will not be available to the node.
                        type: string
                      threadsPerCore:
                        description: |-
                          The number of threads per physical core. To disable simultaneous
                           multithreading (SMT) set this to 1. If unset, the maximum number of threads
                           supported per core by the underlying processor is assumed.
                        format: int64
                        type: integer
                    type: object
                  bootDisk:
                    description: The boot disk configuration for the node pool.
                    properties:
                      diskType:
                        description: |-
                          Disk type of the boot disk.
                           (i.e. Hyperdisk-Balanced, PD-Balanced, etc.)
                        type: string
                      provisionedIops:
                        description: For Hyperdisk-Balanced only, the provisioned
                          IOPS config value.
                        format: int64
                        type: integer
                      provisionedThroughput:
                        description: For Hyperdisk-Balanced only, the provisioned
                          throughput config value.
                        format: int64
                        type: integer
                      sizeGB:
                        description: Disk size in GB. Replaces NodeConfig.disk_size_gb
                        format: int64
                        type: integer
                    type: object
                  bootDiskKMSKey:
                    description: |-
                      The Customer Managed Encryption Key used to encrypt the boot disk attached
                       to each node in the node pool. This should be of the form
                       projects/[KEY_PROJECT_ID]/locations/[LOCATION]/keyRings/[RING_NAME]/cryptoKeys/[KEY_NAME].
                       For more information about protecting resources with Cloud KMS Keys please
                       see:
                       https://cloud.google.com/compute/docs/disks/customer-managed-encryption
                    type: string
                  confidentialNodes:
                    description: |-
                      Confidential nodes config.
                       All the nodes in the node pool will be Confidential VM once enabled.
                    properties:
                      confidentialInstanceType:
                        description: Defines the type of technology used by the confidential
                          node.
                        type: string
                      enabled:
                        description: Whether Confidential Nodes feature is enabled.
                        type: boolean
                    type: object
                  containerdConfig:
                    description: Parameters for containerd customization.
                    properties:
                      privateRegistryAccessConfig:
                        description: |-
                          PrivateRegistryAccessConfig is used to configure access configuration
                           for private container registries.
                        properties:
                          certificateAuthorityDomainConfig:
                            description: Private registry access configuration.
                            items:
                              properties:
                                fqdns:
                                  description: |-
                                    List of fully qualified domain names (FQDN).
                                     Specifying port is supported.
                                     Wildcards are NOT supported.
                                     Examples:
                                     - my.customdomain.com
                                     - 10.0.1.2:5000
                                  items:
                                    type: string
                                  type: array
                                gcpSecretManagerCertificateConfig:
                                  description: Google Secret Manager (GCP) certificate
                                    configuration.
                                  properties:
                                    secretURI:
                                      description: |-
                                        Secret URI, in the form
                                         "projects/$PROJECT_ID/secrets/$SECRET_NAME/versions/$VERSION".
                                         Version can be fixed (e.g. "2") or "latest"
                                      type: string
                                  type: object
                              type: object
                            type: array
                          enabled:
                            description: Private registry access is enabled.
                            type: boolean
                        type: object
                    type: object
                  diskSizeGB:
                    description: |-
                      Size of the disk attached to each node, specified in GB.
                       The smallest allowed disk size is 10GB.

                       If unspecified, the default disk size is 100GB.
                    format: int32
                    type: integer
                  diskType:
                    description: |-
                      Type of the disk attached to each node (e.g. 'pd-standard', 'pd-ssd' or
                       'pd-balanced')

                       If unspecified, the default disk type is 'pd-standard'
                    type: string
                  enableConfidentialStorage:
                    description: Optional. Reserved for future use.
                    type: boolean
                  ephemeralStorageLocalSsdConfig:
                    description: |-
                      Parameters for the node ephemeral storage using Local SSDs.
                       If unspecified, ephemeral storage is backed by the boot disk.
                    properties:
                      dataCacheCount:
                        description: Number of local SSDs to use for GKE Data Cache.
                        format: int32
                        type: integer
                      localSsdCount:
                        description: |-
                          Number of local SSDs to use to back ephemeral storage. Uses NVMe
                           interfaces.

                           A zero (or unset) value has different meanings depending on machine type
                           being used:
                           1. For pre-Gen3 machines, which support flexible numbers of local ssds,
                           zero (or unset) means to disable using local SSDs as ephemeral storage. The
                           limit for this value is dependent upon the maximum number of disk
                           available on a machine per zone. See:
                           https://cloud.google.com/compute/docs/disks/local-ssd
                           for more information.
                           2. For Gen3 machines which dictate a specific number of local ssds, zero
                           (or unset) means to use the default number of local ssds that goes with
                           that machine type. For example, for a c3-standard-8-lssd machine, 2 local
                           ssds would be provisioned. For c3-standard-8 (which doesn't support local
                           ssds), 0 will be provisioned. See
                           https://cloud.google.com/compute/docs/disks/local-ssd#choose_number_local_ssds
                           for more info.
                        format: int32
                        type: integer
                    type: object
                  fastSocket:
                    description: Enable or disable NCCL fast socket for the node pool.
                    properties:
                      enabled:
                        description: Whether Fast Socket features are enabled in the
                          node pool.
                        type: boolean
                    type: object
                  flexStart:
                    description: Flex Start flag for enabling Flex Start VM.
                    type: boolean
                  gcfsConfig:
                    description: Google Container File System (image streaming) configs.
                    properties:
                      enabled:
                        description: Whether to use GCFS.
                        type: boolean
                    type: object
                  gvnic:
                    description: Enable or disable gvnic in the node pool.
                    properties:
                      enabled:
                        description: Whether gVNIC features are enabled in the node
                          pool.
                        type: boolean
                    type: object
                  imageType:
                    description: |-
                      The image type to use for this node. Note that for a given image type,
                       the latest version of it will be used. Please see
                       https://cloud.google.com/kubernetes-engine/docs/concepts/node-images
                       for available image types.
                    type: string
                  kubeletConfig:
                    description: Node kubelet configs.
                    properties:
                      allowedUnsafeSysctls:
                        description: |-
                          Optional. Defines a comma-separated allowlist of unsafe sysctls or sysctl
                           patterns (ending in `*`).

                           The unsafe namespaced sysctl groups are `kernel.shm*`, `kernel.msg*`,
                           `kernel.sem`, `fs.mqueue.*`, and `net.*`. Leaving this allowlist empty
                           means they cannot be set on Pods.

                           To allow certain sysctls or sysctl patterns to be set on Pods, list them
                           separated by commas.
                           For example: `kernel.msg*,net.ipv4.route.min_pmtu`.

                           See https://kubernetes.io/docs/tasks/administer-cluster/sysctl-cluster/
                           for more details.
                        items:
                          type: string
                        type: array
                      containerLogMaxFiles:
                        description: |-
                          Optional. Defines the maximum number of container log files that can be
                           present for a container. See
                           https://kubernetes.io/docs/concepts/cluster-administration/logging/#log-rotation

                           The value must be an integer between 2 and 10, inclusive.
                           The default value is 5 if unspecified.
                        format: int32
                        type: integer
                      containerLogMaxSize:
                        description: |-
                          Optional. Defines the maximum size of the container log file before it is
                           rotated. See
                           https://kubernetes.io/docs/concepts/cluster-administration/logging/#log-rotation

                           Valid format is positive number + unit, e.g. 100Ki, 10Mi. Valid units are
                           Ki, Mi, Gi.
                           The value must be between 10Mi and 500Mi, inclusive.

                           Note that the total container log size (container_log_max_size *
                           container_log_max_files) cannot exceed 1% of the total
                           storage of the node, to avoid disk pressure caused by log files.

                           The default value is 10Mi if unspecified.
                        type: string
                      cpuCfsQuota:
                        description: |-
                          Enable CPU CFS quota enforcement for containers that specify CPU limits.

                           This option is enabled by default which makes kubelet use CFS quota
                           (https://www.kernel.org/doc/Documentation/scheduler/sched-bwc.txt) to
                           enforce container CPU limits. Otherwise, CPU limits will not be enforced at
                           all.

                           Disable this option to mitigate CPU throttling problems while still having
                           your pods to be in Guaranteed QoS class by specifying the CPU limits.

                           The default value is 'true' if unspecified.
                        type: boolean
                      cpuCfsQuotaPeriod:
                        description: |-
                          Set the CPU CFS quota period value 'cpu.cfs_period_us'.

                           The string must be a sequence of decimal numbers, each with optional
                           fraction and a unit suffix, such as "300ms".
                           Valid time units are "ns", "us" (or "µs"), "ms", "s", "m", "h".
                           The value must be a positive duration.
                        type: string
                      cpuManagerPolicy:
                        description: |-
                          Control the CPU management policy on the node.
                           See
                           https://kubernetes.io/docs/tasks/administer-cluster/cpu-management-policies/

                           The following values are allowed.
                           * "none": the default, which represents the existing scheduling behavior.
                           * "static": allows pods with certain resource characteristics to be granted
                           increased CPU affinity and exclusivity on the node.
                           The default value is 'none' if unspecified.
                        type: string
                      evictionMaxPodGracePeriodSeconds:
                        description: |-
                          Optional. eviction_max_pod_grace_period_seconds is the maximum allowed
                           grace period (in seconds) to use when terminating pods in response to a
                           soft eviction threshold being met. This value effectively caps the Pod's
                           terminationGracePeriodSeconds value during soft evictions. Default: 0.
                           Range: [0, 300].
                        format: int32
                        type: integer
                      evictionMinimumReclaim:
                        description: |-
                          Optional. eviction_minimum_reclaim is a map of signal names to quantities
                           that defines minimum reclaims, which describe the minimum amount of a given
                           resource the kubelet will reclaim when performing a pod eviction while that
                           resource is under pressure.
                        properties:
                          imagefsAvailable:
                            description: |-
                              Optional. Minimum reclaim for eviction due to imagefs available signal.
                               Only take percentage value for now. Sample format: "10%". Must be <=10%.
                               See
                               https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
                            type: string
                          imagefsInodesFree:
                            description: |-
                              Optional. Minimum reclaim for eviction due to imagefs inodes free signal.
                               Only take percentage value for now. Sample format: "10%". Must be <=10%.
                               See
                               https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
                            type: string
                          memoryAvailable:
                            description: |-
                              Optional. Minimum reclaim for eviction due to memory available signal. Only
                               take percentage value for now. Sample format: "10%". Must be <=10%. See
                               https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
                            type: string
                          nodefsAvailable:
                            description: |-
                              Optional. Minimum reclaim for eviction due to nodefs available signal. Only
                               take percentage value for now. Sample format: "10%". Must be <=10%. See
                               https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
                            type: string
                          nodefsInodesFree:
                            description: |-
                              Optional. Minimum reclaim for eviction due to nodefs inodes free signal.
                               Only take percentage value for now. Sample format: "10%". Must be <=10%.
                               See
                               https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
                            type: string
                          pidAvailable:
                            description: |-
                              Optional. Minimum reclaim for eviction due to pid available signal. Only
                               take percentage value for now. Sample format: "10%". Must be <=10%. See
                               https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
                            type: string
                        type: object
                      evictionSoft:
                        description: |-
                          Optional. eviction_soft is a map of signal names to quantities that defines
                           soft eviction thresholds. Each signal is compared to its corresponding
                           threshold to determine if a pod eviction should occur.
                        properties:
                          imagefsAvailable:
                            description: |-
                              Optional. Amount of storage available on filesystem that container runtime
                               uses for storing images layers. If the container filesystem and image
                               filesystem are not separate, then imagefs can store both image layers and
                               writeable layers. Defines the amount of "imagefs.available" signal in
                               kubelet. Default is unset, if not specified in the kubelet config. It
                               takses percentage value for now. Sample format: "30%". Must be >= 15% and
                               <= 50%. See
                               https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
                            type: string
                          imagefsInodesFree:
                            description: |-
                              Optional. Amount of inodes available on filesystem that container runtime
                               uses for storing images layers. Defines the amount of "imagefs.inodesFree"
                               signal in kubelet. Default is unset, if not specified in the kubelet
                               config. Linux only. It takses percentage value for now. Sample format:
                               "30%". Must be >= 5% and <= 50%. See
                               https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
                            type: string
                          memoryAvailable:
                            description: |-
                              Optional. Memory available (i.e. capacity - workingSet), in bytes. Defines
                               the amount of "memory.available" signal in kubelet. Default is unset, if
                               not specified in the kubelet config. Format: positive number + unit, e.g.
                               100Ki, 10Mi, 5Gi. Valid units are Ki, Mi, Gi. Must be >= 100Mi and <= 50%
                               of the node's memory. See
                               https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
                            type: string
                          nodefsAvailable:
                            description: |-
                              Optional. Amount of storage available on filesystem that kubelet uses for
                               volumes, daemon logs, etc. Defines the amount of "nodefs.available" signal
                               in kubelet. Default is unset, if not specified in the kubelet config. It
                               takses percentage value for now. Sample format: "30%". Must be >= 10% and
                               <= 50%. See
                               https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
                            type: string
                          nodefsInodesFree:
                            description: |-
                              Optional. Amount of inodes available on filesystem that kubelet uses for
                               volumes, daemon logs, etc. Defines the amount of "nodefs.inodesFree" signal
                               in kubelet. Default is unset, if not specified in the kubelet config. Linux
                               only. It takses percentage value for now. Sample format: "30%". Must be >=
                               5% and <= 50%. See
                               https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
                            type: string
                          pidAvailable:
                            description: |-
                              Optional. Amount of PID available for pod allocation. Defines the amount of
                               "pid.available" signal in kubelet. Default is unset, if not specified in
                               the kubelet config. It takses percentage value for now. Sample format:
                               "30%". Must be >= 10% and <= 50%. See
                               https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
                            type: string
                        type: object
                      evictionSoftGracePeriod:
                        description: |-
                          Optional. eviction_soft_grace_period is a map of signal names to quantities
                           that defines grace periods for each soft eviction signal. The grace period
                           is the amount of time that a pod must be under pressure before an eviction
                           occurs.
                        properties:
                          imagefsAvailable:
                            description: |-
                              Optional. Grace period for eviction due to imagefs available signal. Sample
                               format: "10s". Must be >= 0. See
                               https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
                            type: string
                          imagefsInodesFree:
                            description: |-
                              Optional. Grace period for eviction due to imagefs inodes free signal.
                               Sample format: "10s". Must be >= 0. See
                               https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
                            type: string
                          memoryAvailable:
                            description: |-
                              Optional. Grace period for eviction due to memory available signal. Sample
                               format: "10s". Must be >= 0. See
                               https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
                            type: string
                          nodefsAvailable:
                            description: |-
                              Optional. Grace period for eviction due to nodefs available signal. Sample
                               format: "10s". Must be >= 0. See
                               https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
                            type: string
                          nodefsInodesFree:
                            description: |-
                              Optional. Grace period for eviction due to nodefs inodes free signal.
                               Sample format: "10s". Must be >= 0. See
                               https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
                            type: string
                          pidAvailable:
                            description: |-
                              Optional. Grace period for eviction due to pid available signal. Sample
                               format: "10s". Must be >= 0. See
                               https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#eviction-signals
                            type: string
                        type: object
                      imageGcHighThresholdPercent:
                        description: |-
                          Optional. Defines the percent of disk usage after which image garbage
                           collection is always run. The percent is calculated as this field value out
                           of 100.

                           The value must be between 10 and 85, inclusive and greater than
                           image_gc_low_threshold_percent.

                           The default value is 85 if unspecified.
                        format: int32
                        type: integer
                      imageGcLowThresholdPercent:
                        description: |-
                          Optional. Defines the percent of disk usage before which image garbage
                           collection is never run. Lowest disk usage to garbage collect to. The
                           percent is calculated as this field value out of 100.

                           The value must be between 10 and 85, inclusive and smaller than
                           image_gc_high_threshold_percent.

                           The default value is 80 if unspecified.
                        format: int32
                        type: integer
                      imageMaximumGcAge:
                        description: |-
                          Optional. Defines the maximum age an image can be unused before it is
                           garbage collected. The string must be a sequence of decimal numbers, each
                           with optional fraction and a unit suffix, such as "300s", "1.5h", and
                           "2h45m". Valid time units are "ns", "us" (or "µs"), "ms", "s", "m", "h".

                           The value must be a positive duration greater than image_minimum_gc_age
                           or "0s".

                           The default value is "0s" if unspecified, which disables this field,
                           meaning images won't be garbage collected based on being unused for too
                           long.
                        type: string
                      imageMinimumGcAge:
                        description: |-
                          Optional. Defines the minimum age for an unused image before it is garbage
                           collected.

                           The string must be a sequence of decimal numbers, each with optional
                           fraction and a unit suffix, such as "300s", "1.5h", and "2h45m". Valid time
                           units are "ns", "us" (or "µs"), "ms", "s", "m", "h".

                           The value must be a positive duration less than or equal to 2 minutes.

                           The default value is "2m0s" if unspecified.
                        type: string
                      insecureKubeletReadonlyPortEnabled:
                        description: Enable or disable Kubelet read only port.
                        type: boolean
                      maxParallelImagePulls:
                        description: |-
                          Optional. Defines the maximum number of image pulls in parallel.
                           The range is 2 to 5, inclusive.
                           The default value is 2 or 3 depending on the disk type.

                           See
                           https://kubernetes.io/docs/concepts/containers/images/#maximum-parallel-image-pulls
                           for more details.
                        format: int32
                        type: integer
                      memoryManager:
                        description: |-
                          Optional. Controls NUMA-aware Memory Manager configuration on the
                           node. For more information, see:
                           https://kubernetes.io/docs/tasks/administer-cluster/memory-manager/
                        properties:
                          policy:
                            description: |-
                              Controls the memory management policy on the Node.
                               See
                               https://kubernetes.io/docs/tasks/administer-cluster/memory-manager/#policies

                               The following values are allowed.
                               * "none"
                               * "static"
                               The default value is 'none' if unspecified.
                            type: string
                        type: object
                      podPidsLimit:
                        description: |-
                          Set the Pod PID limits. See
                           https://kubernetes.io/docs/concepts/policy/pid-limiting/#pod-pid-limits

                           Controls the maximum number of processes allowed to run in a pod. The value
                           must be greater than or equal to 1024 and less than 4194304.
                        format: int64
                        type: integer
                      singleProcessOomKill:
                        description: |-
                          Optional. Defines whether to enable single process OOM killer.
                           If true, will prevent the memory.oom.group flag from being set for
                           container cgroups in cgroups v2. This causes processes in the container to
                           be OOM killed individually instead of as a group.
                        type: boolean
                      topologyManager:
                        description: |-
                          Optional. Controls Topology Manager configuration on the node.
                           For more information, see:
                           https://kubernetes.io/docs/tasks/administer-cluster/topology-manager/
                        properties:
                          policy:
                            description: |-
                              Configures the strategy for resource alignment.
                               Allowed values are:

                               * none: the default policy, and does not perform any topology alignment.
                               * restricted: the topology manager stores the preferred NUMA node affinity
                               for the container, and will reject the pod if the affinity if not
                               preferred.
                               * best-effort: the topology manager stores the preferred NUMA node affinity
                               for the container. If the affinity is not preferred, the topology manager
                               will admit the pod to the node anyway.
                               * single-numa-node: the topology manager determines if the single NUMA node
                               affinity is possible. If it is, Topology Manager will store this and the
                               Hint Providers can then use this information when making the resource
                               allocation decision. If, however, this is not possible then the
                               Topology Manager will reject the pod from the node. This will result in a
                               pod in a Terminated state with a pod admission failure.

                               The default policy value is 'none' if unspecified.
                               Details about each strategy can be found
                               [here](https://kubernetes.io/docs/tasks/administer-cluster/topology-manager/#topology-manager-policies).
                            type: string
                          scope:
                            description: |-
                              The Topology Manager aligns resources in following scopes:

                               * container
                               * pod

                               The default scope is 'container' if unspecified.
                               See
                               https://kubernetes.io/docs/tasks/administer-cluster/topology-manager/#topology-manager-scopes
                            type: string
                        type: object
                    type: object
                  labels:
                    additionalProperties:
                      type: string
                    description: |-
                      The map of Kubernetes labels (key/value pairs) to be applied to each node.
                       These will added in addition to any default label(s) that
                       Kubernetes may apply to the node.
                       In case of conflict in label keys, the applied set may differ depending on
                       the Kubernetes version -- it's best to assume the behavior is undefined
                       and conflicts should be avoided.
                       For more information, including usage and the valid values, see:
                       https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
                    type: object
                  linuxNodeConfig:
                    description: Parameters that can be configured on Linux nodes.
                    properties:
                      cgroupMode:
                        description: cgroup_mode specifies the cgroup mode to be used
                          on the node.
                        type: string
                      hugepages:
                        description: Optional. Amounts for 2M and 1G hugepages
                        properties:
                          hugepageSize1g:
                            description: Optional. Amount of 1G hugepages
                            format: int32
                            type: integer
                          hugepageSize2m:
                            description: Optional. Amount of 2M hugepages
                            format: int32
                            type: integer
                        type: object
                      sysctls:
                        additionalProperties:
                          type: string
                        description: |-
                          The Linux kernel parameters to be applied to the nodes and all pods running
                           on the nodes.

                           The following parameters are supported.

                           net.core.busy_poll
                           net.core.busy_read
                           net.core.netdev_max_backlog
                           net.core.rmem_max
                           net.core.rmem_default
                           net.core.wmem_default
                           net.core.wmem_max
                           net.core.optmem_max
                           net.core.somaxconn
                           net.ipv4.tcp_rmem
                           net.ipv4.tcp_wmem
                           net.ipv4.tcp_tw_reuse
                           net.ipv4.tcp_max_orphans
                           net.netfilter.nf_conntrack_max
                           net.netfilter.nf_conntrack_buckets
                           net.netfilter.nf_conntrack_tcp_timeout_close_wait
                           net.netfilter.nf_conntrack_tcp_timeout_time_wait
                           net.netfilter.nf_conntrack_tcp_timeout_established
                           net.netfilter.nf_conntrack_acct
                           kernel.shmmni
                           kernel.shmmax
                           kernel.shmall
                           fs.aio-max-nr
                           fs.file-max
                           fs.inotify.max_user_instances
                           fs.inotify.max_user_watches
                           fs.nr_open
                           vm.dirty_background_ratio
                           vm.dirty_expire_centisecs
                           vm.dirty_ratio
                           vm.dirty_writeback_centisecs
                           vm.max_map_count
                           vm.overcommit_memory
                           vm.overcommit_ratio
                           vm.vfs_cache_pressure
                           vm.swappiness
                           vm.watermark_scale_factor
                           vm.min_free_kbytes
                        type: object
                      transparentHugepageDefrag:
                        description: |-
                          Optional. Defines the transparent hugepage defrag configuration on the
                           node. VM hugepage allocation can be managed by either limiting
                           defragmentation for delayed allocation or skipping it entirely for
                           immediate allocation only.

                           See https://docs.kernel.org/admin-guide/mm/transhuge.html
                           for more details.
                        type: string
                      transparentHugepageEnabled:
                        description: |-
                          Optional. Transparent hugepage support for anonymous memory can be entirely
                           disabled (mostly for debugging purposes) or only enabled inside
                           MADV_HUGEPAGE regions (to avoid the risk of consuming more memory
                           resources) or enabled system wide.

                           See https://docs.kernel.org/admin-guide/mm/transhuge.html
                           for more details.
                        type: string
                    type: object
                  localNvmeSsdBlockConfig:
                    description: Parameters for using raw-block Local NVMe SSDs.
                    properties:
                      localSsdCount:
                        description: |-
                          Number of local NVMe SSDs to use.  The limit for this value is dependent
                           upon the maximum number of disk available on a machine per zone. See:
                           https://cloud.google.com/compute/docs/disks/local-ssd
                           for more information.

                           A zero (or unset) value has different meanings depending on machine type
                           being used:
                           1. For pre-Gen3 machines, which support flexible numbers of local ssds,
                           zero (or unset) means to disable using local SSDs as ephemeral storage.
                           2. For Gen3 machines which dictate a specific number of local ssds, zero
                           (or unset) means to use the default number of local ssds that goes with
                           that machine type. For example, for a c3-standard-8-lssd machine, 2 local
                           ssds would be provisioned. For c3-standard-8 (which doesn't support local
                           ssds), 0 will be provisioned. See
                           https://cloud.google.com/compute/docs/disks/local-ssd#choose_number_local_ssds
                           for more info.
                        format: int32
                        type: integer
                    type: object
                  localSsdCount:
                    description: |-
                      The number of local SSD disks to be attached to the node.

                       The limit for this value is dependent upon the maximum number of
                       disks available on a machine per zone. See:
                       https://cloud.google.com/compute/docs/disks/local-ssd
                       for more information.
                    format: int32
                    type: integer
                  localSsdEncryptionMode:
                    description: |-
                      Specifies which method should be used for encrypting the
                       Local SSDs attached to the node.
                    type: string
                  loggingConfig:
                    description: Logging configuration.
                    properties:
                      variantConfig:
                        description: Logging variant configuration.
                        properties:
                          variant:
                            description: Logging variant deployed on nodes.
                            type: string
                        type: object
                    type: object
                  machineType:
                    description: |-
                      The name of a Google Compute Engine [machine
                       type](https://cloud.google.com/compute/docs/machine-types)

                       If unspecified, the default machine type is `e2-medium`.
                    type: string
                  maxRunDuration:
                    description: |-
                      The maximum duration for the nodes to exist.
                       If unspecified, the nodes can exist indefinitely.
                    type: string
                  metadata:
                    additionalProperties:
                      type: string
                    description: |-
                      The metadata key/value pairs assigned to instances in the cluster.

                       Keys must conform to the regexp `[a-zA-Z0-9-_]+` and be less than 128 bytes
                       in length. These are reflected as part of a URL in the metadata server.
                       Additionally, to avoid ambiguity, keys must not conflict with any other
                       metadata keys for the project or be one of the reserved keys:

                        - "cluster-location"
                        - "cluster-name"
                        - "cluster-uid"
                        - "configure-sh"
                        - "containerd-configure-sh"
                        - "enable-os-login"
                        - "gci-ensure-gke-docker"
                        - "gci-metrics-enabled"
                        - "gci-update-strategy"
                        - "instance-template"
                        - "kube-env"
                        - "startup-script"
                        - "user-data"
                        - "disable-address-manager"
                        - "windows-startup-script-ps1"
                        - "common-psm1"
                        - "k8s-node-setup-psm1"
                        - "install-ssh-psm1"
                        - "user-profile-psm1"

                       Values are free-form strings, and only have meaning as interpreted by
                       the image running in the instance. The only restriction placed on them is
                       that each value's size must be less than or equal to 32 KB.

                       The total size of all keys and values must be less than 512 KB.
                    type: object
                  minCPUPlatform:
                    description: |-
                      Minimum CPU platform to be used by this instance. The instance may be
                       scheduled on the specified or newer CPU platform. Applicable values are the
                       friendly names of CPU platforms, such as
                       `minCpuPlatform: "Intel Haswell"` or
                       `minCpuPlatform: "Intel Sandy Bridge"`. For more
                       information, read [how to specify min CPU
                       platform](https://cloud.google.com/compute/docs/instances/specify-min-cpu-platform)
                    type: string
                  nodeGroup:
                    description: |-
                      Setting this field will assign instances of this
                       pool to run on the specified node group. This is useful for running
                       workloads on [sole tenant
                       nodes](https://cloud.google.com/compute/docs/nodes/sole-tenant-nodes).
                    type: string
                  oauthScopes:
                    description: |-
                      The set of Google API scopes to be made available on all of the
                       node VMs under the "default" service account.

                       The following scopes are recommended, but not required, and by default are
                       not included:

                       * `https://www.googleapis.com/auth/compute` is required for mounting
                       persistent storage on your nodes.
                       * `https://www.googleapis.com/auth/devstorage.read_only` is required for
                       communicating with **gcr.io**
                       (the [Google Container
                       Registry](https://cloud.google.com/container-registry/)).

                       If unspecified, no scopes are added, unless Cloud Logging or Cloud
                       Monitoring are enabled, in which case their required scopes will be added.
                    items:
                      type: string
                    type: array
                  preemptible:
                    description: |-
                      Whether the nodes are created as preemptible VM instances. See:
                       https://cloud.google.com/compute/docs/instances/preemptible
                       for more information about preemptible VM instances.
                    type: boolean
                  reservationAffinity:
                    description: |-
                      The optional reservation affinity. Setting this field will apply
                       the specified [Zonal Compute
                       Reservation](https://cloud.google.com/compute/docs/instances/reserving-zonal-resources)
                       to this node pool.
                    properties:
                      consumeReservationType:
                        description: Corresponds to the type of reservation consumption.
                        type: string
                      key:
                        description: |-
                          Corresponds to the label key of a reservation resource. To target a
                           SPECIFIC_RESERVATION by name, specify
                           "compute.googleapis.com/reservation-name" as the key and specify the name
                           of your reservation as its value.
                        type: string
                      values:
                        description: Corresponds to the label value(s) of reservation
                          resource(s).
                        items:
                          type: string
                        type: array
                    type: object
                  resourceLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      The resource labels for the node pool to use to annotate any related
                       Google Compute Engine resources.
                    type: object
                  resourceManagerTags:
                    description: A map of resource manager tag keys and values to
                      be attached to the nodes.
                    properties:
                      tags:
                        additionalProperties:
                          type: string
                        description: |-
                          TagKeyValue must be in one of the following formats ([KEY]=[VALUE])
                           1. `tagKeys/{tag_key_id}=tagValues/{tag_value_id}`
                           2. `{org_id}/{tag_key_name}={tag_value_name}`
                           3. `{project_id}/{tag_key_name}={tag_value_name}`
                        type: object
                    type: object
                  sandboxConfig:
                    description: Sandbox configuration for this node.
                    properties:
                      type:
                        description: Type of the sandbox to use for the node.
                        type: string
                    type: object
                  secondaryBootDiskUpdateStrategy:
                    description: Secondary boot disk update strategy.
                    type: object
                  secondaryBootDisks:
                    description: List of secondary boot disks attached to the nodes.
                    items:
                      properties:
                        diskImage:
                          description: Fully-qualified resource ID for an existing
                            disk image.
                          type: string
                        mode:
                          description: Disk mode (container image cache, etc.)
                          type: string
                      type: object
                    type: array
                  serviceAccount:
                    description: |-
                      The Google Cloud Platform Service Account to be used by the node VMs.
                       Specify the email address of the Service Account; otherwise, if no Service
                       Account is specified, the "default" service account is used.
                    type: string
                  shieldedInstanceConfig:
                    description: Shielded Instance options.
                    properties:
                      enableIntegrityMonitoring:
                        description: |-
                          Defines whether the instance has integrity monitoring enabled.

                           Enables monitoring and attestation of the boot integrity of the instance.
                           The attestation is performed against the integrity policy baseline. This
                           baseline is initially derived from the implicitly trusted boot image when
                           the instance is created.
                        type: boolean
                      enableSecureBoot:
                        description: |-
                          Defines whether the instance has Secure Boot enabled.

                           Secure Boot helps ensure that the system only runs authentic software by
                           verifying the digital signature of all boot components, and halting the
                           boot process if signature verification fails.
                        type: boolean
                    type: object
                  soleTenantConfig:
                    description: Parameters for node pools to be backed by shared
                      sole tenant node groups.
                    properties:
                      minNodeCpus:
                        description: |-
                          Optional. The minimum number of virtual CPUs this instance will consume
                           when running on a sole-tenant node. This field can only be set if the node
                           pool is created in a shared sole-tenant node group.
                        format: int32
                        type: integer
                      nodeAffinities:
                        description: NodeAffinities used to match to a shared sole
                          tenant node group.
                        items:
                          properties:
                            key:
                              description: Key for NodeAffinity.
                              type: string
                            operator:
                              description: Operator for NodeAffinity.
                              type: string
                            values:
                              description: Values for NodeAffinity.
                              items:
                                type: string
                              type: array
                          type: object
                        type: array
                    type: object
                  spot:
                    description: |-
                      Spot flag for enabling Spot VM, which is a rebrand of
                       the existing preemptible flag.
                    type: boolean
                  storagePools:
                    description: List of Storage Pools where boot disks are provisioned.
                    items:
                      type: string
                    type: array
                  tags:
                    description: |-
                      The list of instance tags applied to all nodes. Tags are used to identify
                       valid sources or targets for network firewalls and are specified by
                       the client during cluster or node pool creation. Each tag within the list
                       must comply with RFC1035.
                    items:
                      type: string
                    type: array
                  taints:
                    description: |-
                      List of kubernetes taints to be applied to each node.

                       For more information, including usage and the valid values, see:
                       https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
                    items:
                      properties:
                        effect:
                          description: Effect for taint.
                          type: string
                        key:
                          description: Key for taint.
                          type: string
                        value:
                          description: Value for taint.
                          type: string
                      type: object
                    type: array
                  windowsNodeConfig:
                    description: Parameters that can be configured on Windows nodes.
                    properties:
                      osVersion:
                        description: OSVersion specifies the Windows node config to
                          be used on the node.
                        type: string
                    type: object
                  workloadMetadataConfig:
                    description: The workload metadata configuration for this node.
                    properties:
                      mode:
                        description: |-
                          Mode is the configuration for how to expose metadata to workloads running
                           on the node pool.
                        type: string
                    type: object
                type: object
              etag:
                description: |-
                  This checksum is computed by the server based on the value of node pool
                   fields, and may be sent on update requests to ensure the client has an
                   up-to-date value before proceeding.
                type: string
              initialNodeCount:
                description: |-
                  The initial node count for the pool. You must ensure that your
                   Compute Engine [resource
                   quota](https://cloud.google.com/compute/quotas)
                   is sufficient for this number of instances. You must also have available
                   firewall and routes quota.
                format: int32
                type: integer
              location:
                description: The location of this resource.
                type: string
              locations:
                description: |-
                  The list of Google Compute Engine
                   [zones](https://cloud.google.com/compute/docs/zones#available)
                   in which the NodePool's nodes should be located.

                   If this value is unspecified during node pool creation, the
                   [Cluster.Locations](https://cloud.google.com/kubernetes-engine/docs/reference/rest/v1/projects.locations.clusters#Cluster.FIELDS.locations)
                   value will be used, instead.

                   Warning: changing node pool locations will result in nodes being added
                   and/or removed.
                items:
                  type: string
                type: array
              management:
                description: NodeManagement configuration for this NodePool.
                properties:
                  autoRepair:
                    description: |-
                      A flag that specifies whether the node auto-repair is enabled for the node
                       pool. If enabled, the nodes in this node pool will be monitored and, if
                       they fail health checks too many times, an automatic repair action will be
                       triggered.
                    type: boolean
                  autoUpgrade:
                    description: |-
                      A flag that specifies whether node auto-upgrade is enabled for the node
                       pool. If enabled, node auto-upgrade helps keep the nodes in your node pool
                       up to date with the latest release version of Kubernetes.
                    type: boolean
                  upgradeOptions:
                    description: Specifies the Auto Upgrade knobs for the node pool.
                    type: object
                type: object
              maxPodsConstraint:
                description: |-
                  The constraint on the maximum number of pods that can be run
                   simultaneously on a node in the node pool.
                properties:
                  maxPodsPerNode:
                    description: Constraint enforced on the max num of pods per node.
                    format: int64
                    type: integer
                type: object
              networkConfig:
                description: |-
                  Networking configuration for this NodePool. If specified, it overrides the
                   cluster-level defaults.
                properties:
                  additionalNodeNetworkConfigs:
                    description: |-
                      We specify the additional node networks for this node pool using this list.
                       Each node network corresponds to an additional interface
                    items:
                      properties:
                        network:
                          description: Name of the VPC where the additional interface
                            belongs
                          type: string
                        subnetwork:
                          description: Name of the subnetwork where the additional
                            interface belongs
                          type: string
                      type: object
                    type: array
                  additionalPodNetworkConfigs:
                    description: |-
                      We specify the additional pod networks for this node pool using this list.
                       Each pod network corresponds to an additional alias IP range for the node
                    items:
                      properties:
                        maxPodsPerNode:
                          description: The maximum number of pods per node which use
                            this pod network.
                          properties:
                            maxPodsPerNode:
                              description: Constraint enforced on the max num of pods
                                per node.
                              format: int64
                              type: integer
                          type: object
                        secondaryPodRange:
                          description: |-
                            The name of the secondary range on the subnet which provides IP address for
                             this pod range.
                          type: string
                        subnetwork:
                          description: Name of the subnetwork where the additional
                            pod network belongs.
                          type: string
                      type: object
                    type: array
                  createPodRange:
                    description: |-
                      Input only. Whether to create a new range for pod IPs in this node pool.
                       Defaults are provided for `pod_range` and `pod_ipv4_cidr_block` if they
                       are not specified.

                       If neither `create_pod_range` or `pod_range` are specified, the
                       cluster-level default (`ip_allocation_policy.cluster_ipv4_cidr_block`) is
                       used.

                       Only applicable if `ip_allocation_policy.use_ip_aliases` is true.

                       This field cannot be changed after the node pool has been created.
                    type: boolean
                  enablePrivateNodes:
                    description: |-
                      Whether nodes have internal IP addresses only.
                       If enable_private_nodes is not specified, then the value is derived from
                       [Cluster.NetworkConfig.default_enable_private_nodes][]
                    type: boolean
                  networkPerformanceConfig:
                    description: Network bandwidth tier configuration.
                    properties:
                      totalEgressBandwidthTier:
                        description: Specifies the total network bandwidth tier for
                          the NodePool.
                        type: string
                    type: object
                  podCIDROverprovisionConfig:
                    description: |-
                      [PRIVATE FIELD]
                       Pod CIDR size overprovisioning config for the nodepool.

                       Pod CIDR size per node depends on max_pods_per_node. By default, the value
                       of max_pods_per_node is rounded off to next power of 2 and we then double
                       that to get the size of pod CIDR block per node.
                       Example: max_pods_per_node of 30 would result in 64 IPs (/26).

                       This config can disable the doubling of IPs (we still round off to next
                       power of 2)
                       Example: max_pods_per_node of 30 will result in 32 IPs (/27) when
                       overprovisioning is disabled.
                    properties:
                      disable:
                        description: |-
                          Whether Pod CIDR overprovisioning is disabled.
                           Note: Pod CIDR overprovisioning is enabled by default.
                        type: boolean
                    type: object
                  podIPV4CIDRBlock:
                    description: |-
                      The IP address range for pod IPs in this node pool.

                       Only applicable if `create_pod_range` is true.

                       Set to blank to have a range chosen with the default size.

                       Set to /netmask (e.g. `/14`) to have a range chosen with a specific
                       netmask.

                       Set to a
                       [CIDR](https://en.wikipedia.org/wiki/Classless_Inter-Domain_Routing)
                       notation (e.g. `10.96.0.0/14`) to pick a specific range to use.

                       Only applicable if `ip_allocation_policy.use_ip_aliases` is true.

                       This field cannot be changed after the node pool has been created.
                    type: string
                  podRange:
                    description: |-
                      The ID of the secondary range for pod IPs.
                       If `create_pod_range` is true, this ID is used for the new range.
                       If `create_pod_range` is false, uses an existing secondary range with this
                       ID.

                       Only applicable if `ip_allocation_policy.use_ip_aliases` is true.

                       This field cannot be changed after the node pool has been created.
                    type: string
                type: object
              placementPolicy:
                description: Specifies the node placement policy.
                properties:
                  policyName:
                    description: |-
                      If set, refers to the name of a custom resource policy supplied by the
                       user. The resource policy must be in the same project and region as the
                       node pool. If not found, InvalidArgument error is returned.
                    type: string
                  tpuTopology:
                    description: |-
                      Optional. TPU placement topology for pod slice node pool.
                       https://cloud.google.com/tpu/docs/types-topologies#tpu_topologies
                    type: string
                  type:
                    description: The type of placement.
                    type: string
                type: object
              projectRef:
                description: The project that this resource belongs to.
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              queuedProvisioning:
                description: Specifies the configuration of queued provisioning.
                properties:
                  enabled:
                    description: |-
                      Denotes that this nodepool is QRM specific, meaning nodes can be only
                       obtained through queuing via the Cluster Autoscaler ProvisioningRequest
                       API.
                    type: boolean
                type: object
              resourceID:
                description: The ContainerNodePool name. If not given, the metadata.name
                  will be used.
                type: string
              upgradeSettings:
                description: Upgrade settings control disruption and speed of the
                  upgrade.
                properties:
                  blueGreenSettings:
                    description: Settings for blue-green upgrade strategy.
                    properties:
                      nodePoolSoakDuration:
                        description: |-
                          Time needed after draining entire blue pool. After this period, blue pool
                           will be cleaned up.
                        type: string
                      standardRolloutPolicy:
                        description: Standard policy for the blue-green upgrade.
                        properties:
                          batchNodeCount:
                            description: Number of blue nodes to drain in a batch.
                            format: int32
                            type: integer
                          batchPercentage:
                            description: |-
                              Percentage of the blue pool nodes to drain in a batch.
                               The range of this field should be (0.0, 1.0].
                            type: number
                          batchSoakDuration:
                            description: Soak time after each batch gets drained.
                              Default to zero.
                            type: string
                        type: object
                    type: object
                  maxSurge:
                    description: |-
                      The maximum number of nodes that can be created beyond the current size
                       of the node pool during the upgrade process.
                    format: int32
                    type: integer
                  maxUnavailable:
                    description: |-
                      The maximum number of nodes that can be simultaneously unavailable during
