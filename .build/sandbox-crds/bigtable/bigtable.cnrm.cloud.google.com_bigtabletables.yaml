                            format: byte
                            type: string
                        type: object
                      orderedCodeBytes:
                        description: User `OrderedCodeBytes` encoding.
                        type: object
                      singleton:
                        description: Use `Singleton` encoding.
                        type: object
                    type: object
                  fields:
                    description: The names and types of the fields in this struct.
                    items:
                      properties:
                        fieldName:
                          description: |-
                            The field name (optional). Fields without a `field_name` are considered
                             anonymous and cannot be referenced by name.
                          type: string
                        type:
                          description: The type of values in this field.
                          properties:
                            aggregateType:
                              description: Aggregate
                              properties:
                                hllppUniqueCount:
                                  description: HyperLogLogPlusPlusUniqueCount aggregator.
                                  type: object
                                inputType:
                                  description: |-
                                    Type of the inputs that are accumulated by this `Aggregate`, which must
                                     specify a full encoding.
                                     Use `AddInput` mutations to accumulate new inputs.
                                max:
                                  description: Max aggregator.
                                  type: object
                                min:
                                  description: Min aggregator.
                                  type: object
                                sum:
                                  description: Sum aggregator.
                                  type: object
                              type: object
                            arrayType:
                              description: Array
                              properties:
                                elementType:
                                  description: The type of the elements in the array.
                                    This must not be `Array`.
                              type: object
                            boolType:
                              description: Bool
                              type: object
                            bytesType:
                              description: Bytes
                              properties:
                                encoding:
                                  description: The encoding to use when converting
                                    to or from lower level types.
                                  properties:
                                    raw:
                                      description: Use `Raw` encoding.
                                      type: object
                                  type: object
                              type: object
                            dateType:
                              description: Date
                              type: object
                            enumType:
                              description: Enum
                              properties:
                                enumName:
                                  description: |-
                                    The fully qualified name of the protobuf enum message, including package.
                                     In the format of "foo.bar.EnumMessage".
                                  type: string
                                schemaBundleID:
                                  description: The ID of the schema bundle that this
                                    enum is defined in.
                                  type: string
                              type: object
                            float32Type:
                              description: Float32
                              type: object
                            float64Type:
                              description: Float64
                              type: object
                            int64Type:
                              description: Int64
                              properties:
                                encoding:
                                  description: The encoding to use when converting
                                    to or from lower level types.
                                  properties:
                                    bigEndianBytes:
                                      description: Use `BigEndianBytes` encoding.
                                      properties:
                                        bytesType:
                                          description: 'Deprecated: ignored if set.'
                                          properties:
                                            encoding:
                                              description: The encoding to use when
                                                converting to or from lower level
                                                types.
                                              properties:
                                                raw:
                                                  description: Use `Raw` encoding.
                                                  type: object
                                              type: object
                                          type: object
                                      type: object
                                    orderedCodeBytes:
                                      description: Use `OrderedCodeBytes` encoding.
                                      type: object
                                  type: object
                              type: object
                            mapType:
                              description: Map
                              properties:
                                keyType:
                                  description: |-
                                    The type of a map key.
                                     Only `Bytes`, `String`, and `Int64` are allowed as key types.
                                valueType:
                                  description: The type of the values in a map.
                              type: object
                            protoType:
                              description: Proto
                              properties:
                                messageName:
                                  description: |-
                                    The fully qualified name of the protobuf message, including package. In
                                     the format of "foo.bar.Message".
                                  type: string
                                schemaBundleID:
                                  description: The ID of the schema bundle that this
                                    proto is defined in.
                                  type: string
                              type: object
                            stringType:
                              description: String
                              properties:
                                encoding:
                                  description: The encoding to use when converting
                                    to or from lower level types.
                                  properties:
                                    utf8Bytes:
                                      description: Use `Utf8Bytes` encoding.
                                      type: object
                                    utf8Raw:
                                      description: 'Deprecated: if set, converts to
                                        an empty `utf8_bytes`.'
                                      type: object
                                  type: object
                              type: object
                            structType:
                              description: Struct
                            timestampType:
                              description: Timestamp
                              properties:
                                encoding:
                                  description: The encoding to use when converting
                                    to or from lower level types.
                                  properties:
                                    unixMicrosInt64:
                                      description: |-
                                        Encodes the number of microseconds since the Unix epoch using the
                                         given `Int64` encoding. Values must be microsecond-aligned.

                                         Compatible with:

                                          - Java `Instant.truncatedTo()` with `ChronoUnit.MICROS`
                                      properties:
                                        bigEndianBytes:
                                          description: Use `BigEndianBytes` encoding.
                                          properties:
                                            bytesType:
                                              description: 'Deprecated: ignored if
                                                set.'
                                              properties:
                                                encoding:
                                                  description: The encoding to use
                                                    when converting to or from lower
                                                    level types.
                                                  properties:
                                                    raw:
                                                      description: Use `Raw` encoding.
                                                      type: object
                                                  type: object
                                              type: object
                                          type: object
                                        orderedCodeBytes:
                                          description: Use `OrderedCodeBytes` encoding.
                                          type: object
                                      type: object
                                  type: object
                              type: object
                          type: object
                      type: object
                    type: array
                type: object
              tieredStorageConfig:
                description: |-
                  Rules to specify what data is stored in each storage tier.
                   Different tiers store data differently, providing different trade-offs
                   between cost and performance. Different parts of a table can be stored
                   separately on different tiers.
                   If a config is specified, tiered storage is enabled for this table.
                   Otherwise, tiered storage is disabled.
                   Only SSD instances can configure tiered storage.
                properties:
                  infrequentAccess:
                    description: |-
                      Rule to specify what data is stored in the infrequent access(IA) tier.
                       The IA tier allows storing more data per node with reduced performance.
                    properties:
                      includeIfOlderThan:
                        description: |-
                          Include cells older than the given age.
                           For the infrequent access tier, this value must be at least 30 days.
                        type: string
                    type: object
                type: object
            type: object
          status:
            description: BigtableTableStatus defines the config connector machine
              state of BigtableTable
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: |-
                        Unique, one-word, CamelCase reason for the condition's last
                        transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: A unique specifier for the BigtableTable resource in
                  GCP.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the Config Connector controller.
                  If this is equal to metadata.generation, then that means that the
                  current reported status reflects the most recent desired state of
                  the resource.
                format: int64
                type: integer
              observedState:
                description: ObservedState is the state of the resource as most recently
                  observed in GCP.
                properties:
                  restoreInfo:
                    description: |-
                      Output only. If this table was restored from another data source (e.g. a
                       backup), this field will be populated with information about the restore.
                    properties:
                      backupInfo:
                        description: |-
                          Information about the backup used to restore the table. The backup
                           may no longer exist.
                        properties:
                          backup:
                            description: Output only. Name of the backup.
                            type: string
                          endTime:
                            description: |-
                              Output only. This time that the backup was finished. Row data in the
                               backup will be no newer than this timestamp.
                            type: string
                          sourceBackup:
                            description: |-
                              Output only. Name of the backup from which this backup was copied. If a
                               backup is not created by copying a backup, this field will be empty. Values
                               are of the form:
                               projects/<project>/instances/<instance>/clusters/<cluster>/backups/<backup>
                            type: string
                          sourceTable:
                            description: Output only. Name of the table the backup
                              was created from.
                            type: string
                          startTime:
                            description: |-
                              Output only. The time that the backup was started. Row data in the backup
                               will be no older than this timestamp.
                            type: string
                        type: object
                      sourceType:
                        description: The type of the restore source.
                        type: string
                    type: object
                type: object
            type: object
