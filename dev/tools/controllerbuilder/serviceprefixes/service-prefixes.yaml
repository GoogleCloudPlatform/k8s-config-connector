# Approved service prefixes for KRM Kinds, one per GCP API. This file is
# maintained by hand.
#
# A Kind is <servicePrefix><resource type>, with the resource type (the type in
# google.api.resource) in the singular: logging + logging.googleapis.com/Settings
# gives LoggingSetting. So the service prefix is all that needs deciding, once
# per API.
#
# generate-types --prepopulate-resource checks every new resource against this
# file and service-prefix-exceptions.yaml: the Kind must be its API's
# servicePrefix followed by the singular resource type, and the API must be
# listed here (an API listed only in service-prefix-exceptions.yaml is pending
# approval, and its resources are refused). A resource whose API is in neither
# file is not checked. There is no override flag.
#
# Fields:
#   api            the API name: google.api.default_host without .googleapis.com
#                  (or the host of the resource type), e.g. sqladmin
#   title          the API's service config title, for reference
#   servicePrefix  the prefix of the API's Kinds
#   reason         optional: what was decided and where, e.g.
#                  "approved as proposed (PR #1234)"
#
# To approve a prefix proposed in service-prefix-exceptions.yaml, move its
# entry here (keeping or changing servicePrefix) and replace the reason with
# the decision.
