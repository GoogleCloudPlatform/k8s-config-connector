# Approved service prefixes for KRM Kinds, one per GCP API. This file is
# maintained by hand. Together with service-prefix-pending.yaml it is the only
# list of service prefixes; tests/apichecks and
# hack/tools/greenfield/calculate_coverage.py both read it.
#
# A Kind is <servicePrefix><proto message>, with the acronyms in
# acronyms.yaml applied to the message: sqladmin
# + BackupRun gives SQLAdminBackupRun. So the service prefix is all that needs
# deciding, once per API.
#
# TestKindNamesFollowServicePrefixes in tests/apichecks checks every
# --resource <Kind>:<Message> of generate-types in apis/*/generate.sh against
# this file and service-prefix-pending.yaml: the API (found from the --service
# package in protoPackages) must be listed here, not only in
# service-prefix-pending.yaml, and the Kind must be its servicePrefix followed
# by the message. Existing violations are in
# tests/apichecks/testdata/exceptions/kind_name_violations.txt.
#
# Fields:
#   api            the API name: google.api.default_host without .googleapis.com
#                  (or the host of the resource type), e.g. sqladmin
#   title          the API's service config title, for reference
#   servicePrefix  the prefix of the API's Kinds
#   protoPackages  the API's proto packages that apis/*/generate.sh passes to
#                  --service, e.g. google.cloud.sql.v1; each package belongs to
#                  one API. tests/apichecks TestKindNamesFollowServicePrefixes
#                  uses it to find the API of each generated Kind
#   reason         optional: what was decided and where, e.g.
#                  "approved as proposed (PR #1234)"
#
# To approve a prefix proposed in service-prefix-pending.yaml, move its
# entry here (keeping or changing servicePrefix) and replace the reason with
# the decision.
