# Acronym and casing corrections for the words of a proto message name, used
# to build a Kind from <servicePrefix><message> (see service-prefixes.yaml):
# UrlMap gives URLMap, TensorboardExperiment gives TensorBoardExperiment. A
# word is replaced only when it matches a key whole, so Apis and Rapid are left
# alone.
#
# Read by TestKindNamesFollowServicePrefixes in tests/apichecks and by
# hack/tools/greenfield/calculate_coverage.py. Keep to the flat
# "  Word: Replacement" format below; calculate_coverage.py parses it without a
# YAML library.
acronyms:
  Rag: RAG
  Ces: CES
  Hsm: HSM
  Qa: QA
  Qna: QnA
  Dlp: DLP
  Aws: AWS
  Iap: IAP
  Dvr: DVR
  Acl: ACL
  Lfp: LFP
  Kms: KMS
  Vpc: VPC
  Url: URL
  Lb: LB
  Odb: ODB
  Saas: SaaS
  Slm: SLM
  Tpu: TPU
  Vod: VOD
  Dns: DNS
  Cdn: CDN
  Ekm: EKM
  Hcx: HCX
  Ipam: IPAM
  Gke: GKE
  Api: API
  Db: DB
  Vm: VM
  Vpn: VPN
  Ssl: SSL
  Http: HTTP
  Https: HTTPS
  Tls: TLS
  Grpc: GRPC
  Ssh: SSH
  Nat: NAT
  Ca: CA
  Tcp: TCP
  Gcp: GCP
