# Proposed service prefixes waiting for approval. This file is maintained by
# hand; approved prefixes are in service-prefixes.yaml.
#
# TestKindNamesFollowServicePrefixes in tests/apichecks reports every Kind of an
# API listed here as pending until its prefix is approved. To approve, move the
# entry to
# service-prefixes.yaml (keeping or changing servicePrefix) and replace the
# reason with the decision, e.g. "approved as proposed (PR #1234)" or
# "title does not contain the API name; casing agreed in PR #1234".
#
# To propose a prefix for a new API, add an entry here. The prefix rule: the
# API name (google.api.default_host without .googleapis.com) kept verbatim,
# including "Cloud" and "Admin", with word boundaries and casing from the
# service config title; an API that already has KCC Kinds keeps the prefix
# those Kinds use.
#
# Fields:
#   api            the API name, e.g. lustre
#   title          the API's service config title, for reference
#   servicePrefix  the proposed prefix
#   protoPackages  the API's proto packages that apis/*/generate.sh passes to
#                  --service, e.g. google.cloud.sql.v1; each package belongs to
#                  one API. tests/apichecks TestKindNamesFollowServicePrefixes
#                  uses it to find the API of each generated Kind
#   reason         required: why the API needs a decision
services:
  - api: accessapproval
    title: Access Approval API
    servicePrefix: AccessApproval
    reason: new API with no KCC Kinds yet
  - api: advisorynotifications
    title: Advisory Notifications API
    servicePrefix: AdvisoryNotifications
    reason: new API with no KCC Kinds yet
  - api: baremetalsolution
    title: Bare Metal Solution API
    servicePrefix: BareMetalSolution
    reason: new API with no KCC Kinds yet
  - api: ces
    title: Customer Engagement Suite API
    servicePrefix: CES
    protoPackages:
      - google.cloud.ces.v1
      - google.cloud.ces.v1beta
    reason: existing Kinds disagree on casing (CesAgent, CESApp); decide which one new Kinds use
  - api: cloudcommerceconsumerprocurement
    title: Cloud Commerce Consumer Procurement API
    servicePrefix: CloudCommerceConsumerProcurement
    reason: API name starts with cloud; new API with no KCC Kinds yet
  - api: cloudcontrolspartner
    title: Cloud Controls Partner API
    servicePrefix: Cloudcontrolspartner
    protoPackages:
      - google.cloud.cloudcontrolspartner.v1
    reason: Decide whether new Kinds use ControlsPartner or follow the existing names.
  - api: cloudiot
    title: Cloud IoT API
    servicePrefix: CloudIoT
    reason: existing Kinds (CloudIOTDevice, CloudIOTDeviceRegistry) use CloudIOT, but the title casing gives CloudIoT; decide whether new Kinds use CloudIoT or follow the existing names
  - api: cloudquotas
    title: Cloud Quotas API
    servicePrefix: CloudQuotas
    protoPackages:
      - google.api.cloudquotas.v1beta
    reason: existing Kinds (APIQuotaAdjusterSettings, APIQuotaPreference) use APIQuota, which is not the API name; decide whether new Kinds use CloudQuotas or APIQuota
  - api: containeranalysis
    title: Container Analysis API
    servicePrefix: ContainerAnalysis
    protoPackages:
      - grafeas.v1
    reason: existing Kinds use two prefixes (ContainerAnalysisNote, ContainerAnalysisOccurrence; GrafeasNote from the grafeas.v1 protos, whose default host is containeranalysis); decide which one new Kinds use
  - api: datamigration
    title: Database Migration API
    servicePrefix: CloudDMS
    protoPackages:
      - google.cloud.clouddms.v1
    reason: existing Kinds use four prefixes (CloudDMSConversionWorkspace, CloudDMSMigrationJob, CloudDMSPrivateConnection; DatabaseMigrationConversionWorkspace, DatabaseMigrationMigrationJob, DatabaseMigrationPrivateConnection; DatamigrationConnectionProfile; DataMigrationMappingRule); decide which one new Kinds use
  - api: domains
    title: Cloud Domains API
    servicePrefix: Domains
    reason: single-word API name; new API with no KCC Kinds yet
  - api: gkemulticloud
    title: GKE Multi-Cloud API
    servicePrefix: GKEMultiCloud
    protoPackages:
      - google.cloud.gkemulticloud.v1
    reason: existing Kinds disagree on casing (GKEMultiCloudAWSNodePool, GKEMultiCloudAzureClient, GKEMultiCloudAzureNodePool; GKEMulticloudAttachedCluster); decide which one new Kinds use
  - api: issuerswitch
    title: Issuer switch API
    servicePrefix: IssuerSwitch
    reason: new API with no KCC Kinds yet
  - api: kmsinventory
    title: KMS Inventory API
    servicePrefix: KMSInventory
    reason: new API with no KCC Kinds yet
  - api: lustre
    title: Google Cloud Managed Lustre API
    servicePrefix: Lustre
    reason: single-word API name; new API with no KCC Kinds yet
  - api: managedidentities
    title: Managed Service for Microsoft Active Directory API
    servicePrefix: Managedidentities
    reason: API name words not found in the title; new API with no KCC Kinds yet
  - api: policysimulator
    title: Policy Simulator API
    servicePrefix: PolicySimulator
    reason: new API with no KCC Kinds yet
  - api: recommender
    title: Recommender API
    servicePrefix: Recommender
    reason: single-word API name; new API with no KCC Kinds yet
  - api: serviceusage
    title: Service Usage API
    servicePrefix: ServiceUsage
    protoPackages:
      - google.api.serviceusage.v1beta1
    reason: existing Kinds are mixed (ServiceUsageConsumerQuotaOverride; Service and ServiceIdentity have no prefix); decide whether new Kinds use ServiceUsage
  - api: sqladmin
    title: Cloud SQL Admin API
    servicePrefix: SQLAdmin
    protoPackages:
      - google.cloud.sql.v1
      - google.cloud.sql.v1beta4
    reason: existing Kinds use two prefixes (SQLDatabase, SQLInstance, SQLSSLCert, SQLUser; SQLAdminBackup); decide whether new Kinds use SQLAdmin or SQL
  - api: timeseriesinsights
    title: Timeseries Insights API
    servicePrefix: TimeseriesInsights
    reason: new API with no KCC Kinds yet
  - api: workflowexecutions
    title: Workflow Executions API
    servicePrefix: WorkflowExecutions
    protoPackages:
      - google.cloud.workflows.executions.v1
    reason: existing Kind WorkflowsExecution uses Workflows (the workflows API's prefix), not the API name; decide whether new Kinds use WorkflowExecutions or Workflows
  - api: workstations
    title: Cloud Workstations API
    servicePrefix: Workstations
    protoPackages:
      - google.cloud.workstations.v1
    reason: existing Kinds (Workstation, WorkstationCluster, WorkstationConfig) have no service prefix; decide whether new Kinds use Workstations or follow the existing names
