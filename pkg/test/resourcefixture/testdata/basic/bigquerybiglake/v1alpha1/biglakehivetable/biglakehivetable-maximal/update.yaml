apiVersion: bigquerybiglake.cnrm.cloud.google.com/v1alpha1
kind: BigLakeHiveTable
metadata:
  name: biglakehivetable-max-${uniqueId}
spec:
  parentRef:
    name: biglakehivedatabase-max-${uniqueId}
  resourceID: biglakehivetable_max_${uniqueId}
  description: Updated Maximal BigLake Hive Table
  parameters:
    owner: kcc-test-updated
    environment: production
  partitionKeys:
  - name: date
    type: string
    comment: Partition by date updated
  storageDescriptor:
    locationURI: gs://${projectId}-hivetbl-max-${uniqueId}/tables/table1
    inputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
    outputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
    compressed: false
    numBuckets: 8
    bucketCols:
    - user_id
    sortCols:
    - col: user_id
      order: 0
    parameters:
      key: updated_value
    serdeInfo:
      name: parquet_serde
      serializationLib: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
      description: Updated Parquet SerDe
      parameters:
        serde_param: updated_serde_val
      serdeType: HIVE
    columns:
    - name: user_id
      type: int
      comment: User identifier
    - name: data
      type: string
      comment: Payload data updated
    - name: extra
      type: string
      comment: Added column
