apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  name: dfwc-sa-${uniqueId}
spec:
  displayName: Dataform Workflow Config SA
---
apiVersion: dataform.cnrm.cloud.google.com/v1beta1
kind: DataformRepository
metadata:
  name: dfwc-repo-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  region: us-central1
---
apiVersion: dataform.cnrm.cloud.google.com/v1alpha1
kind: DataformReleaseConfig
metadata:
  name: dfwc-rc-${uniqueId}
spec:
  repositoryRef:
    name: dfwc-repo-${uniqueId}
  gitCommitish: main
