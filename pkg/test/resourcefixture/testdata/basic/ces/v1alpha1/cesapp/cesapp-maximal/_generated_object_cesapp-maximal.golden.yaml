apiVersion: ces.cnrm.cloud.google.com/v1alpha1
kind: CESApp
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 2
  labels:
    cnrm-test: "true"
  name: cesapp-maximal-${uniqueId}
  namespace: ${uniqueId}
spec:
  audioProcessingConfig:
    ambientSoundConfig:
      prebuiltAmbientSound: office_1
      volumeGainDb: 0
    bargeInConfig:
      bargeInAwareness: true
    inactivityTimeout: 10s
  defaultChannelProfile:
    channelType: API
    profileID: default-api
  description: Updated maximal test fixture for CESApp
  displayName: cesapp-max-updated-${uniqueId}
  errorHandlingSettings:
    errorHandlingStrategy: FALLBACK_RESPONSE
  evaluationMetricsThresholds:
    goldenHallucinationMetricBehavior: ENABLED
    scenarioHallucinationMetricBehavior: ENABLED
  globalInstruction: You are an updated customer service representative.
  languageSettings:
    defaultLanguageCode: en-US
    enableMultilingualSupport: true
    supportedLanguageCodes:
    - es-ES
  location: us
  loggingSettings:
    cloudLoggingSettings:
      enableCloudLogging: true
    conversationLoggingSettings:
      disableConversationLogging: false
      retentionWindow: 86400s
  metadata:
    env: prod
  modelSettings:
    temperature: 0.5
  pinned: false
  projectRef:
    external: projects/${projectId}
  timeZoneSettings:
    timeZone: America/Chicago
  toolExecutionMode: PARALLEL
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/locations/us/apps/cesapp-maximal-${uniqueId}
  observedGeneration: 2
  observedState:
    createTime: "1970-01-01T00:00:00Z"
    etag: abcdef123456
    predefinedVariableDeclarations:
    - description: Current time represented in the ISO 8601 format along with its
        corresponding IANA Time Zone.
      name: current_date
      schema: {}
    - description: Contains session specific variables like modality, channel, recording
        control, and language code.
      name: _session
      schema: {}
    updateTime: "1970-01-01T00:00:00Z"
