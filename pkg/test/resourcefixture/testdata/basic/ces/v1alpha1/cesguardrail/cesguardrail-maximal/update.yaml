apiVersion: ces.cnrm.cloud.google.com/v1alpha1
kind: CESGuardrail
metadata:
  name: cesguardrail-maximal-${uniqueId}
spec:
  resourceID: cesguardrail-max-${uniqueId}
  parentRef:
    name: cesapp-${uniqueId}
  displayName: cesguardrail-max-updated-${uniqueId}
  description: Updated maximal CESGuardrail for testing
  enabled: false
  action:
    respondImmediately:
      responses:
        - text: Updated blocked content response.
          disabled: true
  contentFilter:
    matchType: SIMPLE_STRING_MATCH
    disregardDiacritics: false
    bannedContents:
      - banned_general_updated
    bannedContentsInUserInput:
      - banned_user_updated
    bannedContentsInAgentResponse:
      - banned_agent_updated
