apiVersion: ces.cnrm.cloud.google.com/v1alpha1
kind: CESDeployment
metadata:
  name: cesdeployment-maximal-${uniqueId}
spec:
  resourceID: cesdep-max-${uniqueId}
  parentRef:
    name: cesapp-${uniqueId}
  displayName: cesdeployment-max-updated-${uniqueId}
  appVersionRef:
    external: projects/${projectId}/locations/us/apps/cesapp-${uniqueId}/versions/-
  channelProfile:
    profileID: web-widget-profile
    channelType: WEB_UI
    personaProperty:
      persona: CHATTY
    disableDtmf: true
    disableBargeInControl: true
    noiseSuppressionLevel: high
    webWidgetConfig:
      modality: CHAT_ONLY
      theme: DARK
      webWidgetTitle: Updated Customer Support Widget
      securitySettings:
        enablePublicAccess: false
        enableOriginCheck: true
        allowedOrigins:
          - https://updated.example.com
        enableRecaptcha: false
