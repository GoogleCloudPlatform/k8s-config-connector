apiVersion: ces.cnrm.cloud.google.com/v1alpha1
kind: CESToolset
metadata:
  name: cestoolset-maximal-${uniqueId}
spec:
  parentRef:
    name: cesapp-${uniqueId}
  resourceID: cestoolset-max-${uniqueId}
  displayName: cestoolset-maximal-updated-${uniqueId}
  description: Updated maximal CESToolset fixture
  executionType: SYNCHRONOUS
  toolFakeConfig:
    enableFakeMode: false
    codeBlock:
      pythonCode: |
        def fake_tool_call(tool, input, callback_context):
          return None
  openAPIToolset:
    ignoreUnknownFields: false
    apiAuthentication:
      bearerTokenConfig:
        token: "$context.variables.updated_auth_token"
    openAPISchema: |
      openapi: 3.0.0
      info:
        title: Maximal Toolset API Updated
        version: 1.0.1
      servers:
        - url: https://api.example.com
      paths:
        /items:
          get:
            operationId: listItems
            summary: List items updated
            responses:
              '200':
                description: Successful updated response
