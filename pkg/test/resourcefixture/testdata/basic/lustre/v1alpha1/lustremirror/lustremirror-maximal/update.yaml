apiVersion: lustre.cnrm.cloud.google.com/v1alpha1
kind: LustreMirror
metadata:
  name: lustremirror-maximal-${uniqueId}
  labels:
    env: dev
    team: beta
spec:
  resourceID: lustremirror-maximal-${uniqueId}
  parentRef:
    name: lustreinstance-dep-${uniqueId}
  direction: FROM_CLOUD_STORAGE
  gcsPath:
    uri: gs://${projectId}-lmax-${uniqueId}/
  lustrePath:
    path: /
  deletedFilesRetained: true
  description: "Maximal updated description"
