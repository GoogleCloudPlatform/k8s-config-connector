apiVersion: lustre.cnrm.cloud.google.com/v1alpha1
kind: LustreInstance
metadata:
  labels:
    env: test
  name: lustreinstance-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1-a
  filesystem: testfs
  capacityGib: 36000
  perUnitStorageThroughput: 250
  networkRef:
    name: computenetwork-${uniqueId}
  description: Basic Lustre instance
