apiVersion: lustre.cnrm.cloud.google.com/v1alpha1
kind: LustreInstance
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 2
  labels:
    cnrm-test: "true"
    env: staging
  name: lustreinstance-${uniqueId}
  namespace: ${uniqueId}
spec:
  capacityGib: 36000
  description: Updated Lustre instance
  filesystem: testfs
  location: us-central1-a
  networkRef:
    name: ${networkID}
  perUnitStorageThroughput: 250
  projectRef:
    external: ${projectId}
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/locations/us-central1-a/instances/lustreinstance-${uniqueId}
  observedGeneration: 2
  observedState:
    createTime: "1970-01-01T00:00:00Z"
    mountPoint: 10.0.0.2@tcp:/testfs
    state: ACTIVE
    updateTime: "1970-01-01T00:00:00Z"
