apiVersion: contactcenterinsights.cnrm.cloud.google.com/v1alpha1
kind: CCInsightsPhraseMatcher
metadata:
  name: pmmin${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  type: ANY_OF
  phraseMatchRuleGroups:
  - type: ANY_OF
    phraseMatchRules:
    - query: "hello"
      config:
        exactMatchConfig:
          caseSensitive: false
