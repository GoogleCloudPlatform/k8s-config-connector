apiVersion: contactcenterinsights.cnrm.cloud.google.com/v1alpha1
kind: CCInsightsAnalysisRule
metadata:
  name: armax${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  displayName: "Updated Maximal Analysis Rule ${uniqueId}"
  conversationFilter: 'agent_id="agent-2"'
  analysisPercentage: 0.8
  active: false
  annotatorSelector:
    runInterruptionAnnotator: false
    runSilenceAnnotator: false
    runPhraseMatcherAnnotator: false
    runSentimentAnnotator: false
    runEntityAnnotator: false
    runIntentAnnotator: false
    runIssueModelAnnotator: false
    runSummarizationAnnotator: true
    summarizationConfig:
      summarizationModel: BASELINE_MODEL_V2_0
    runQaAnnotator: false
