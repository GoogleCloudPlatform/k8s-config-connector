apiVersion: websecurityscanner.cnrm.cloud.google.com/v1alpha1
kind: WebSecurityScannerScanConfig
metadata:
  name: websecurityscannerscanconfig-maximal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  displayName: websecurityscannerscanconfig-maximal-${uniqueId}
  startingURLs:
  - https://${projectId}.appspot.com
  maxQps: 20
  userAgent: CHROME_LINUX
  riskLevel: NORMAL
  exportToSecurityCommandCenter: ENABLED
  schedule:
    intervalDurationDays: 7
    scheduleTime: "2026-11-01T00:00:00Z"
  blacklistPatterns:
  - https://${projectId}.appspot.com/logout
  staticIPScan: false
  ignoreHTTPStatusErrors: false
