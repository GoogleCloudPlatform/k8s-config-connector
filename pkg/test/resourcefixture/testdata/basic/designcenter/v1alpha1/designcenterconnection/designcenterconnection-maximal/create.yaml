apiVersion: designcenter.cnrm.cloud.google.com/v1alpha1
kind: DesignCenterConnection
metadata:
  name: designcenterconnection-maximal-${uniqueId}
spec:
  parentRef:
    name: dc-comp-frontend-max-${uniqueId}
  destinationComponentRef:
    name: dc-comp-secret-max-${uniqueId}
  sourceComponentParameters:
    - key: service_account_project_roles
      value:
        listValue:
          values:
            - stringValue: roles/secretmanager.secretAccessor
