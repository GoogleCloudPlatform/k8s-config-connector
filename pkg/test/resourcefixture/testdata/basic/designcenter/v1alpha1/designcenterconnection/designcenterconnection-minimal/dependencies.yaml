apiVersion: designcenter.cnrm.cloud.google.com/v1alpha1
kind: DesignCenterSpace
metadata:
  name: dc-space-${uniqueId}
spec:
  projectRef:
    external: projects/${projectId}
  location: us-central1
  enableGCPSharedTemplates: true
---
apiVersion: designcenter.cnrm.cloud.google.com/v1alpha1
kind: DesignCenterApplicationTemplate
metadata:
  name: dc-app-template-${uniqueId}
spec:
  parentRef:
    name: dc-space-${uniqueId}
  compositionType: COMPOSITE
---
apiVersion: designcenter.cnrm.cloud.google.com/v1alpha1
kind: DesignCenterComponent
metadata:
  name: dc-comp-frontend-${uniqueId}
spec:
  parentRef:
    name: dc-app-template-${uniqueId}
  sharedTemplateRevisionURI: projects/gcpdesigncenter/locations/us-central1/spaces/googlespace/sharedTemplates/1b5e09c8-780f-484e-b8ed-c7178f4e4342/revisions/r-26
---
apiVersion: designcenter.cnrm.cloud.google.com/v1alpha1
kind: DesignCenterComponent
metadata:
  name: dc-comp-secret-${uniqueId}
spec:
  parentRef:
    name: dc-app-template-${uniqueId}
  sharedTemplateRevisionURI: projects/gcpdesigncenter/locations/us-central1/spaces/googlespace/sharedTemplates/33bdf948-a847-4f9d-b514-0b3ad17eefff/revisions/r-11
