apiVersion: managedkafka.cnrm.cloud.google.com/v1alpha1
kind: ManagedKafkaConnectCluster
metadata:
  name: connectcluster-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  clusterRef:
    name: managedkafkacluster-${uniqueId}
  capacityConfig:
    vcpuCount: 3
    memoryBytes: 3221225472
  gcpConfig:
    accessConfig:
      networkConfigs:
      - primarySubnetRef:
          name: computesubnetwork-${uniqueId}-1
        additionalSubnetRefs:
        - name: computesubnetwork-${uniqueId}-2
        dnsDomainNames:
        - "my-dns-domain.example.com"
  config:
    my-config-key: "my-updated-config-value"
  labels:
    my-label: "my-updated-value"
