apiVersion: vmwareengine.cnrm.cloud.google.com/v1alpha1
kind: VMwareEngineCluster
metadata:
  name: vmwareenginecluster-maximal-${uniqueId}
spec:
  parentRef:
    name: vmwareengineprivatecloud-maximal-${uniqueId}
  nodeTypeConfigs:
    standard-72:
      nodeTypeID: "standard-72"
      nodeCount: 3
  autoscalingSettings:
    autoscalingPolicies:
      policy-1:
        nodeTypeID: "standard-72"
        scaleOutSize: 1
        cpuThresholds:
          scaleOut: 85
          scaleIn: 25
        grantedMemoryThresholds:
          scaleOut: 85
          scaleIn: 25
        consumedMemoryThresholds:
          scaleOut: 85
          scaleIn: 25
        storageThresholds:
          scaleOut: 85
          scaleIn: 25
    minClusterNodeCount: 3
    maxClusterNodeCount: 10
    coolDownPeriod: "3600s"
