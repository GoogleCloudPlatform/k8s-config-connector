apiVersion: modelarmor.cnrm.cloud.google.com/v1alpha1
kind: ModelArmorFloorSetting
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 2
  labels:
    cnrm-test: "true"
  name: modelarmorfloorsetting-maximal-${uniqueId}
  namespace: ${uniqueId}
spec:
  aiPlatformFloorSetting:
    enableCloudLogging: false
    inspectAndBlock: true
  enableFloorSettingEnforcement: false
  filterConfig:
    maliciousURIFilterSettings:
      filterEnforcement: DISABLED
    piAndJailbreakFilterSettings:
      filterEnforcement: DISABLED
    raiSettings:
      raiFilters:
      - confidenceLevel: MEDIUM_AND_ABOVE
        filterType: SEXUALLY_EXPLICIT
    sdpSettings:
      basicConfig:
        filterEnforcement: DISABLED
  floorSettingMetadata:
    multiLanguageDetection:
      enableMultiLanguageDetection: false
  integratedServices:
  - AI_PLATFORM
  location: global
  projectRef:
    external: ${projectId}
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/locations/global/floorSetting
  observedGeneration: 2
  observedState:
    createTime: "1970-01-01T00:00:00Z"
    updateTime: "1970-01-01T00:00:00Z"
