apiVersion: modelarmor.cnrm.cloud.google.com/v1alpha1
kind: ModelArmorFloorSetting
metadata:
  name: floor-setting-block-${uniqueId}
spec:
  projectRef:
    external: ${PROJECT_ID}
  location: us-central1
  resourceID: floor-setting-block-${uniqueId}
  filterConfig:
    piAndJailbreakFilterSettings:
      filterEnforcement: ENFORCED
      confidenceLevel: LOW
    raiSettings:
      raiFilters:
      - filterType: SEXUALLY_EXPLICIT
        confidenceLevel: LOW
    maliciousURIFilterSettings:
      filterEnforcement: ENFORCED
    sdpSettings:
      basicConfig:
        filterEnforcement: ENFORCED
      advancedConfig:
        inspectTemplateRef:
          external: projects/${PROJECT_ID}/locations/us-central1/inspectTemplates/default
        deidentifyTemplateRef:
          external: projects/${PROJECT_ID}/locations/us-central1/deidentifyTemplates/default
  enableFloorSettingEnforcement: true
  integratedServices:
  - SERVICE_1
  aiPlatformFloorSetting:
    inspectAndBlock: true
    enableCloudLogging: true
  floorSettingMetadata:
    multiLanguageDetection:
      enableMultiLanguageDetection: true
