apiVersion: networksecurity.cnrm.cloud.google.com/v1alpha1
kind: NetworkSecuritySecurityProfile
metadata:
  name: sp-${uniqueId}
spec:
  projectRef:
    external: "projects/${projectId}"
  location: global
  type: URL_FILTERING
  description: "security profile description updated"
  labels:
    foo: baz
  urlFilteringProfile:
    urlFilters:
      - priority: 1
        filteringAction: "ALLOW"
        urls: [ "*example.com", "*about.example.com", "*help.example.com" ]
      - priority: 2
        filteringAction: "DENY"
        urls: ["*restricted.example.com"]