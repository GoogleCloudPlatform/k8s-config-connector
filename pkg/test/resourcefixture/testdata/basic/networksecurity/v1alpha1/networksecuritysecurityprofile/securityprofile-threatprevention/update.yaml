apiVersion: networksecurity.cnrm.cloud.google.com/v1alpha1
kind: NetworkSecuritySecurityProfile
metadata:
  name: sp-${uniqueId}
spec:
  projectRef:
    external: "projects/${projectId}"
  location: global
  type: THREAT_PREVENTION
  description: "security profile description updated"
  labels:
    foo: baz
  threatPreventionProfile:
    antivirusOverrides:
      - protocol: "FTP"
        action: "ALLOW"
    severityOverrides:
      - severity: "INFORMATIONAL"
        action: "ALERT"
    threatOverrides:
      - threatID: "1000001"
        action: "ALLOW"
