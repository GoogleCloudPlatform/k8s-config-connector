apiVersion: networksecurity.cnrm.cloud.google.com/v1alpha1
kind: NetworkSecurityMirroringEndpointGroup
metadata:
  name: mirroringeg-dep-${uniqueId}
spec:
  projectRef:
    external: "projects/${projectId}"
  location: global
  mirroringDeploymentGroupRef:
    external: "projects/${projectId}/locations/global/mirroringDeploymentGroups/my-mdg"
---
apiVersion: networksecurity.cnrm.cloud.google.com/v1alpha1
kind: NetworkSecuritySecurityProfile
metadata:
  name: sp-dep-${uniqueId}-cm
spec:
  projectRef:
    external: "projects/${projectId}"
  location: global
  type: CUSTOM_MIRRORING
  customMirroringProfile:
    mirroringEndpointGroupRef:
      name: mirroringeg-dep-${uniqueId}