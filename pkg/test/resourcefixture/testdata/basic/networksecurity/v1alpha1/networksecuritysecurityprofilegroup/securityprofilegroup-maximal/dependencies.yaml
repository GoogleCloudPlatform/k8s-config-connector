apiVersion: networksecurity.cnrm.cloud.google.com/v1alpha1
kind: NetworkSecuritySecurityProfile
metadata:
  name: sp-dep-${uniqueId}-tp
spec:
  projectRef:
    external: "projects/${projectId}"
  location: global
  type: THREAT_PREVENTION
---
apiVersion: networksecurity.cnrm.cloud.google.com/v1alpha1
kind: NetworkSecuritySecurityProfile
metadata:
  name: sp-dep-${uniqueId}-uf
spec:
  projectRef:
    external: "projects/${projectId}"
  location: global
  type: URL_FILTERING
  urlFilteringProfile:
    urlFilters:
      - priority: 1
        filteringAction: "ALLOW"
        urls: ["*example.com", "*about.example.com", "*help.example.com"]
