apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  name: producer-net-max-${uniqueId}
spec:
  autoCreateSubnetworks: false
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  name: consumer-net-max-${uniqueId}
spec:
  autoCreateSubnetworks: false
---
apiVersion: networksecurity.cnrm.cloud.google.com/v1alpha1
kind: NetworkSecurityMirroringDeploymentGroup
metadata:
  name: mirroringdg-max-${uniqueId}
spec:
  projectRef:
    external: "projects/${projectId}"
  location: global
  networkRef:
    name: producer-net-max-${uniqueId}
---
apiVersion: networksecurity.cnrm.cloud.google.com/v1alpha1
kind: NetworkSecurityMirroringEndpointGroup
metadata:
  name: mirroringeg-max-${uniqueId}
spec:
  projectRef:
    external: "projects/${projectId}"
  location: global
  mirroringDeploymentGroupRef:
    name: mirroringdg-max-${uniqueId}
