apiVersion: networksecurity.cnrm.cloud.google.com/v1alpha1
kind: NetworkSecurityInterceptDeployment
metadata:
  name: interceptdep-${uniqueId}
spec:
  projectRef:
    external: "projects/${projectId}"
  location: us-central1
  forwardingRuleRef:
    external: "projects/${projectId}/regions/us-central1/forwardingRules/my-fr-${uniqueId}"
  interceptDeploymentGroupRef:
    external: "projects/${projectId}/locations/global/interceptDeploymentGroups/my-dg-${uniqueId}"
