    external: "projects/${projectId}"
  location: us-central1-a
  forwardingRuleRef:
    external: "projects/${projectId}/regions/us-central1/forwardingRules/shared-fr"
  interceptDeploymentGroupRef:
    external: "projects/${projectId}/locations/global/interceptDeploymentGroups/shared-dg"
