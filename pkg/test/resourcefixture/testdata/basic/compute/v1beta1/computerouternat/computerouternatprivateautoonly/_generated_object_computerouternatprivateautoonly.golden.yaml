apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeRouterNAT
metadata:
  annotations:
    cnrm.cloud.google.com/management-conflict-prevention-policy: none
    cnrm.cloud.google.com/project-id: ${projectId}
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    cnrm-test: "true"
  name: computerouternat-${uniqueId}
  namespace: ${uniqueId}
spec:
  enableEndpointIndependentMapping: false
  endpointTypes:
  - ENDPOINT_TYPE_VM
  natIpAllocateOption: AUTO_ONLY
  region: us-central1
  routerRef:
    name: ${routerID}
  rules:
  - action:
      sourceNatActiveRangesRefs:
      - name: ${subnetworkID}
    description: private nat rule example
    match: nexthop.hub == 'https://networkconnectivity.googleapis.com/v1/projects/${projectId}/locations/global/hubs/networkconnectivityhub-${uniqueId}'
    ruleNumber: 100
  sourceSubnetworkIpRangesToNat: LIST_OF_SUBNETWORKS
  subnetwork:
  - sourceIpRangesToNat:
    - ALL_IP_RANGES
    subnetworkRef:
      name: ${subnetworkID}
  type: PRIVATE
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: 'Update call failed: error creating: creating ComputeRouterNAT projects/${projectId}/regions/us-central1/routers/${routerID}/computerouternat-${uniqueId}:
      googleapi: Error 400: Invalid value for field ''resource.nats[0].natIpAllocateOption'':
      ''AUTO_ONLY''. Setting natIpAllocateOption is unsupported with type=PRIVATE.'
    reason: UpdateFailed
    status: "False"
    type: Ready
  observedGeneration: 1
