apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeInstance
metadata:
  annotations:
    cnrm.cloud.google.com/allow-stopping-for-update: "true"
    cnrm.cloud.google.com/management-conflict-prevention-policy: none
    cnrm.cloud.google.com/project-id: ${projectId}
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 2
  labels:
    cnrm-test: "true"
    label-one: value-two
  name: ${instanceID}
  namespace: ${uniqueId}
spec:
  bootDisk:
    initializeParams:
      sourceImageRef:
        external: projects/cos-cloud/global/images/family/cos-121-lts
  machineType: n1-standard-1
  networkInterface:
  - networkIpRef:
      external: 10.128.0.43
    networkRef:
      name: default
  zone: us-central1-a
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  currentStatus: RUNNING
  instanceId: "1111111111111111"
  labelFingerprint: abcdef0123A=
  observedGeneration: 2
  selfLink: https://www.googleapis.com/compute/v1/projects/${projectId}/zones/us-central1-a/instances/${instanceID}
