# This ComputeReservation is created first as a dependency with optional/immutable
# fields populated (description, minCpuPlatform, specificReservationRequired, etc.).
# The primary resource (create.yaml) uses the same resourceID to test acquiring
# a brownfield reservation when optional immutable fields are omitted from spec.
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeReservation
metadata:
  annotations:
    alpha.cnrm.cloud.google.com/reconciler: "direct"
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
  name: computereservation-dep-${uniqueId}
spec:
  resourceID: computereservation-${uniqueId}
  description: Pre-existing compute reservation
  zone: us-central1-a
  specificReservationRequired: true
  specificReservation:
    count: 2
    instanceProperties:
      machineType: n1-standard-1
      minCpuPlatform: "Intel Sandy Bridge"
      localSsds:
        - interface: NVME
          diskSizeGb: 375
  shareSettings:
    shareType: LOCAL
