apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSecurityPolicy
metadata:
  name: computesecuritypolicy-${uniqueId}
  annotations:
    cnrm.cloud.google.com/state-into-spec: absent
spec:
  rule:
  - action: allow
    priority: 2147483647
    match:
      versionedExpr: SRC_IPS_V1
      config:
        srcIpRanges:
        - "*"
  - action: throttle
    priority: 1000
    match:
      versionedExpr: SRC_IPS_V1
      config:
        srcIpRanges:
        - 10.0.0.0/8
    rateLimitOptions:
      conformAction: allow
      exceedAction: deny(429)
      rateLimitThreshold:
        count: 100
        intervalSec: 60
      enforceOnKey: IP
  - action: throttle
    priority: 2000
    match:
      versionedExpr: SRC_IPS_V1
      config:
        srcIpRanges:
        - 192.168.0.0/16
    rateLimitOptions:
      conformAction: allow
      exceedAction: deny(429)
      rateLimitThreshold:
        count: 50
        intervalSec: 60
      enforceOnKeyConfigs:
      - enforceOnKeyType: HTTP_PATH
