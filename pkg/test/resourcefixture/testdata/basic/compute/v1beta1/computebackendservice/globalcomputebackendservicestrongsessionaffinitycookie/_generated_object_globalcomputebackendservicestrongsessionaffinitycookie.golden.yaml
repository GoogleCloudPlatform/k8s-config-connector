apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeBackendService
metadata:
  annotations:
    cnrm.cloud.google.com/management-conflict-prevention-policy: none
    cnrm.cloud.google.com/mutable-but-unreadable-fields: '{}'
    cnrm.cloud.google.com/observed-secret-versions: (removed)
    cnrm.cloud.google.com/project-id: ${projectId}
    cnrm.cloud.google.com/state-into-spec: absent
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 3
  labels:
    cnrm-test: "true"
  name: ${backendServiceID}
  namespace: ${uniqueId}
spec:
  healthChecks:
  - healthCheckRef:
      name: ${healthCheckID}
  loadBalancingScheme: EXTERNAL_MANAGED
  localityLbPolicy: ROUND_ROBIN
  location: global
  protocol: HTTP
  resourceID: ${backendServiceID}
  sessionAffinity: STRONG_COOKIE_AFFINITY
  strongSessionAffinityCookie:
    name: updated-session-cookie
    path: /updated
    ttl:
      nanos: 0
      seconds: 7200
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  creationTimestamp: "1970-01-01T00:00:00Z"
  fingerprint: abcdef0123A=
  generatedId: 1111111111111111
  observedGeneration: 3
  selfLink: https://www.googleapis.com/compute/v1/projects/${projectId}/global/backendServices/${backendServiceID}
