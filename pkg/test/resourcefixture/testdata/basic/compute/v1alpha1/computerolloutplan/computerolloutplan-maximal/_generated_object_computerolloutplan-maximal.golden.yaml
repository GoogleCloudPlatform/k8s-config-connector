apiVersion: compute.cnrm.cloud.google.com/v1alpha1
kind: ComputeRolloutPlan
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    cnrm-test: "true"
  name: ${rolloutPlanID}
  namespace: ${uniqueId}
spec:
  description: A maximal ComputeRolloutPlan test fixture
  locationScope: ZONAL
  projectRef:
    external: ${projectId}
  resourceID: ${rolloutPlanID}
  waves:
  - displayName: wave-1
    orchestrationOptions:
      delays:
      - delimiter: DELIMITER_LOCATION
        duration: 0s
        type: TYPE_OFFSET
      maxConcurrentLocations: 10
      maxConcurrentResourcesPerLocation: 10
    selectors:
    - locationSelector:
        includedLocations:
        - us-central1-a
    - resourceHierarchySelector:
        includedProjectRefs:
        - external: projects/${projectNumber}
    validation:
      timeBasedValidationMetadata:
        waitDuration: 0s
      type: time
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/global/rolloutPlans/${rolloutPlanID}
  observedGeneration: 1
  observedState:
    creationTimestamp: "1970-01-01T00:00:00Z"
    id: 1111111111111111
    kind: compute#rolloutPlan
    selfLink: https://www.googleapis.com/compute/v1/projects/${projectId}/global/rolloutPlans/${rolloutPlanID}
    selfLinkWithID: https://www.googleapis.com/compute/v1/projects/${projectId}/global/rolloutPlans/${rolloutPlanID}
    waves:
    - number: 1
