apiVersion: compute.cnrm.cloud.google.com/v1alpha1
kind: ComputeRolloutPlan
metadata:
  name: computerolloutplan-maximal-${uniqueId}
spec:
  resourceID: computerolloutplan-maximal-${uniqueId}
  projectRef:
    external: ${projectId}
  description: A maximal ComputeRolloutPlan test fixture
  locationScope: ZONAL
  waves:
    - displayName: wave-1
      orchestrationOptions:
        delays:
          - delimiter: DELIMITER_LOCATION
            duration: 0s
            type: TYPE_OFFSET
        maxConcurrentLocations: 10
        maxConcurrentResourcesPerLocation: 10
      selectors:
        - locationSelector:
            includedLocations:
              - us-central1-a
        - resourceHierarchySelector:
            includedProjectRefs:
              - external: projects/${projectNumber}
      validation:
        type: time
        timeBasedValidationMetadata:
          waitDuration: 0s
