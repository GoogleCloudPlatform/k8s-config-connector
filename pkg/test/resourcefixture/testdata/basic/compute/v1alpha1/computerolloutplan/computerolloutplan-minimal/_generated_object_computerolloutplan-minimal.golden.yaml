apiVersion: compute.cnrm.cloud.google.com/v1alpha1
kind: ComputeRolloutPlan
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    cnrm-test: "true"
  name: ${rolloutPlanID}
  namespace: ${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  waves:
  - selectors:
    - locationSelector:
        includedLocations:
        - us-central1-a
    validation:
      timeBasedValidationMetadata:
        waitDuration: 0s
      type: time
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/global/rolloutPlans/${rolloutPlanID}
  observedGeneration: 1
  observedState:
    creationTimestamp: "1970-01-01T00:00:00Z"
    id: 1111111111111111
    kind: compute#rolloutPlan
    selfLink: https://www.googleapis.com/compute/v1/projects/${projectId}/global/rolloutPlans/${rolloutPlanID}
    selfLinkWithID: https://www.googleapis.com/compute/v1/projects/${projectId}/global/rolloutPlans/${rolloutPlanID}
    waves:
    - number: 1
