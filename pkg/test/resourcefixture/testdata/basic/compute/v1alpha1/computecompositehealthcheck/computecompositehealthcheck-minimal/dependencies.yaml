apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeHealthCheck
metadata:
  annotations:
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
  name: hc-min-${uniqueId}
spec:
  location: us-central1
  checkIntervalSec: 10
  timeoutSec: 10
  tcpHealthCheck:
    port: 80
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeBackendService
metadata:
  annotations:
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
  name: bs-min-${uniqueId}
spec:
  location: us-central1
  loadBalancingScheme: INTERNAL
  protocol: TCP
  healthChecks:
    - healthCheckRef:
        name: hc-min-${uniqueId}
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeForwardingRule
metadata:
  annotations:
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
  name: fr-min-${uniqueId}
spec:
  location: us-central1
  loadBalancingScheme: INTERNAL
  allPorts: true
  ipProtocol: TCP
  networkRef:
    external: projects/${projectId}/global/networks/default
  subnetworkRef:
    external: projects/${projectId}/regions/us-central1/subnetworks/default
  backendServiceRef:
    name: bs-min-${uniqueId}
---
apiVersion: compute.cnrm.cloud.google.com/v1alpha1
kind: ComputeHealthAggregationPolicy
metadata:
  annotations:
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
  name: hap-min-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  policyType: BACKEND_SERVICE_POLICY
---
apiVersion: compute.cnrm.cloud.google.com/v1alpha1
kind: ComputeHealthSource
metadata:
  annotations:
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
  name: hs-min-1-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  sourceType: BACKEND_SERVICE
  healthAggregationPolicyRef:
    name: hap-min-${uniqueId}
  sources:
    - name: bs-min-${uniqueId}
