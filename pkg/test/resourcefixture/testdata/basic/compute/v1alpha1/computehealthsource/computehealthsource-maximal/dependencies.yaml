apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeHealthCheck
metadata:
  name: hc-max-${uniqueId}
spec:
  location: us-central1
  checkIntervalSec: 10
  timeoutSec: 10
  tcpHealthCheck:
    port: 80
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeBackendService
metadata:
  name: bs-max-${uniqueId}
spec:
  location: us-central1
  loadBalancingScheme: INTERNAL
  protocol: TCP
  healthChecks:
    - healthCheckRef:
        name: hc-max-${uniqueId}
---
apiVersion: compute.cnrm.cloud.google.com/v1alpha1
kind: ComputeHealthAggregationPolicy
metadata:
  name: hap-max-1-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  policyType: BACKEND_SERVICE_POLICY
---
apiVersion: compute.cnrm.cloud.google.com/v1alpha1
kind: ComputeHealthAggregationPolicy
metadata:
  name: hap-max-2-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  policyType: BACKEND_SERVICE_POLICY
