apiVersion: compute.cnrm.cloud.google.com/v1alpha1
kind: ComputeLicense
metadata:
  name: computelicense-maximal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  resourceID: computelicense-maximal-${uniqueId}
  description: A maximal Compute License for E2E testing
  transferable: true
  appendableToDisk: true
  removableFromDisk: true
  osLicense: true
  multiTenantOnly: true
  minimumRetention:
    seconds: 7200
  resourceRequirements:
    minGuestCPUCount: 2
    minMemoryMb: 4096
