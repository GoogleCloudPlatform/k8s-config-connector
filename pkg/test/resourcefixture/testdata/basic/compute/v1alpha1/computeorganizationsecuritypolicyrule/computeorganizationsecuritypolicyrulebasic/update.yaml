apiVersion: compute.cnrm.cloud.google.com/v1alpha1
kind: ComputeOrganizationSecurityPolicyRule
metadata:
  name: computeorganizationsecuritypolicyrule-${uniqueId}
spec:
  securityPolicyRef:
    name: computeorganizationsecuritypolicy-${uniqueId}
  resourceID: "100"
  action: allow
  description: Updated organization security policy rule
  match:
    config:
      srcIpRanges:
        - 192.168.0.0/16
    versionedExpr: SRC_IPS_V1
  preview: false
