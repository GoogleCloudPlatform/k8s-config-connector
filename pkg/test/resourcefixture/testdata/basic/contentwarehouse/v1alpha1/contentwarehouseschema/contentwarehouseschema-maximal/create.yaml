apiVersion: contentwarehouse.cnrm.cloud.google.com/v1alpha1
kind: ContentWarehouseSchema
metadata:
  name: cws-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us
  displayName: "Maximal Schema ${uniqueId}"
  description: "A comprehensive document schema for testing"
  documentIsFolder: false
  propertyDefinitions:
    - name: "prop_int"
      displayName: "Integer Property"
      isRepeatable: false
      isFilterable: true
      isSearchable: true
      isMetadata: true
      isRequired: false
      integerTypeOptions: {}
    - name: "prop_text"
      displayName: "Text Property"
      isRepeatable: true
      isFilterable: true
      isSearchable: true
      isMetadata: true
      isRequired: true
      textTypeOptions: {}
    - name: "prop_enum"
      displayName: "Enum Property"
      isRepeatable: false
      isFilterable: true
      isSearchable: true
      isMetadata: true
      isRequired: false
      enumTypeOptions:
        possibleValues:
          - "VALUE_A"
          - "VALUE_B"
        validationCheckDisabled: false
