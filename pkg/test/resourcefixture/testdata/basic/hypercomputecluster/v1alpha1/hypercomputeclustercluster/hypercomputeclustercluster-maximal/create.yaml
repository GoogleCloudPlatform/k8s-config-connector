apiVersion: hypercomputecluster.cnrm.cloud.google.com/v1alpha1
kind: HypercomputeClusterCluster
metadata:
  name: hcc-maximal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  resourceID: hccmax
  description: "Maximal Hypercompute Cluster Description"
  labels:
    foo: bar
  networkResources:
    net-resource-1:
      config:
        existingNetwork:
          networkRef:
            external: projects/${projectId}/global/networks/default
          subnetworkRef:
            external: projects/${projectId}/regions/us-central1/subnetworks/default
  computeResources:
    comp-resource-1:
      config:
        newOnDemandInstances:
          machineType: n2-standard-4
          zone: us-central1-a
  orchestrator:
    slurm:
      loginNodes:
        count: 1
        machineType: e2-standard-4
        zone: us-central1-a
        enableOSLogin: true
        enablePublicIPs: true
      nodeSets:
      - id: nodeset1
        computeID: comp-resource-1
        staticNodeCount: 1
        computeInstance:
          bootDisk:
            sizeGB: 100
            type: projects/${projectId}/zones/us-central1-a/diskTypes/pd-standard
          labels:
            nodeset-label: test
          startupScript: "#!/bin/bash\necho hello"
      partitions:
      - id: partition1
        nodeSetIds:
        - nodeset1
      defaultPartition: partition1
