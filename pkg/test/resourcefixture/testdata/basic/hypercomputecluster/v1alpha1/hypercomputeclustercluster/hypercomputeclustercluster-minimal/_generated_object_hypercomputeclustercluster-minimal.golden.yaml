apiVersion: hypercomputecluster.cnrm.cloud.google.com/v1alpha1
kind: HypercomputeClusterCluster
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    cnrm-test: "true"
  name: hcc-minimal-${uniqueId}
  namespace: ${uniqueId}
spec:
  description: Minimal Hypercompute Cluster
  location: us-central1
  networkResources:
    net-resource-1:
      config:
        existingNetwork:
          networkRef:
            external: projects/${projectId}/global/networks/default
          subnetworkRef:
            external: projects/${projectId}/regions/us-central1/subnetworks/default
  orchestrator:
    slurm:
      loginNodes:
        count: 1
        enableOSLogin: true
        enablePublicIPs: true
        machineType: e2-standard-4
        zone: us-central1-a
  projectRef:
    external: ${projectId}
  resourceID: hccmin
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/locations/us-central1/clusters/hccmin
  observedGeneration: 1
  observedState:
    createTime: "1970-01-01T00:00:00Z"
    orchestrator:
      slurm:
        loginNodes:
          instances:
          - instance: projects/${projectId}/zones/us-central1-a/instances/hccmin-login-001
    updateTime: "1970-01-01T00:00:00Z"
