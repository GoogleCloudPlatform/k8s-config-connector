apiVersion: translate.cnrm.cloud.google.com/v1alpha1
kind: TranslateGlossary
metadata:
  name: tg-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  displayName: Initial Glossary
  languageCodesSet:
    languageCodes:
      - en
      - es
  inputConfig:
    gcsSource:
      inputURI: gs://cloud-samples-data/translation/glossary.csv
