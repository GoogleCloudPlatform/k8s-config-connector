apiVersion: monitoring.cnrm.cloud.google.com/v1beta1
kind: MonitoringDashboard
metadata:
  name: monitoringdashboard-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  displayName: "monitoringdashboard-opsanalyticsquery-updated"
  gridLayout:
    widgets:
    - title: "Log Analytics SQL Chart"
      xyChart:
        dataSets:
        - timeSeriesQuery:
            opsAnalyticsQuery:
              sql: "SELECT timestamp, proto_payload.status.code FROM `my-project._AllLogs.views._AllLogs` WHERE timestamp >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 2 HOUR)"
          plotType: "STACKED_BAR"
    - title: "Log Analytics Scorecard"
      scorecard:
        timeSeriesQuery:
          opsAnalyticsQuery:
            sql: "SELECT COUNT(*) as count FROM `my-project._AllLogs.views._AllLogs` WHERE timestamp >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 2 HOUR)"
