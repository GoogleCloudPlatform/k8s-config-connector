apiVersion: monitoring.cnrm.cloud.google.com/v1beta1
kind: MonitoringDashboard
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 3
  labels:
    cnrm-test: "true"
  name: ${dashboardID}
  namespace: ${uniqueId}
spec:
  displayName: monitoringdashboard-opsanalyticsquery-updated
  gridLayout:
    widgets:
    - title: Log Analytics SQL Chart
      xyChart:
        dataSets:
        - plotType: STACKED_BAR
          timeSeriesQuery:
            opsAnalyticsQuery:
              sql: SELECT timestamp, proto_payload.status.code FROM `my-project._AllLogs.views._AllLogs`
                WHERE timestamp >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 2 HOUR)
    - scorecard:
        timeSeriesQuery:
          opsAnalyticsQuery:
            sql: SELECT COUNT(*) as count FROM `my-project._AllLogs.views._AllLogs`
              WHERE timestamp >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 2 HOUR)
      title: Log Analytics Scorecard
  projectRef:
    external: ${projectId}
  resourceID: ${dashboardID}
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  etag: abcdef123456
  observedGeneration: 3
