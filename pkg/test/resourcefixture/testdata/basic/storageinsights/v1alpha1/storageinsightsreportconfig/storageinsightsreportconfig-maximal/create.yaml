apiVersion: storageinsights.cnrm.cloud.google.com/v1alpha1
kind: StorageInsightsReportConfig
metadata:
  name: storageinsightsreportconfig-maximal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  displayName: "Maximal Storage Insights Report Config"
  labels:
    env: test
    managed-by: kcc
  frequencyOptions:
    frequency: DAILY
    startDate:
      year: 2050
      month: 1
      day: 1
    endDate:
      year: 2050
      month: 2
      day: 1
  csvOptions:
    recordSeparator: "\n"
    delimiter: ","
    headerRequired: true
  objectMetadataReportOptions:
    metadataFields:
      - bucket
      - project
      - name
      - size
      - updated
      - storageClass
    storageFilters:
      bucketRef:
        name: storageinsights-max-dep-${uniqueId}
    storageDestinationOptions:
      bucketRef:
        name: storageinsights-max-dep-${uniqueId}
      destinationPath: "insights-reports"
