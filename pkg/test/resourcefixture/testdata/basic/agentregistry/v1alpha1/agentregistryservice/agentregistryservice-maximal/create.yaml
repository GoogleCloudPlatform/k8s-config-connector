apiVersion: agentregistry.cnrm.cloud.google.com/v1alpha1
kind: AgentRegistryService
metadata:
  name: agentregistryservice-maximal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  displayName: Maximal MCP Server
  description: Maximal MCP Server Description
  mcpServerSpec:
    type: TOOL_SPEC
    content:
      tools:
        - name: get_weather
          description: Get current weather
          inputSchema:
            type: object
            properties:
              location:
                type: string
            required:
              - location
  interfaces:
    - url: https://mcp-maximal-${uniqueId}.com
      protocolBinding: JSONRPC
