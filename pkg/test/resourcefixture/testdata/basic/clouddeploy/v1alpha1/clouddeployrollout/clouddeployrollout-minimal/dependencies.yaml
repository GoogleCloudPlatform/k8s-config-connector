apiVersion: clouddeploy.cnrm.cloud.google.com/v1alpha1
kind: CloudDeployTarget
metadata:
  annotations:
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
  name: clouddeploytarget-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  description: "Test Target for Rollout"
  run:
    location: projects/${projectId}/locations/us-central1
---
apiVersion: clouddeploy.cnrm.cloud.google.com/v1beta1
kind: CloudDeployDeliveryPipeline
metadata:
  annotations:
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
  name: clouddeploydeliverypipeline-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  description: "Test Delivery Pipeline for Rollout"
  serialPipeline:
    stages:
      - targetID: clouddeploytarget-${uniqueId}
---
apiVersion: clouddeploy.cnrm.cloud.google.com/v1alpha1
kind: CloudDeployRelease
metadata:
  annotations:
    cnrm.cloud.google.com/deletion-policy: "abandon"
  name: clouddeployrelease-${uniqueId}
spec:
  parentRef:
    name: clouddeploydeliverypipeline-${uniqueId}
  skaffoldConfigURI: gs://${projectId}-clouddeploy-test-bucket-2026/source.tar.gz
