apiVersion: clouddeploy.cnrm.cloud.google.com/v1alpha1
kind: CloudDeployCustomTargetType
metadata:
  name: clouddeploycustomtargettype-max-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  description: "Maximal custom target type updated by KCC"
  customActions:
    deployAction: deploy-action-updated
    renderAction: render-action
    includeSkaffoldModules:
      - configs:
          - config-1
        git:
          repo: "https://github.com/GoogleCloudPlatform/k8s-config-connector.git"
          path: "skaffold.yaml"
          ref: "main"
