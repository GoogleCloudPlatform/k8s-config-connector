apiVersion: clouddeploy.cnrm.cloud.google.com/v1alpha1
kind: CloudDeployTarget
metadata:
  name: clouddeploytarget-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  description: "GKE Target with a full URL cluster reference"
  gke:
    clusterRef:
      external: https://container.googleapis.com/v1/projects/${projectId}/zones/us-central1-a/clusters/gkecluster-${uniqueId}
