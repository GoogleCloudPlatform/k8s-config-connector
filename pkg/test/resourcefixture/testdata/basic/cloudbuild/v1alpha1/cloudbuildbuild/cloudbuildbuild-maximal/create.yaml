apiVersion: cloudbuild.cnrm.cloud.google.com/v1alpha1
kind: CloudBuildBuild
metadata:
  name: cloudbuildbuild-maximal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  steps:
    - id: step-1
      name: bash
      args:
        - -c
        - echo "hello from maximal build"
      env:
        - "BUILD_STEP_ENV=hello"
      dir: /workspace
      timeout: 120s
      allowFailure: false
      automapSubstitutions: true
  timeout: 600s
  queueTTL: 3600s
  tags:
    - test
    - maximal
  substitutions:
    _CUSTOM_VAR: custom_value
  options:
    logging: CLOUD_LOGGING_ONLY
    logStreamingOption: STREAM_ON
    dynamicSubstitutions: true
    substitutionOption: ALLOW_LOOSE
