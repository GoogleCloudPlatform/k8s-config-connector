# This EssentialContactsContact is created first as a dependency.
# The primary resource (create.yaml) uses the same parent + email,
# which triggers an ALREADY_EXISTS error and tests the acquire path.
apiVersion: essentialcontacts.cnrm.cloud.google.com/v1beta1
kind: EssentialContactsContact
metadata:
  annotations:
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
  name: essentialcontactscontact-dep-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  languageTag: en
  notificationCategorySubscriptions:
    - BILLING
  email: "alerts-${uniqueId}@test.com"
