      Update call failed: error applying desired state: summary: error creating NodePool: googleapi: Error 403: Permission denied: for service-${projectNumber}@container-engine-robot.iam.gserviceaccount.com on TagKey "tagKeys/123" (or it may not exist).
      Details:
      [
        {
          "@type": "type.googleapis.com/google.rpc.RequestInfo",
          "requestId": "0xc32dc37bf0668566"
        },
        {
          "@type": "type.googleapis.com/google.rpc.ErrorInfo",
          "domain": "container.googleapis.com",
          "reason": "GCE_PERMISSION_DENIED"
        }
      ]
      , forbidden
    reason: UpdateFailed
    status: "False"
    type: Ready
  observedGeneration: 2
