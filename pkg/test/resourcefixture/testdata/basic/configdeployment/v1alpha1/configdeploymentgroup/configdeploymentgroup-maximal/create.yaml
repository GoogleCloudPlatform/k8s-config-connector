apiVersion: configdeployment.cnrm.cloud.google.com/v1alpha1
kind: ConfigDeploymentGroup
metadata:
  name: configdeploymentgroup-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  labels:
    env: test-create
  annotations:
    client: custom-client
  deploymentUnits:
    - id: unit1
    - id: unit2
      dependencies:
        - unit1
