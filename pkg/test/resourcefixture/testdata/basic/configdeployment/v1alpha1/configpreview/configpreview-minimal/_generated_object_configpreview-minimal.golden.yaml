apiVersion: configdeployment.cnrm.cloud.google.com/v1alpha1
kind: ConfigPreview
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    cnrm-test: "true"
  name: configpreview-${uniqueId}
  namespace: ${uniqueId}
spec:
  location: us-central1
  projectRef:
    external: ${projectId}
  serviceAccountRef:
    external: projects/${projectId}/serviceAccounts/sa-${uniqueId}@${projectId}.iam.gserviceaccount.com
  terraformBlueprint:
    gcsSource:
      bucketRef:
        external: projects/${projectId}/buckets/${projectId}-bucket-${uniqueId}
      object: blueprint.zip
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/locations/us-central1/previews/configpreview-${uniqueId}
  observedGeneration: 1
  observedState:
    createTime: "1970-01-01T00:00:00Z"
    errorCode: PREVIEW_BUILD_API_FAILED
    errorStatus:
      code: 500
      message: 'The preview build failed due to an internal error: invalid bucket
        "${projectNumber}-us-central1-blueprint-config"; service account sa-${uniqueId}@${projectId}.iam.gserviceaccount.com
        does not have access to the bucket'
    logs: gs://${projectNumber}-us-central1-blueprint-config/new-previews/configpreview-${uniqueId}/logs
    previewArtifacts:
      artifacts: gs://${projectNumber}-us-central1-blueprint-config/new-previews/configpreview-${uniqueId}/preview_results/artifacts
      content: gs://${projectNumber}-us-central1-blueprint-config/new-previews/configpreview-${uniqueId}/preview_results/content
    state: FAILED
    tfVersion: 1.5.7
