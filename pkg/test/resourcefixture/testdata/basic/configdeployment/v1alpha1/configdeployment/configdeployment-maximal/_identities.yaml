- caisURL: //iam.googleapis.com/projects/${projectId}/serviceAccounts/sa-${uniqueId}
  group: iam.cnrm.cloud.google.com
  kind: IAMServiceAccount
  name: sa-${uniqueId}
  namespace: ${uniqueId}
  version: v1beta1
- caisURL: //storage.googleapis.com/projects/${projectId}/buckets/${projectId}-bucket-${uniqueId}
  group: storage.cnrm.cloud.google.com
  kind: StorageBucket
  name: ${projectId}-bucket-${uniqueId}
  namespace: ${uniqueId}
  version: v1beta1
- caisURL: //config.googleapis.com/projects/${projectId}/locations/us-central1/deployments/configdeployment-${uniqueId}
  group: configdeployment.cnrm.cloud.google.com
  kind: ConfigDeployment
  name: configdeployment-${uniqueId}
  namespace: ${uniqueId}
  version: v1alpha1
