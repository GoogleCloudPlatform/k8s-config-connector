apiVersion: configdeployment.cnrm.cloud.google.com/v1alpha1
kind: ConfigDeployment
metadata:
  name: configdeployment-${uniqueId}
  labels:
    env: test
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  serviceAccountRef:
    external: projects/${projectId}/serviceAccounts/sa-${uniqueId}@${projectId}.iam.gserviceaccount.com
  workerPoolRef:
    external: projects/${projectId}/locations/us-central1/workerPools/workerpool-${uniqueId}
  terraformBlueprint:
    gitSource:
      repo: https://github.com/GoogleCloudPlatform/k8s-config-connector.git
      directory: scripts
      ref: main
    inputValues:
      foo:
        inputValue:
          stringValue: bar
    externalValues:
      ext_var:
        deploymentSource:
          deploymentRef:
            external: projects/${projectId}/locations/us-central1/deployments/dep-${uniqueId}
          outputName: my_output
  artifactsLocation:
    bucketRef:
      external: projects/${projectId}/buckets/${projectId}-bucket-${uniqueId}
    folder: artifacts
  importExistingResources: false
  tfVersionConstraint: "=1.3.10"
  quotaValidation: QUOTA_VALIDATION_UNSPECIFIED
  annotations:
    note: initial
  providerConfig:
    sourceType: PROVIDER_SOURCE_UNSPECIFIED
