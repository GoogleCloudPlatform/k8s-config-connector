apiVersion: configdeployment.cnrm.cloud.google.com/v1alpha1
kind: ConfigDeployment
metadata:
  name: configdeployment-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  serviceAccountRef:
    external: projects/${projectId}/serviceAccounts/sa-${uniqueId}@${projectId}.iam.gserviceaccount.com
  terraformBlueprint:
    gcsSource:
      bucketRef:
        external: ${projectId}-bucket
      object: blueprint.zip
    inputValues:
      foo:
        inputValue:
          stringValue: updated
  labels:
    env: staging
  artifactsLocation:
    bucketRef:
      external: ${projectId}-bucket
    folder: artifacts
  importExistingResources: false
  tfVersionConstraint: "=1.3.10"
  quotaValidation: QUOTA_VALIDATION_UNSPECIFIED
  annotations:
    note: updated
  providerConfig:
    sourceType: PROVIDER_SOURCE_UNSPECIFIED
