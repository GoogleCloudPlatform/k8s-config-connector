apiVersion: notebooks.cnrm.cloud.google.com/v1alpha1
kind: NotebooksSchedule
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    cnrm-test: "true"
  name: n-sch-full-${uniqueId}
  namespace: ${uniqueId}
spec:
  cronSchedule: 0 0 * * *
  description: A test schedule with many fields set
  executionTemplate:
    containerImageURI: gcr.io/deeplearning-platform-release/base-cpu
    dataprocParameters:
      clusterRef:
        external: projects/${projectId}/regions/us-central1/clusters/some-cluster
    jobType: VERTEX_AI
    masterType: n1-standard-4
    scaleTier: CUSTOM
    serviceAccountRef:
      name: n-sch-sa-${uniqueId}
    tensorboardRef:
      name: n-sch-tb-${uniqueId}
    vertexAiParameters:
      networkRef:
        name: ${networkID}
  location: us-central1
  projectRef:
    external: ${projectId}
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/locations/us-central1/schedules/n-sch-full-${uniqueId}
  observedGeneration: 1
  observedState:
    createTime: "1970-01-01T00:00:00Z"
    updateTime: "1970-01-01T00:00:00Z"
