apiVersion: notebooks.cnrm.cloud.google.com/v1alpha1
kind: NotebooksExecution
metadata:
  name: n-exec-full-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  executionTemplate:
    scaleTier: CUSTOM
    masterType: n1-standard-4
    containerImageURI: gcr.io/deeplearning-platform-release/base-cpu
    tensorboardRef:
      name: n-exec-tb-${uniqueId}
    vertexAiParameters:
      networkRef:
        name: n-exec-net-${uniqueId}
    serviceAccountRef:
      name: n-exec-sa-${uniqueId}
    jobType: VERTEX_AI
