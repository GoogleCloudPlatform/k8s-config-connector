apiVersion: notebooks.cnrm.cloud.google.com/v1alpha1
kind: NotebookInstanceV2
metadata:
  name: ni2-full-gce-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1-a
  gceSetup:
    machineType: n1-standard-4
    vmImage:
      family: tf-latest-cpu
      project: deeplearning-platform-release
    acceleratorConfigs:
      - coreCount: 1
        type: NVIDIA_TESLA_T4
    bootDisk:
      diskSizeGB: 100
      diskType: PD_SSD
      diskEncryption: CMEK
      kmsKeyRef:
        name: kms-key-${uniqueId}
    dataDisks:
      - diskSizeGB: 100
        diskType: PD_SSD
        diskEncryption: CMEK
        kmsKeyRef:
          name: kms-key-${uniqueId}
    enableIPForwarding: true
    gpuDriverConfig:
      enableGpuDriver: true
    networkInterfaces:
      - networkRef:
          name: ni2-net-${uniqueId}
        subnetRef:
          name: ni2-sub-${uniqueId}
        nicType: GVNIC
    serviceAccounts:
      - serviceAccountRef:
          name: ni2-sa-${uniqueId}
    shieldedInstanceConfig:
      enableSecureBoot: true
      enableVTPM: true
      enableIntegrityMonitoring: true
    disablePublicIP: true
    tags:
      - full-test
    metadata:
      enable-os-config: "true"
  instanceOwners: 
    - ${projectNumber}-compute@developer.gserviceaccount.com
  disableProxyAccess: false
  labels:
    test: full-gce
