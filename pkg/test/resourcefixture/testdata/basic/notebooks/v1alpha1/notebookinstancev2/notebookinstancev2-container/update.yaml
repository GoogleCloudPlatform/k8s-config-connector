apiVersion: notebooks.cnrm.cloud.google.com/v1alpha1
kind: NotebookInstanceV2
metadata:
  name: ni2-container-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1-a
  gceSetup:
    metadata:
      notebook-disable-downloads: "true"
      notebook-disable-root: "true"
      notebook-updated-metadata: "true"
    # instance in state must be stopped before updating one of the following:
    # [accelerator_configs machine_type shielded_instance_config reservation_affinity container_image disable_public_ip disable_proxy_access]
    disablePublicIP: true
    machineType: n1-standard-1
    containerImage:
      repository: gcr.io/deeplearning-platform-release/base-cpu
      tag: latest
