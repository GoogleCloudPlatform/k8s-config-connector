apiVersion: notebooks.cnrm.cloud.google.com/v1alpha1
kind: NotebookInstanceV2
metadata:
  name: notebookinstancev2-maximal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1-a
  gceSetup:
    machineType: n1-standard-2 # Update machineType
    containerImage:
      repository: gcr.io/deeplearning-platform-release/base-cpu
    bootDisk:
      diskSizeGB: 100
      diskType: PD_SSD
      diskEncryption: GMEK
    dataDisks:
      - diskSizeGB: 100
        diskType: PD_SSD
        diskEncryption: GMEK
    shieldedInstanceConfig:
      enableSecureBoot: false
      enableVTPM: true
      enableIntegrityMonitoring: true
    disablePublicIP: true
    tags:
      - tag1
      - tag2
    metadata:
      enable-os-config: "true"
  instanceOwners: 
    - ${projectNumber}-compute@developer.gserviceaccount.com
  disableProxyAccess: true
  labels:
    environment: staging # Update labels
    team: config-connector
