apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  name: ni2-net-${uniqueId}
spec:
  routingConfig:
    routingMode: REGIONAL
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSubnetwork
metadata:
  name: ni2-sub-${uniqueId}
spec:
  ipCidrRange: 10.0.0.0/24
  region: us-central1
  networkRef:
    name: ni2-net-${uniqueId}
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  name: ni2-sa-${uniqueId}
spec:
  displayName: NI2 Test SA
---
apiVersion: kms.cnrm.cloud.google.com/v1beta1
kind: KMSKeyRing
metadata:
  name: ni2-ring-${uniqueId}
spec:
  location: us-central1
---
apiVersion: kms.cnrm.cloud.google.com/v1beta1
kind: KMSCryptoKey
metadata:
  name: kms-key-${uniqueId}
spec:
  keyRingRef:
    name: ni2-ring-${uniqueId}
  purpose: ENCRYPT_DECRYPT
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: ni2-cmek-binding-${uniqueId}
spec:
  resourceRef:
    apiVersion: kms.cnrm.cloud.google.com/v1beta1
    kind: KMSCryptoKey
    name: kms-key-${uniqueId}
  role: roles/cloudkms.cryptoKeyEncrypterDecrypter
  member: "serviceAccount:service-${projectNumber}@gcp-sa-notebooks.iam.gserviceaccount.com"
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: ni2-cmek-binding-compute-${uniqueId}
spec:
  resourceRef:
    apiVersion: kms.cnrm.cloud.google.com/v1beta1
    kind: KMSCryptoKey
    name: kms-key-${uniqueId}
  role: roles/cloudkms.cryptoKeyEncrypterDecrypter
  member: "serviceAccount:service-${projectNumber}@compute-system.iam.gserviceaccount.com"
