apiVersion: notebooks.cnrm.cloud.google.com/v1alpha1
kind: NotebookInstanceV2
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 2
  labels:
    cnrm-test: "true"
  name: ni2-container-${uniqueId}
  namespace: ${uniqueId}
spec:
  gceSetup:
    containerImage:
      repository: gcr.io/deeplearning-platform-release/base-cpu
      tag: latest
    disablePublicIP: true
    machineType: n1-standard-1
    metadata:
      notebook-disable-downloads: "true"
      notebook-disable-root: "true"
      notebook-updated-metadata: "true"
  location: us-central1-a
  projectRef:
    external: ${projectId}
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/locations/us-central1-a/instances/ni2-container-${uniqueId}
  observedGeneration: 2
  observedState:
    createTime: "1970-01-01T00:00:00Z"
    creator: someone@somewhere.com
    gceSetup:
      serviceAccounts:
      - scopes:
        - https://www.googleapis.com/auth/cloud-platform
        - https://www.googleapis.com/auth/userinfo.email
    gcpID: "000000000000000000000"
    proxyURI: https://ni2-container-${uniqueId}-dot-us-central1.notebooks.googleusercontent.com
    state: PROVISIONING
    updateTime: "1970-01-01T00:00:00Z"
