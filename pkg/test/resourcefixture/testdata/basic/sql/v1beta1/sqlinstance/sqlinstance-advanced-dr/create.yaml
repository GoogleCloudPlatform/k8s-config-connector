apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: sqlinstance-replica-advdr-${uniqueId}
  annotations:
    cnrm.cloud.google.com/sqlinstance-advanced-dr: "enabled"
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
spec:
  databaseVersion: MYSQL_8_0
  instanceType: READ_REPLICA_INSTANCE
  masterInstanceRef:
    name: sqlinstance-primary-advdr-${uniqueId}
  region: us-east1
  settings:
    locationPreference:
      zone: us-east1-c
    tier: db-perf-optimized-N-2
    edition: ENTERPRISE_PLUS
