apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  annotations:
    cnrm.cloud.google.com/last-changed-cookie: normalized-cookie
    cnrm.cloud.google.com/project-id: ${projectId}
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
    cnrm.cloud.google.com/sqlinstance-advanced-dr: enabled
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    cnrm-test: "true"
    test-label: updated-value
  name: sqlinstance-replica-advdr-${uniqueId}
  namespace: ${uniqueId}
spec:
  databaseVersion: MYSQL_8_0
  instanceType: READ_REPLICA_INSTANCE
  masterInstanceRef:
    name: sqlinstance-primary-advdr-${uniqueId}
  region: us-east1
  settings:
    edition: ENTERPRISE_PLUS
    locationPreference:
      zone: us-east1-c
    tier: db-perf-optimized-N-2
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  connectionName: ${projectId}:us-east1:sqlinstance-replica-advdr-${uniqueId}
  firstIpAddress: 10.1.2.3
  instanceType: READ_REPLICA_INSTANCE
  ipAddress: 10.1.2.3
  observedGeneration: 1
  observedState:
    masterInstanceName: ${projectId}:sqlinstance-primary-advdr-${uniqueId}
  publicIpAddress: 10.1.2.3
  selfLink: https://sqladmin.googleapis.com/sql/v1beta4/projects/${projectId}/instances/sqlinstance-replica-advdr-${uniqueId}
  serverCaCert:
    cert: |
      -----BEGIN CERTIFICATE-----
      -----END CERTIFICATE-----
    commonName: common-name
    createTime: "1970-01-01T00:00:00Z"
    expirationTime: "1970-01-01T00:00:00Z"
    sha1Fingerprint: "12345678"
  serviceAccountEmailAddress: p${projectNumber}-abcdef@gcp-sa-cloud-sql.iam.gserviceaccount.com
