apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  annotations:
    alpha.cnrm.cloud.google.com/reconciler: direct
    cnrm.cloud.google.com/last-changed-cookie: normalized-cookie
    cnrm.cloud.google.com/project-id: ${projectId}
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 2
  labels:
    cnrm-test: "true"
  name: sqlinstance-psc-na-direct-${uniqueId}
  namespace: ${uniqueId}
spec:
  databaseVersion: POSTGRES_16
  region: europe-north2
  settings:
    ipConfiguration:
      ipv4Enabled: false
      pscConfig:
      - allowedConsumerProjects:
        - ${projectId}
        networkAttachmentRef:
          name: ${networkAttachmentID}
        pscEnabled: true
    locationPreference:
      zone: europe-north2-a
    tier: db-custom-1-3840
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  connectionName: ${projectId}:europe-north2:sqlinstance-psc-na-direct-${uniqueId}
  dnsName: ${dnsName}
  instanceType: CLOUD_SQL_INSTANCE
  observedGeneration: 2
  pscServiceAttachmentLink: projects/tenanta-tp/regions/europe-north2/serviceAttachments/a-abcdef-psc-service-attachment-0123456789abcdef
  selfLink: https://sqladmin.googleapis.com/sql/v1beta4/projects/${projectId}/instances/sqlinstance-psc-na-direct-${uniqueId}
  serverCaCert:
    cert: |
      -----BEGIN CERTIFICATE-----
      -----END CERTIFICATE-----
    commonName: common-name
    createTime: "1970-01-01T00:00:00Z"
    expirationTime: "1970-01-01T00:00:00Z"
    sha1Fingerprint: "12345678"
  serviceAccountEmailAddress: p${projectNumber}-abcdef@gcp-sa-cloud-sql.iam.gserviceaccount.com
