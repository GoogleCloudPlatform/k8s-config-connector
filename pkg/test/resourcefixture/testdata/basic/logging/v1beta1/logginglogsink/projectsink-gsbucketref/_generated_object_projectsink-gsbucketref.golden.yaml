apiVersion: logging.cnrm.cloud.google.com/v1beta1
kind: LoggingLogSink
metadata:
  annotations:
    alpha.cnrm.cloud.google.com/reconciler: direct
    cnrm.cloud.google.com/management-conflict-prevention-policy: none
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    cnrm-test: "true"
  name: logsink-${uniqueId}
  namespace: ${uniqueId}
spec:
  destination:
    storageBucketRef:
      external: gs://logsink-${uniqueId}
  filter: resource.type="bigquery_project" AND logName:"cloudaudit.googleapis.com"
  projectRef:
    external: ${projectId}
  uniqueWriterIdentity: true
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  observedGeneration: 1
  writerIdentity: serviceAccount:service-${projectNumber}@gcp-sa-logging.iam.gserviceaccount.com
