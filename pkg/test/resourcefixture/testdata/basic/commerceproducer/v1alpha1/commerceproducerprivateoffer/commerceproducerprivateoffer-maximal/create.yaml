apiVersion: commerceproducer.cnrm.cloud.google.com/v1alpha1
kind: CommerceProducerPrivateOffer
metadata:
  name: commerceproducerprivateoffer-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  title: Maximal Private Offer ${uniqueId}
  customerNote: Customer note for ${uniqueId}
  internalNote: Internal note for ${uniqueId}
  offerDealType: NEW
  customer:
    targetBillingAccountRef:
      external: billingAccounts/000000-000000-000000
    entityTitle: Example Customer Corp
    contact: John Doe
    email: johndoe@example.com
  partnerContact:
    contact: Jane Partner
    email: partner@example.com
  acceptDeadlineTime:
    year: 2030
    month: 12
    day: 31
    hours: 23
    minutes: 59
    seconds: 59
    nanos: 0
    timeZone:
      id: UTC
      version: "2024a"
    utcOffset: 0s
  term:
    durationMonths: 12
    endPolicy: CANCEL_SUBSCRIPTION
    maxRenewalCount: 2
    scheduledStartTime:
      year: 2030
      month: 1
      day: 1
      hours: 0
      minutes: 0
      seconds: 0
      nanos: 0
      timeZone:
        id: UTC
        version: "2024a"
      utcOffset: 0s
    scheduledEndTime:
      year: 2031
      month: 1
      day: 1
      hours: 0
      minutes: 0
      seconds: 0
      nanos: 0
      timeZone:
        id: UTC
        version: "2024a"
      utcOffset: 0s
    startPolicy: UPON_ISSUANCE
  singleProductOffer:
    amendedPrivateOfferRef:
      external: projects/${projectId}/locations/us-central1/privateOffers/amended-offer
    amendedStandardOfferRef:
      external: projects/${projectId}/locations/us-central1/services/test-service/standardOffers/amended-standard
    baseStandardOfferRef:
      external: projects/${projectId}/locations/us-central1/services/test-service/standardOffers/base-standard
    features:
      - displayName: Premium Support
        value: 24/7 Phone Support
    additionalContractValue:
      contractValue:
        currencyCode: USD
        units: 50000
        nanos: 0
      eligibleSkuRefs:
        - external: projects/${projectId}/locations/us-central1/services/test-service/skus/test-sku
    standardIntervalPrice:
      standardInterval: MONTH
      priceModel:
        commitment:
          commitmentAmount:
            currencyCode: USD
            units: 10000
            nanos: 0
          discountPercent:
            value: "10.5"
          additionalCredit:
            currencyCode: USD
            units: 500
            nanos: 0
          discardPreviousCreditBalance: true
        flatFee:
          flatFeeOverride:
            currencyCode: USD
            units: 2000
            nanos: 0
        usage:
          defaultDiscountPercent:
            value: "5.0"
          skuDiscounts:
            - cloudBillingSku: 0000-0000-0000
              skuRef:
                external: projects/${projectId}/locations/us-central1/services/test-service/skus/test-sku
              discountPercent:
                value: "15.0"
    customIntervalPrice:
      installments:
        - startTime:
            year: 2030
            month: 1
            day: 1
            hours: 0
            minutes: 0
            seconds: 0
            nanos: 0
            timeZone:
              id: UTC
              version: "2024a"
            utcOffset: 0s
          priceModel:
            commitment:
              commitmentAmount:
                currencyCode: USD
                units: 5000
                nanos: 0
              discountPercent:
                value: "10.0"
              additionalCredit:
                currencyCode: USD
                units: 250
                nanos: 0
              discardPreviousCreditBalance: false
            flatFee:
              flatFeeOverride:
                currencyCode: USD
                units: 1000
                nanos: 0
            usage:
              defaultDiscountPercent:
                value: "2.5"
              skuDiscounts:
                - cloudBillingSku: 1111-1111-1111
                  skuRef:
                    external: projects/${projectId}/locations/us-central1/services/test-service/skus/test-sku
                  discountPercent:
                    value: "8.0"
