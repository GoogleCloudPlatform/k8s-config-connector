apiVersion: assuredworkloads.cnrm.cloud.google.com/v1alpha1
kind: AssuredWorkloadsWorkload
metadata:
  name: assuredworkloadsworkload-${uniqueId}
  labels:
    test-label: updated-value
spec:
  displayName: Upd Max ${uniqueId}
  complianceRegime: FEDRAMP_HIGH
  organizationRef:
    external: organizations/${TEST_ORG_ID}
  location: us-central1
  billingAccountRef:
    external: billingAccounts/${TEST_BILLING_ACCOUNT_ID}
  resourceSettings:
    - resourceType: CONSUMER_FOLDER
      displayName: myfolder${uniqueId}
