apiVersion: networkservices.cnrm.cloud.google.com/v1alpha1
kind: NetworkServicesServiceLBPolicy
metadata:
  name: servicelbpolicy-maximal-${uniqueId}
  labels:
    test-label: updated-value
spec:
  projectRef:
    external: ${projectId}
  location: global
  description: Updated description for ServiceLBPolicy
  loadBalancingAlgorithm: WATERFALL_BY_ZONE
  autoCapacityDrain:
    enable: false
  failoverConfig:
    failoverHealthThreshold: 80
  isolationConfig:
    isolationGranularity: REGION
    isolationMode: STRICT
