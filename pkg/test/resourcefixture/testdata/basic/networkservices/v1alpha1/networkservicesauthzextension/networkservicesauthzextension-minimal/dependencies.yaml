apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeHealthCheck
metadata:
  name: hc-${uniqueId}
spec:
  location: us-central1
  checkIntervalSec: 5
  timeoutSec: 5
  healthyThreshold: 2
  unhealthyThreshold: 2
  http2HealthCheck:
    port: 443
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeBackendService
metadata:
  name: bs-callout-${uniqueId}
spec:
  location: us-central1
  loadBalancingScheme: INTERNAL_MANAGED
  protocol: HTTP2
  healthChecks:
    - healthCheckRef:
        name: hc-${uniqueId}
