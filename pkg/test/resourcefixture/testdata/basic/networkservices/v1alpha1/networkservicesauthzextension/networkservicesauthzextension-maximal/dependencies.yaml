apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeHealthCheck
metadata:
  name: hc-${uniqueId}
spec:
  location: global
  httpHealthCheck:
    port: 80
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeBackendService
metadata:
  name: bs-callout-${uniqueId}
spec:
  location: us-central1
  loadBalancingScheme: INTERNAL_MANAGED
  protocol: HTTP2
  healthChecks:
    - healthCheckRef:
        name: hc-${uniqueId}
