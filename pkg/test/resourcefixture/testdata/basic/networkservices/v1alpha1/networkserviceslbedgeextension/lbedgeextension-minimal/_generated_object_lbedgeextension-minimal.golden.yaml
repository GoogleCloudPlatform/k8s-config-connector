apiVersion: networkservices.cnrm.cloud.google.com/v1alpha1
kind: NetworkServicesLBEdgeExtension
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 2
  labels:
    cnrm-test: "true"
  name: lbedgeextension-${uniqueId}
  namespace: ${uniqueId}
spec:
  description: An updated minimal LBEdgeExtension
  extensionChains:
  - extensions:
    - backendServiceRef:
        name: ${backendServiceID}
      name: ext1
    matchCondition:
      celExpression: request.host == 'updated.example.com'
    name: chain1
  forwardingRuleRefs:
  - name: ${forwardingRuleID}
  loadBalancingScheme: EXTERNAL_MANAGED
  location: global
  projectRef:
    external: ${projectId}
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/locations/global/lbEdgeExtensions/lbedgeextension-${uniqueId}
  observedGeneration: 2
  observedState:
    createTime: "1970-01-01T00:00:00Z"
    updateTime: "1970-01-01T00:00:00Z"
