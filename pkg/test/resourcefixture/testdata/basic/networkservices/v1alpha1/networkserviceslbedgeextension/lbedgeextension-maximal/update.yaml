apiVersion: networkservices.cnrm.cloud.google.com/v1alpha1
kind: NetworkServicesLBEdgeExtension
metadata:
  name: lbedgeextension-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: global
  description: "An updated sample maximal LBEdgeExtension"
  loadBalancingScheme: EXTERNAL_MANAGED
  forwardingRuleRefs:
    - name: fr-${uniqueId}
  extensionChains:
    - name: "chain1"
      matchCondition:
        celExpression: "request.host == 'updated.example.com'"
      extensions:
        - name: "ext1"
          authority: "updated-ext1.example.com"
          backendServiceRef:
            name: bs-callout2-${uniqueId}
          supportedEvents:
            - REQUEST_HEADERS
          timeout: "0.200s"
          failOpen: false
          forwardHeaders:
            - "Authorization"
            - "X-Custom-Header"
