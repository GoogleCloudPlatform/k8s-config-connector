apiVersion: networkservices.cnrm.cloud.google.com/v1alpha1
kind: NetworkServicesLBEdgeExtension
metadata:
  name: lbedgeextension-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: global
  description: "A sample maximal LBEdgeExtension"
  loadBalancingScheme: EXTERNAL_MANAGED
  forwardingRuleRefs:
    - name: fr-${uniqueId}
  extensionChains:
    - name: "chain1"
      matchCondition:
        celExpression: "request.host == 'example.com'"
      extensions:
        - name: "ext1"
          authority: "ext1.example.com"
          backendServiceRef:
            name: bs-callout-${uniqueId}
          supportedEvents:
            - REQUEST_HEADERS
          timeout: "0.100s"
          failOpen: true
          forwardHeaders:
            - "Authorization"
