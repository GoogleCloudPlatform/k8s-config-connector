apiVersion: networkservices.cnrm.cloud.google.com/v1alpha1
kind: NetworkServicesLBTrafficExtension
metadata:
  name: lbtrafficextension-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  description: "An updated sample LBTrafficExtension"
  labels:
    env: "prod"
    labelkey: "updatedval"
  loadBalancingScheme: INTERNAL_MANAGED
  forwardingRuleRefs:
    - name: fr-${uniqueId}
  extensionChains:
    - name: "chain1"
      matchCondition:
        celExpression: "request.host == 'updated.example.com'"
      extensions:
        - name: "ext1"
          authority: "updated.ext1.example.com"
          backendServiceRef:
            name: bs-callout2-${uniqueId}
          supportedEvents:
            - REQUEST_HEADERS
            - RESPONSE_HEADERS
          timeout: "0.200s"
          failOpen: true
          forwardHeaders:
            - "x-updated-header"
          metadata:
            ext_level_key: "updated_ext_level_value"
