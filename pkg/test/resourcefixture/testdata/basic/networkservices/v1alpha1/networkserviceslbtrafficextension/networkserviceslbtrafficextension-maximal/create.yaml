apiVersion: networkservices.cnrm.cloud.google.com/v1alpha1
kind: NetworkServicesLBTrafficExtension
metadata:
  name: lbtrafficextension-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  description: "A sample LBTrafficExtension"
  labels:
    env: "test"
    labelkey: "labelval"
  loadBalancingScheme: INTERNAL_MANAGED
  forwardingRuleRefs:
    - name: fr-${uniqueId}
  extensionChains:
    - name: "chain1"
      matchCondition:
        celExpression: "request.host == 'example.com'"
      extensions:
        - name: "ext1"
          authority: "ext1.example.com"
          backendServiceRef:
            name: bs-callout-${uniqueId}
          supportedEvents:
            - REQUEST_HEADERS
            - RESPONSE_HEADERS
          timeout: "0.100s"
          failOpen: false
          forwardHeaders:
            - "x-custom-header"
          metadata:
            ext_level_key: "ext_level_value"
