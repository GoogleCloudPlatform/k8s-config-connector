apiVersion: networkservices.cnrm.cloud.google.com/v1alpha1
kind: NetworkServicesLBTrafficExtension
metadata:
  name: lbtrafficextension-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  description: "Updated LBTrafficExtension with resource level metadata"
  loadBalancingScheme: INTERNAL_MANAGED
  forwardingRuleRefs:
    - name: fr-${uniqueId}
  metadata:
    resource_level_key: "updated_resource_level_value"
  extensionChains:
    - name: "chain1"
      matchCondition:
        celExpression: "request.host == 'updated.example.com'"
      extensions:
        - name: "ext1"
          authority: "updated.ext1.example.com"
          backendServiceRef:
            name: bs-callout2-${uniqueId}
          supportedEvents:
            - REQUEST_HEADERS
          timeout: "0.200s"
