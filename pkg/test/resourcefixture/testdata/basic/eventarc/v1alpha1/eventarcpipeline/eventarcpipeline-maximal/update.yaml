apiVersion: eventarc.cnrm.cloud.google.com/v1alpha1
kind: EventarcPipeline
metadata:
  name: eventarcpipeline-maximal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  displayName: "Eventarc Pipeline Maximal Updated"
  labels:
    foo: baz
  annotations:
    kcc-test: "updated"
  loggingConfig:
    logSeverity: DEBUG
  retryPolicy:
    maxAttempts: 5
    minRetryDelay: 2s
    maxRetryDelay: 120s
  inputPayloadFormat:
    json: {}
  mediations:
  - transformation:
      transformationTemplate: '{"updated_data": message.data}'
  destinations:
  - httpEndpoint:
      uri: "https://example.com/updated-events"
      messageBindingTemplate: '{"updated_data": message.data}'
    outputPayloadFormat:
      json: {}
