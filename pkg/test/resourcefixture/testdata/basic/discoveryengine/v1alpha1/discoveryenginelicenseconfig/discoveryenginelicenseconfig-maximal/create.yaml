apiVersion: discoveryengine.cnrm.cloud.google.com/v1alpha1
kind: DiscoveryEngineLicenseConfig
metadata:
  name: licenseconfig-${uniqueId}
spec:
  projectRef:
    external: projects/${projectId}
  location: global
  resourceID: search
  licenseCount: 10
  subscriptionTier: SUBSCRIPTION_TIER_SEARCH
  subscriptionTerm: SUBSCRIPTION_TERM_ONE_YEAR
  startDate:
    year: 2027
    month: 8
    day: 5
  endDate:
    year: 2028
    month: 8
    day: 5
  autoRenew: true
  freeTrial: false
