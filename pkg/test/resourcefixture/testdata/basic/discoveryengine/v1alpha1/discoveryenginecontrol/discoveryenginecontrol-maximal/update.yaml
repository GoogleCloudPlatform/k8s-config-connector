apiVersion: discoveryengine.cnrm.cloud.google.com/v1alpha1
kind: DiscoveryEngineControl
metadata:
  name: control-max-${uniqueId}
spec:
  projectRef:
    external: projects/${projectId}
  location: global
  dataStoreRef:
    name: datastore-${uniqueId}
  displayName: "Maximal Control Updated"
  solutionType: SOLUTION_TYPE_SEARCH
  useCases:
    - SEARCH_USE_CASE_SEARCH
  conditions:
    - activeTimeRange:
        - startTime: "2026-02-01T00:00:00Z"
          endTime: "2027-11-30T23:59:59Z"
  synonymsAction:
    synonyms:
      - "synonym1"
      - "synonym2"
      - "synonym3"
