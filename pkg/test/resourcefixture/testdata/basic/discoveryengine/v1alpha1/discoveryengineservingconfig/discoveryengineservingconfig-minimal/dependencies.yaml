apiVersion: discoveryengine.cnrm.cloud.google.com/v1alpha1
kind: DiscoveryEngineDataStore
metadata:
  name: datastore-${uniqueId}
spec:
  projectRef:
    external: projects/${projectId}
  location: global
  collection: default_collection
  displayName: "My DataStore for ServingConfig"
  industryVertical: GENERIC
---
apiVersion: discoveryengine.cnrm.cloud.google.com/v1alpha1
kind: DiscoveryEngineEngine
metadata:
  name: engine-${uniqueId}
spec:
  projectRef:
    external: projects/${projectId}
  location: global
  collection: default_collection
  displayName: "My Engine for ServingConfig"
  solutionType: SOLUTION_TYPE_SEARCH
  industryVertical: GENERIC
  dataStoreRefs:
    - name: datastore-${uniqueId}
status:
  externalRef: projects/${projectId}/locations/global/collections/default_collection/engines/engine-${uniqueId}
