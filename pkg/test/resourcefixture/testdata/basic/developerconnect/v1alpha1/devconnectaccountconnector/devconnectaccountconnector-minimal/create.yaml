apiVersion: developerconnect.cnrm.cloud.google.com/v1alpha1
kind: DevConnectAccountConnector
metadata:
  name: devconnectaccountconnector-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  providerOauthConfig:
    systemProviderID: GITHUB
    scopes:
      - "user:email"
