apiVersion: developerconnect.cnrm.cloud.google.com/v1alpha1
kind: DevConnectAccountConnector
metadata:
  name: devconnectaccountconnector-${uniqueId}
  labels:
    foo: baz
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  providerOauthConfig:
    systemProviderID: GITHUB
    scopes:
      - "user:email"
      - "read:user"
      - "repo"
  labels:
    my-label: updated-value
  annotations:
    my-annotation: updated-annotation-value
