apiVersion: dialogflowcx.cnrm.cloud.google.com/v1alpha1
kind: DialogflowCXGenerator
metadata:
  name: dialogflowcxgenerator-${uniqueId}
spec:
  parentRef:
    name: dialogflowcxagent-${uniqueId}
  displayName: generator-max-updated-${uniqueId}
  promptText:
    text: "Summarize $conversation for topic $topic and subtopic $topic2"
  placeholders:
    - id: "topic_id"
      name: "topic"
    - id: "topic_id_2"
      name: "topic2"
  modelParameter:
    temperature: 0.7
    maxDecodeSteps: 150
    topP: 0.95
    topK: 30
