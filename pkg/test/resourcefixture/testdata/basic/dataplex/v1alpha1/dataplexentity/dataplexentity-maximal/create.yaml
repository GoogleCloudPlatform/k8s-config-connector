apiVersion: dataplex.cnrm.cloud.google.com/v1alpha1
kind: DataplexEntity
metadata:
  name: dataplexentity-maximal-${uniqueId}
spec:
  parentRef:
    name: dataplexzone-${uniqueId}
  id: entity_maximal_${uniqueId}
  displayName: Maximal Entity
  description: Initial maximal description
  type: TABLE
  assetRef:
    name: dataplexasset-${uniqueId}
  dataPath: gs://dataplexbucket-${uniqueId}/data
  dataPathPattern: gs://dataplexbucket-${uniqueId}/data/**/*.csv
  system: CLOUD_STORAGE
  format:
    mimeType: text/csv
    csv:
      delimiter: ","
      encoding: UTF-8
      headerRows: 1
  schema:
    userManaged: true
    fields:
      - name: id
        type: INT64
        mode: REQUIRED
        description: Primary ID
      - name: name
        type: STRING
        mode: NULLABLE
        description: Item Name
