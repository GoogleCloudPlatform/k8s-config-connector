apiVersion: dataplex.cnrm.cloud.google.com/v1alpha1
kind: DataplexEntry
metadata:
  name: dataplexentry-maximal-${uniqueId}
spec:
  parentRef:
    name: entrygroup-max-${uniqueId}
  entryTypeRef:
    name: entrytype-max-${uniqueId}
  parentEntryRef:
    name: parent-entry-max-${uniqueId}
  fullyQualifiedName: "dataplex:${projectId}.us-central1.entrygroup-max-${uniqueId}.dataplexentry-maximal-${uniqueId}"
  entrySource:
    resource: "custom:resource-${uniqueId}"
    system: "custom-system"
    platform: "custom-platform"
    displayName: "Maximal Entry"
    description: "Maximal entry initial description"
    labels:
      env: "test"
    ancestors:
      - name: "root-ancestor"
        type: "folder"
