apiVersion: dataplex.cnrm.cloud.google.com/v1alpha1
kind: DataplexAsset
metadata:
  annotations:
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
  name: dataplexasset-maximal-${uniqueId}
spec:
  parentRef:
    name: dpzone-max-${uniqueId}
  displayName: "Updated Maximal Asset ${uniqueId}"
  description: "Updated description for maximal asset"
  resourceSpec:
    type: STORAGE_BUCKET
    readAccessMode: DIRECT
    storageBucketRef:
      name: dpasset-max-${uniqueId}
  discoverySpec:
    enabled: true
    includePatterns:
      - "data2/*"
    excludePatterns:
      - "tmp2/*"
    csvOptions:
      headerRows: 2
      delimiter: "|"
      encoding: "UTF-8"
      disableTypeInference: true
    jsonOptions:
      encoding: "UTF-8"
      disableTypeInference: true
    schedule: "0 2 * * *"
