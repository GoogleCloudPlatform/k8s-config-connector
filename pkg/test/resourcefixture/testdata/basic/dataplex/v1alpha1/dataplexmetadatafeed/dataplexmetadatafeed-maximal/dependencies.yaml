apiVersion: pubsub.cnrm.cloud.google.com/v1beta1
kind: PubSubTopic
metadata:
  name: pubsubtopic-dep-${uniqueId}
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: iampolicymember-${uniqueId}
spec:
  member: serviceAccount:service-${projectNumber}@gcp-sa-dataplex.iam.gserviceaccount.com
  role: roles/pubsub.admin
  resourceRef:
    apiVersion: pubsub.cnrm.cloud.google.com/v1beta1
    kind: PubSubTopic
    name: pubsubtopic-dep-${uniqueId}
---
apiVersion: dataplex.cnrm.cloud.google.com/v1alpha1
kind: DataplexEntryGroup
metadata:
  name: entrygroup-dep-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  description: "Test entry group for metadatafeed maximal test"
---
apiVersion: dataplex.cnrm.cloud.google.com/v1alpha1
kind: DataplexEntryType
metadata:
  name: entrytype-dep-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  description: "Test entry type for metadatafeed maximal test"
---
apiVersion: dataplex.cnrm.cloud.google.com/v1alpha1
kind: DataplexAspectType
metadata:
  name: aspecttype-dep-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  description: "Test aspect type for metadatafeed maximal test"
  metadataTemplate:
    name: "test_template"
    type: "record"
    recordFields:
      - name: "test_field"
        type: "string"
        index: 1
