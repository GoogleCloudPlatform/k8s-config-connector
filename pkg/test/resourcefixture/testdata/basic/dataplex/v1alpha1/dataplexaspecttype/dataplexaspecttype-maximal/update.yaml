apiVersion: dataplex.cnrm.cloud.google.com/v1alpha1
kind: DataplexAspectType
metadata:
  name: aspecttype-maximal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  description: "Maximal aspect type description updated"
  displayName: "Maximal Aspect Type Updated"
  metadataTemplate:
    name: "RecordTemplate"
    type: "record"
    recordFields:
      - name: "string_field"
        type: "string"
        index: 1
        constraints:
          required: true
        annotations:
          displayName: "String Field"
          description: "A simple string field"
      - name: "int_field"
        type: "int"
        index: 2
        annotations:
          displayName: "Integer Field Updated"
