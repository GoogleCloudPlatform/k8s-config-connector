apiVersion: ftp.cnrm.cloud.google.com/v1alpha1
kind: FTPUser
metadata:
  name: ftpumax-${uniqueId}
  labels:
    test-label: ftpuser-${uniqueId}
spec:
  resourceID: ftpumax-${uniqueId}
  parentRef:
    name: ftpserv-max-${uniqueId}
  customerServiceAccountRef:
    name: ftpsa-max-${uniqueId}
  userCredentials:
  - credentialName: cred-max
    credentialType: PUBLIC_KEY
    sshPublicKeyBody: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHim2opOwxlv6qeSHf0HnRTHF6tlsOWUfOM2CbLBz3sH"
  storageDirectoryMappings:
  - bucketRef:
      name: ftpbucket-max-${uniqueId}
    bucketPrefix: "uploads"
    directory: "/home/user"
    permission: READ_WRITE
