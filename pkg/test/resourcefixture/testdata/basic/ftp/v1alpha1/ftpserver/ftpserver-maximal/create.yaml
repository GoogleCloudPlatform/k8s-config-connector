apiVersion: ftp.cnrm.cloud.google.com/v1alpha1
kind: FTPServer
metadata:
  name: ftpmax-${uniqueId}
  labels:
    test-label: ftpserver-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-west1
  resourceID: ftpmax-${uniqueId}
  displayName: ftpmax-${uniqueId}
  accessType: INTERNAL
  internalConfig:
    consumerAcceptList:
    - projectRef:
        external: projects/${projectId}
      connectionLimit: 10
    consumerRejectList:
    - projectRef:
        external: projects/1234567890
