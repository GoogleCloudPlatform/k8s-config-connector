apiVersion: dlp.cnrm.cloud.google.com/v1alpha1
kind: DLPContentPolicy
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 2
  labels:
    cnrm-test: "true"
  name: dlpcontentpolicy-maximal-${uniqueId}
  namespace: ${uniqueId}
spec:
  defaultAction:
    returnVerdict: BLOCK
  displayName: Maximal DLP Content Policy Updated
  failedToScanSupportedFileType:
    returnVerdict: BLOCK
  inputTooLarge:
    returnVerdict: BLOCK
  inspectConfig:
    includeQuote: false
    infoTypes:
    - name: EMAIL_ADDRESS
    - name: PHONE_NUMBER
    limits:
      maxFindingsPerItem: 20
    minLikelihood: LIKELY
  location: global
  projectRef:
    external: ${projectId}
  rules:
  - action:
      returnVerdict: BLOCK
    conditions:
    - infoTypeCondition:
        infoTypes:
          infoTypeNames:
          - EMAIL_ADDRESS
        minCount: 1
  - action:
      returnVerdict: ALLOW
    conditions:
    - infoTypeCondition:
        infoTypes:
          infoTypeNames:
          - PHONE_NUMBER
        minCount: 5
  unsupportedFileType:
    returnVerdict: BLOCK
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/locations/global/contentPolicies/dlpcontentpolicy-maximal-${uniqueId}
  observedGeneration: 2
  observedState:
    createTime: "1970-01-01T00:00:00Z"
    updateTime: "1970-01-01T00:00:00Z"
