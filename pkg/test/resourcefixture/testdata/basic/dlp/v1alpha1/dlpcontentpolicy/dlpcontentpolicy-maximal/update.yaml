apiVersion: dlp.cnrm.cloud.google.com/v1alpha1
kind: DLPContentPolicy
metadata:
  name: dlpcontentpolicy-maximal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: global
  displayName: Maximal DLP Content Policy Updated
  inspectConfig:
    infoTypes:
    - name: EMAIL_ADDRESS
    - name: PHONE_NUMBER
    minLikelihood: LIKELY
    limits:
      maxFindingsPerItem: 20
    includeQuote: false
  rules:
  - action:
      returnVerdict: BLOCK
    conditions:
    - infoTypeCondition:
        minCount: 1
        infoTypes:
          infoTypeNames:
          - EMAIL_ADDRESS
  - action:
      returnVerdict: ALLOW
    conditions:
    - infoTypeCondition:
        minCount: 5
        infoTypes:
          infoTypeNames:
          - PHONE_NUMBER
  unsupportedFileType:
    returnVerdict: BLOCK
  inputTooLarge:
    returnVerdict: BLOCK
  failedToScanSupportedFileType:
    returnVerdict: BLOCK
  defaultAction:
    returnVerdict: BLOCK
