apiVersion: datamigration.cnrm.cloud.google.com/v1alpha1
kind: DatabaseMigrationConversionWorkspace
metadata:
  name: db-mw-min-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  source:
    engine: ORACLE
    version: "11"
  destination:
    engine: POSTGRESQL
    version: "14"
