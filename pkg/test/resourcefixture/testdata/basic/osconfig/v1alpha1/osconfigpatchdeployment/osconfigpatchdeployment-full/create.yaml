apiVersion: osconfig.cnrm.cloud.google.com/v1alpha1
kind: OSConfigPatchDeployment
metadata:
  name: ospd-full-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  patchDeploymentId: ospd-full-${uniqueId}
  description: "Full test deployment"
  duration: 3600s
  instanceFilter:
    all: true
  patchConfig:
    rebootConfig: DEFAULT
  oneTimeSchedule:
    executeTime: "2026-12-31T23:59:59Z"
