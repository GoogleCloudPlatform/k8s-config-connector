apiVersion: migrationcenter.cnrm.cloud.google.com/v1alpha1
kind: MigrationCenterGroup
metadata:
  name: migrationcentergroup-minimal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
---
apiVersion: migrationcenter.cnrm.cloud.google.com/v1alpha1
kind: MigrationCenterPreferenceSet
metadata:
  name: migrationcenterpreferenceset-minimal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
---
apiVersion: migrationcenter.cnrm.cloud.google.com/v1alpha1
kind: MigrationCenterReportConfig
metadata:
  name: migrationcenterreportconfig-minimal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  groupPreferencesetAssignments:
    - groupRef:
        name: migrationcentergroup-minimal-${uniqueId}
      preferenceSetRef:
        name: migrationcenterpreferenceset-minimal-${uniqueId}
