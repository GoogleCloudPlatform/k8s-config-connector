apiVersion: bigquerymigration.cnrm.cloud.google.com/v1alpha1
kind: BigQueryMigrationMigrationWorkflow
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    cnrm-test: "true"
  name: bigquerymigrationmigrationworkflow-maximal-${uniqueId}
  namespace: ${uniqueId}
spec:
  displayName: Maximal Migration Workflow ${uniqueId}
  location: us
  projectRef:
    external: ${projectId}
  tasks:
    task-1:
      translationTaskDetails:
        fileEncoding: UTF_8
        filter:
          inputFileExclusionPrefixes:
          - gcs_prefix
        identifierSettings:
          identifierRewriteMode: REWRITE_ALL
          outputIdentifierCase: UPPER
        inputPath: gs://bigquerymigration-dep-${uniqueId}/input/
        outputPath: gs://bigquerymigration-dep-${uniqueId}/output/
        schemaPath: gs://bigquerymigration-dep-${uniqueId}/schema/
        teradataOptions: {}
        translationExceptionTable: dataset.table
      type: Translation_Teradata2BQ
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/locations/us/workflows/${workflowID}
  observedGeneration: 1
  observedState:
    name: projects/${projectNumber}/locations/us/workflows/${workflowID}
    state: RUNNING
