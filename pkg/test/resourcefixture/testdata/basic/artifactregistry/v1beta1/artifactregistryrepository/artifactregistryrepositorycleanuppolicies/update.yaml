apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
kind: ArtifactRegistryRepository
metadata:
  labels:
    label-one: "value-one"
  name: arrepository-${uniqueId}
spec:
  format: DOCKER
  location: us-west1
  description: "test repository description 2"
  cleanupPolicies:
  - id: "delete-prerelease"
    action: "DELETE"
    condition:
      tagPrefixes:
      - "alpha"
      - "beta"
      olderThan: "2592000s"
  - id: "keep-minimum-versions"
    action: "KEEP"
    mostRecentVersions:
      keepCount: 10
      packageNamePrefixes:
      - "pkg"
