apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
kind: ArtifactRegistryRepository
metadata:
  annotations:
    cnrm.cloud.google.com/project-id: ${projectId}
  labels:
    cnrm-test: "true"
    label-one: value-one
    label-two: value-two
    managed-by-cnrm: "true"
  name: arrepository-remote-${uniqueId}
spec:
  description: updated remote repository description
  format: DOCKER
  location: us-central1
  mode: REMOTE_REPOSITORY
  remoteRepositoryConfig:
    description: custom docker remote repository
    dockerRepository:
      customRepository:
        uri: https://registry-1.docker.io
  resourceID: arrepository-remote-${uniqueId}