apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
kind: ArtifactRegistryRepository
metadata:
  annotations:
    cnrm.cloud.google.com/project-id: ${projectId}
  labels:
    cnrm-test: "true"
    label-one: value-one
    managed-by-cnrm: "true"
  name: arremoterepo-${uniqueId}
spec:
  description: test remote repository with common repository updated description
  format: DOCKER
  location: us-west1
  mode: REMOTE_REPOSITORY
  remoteRepositoryConfig:
    commonRepository:
      uri: https://registry-1.docker.io
    description: test common remote repository
  resourceID: arremoterepo-${uniqueId}