apiVersion: workloadmanager.cnrm.cloud.google.com/v1alpha1
kind: WorkloadManagerEvaluation
metadata:
  # Evaluation IDs default to metadata.name and are limited to 36 characters.
  name: evaluation-maximal-${uniqueId}
spec:
  projectRef:
    external: projects/${projectId}
  location: us-central1
  evaluationType: SQL_SERVER
  description: "Updated Maximal WorkloadManager Evaluation"
  schedule: "0 */6 * * *"
  # Labels are unchanged: real GCP rejects label updates on evaluations.
  labels:
    env: test-env
  resourceFilter:
    scopeRefs:
      - projectRef:
          external: projects/${projectId}
    resourceIDPatterns:
      - ".*sql-server.*"
    inclusionLabels:
      env: prod-updated
