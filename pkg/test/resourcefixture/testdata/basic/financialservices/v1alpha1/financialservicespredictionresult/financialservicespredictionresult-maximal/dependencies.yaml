apiVersion: kms.cnrm.cloud.google.com/v1beta1
kind: KMSKeyRing
metadata:
  annotations:
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
  name: key-ring-${uniqueId}
spec:
  location: us-central1
---
apiVersion: kms.cnrm.cloud.google.com/v1beta1
kind: KMSCryptoKey
metadata:
  annotations:
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
  name: kmscryptokey-${uniqueId}
spec:
  keyRingRef:
    name: key-ring-${uniqueId}
  purpose: ENCRYPT_DECRYPT
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicy
metadata:
  annotations:
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
  name: iampolicy-${uniqueId}
spec:
  resourceRef:
    apiVersion: kms.cnrm.cloud.google.com/v1beta1
    kind: KMSCryptoKey
    name: kmscryptokey-${uniqueId}
  bindings:
    - role: roles/cloudkms.cryptoKeyEncrypterDecrypter
      members:
        - serviceAccount:service-${projectNumber}@gcp-sa-financialservices.iam.gserviceaccount.com
---
apiVersion: financialservices.cnrm.cloud.google.com/v1alpha1
kind: FinancialServicesInstance
metadata:
  name: financialservicesinstance-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  kmsKeyRef:
    name: kmscryptokey-${uniqueId}
