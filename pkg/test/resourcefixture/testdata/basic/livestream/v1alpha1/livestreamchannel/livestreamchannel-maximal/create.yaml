apiVersion: livestream.cnrm.cloud.google.com/v1alpha1
kind: LiveStreamChannel
metadata:
  name: livestreamchannel-maximal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  resourceID: livestreamchannel-maximal-${uniqueId}
  labels:
    env: test
    app: live
  inputAttachments:
    - key: input-attachment-1
      inputRef:
        name: livestreamchannel-max-input1-${uniqueId}
      automaticFailover:
        inputKeys:
          - input-attachment-2
    - key: input-attachment-2
      inputRef:
        name: livestreamchannel-max-input2-${uniqueId}
  output:
    uri: gs://livestreamchannel-max-${uniqueId}/output/
  elementaryStreams:
    - key: es-video
      videoStream:
        h264:
          widthPixels: 1280
          heightPixels: 720
          frameRate: 30
          bitrateBps: 2000000
          allowOpenGop: false
          gopDuration: 2s
          entropyCoder: cabac
          bPyramid: false
          bFrameCount: 3
          aqStrength: 1.0
          profile: high
          tune: zerolatency
    - key: es-audio
      audioStream:
        codec: aac
        channelCount: 2
        channelLayout:
          - fl
          - fr
        bitrateBps: 128000
        sampleRateHertz: 48000
        mapping:
          - inputKey: input-attachment-1
            inputTrack: 0
            inputChannel: 0
            outputChannel: 0
            gainDb: 0.0
    - key: es-text
      textStream:
        codec: cea608
  muxStreams:
    - key: mux-video
      container: fmp4
      elementaryStreams:
        - es-video
      segmentSettings:
        segmentDuration: 2s
    - key: mux-audio
      container: fmp4
      elementaryStreams:
        - es-audio
      segmentSettings:
        segmentDuration: 2s
  manifests:
    - key: manifest-hls
      fileName: manifest.m3u8
      type: HLS
      muxStreams:
        - mux-video
        - mux-audio
      maxSegmentCount: 5
      segmentKeepDuration: 60s
  spriteSheets:
    - format: jpeg
      filePrefix: sprite
      spriteWidthPixels: 64
      spriteHeightPixels: 36
      columnCount: 10
      rowCount: 10
      interval: 10s
      quality: 85
  logConfig:
    logSeverity: INFO
  timecodeConfig:
    source: MEDIA_TIMESTAMP
  inputConfig:
    inputSwitchMode: MANUAL
  retentionConfig:
    retentionWindowDuration: 604800s
  staticOverlays:
    - assetRef:
        name: livestreamchannel-max-asset-${uniqueId}
      resolution:
        w: 0.1
        h: 0.1
      position:
        x: 0.8
        "y": 0.8
      opacity: 0.8
