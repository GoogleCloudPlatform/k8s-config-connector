apiVersion: storage.cnrm.cloud.google.com/v1beta1
kind: StorageBucket
metadata:
  name: livestreamchannel-max-${uniqueId}
spec:
  location: us-central1
  softDeletePolicy:
    retentionDurationSeconds: 604800
---
apiVersion: livestream.cnrm.cloud.google.com/v1alpha1
kind: LiveStreamInput
metadata:
  name: livestreamchannel-max-input1-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  type: RTMP_PUSH
---
apiVersion: livestream.cnrm.cloud.google.com/v1alpha1
kind: LiveStreamInput
metadata:
  name: livestreamchannel-max-input2-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  type: RTMP_PUSH
---
apiVersion: livestream.cnrm.cloud.google.com/v1alpha1
kind: LiveStreamAsset
metadata:
  name: livestreamchannel-max-asset-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  image:
    uri: gs://cloud-samples-data/vision/demo-img.jpg
