apiVersion: livestream.cnrm.cloud.google.com/v1alpha1
kind: LiveStreamChannel
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 2
  labels:
    cnrm-test: "true"
  name: livestreamchannel-maximal-${uniqueId}
  namespace: ${uniqueId}
spec:
  elementaryStreams:
  - key: es-video
    videoStream:
      h264:
        allowOpenGop: false
        aqStrength: 1
        bFrameCount: 3
        bPyramid: false
        bitrateBps: 2500000
        entropyCoder: cabac
        frameRate: 30
        gopDuration: 2s
        heightPixels: 720
        profile: high
        tune: zerolatency
        widthPixels: 1280
  - audioStream:
      bitrateBps: 160000
      channelCount: 2
      channelLayout:
      - fl
      - fr
      codec: aac
      mapping:
      - gainDb: 0
        inputChannel: 0
        inputKey: input-attachment-1
        inputTrack: 0
        outputChannel: 0
      sampleRateHertz: 48000
    key: es-audio
  - key: es-text
    textStream:
      codec: cea608
  inputAttachments:
  - automaticFailover:
      inputKeys:
      - input-attachment-2
    inputRef:
      name: livestreamchannel-max-input1-${uniqueId}
    key: input-attachment-1
  - inputRef:
      name: livestreamchannel-max-input2-${uniqueId}
    key: input-attachment-2
  inputConfig:
    inputSwitchMode: FAILOVER_PREFER_PRIMARY
  labels:
    app: live
    env: test
  location: us-central1
  logConfig:
    logSeverity: WARNING
  manifests:
  - fileName: manifest.m3u8
    key: manifest-hls
    maxSegmentCount: 6
    muxStreams:
    - mux-video
    - mux-audio
    segmentKeepDuration: 60s
    type: HLS
  muxStreams:
  - container: fmp4
    elementaryStreams:
    - es-video
    key: mux-video
    segmentSettings:
      segmentDuration: 2s
  - container: fmp4
    elementaryStreams:
    - es-audio
    key: mux-audio
    segmentSettings:
      segmentDuration: 2s
  output:
    uri: gs://livestreamchannel-max-${uniqueId}/output/
  projectRef:
    external: ${projectId}
  resourceID: livestreamchannel-maximal-${uniqueId}
  retentionConfig:
    retentionWindowDuration: 604800s
  spriteSheets:
  - columnCount: 10
    filePrefix: sprite
    format: jpeg
    interval: 10s
    quality: 90
    rowCount: 10
    spriteHeightPixels: 36
    spriteWidthPixels: 64
  staticOverlays:
  - assetRef:
      name: livestreamchannel-max-asset-${uniqueId}
    opacity: 0.8
    position:
      x: 0.8
      "y": 0.8
    resolution:
      h: 0.1
      w: 0.1
  timecodeConfig:
    source: MEDIA_TIMESTAMP
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/locations/us-central1/channels/livestreamchannel-maximal-${uniqueId}
  observedGeneration: 2
  observedState:
    activeInput: input-attachment-1
    createTime: "1970-01-01T00:00:00Z"
    streamingState: STOPPED
    updateTime: "1970-01-01T00:00:00Z"
