apiVersion: storage.cnrm.cloud.google.com/v1beta1
kind: StorageBucket
metadata:
  name: livestreamdvrsession-max-${uniqueId}
spec:
  location: us-central1
  softDeletePolicy:
    retentionDurationSeconds: 604800
---
apiVersion: livestream.cnrm.cloud.google.com/v1alpha1
kind: LiveStreamInput
metadata:
  name: livestreamdvrsession-max-input-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  type: RTMP_PUSH
---
apiVersion: livestream.cnrm.cloud.google.com/v1alpha1
kind: LiveStreamChannel
metadata:
  name: livestreamdvrsession-max-channel-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  retentionConfig:
    retentionWindowDuration: 86400s
  inputAttachments:
    - key: input-attachment-1
      inputRef:
        name: livestreamdvrsession-max-input-${uniqueId}
  output:
    uri: gs://livestreamdvrsession-max-${uniqueId}/output/
  elementaryStreams:
    - key: es-video
      videoStream:
        h264:
          widthPixels: 1280
          heightPixels: 720
          frameRate: 30
          bitrateBps: 2000000
    - key: es-audio
      audioStream:
        codec: aac
        channelCount: 2
        bitrateBps: 128000
  muxStreams:
    - key: mux-video
      container: fmp4
      elementaryStreams:
        - es-video
      segmentSettings:
        segmentDuration: 2s
    - key: mux-audio
      container: fmp4
      elementaryStreams:
        - es-audio
      segmentSettings:
        segmentDuration: 2s
  manifests:
    - key: manifest-hls
      fileName: manifest.m3u8
      type: HLS
      muxStreams:
        - mux-video
        - mux-audio
