apiVersion: redis.cnrm.cloud.google.com/v1beta1
kind: RedisCluster
metadata:
  name: rediscluster-${uniqueId}
spec:
  shardCount: 1
  pscConfigs:
    - networkRef:
        name: default
  location:  us-east1
  projectRef:
    external: ${projectId}
  managedBackupSource:
    backupRef:
      # Use a pre-created Redis backup
      external: projects/${projectId}/locations/us-east1/backupCollections/a83d3b51-adcc-4ccf-8eed-22e8dda0f6ab/backups/test-backup
