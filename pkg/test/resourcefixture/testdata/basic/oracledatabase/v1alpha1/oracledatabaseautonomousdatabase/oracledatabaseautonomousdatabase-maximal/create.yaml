apiVersion: oracledatabase.cnrm.cloud.google.com/v1alpha1
kind: OracleDatabaseAutonomousDatabase
metadata:
  labels:
    env: test
    source: kcc
  name: oracledatabaseautonomousdatabase-maximal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-east4
  database: adbmax${uniqueId}
  displayName: Max ADB ${uniqueId}
  adminPasswordSecretVersionRef:
    name: secretmanagersecretversion-${uniqueId}
  networkRef:
    name: computenetwork-${uniqueId}
  cidr: 10.6.0.0/24
  labels:
    test: max
  properties:
    dbWorkload: OLTP
    licenseType: LICENSE_INCLUDED
    computeCount: 2
    dataStorageSizeTb: 1
    dbVersion: "19c"
    characterSet: "AL32UTF8"
    nCharacterSet: "AL16UTF16"
    isAutoScalingEnabled: false
    isStorageAutoScalingEnabled: false
    maintenanceScheduleType: "REGULAR"
    mtlsConnectionRequired: false
    backupRetentionPeriodDays: 7
    allowlistedIPs:
      - 10.0.0.0/16
    customerContacts:
      - email: "oracle-db-admin@example.com"
