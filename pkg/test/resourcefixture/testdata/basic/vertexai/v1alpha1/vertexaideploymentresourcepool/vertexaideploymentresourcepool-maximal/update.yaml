apiVersion: vertexai.cnrm.cloud.google.com/v1alpha1
kind: VertexAIDeploymentResourcePool
metadata:
  name: pool-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  # Not changed here: real GCP ignores disableContainerLogging in the update mask
  # (true -> false is rejected as "identical to the original").
  disableContainerLogging: true
  dedicatedResources:
    machineSpec:
      machineType: n1-standard-2
    minReplicaCount: 2
    maxReplicaCount: 3
