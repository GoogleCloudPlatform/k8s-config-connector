apiVersion: vertexai.cnrm.cloud.google.com/v1alpha1
kind: VertexAICustomJob
metadata:
  name: customjob-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  displayName: maximal-job-${uniqueId}
  jobSpec:
    workerPoolSpecs:
    - machineSpec:
        machineType: n1-standard-4
      replicaCount: 1
      containerSpec:
        imageURI: alpine:latest
        command: ["sh", "-c", "echo hello world"]
    scheduling:
      timeout: 1800s
      restartJobOnWorkerRestart: false
    enableWebAccess: true
  labels:
    foo: bar
