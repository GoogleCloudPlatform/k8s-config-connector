apiVersion: firebasehosting.cnrm.cloud.google.com/v1alpha1
kind: FirebaseHostingSite
metadata:
  annotations:
    cnrm.cloud.google.com/management-conflict-prevention-policy: none
    cnrm.cloud.google.com/state-into-spec: absent
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    cnrm-test: "true"
  name: firebasehostingsite-${uniqueId}
  namespace: ${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  resourceID: firebasehostingsite${uniqueId}
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  defaultUrl: https://firebasehostingsite${uniqueId}.web.app
  name: projects/${projectId}/sites/firebasehostingsite${uniqueId}
  observedGeneration: 1
