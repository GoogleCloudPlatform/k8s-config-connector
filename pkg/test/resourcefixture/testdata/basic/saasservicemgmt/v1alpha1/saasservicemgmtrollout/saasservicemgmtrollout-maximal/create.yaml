apiVersion: saasservicemgmt.cnrm.cloud.google.com/v1alpha1
kind: SaaSServiceMgmtRollout
metadata:
  name: saasservicemgmtrollout-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  releaseRef:
    name: saasservicemgmtrelease-${uniqueId}
  rolloutKindRef:
    external: "projects/${projectId}/locations/us-central1/rolloutKinds/kcc-test-rollout-kind"
  rolloutOrchestrationStrategy: "Google.Cloud.Simple.AllAtOnce"
  unitFilter: "true"
  control:
    action: ROLLOUT_ACTION_RUN
    runParams:
      retryFailedOperations: false
