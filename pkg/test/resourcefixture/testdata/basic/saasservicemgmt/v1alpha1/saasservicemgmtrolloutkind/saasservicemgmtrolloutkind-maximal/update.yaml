apiVersion: saasservicemgmt.cnrm.cloud.google.com/v1alpha1
kind: SaaSServiceMgmtRolloutKind
metadata:
  name: saasservicemgmtrolloutkind-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  unitKind: "projects/${projectId}/locations/us-central1/unitKinds/kcc-test-unit-kind"
  unitFilter: "unit.labels.tier == 'staging'"
  rolloutOrchestrationStrategy: "Google.Cloud.Simple.OneLocationAtATime"
  updateUnitKindStrategy: "UPDATE_UNIT_KIND_STRATEGY_NEVER"
  errorBudget:
    allowedCount: 10
    allowedPercentage: 20
