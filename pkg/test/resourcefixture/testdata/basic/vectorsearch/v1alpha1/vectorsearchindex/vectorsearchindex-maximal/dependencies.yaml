apiVersion: vectorsearch.cnrm.cloud.google.com/v1alpha1
kind: VectorSearchCollection
metadata:
  name: vsc-dep-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  displayName: "Vector Search Collection for Index Maximal"
  description: "Collection for testing maximal index"
  vectorSchema:
    my_vector_field:
      denseVector:
        dimensions: 128
  dataSchema:
    type: "object"
    properties:
      title:
        type: "string"
      plot:
        type: "string"
