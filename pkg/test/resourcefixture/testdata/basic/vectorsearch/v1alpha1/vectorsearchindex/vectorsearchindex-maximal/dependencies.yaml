apiVersion: vectorsearch.cnrm.cloud.google.com/v1alpha1
kind: VectorSearchCollection
metadata:
  name: vsc-max-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  displayName: "Maximal Vector Search Collection"
  description: "Initial description of maximal collection"
  labels:
    env: "test"
    owner: "kcc"
  vectorSchema:
    my_vector_field:
      denseVector:
        dimensions: 128
        vertexEmbeddingConfig:
          modelID: "publishers/google/models/textembedding-gecko@001"
          textTemplate: "Movie Title: {title} ---- Movie Plot: {plot}"
          taskType: "RETRIEVAL_DOCUMENT"
  dataSchema:
    type: "object"
    properties:
      title:
        type: "string"
      plot:
        type: "string"
