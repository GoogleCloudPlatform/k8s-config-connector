apiVersion: vectorsearch.cnrm.cloud.google.com/v1alpha1
kind: VectorsearchIndex
metadata:
  name: vsi-max-${uniqueId}
spec:
  parentRef:
    name: vsc-max-${uniqueId}
  resourceID: vsi-max-${uniqueId}
  displayName: "Updated Maximal Vector Search Index"
  description: "Updated description of maximal index"
  distanceMetric: "DOT_PRODUCT"
  indexField: "my_vector_field"
  filterFields:
    - "title"
  storeFields:
    - "plot"
  dedicatedInfrastructure:
    mode: "PERFORMANCE_OPTIMIZED"
    autoscalingSpec:
      minReplicaCount: 3
      maxReplicaCount: 6
  denseScann:
    featureNormType: "NONE"
