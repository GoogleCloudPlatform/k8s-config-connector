  externalRef: projects/${projectId}/locations/us-central1/kmsConfigs/netappkmsconfig-minimal-${uniqueId}
  observedGeneration: 1
  observedState:
    createTime: "1970-01-01T00:00:00Z"
    instructions: |-
      Please copy and paste the commands listed below into Google Cloud Shell in the project that contains the key ring. The commands create a KMS role and assign it to the CVS service account so that it can access the key.
      ## CREATE KMS role ## gcloud iam roles create cmekNetAppVolumesRole --project=${projectId} --title='cmekNetAppVolumesRole' --description='custom cmek cvs role' --permissions=cloudkms.cryptoKeyVersions.get,cloudkms.cryptoKeyVersions.list,cloudkms.cryptoKeyVersions.useToDecrypt,cloudkms.cryptoKeyVersions.useToEncrypt,cloudkms.cryptoKeys.get,cloudkms.keyRings.get,cloudkms.locations.get,cloudkms.locations.list,resourcemanager.projects.get --stage=GA
       ## ASSIGN role and give KEY ACCESS to CVS service account ## gcloud kms keys add-iam-policy-binding kmscryptokey-${uniqueId} --project=${projectId} --keyring key-ring-${uniqueId} --location us-central1 --member serviceAccount:n-cmek-usce1-${projectNumber}@netapp-cmek-prod.iam.gserviceaccount.com --role projects/${projectId}/roles/cmekNetAppVolumesRole
    serviceAccount: n-cmek-usce1-${projectNumber}@netapp-cmek-prod.iam.gserviceaccount.com
    state: KEY_CHECK_PENDING
    stateDetails: Credentials created and key check pending
