apiVersion: netapp.cnrm.cloud.google.com/v1alpha1
kind: NetAppStoragePool
metadata:
  name: netappstoragepool-${uniqueId}
  labels:
    label-one: value-one
spec:
  projectRef:
    external: projects/${projectId}
  location: us-central1
  serviceLevel: STANDARD
  capacityGib: 2048
  networkRef:
    external: projects/${projectId}/global/networks/default
  description: "Initial description for maximal storage pool"
  zone: us-central1-a
  replicaZone: us-central1-b
