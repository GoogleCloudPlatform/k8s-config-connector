apiVersion: transcoder.cnrm.cloud.google.com/v1alpha1
kind: TranscoderJobTemplate
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    cnrm-test: "true"
    env: updated
  name: transcoderjobtemplate-${uniqueId}
  namespace: ${uniqueId}
spec:
  config:
    elementaryStreams:
    - key: video-stream0
      videoStream:
        h264:
          bitrateBps: 550000
          frameRate: 60
          heightPixels: 360
          widthPixels: 640
    muxStreams:
    - container: mp4
      elementaryStreams:
      - video-stream0
      key: sd
  location: us-central1
  projectRef:
    external: ${projectId}
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/locations/us-central1/jobTemplates/transcoderjobtemplate-${uniqueId}
  observedGeneration: 1
  observedState:
    config:
      inputs:
      - {}
