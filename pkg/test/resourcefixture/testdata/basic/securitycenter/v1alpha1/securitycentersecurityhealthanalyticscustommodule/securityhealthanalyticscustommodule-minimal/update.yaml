apiVersion: securitycenter.cnrm.cloud.google.com/v1alpha1
kind: SecuritycenterSecurityHealthAnalyticsCustomModule
metadata:
  name: scsha-min-${uniqueId}
spec:
  organizationRef:
    external: organizations/${TEST_ORG_ID}
  displayName: "custom_sha_module_${uniqueId}"
  enablementState: DISABLED
  customConfig:
    predicate:
      expression: "resource.rotationPeriod > duration('2592000s')"
    resourceSelector:
      resourceTypes:
        - "cloudkms.googleapis.com/CryptoKey"
    severity: LOW
    description: "The rotation period is greater than 30 days."
    recommendation: "Set the rotation period to less than or equal to 30 days."
