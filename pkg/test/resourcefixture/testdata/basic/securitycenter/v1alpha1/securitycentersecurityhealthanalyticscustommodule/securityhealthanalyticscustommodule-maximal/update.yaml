apiVersion: securitycenter.cnrm.cloud.google.com/v1alpha1
kind: SecuritycenterSecurityHealthAnalyticsCustomModule
metadata:
  name: scsha-max-${uniqueId}
spec:
  organizationRef:
    external: organizations/${TEST_ORG_ID}
  displayName: "custom_sha_max_${uniqueId}"
  enablementState: DISABLED
  customConfig:
    predicate:
      expression: "resource.rotationPeriod > duration('2592000s')"
      title: "Key Rotation Check Updated"
      description: "Updated checks if key rotation period is too long"
      location: "customConfig.predicate"
    customOutput:
      properties:
        - name: "rotation_period"
          valueExpression:
            expression: "resource.rotationPeriod"
            title: "Rotation Period Updated"
            description: "Updated resource rotation period value"
            location: "customOutput.properties[0]"
    resourceSelector:
      resourceTypes:
        - "cloudkms.googleapis.com/CryptoKey"
    severity: CRITICAL
    description: "Updated rotation period description."
    recommendation: "Updated recommendation."
