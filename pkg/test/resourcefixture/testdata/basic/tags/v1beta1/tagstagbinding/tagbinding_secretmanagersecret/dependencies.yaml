apiVersion: tags.cnrm.cloud.google.com/v1beta1
kind: TagsTagKey
metadata:
  annotations:
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
  name: tagstagkey-${uniqueId}
spec:
  description: Tag key for a Secret Manager secret.
  parent: projects/${projectNumber}
  shortName: secrettag${uniqueId}
---
apiVersion: tags.cnrm.cloud.google.com/v1beta1
kind: TagsTagValue
metadata:
  annotations:
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
  name: tagstagvalue-${uniqueId}
spec:
  description: Tag value for a Secret Manager secret.
  parentRef:
    name: tagstagkey-${uniqueId}
  shortName: enabled
---
apiVersion: secretmanager.cnrm.cloud.google.com/v1beta1
kind: SecretManagerSecret
metadata:
  annotations:
    cnrm.cloud.google.com/project-id: ${projectId}
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
  name: secretmanagersecret-${uniqueId}
spec:
  replication:
    automatic: true
