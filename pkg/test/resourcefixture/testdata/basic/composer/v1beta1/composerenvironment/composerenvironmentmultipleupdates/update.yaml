apiVersion: composer.cnrm.cloud.google.com/v1beta1
kind: ComposerEnvironment
metadata:
  name: composerenvironment-${uniqueId}
spec:
  location: us-central1
  projectRef:
    external: ${projectId}
  config:
    nodeConfig:
      serviceAccountRef:
        name: sa-${uniqueId}
    resilienceMode: HIGH_RESILIENCE
    recoveryConfig:
      scheduledSnapshotsConfig:
        enabled: true
        snapshotCreationSchedule: "0 5 * * *"
        timeZone: "UTC"
        snapshotLocation: "gs://bucket-${uniqueId}/snapshots"
    workloadsConfig:
      scheduler:
        cpu: "1"
        memoryGB: "2.5"
        storageGB: "2"
        count: 2
      webServer:
        cpu: "1"
        memoryGB: "3"
        storageGB: "2"
      worker:
        cpu: "1"
        memoryGB: "2.5"
        storageGB: "2"
        minCount: 2
        maxCount: 6
      triggerer:
        count: 2
        cpu: "1"
        memoryGB: "1.5"
      dagProcessor:
        count: 2
        cpu: "1"
        memoryGB: "4"
        storageGB: "2"
