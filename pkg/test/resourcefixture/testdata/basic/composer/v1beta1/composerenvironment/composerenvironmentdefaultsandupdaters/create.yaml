apiVersion: composer.cnrm.cloud.google.com/v1beta1
kind: ComposerEnvironment
metadata:
  name: composerenvironment-${uniqueId}
spec:
  location: us-central1
  projectRef:
    external: ${projectId}
  labels:
    env: initial
    tier: backend
  config:
    nodeConfig:
      serviceAccountRef:
        name: sa-${uniqueId}
    privateEnvironmentConfig:
      enablePrivateBuildsOnly: true
    dataRetentionConfig:
      airflowMetadataRetentionConfig:
        retentionMode: RETENTION_MODE_ENABLED
        retentionDays: 60
    maintenanceWindow:
      startTime: "2024-01-01T00:00:00Z"
      endTime: "2024-01-01T06:00:00Z"
      recurrence: "FREQ=WEEKLY;BYDAY=SA,SU"
    softwareConfig:
      cloudDataLineageIntegration:
        enabled: true
      webServerPluginsMode: PLUGINS_ENABLED
      envVariables:
        INITIAL_VAR: "1"
