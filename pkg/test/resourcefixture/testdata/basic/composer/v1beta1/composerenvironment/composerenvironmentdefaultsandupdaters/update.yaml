apiVersion: composer.cnrm.cloud.google.com/v1beta1
kind: ComposerEnvironment
metadata:
  name: composerenvironment-${uniqueId}
spec:
  location: us-central1
  projectRef:
    external: ${projectId}
  config:
    # 1. nodeConfig.serviceAccountRef is OMITTED -> verifies computedFieldPaths copies SA from actualPb
    privateEnvironmentConfig:
      enablePrivateBuildsOnly: true
    # 2. dataRetentionConfig: updates retentionDays to 30 with explicit required retentionMode
    dataRetentionConfig:
      airflowMetadataRetentionConfig:
        retentionMode: RETENTION_MODE_ENABLED
        retentionDays: 30
    # 3. maintenanceWindow: updates recurrence with explicit required startTime and endTime
    maintenanceWindow:
      startTime: "2024-01-01T00:00:00Z"
      endTime: "2024-01-01T06:00:00Z"
      recurrence: "FREQ=WEEKLY;BYDAY=FR,SA,SU"
    # 4. Disables cloudDataLineageIntegration -> verifies disable normalization and no PATCH loop
    softwareConfig:
      cloudDataLineageIntegration:
        enabled: false
