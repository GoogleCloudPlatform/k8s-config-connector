apiVersion: composer.cnrm.cloud.google.com/v1beta1
kind: ComposerEnvironment
metadata:
  name: composerenvironment-${uniqueId}
spec:
  location: us-central1
  projectRef:
    external: ${projectId}
  config:
    # 1. nodeConfig.serviceAccountRef remains OMITTED -> verifies computedFieldPaths copies default SA
    # 2. privateEnvironmentConfig.enablePrivateBuildsOnly is OMITTED -> verifies computedFieldPaths
    #    copies true from actualPb so validateUpdatableFields succeeds on acquisition/update
    # 3. Partial dataRetentionConfig: updates retentionDays to 30 while OMITTING retentionMode
    dataRetentionConfig:
      airflowMetadataRetentionConfig:
        retentionDays: 30
    # 4. Partial maintenanceWindow: updates recurrence while OMITTING startTime and endTime
    maintenanceWindow:
      recurrence: "FREQ=WEEKLY;BYDAY=FR,SA,SU"
    # 5. Disables cloudDataLineageIntegration -> verifies disable nil-guard and no PATCH loop
    softwareConfig:
      cloudDataLineageIntegration:
        enabled: false
