apiVersion: filestore.cnrm.cloud.google.com/v1beta1
kind: FilestoreInstance
metadata:
  name: filestoresrc-${uniqueId}
spec:
  description: "Source instance for backup"
  location: us-central1-b
  tier: PREMIUM
  fileShares:
  - capacityGb: 2560
    name: my_share
  networks:
  - networkRef:
      name: default
    modes:
    - MODE_IPV4
  projectRef:
    external: ${projectId}
---
apiVersion: filestore.cnrm.cloud.google.com/v1beta1
kind: FilestoreBackup
metadata:
  name: filestorebackup-${uniqueId}
spec:
  description: "Backup for restore"
  location: us-central1
  sourceFileShare: my_share
  sourceInstanceRef:
    name: filestoresrc-${uniqueId}
  projectRef:
    external: ${projectId}
