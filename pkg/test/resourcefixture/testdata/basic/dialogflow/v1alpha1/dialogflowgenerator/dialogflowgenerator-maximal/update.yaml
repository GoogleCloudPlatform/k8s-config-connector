apiVersion: dialogflow.cnrm.cloud.google.com/v1alpha1
kind: DialogflowGenerator
metadata:
  name: dialogflowgenerator-maximal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: global
  description: "Updated Maximal Dialogflow Generator Description"
  freeFormContext:
    text: "Updated Maximal Generator context text"
  inferenceParameter:
    maxOutputTokens: 512
    temperature: 0.2
    topK: 10
    topP: 0.9
  triggerEvent: MANUAL_CALL
