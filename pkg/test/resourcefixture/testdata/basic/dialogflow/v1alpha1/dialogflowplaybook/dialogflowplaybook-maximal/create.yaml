apiVersion: dialogflow.cnrm.cloud.google.com/v1alpha1
kind: DialogflowPlaybook
metadata:
  name: dialogflowplaybook-${uniqueId}
spec:
  parentRef:
    name: dialogflowcxagent-${uniqueId}
  displayName: Maximal Playbook ${uniqueId}
  goal: Help users with maximal playbook test
  instruction:
    guidelines: Always be polite and helpful to the customer.
    steps:
      - text: Ask customer for account number.
  inputParameterDefinitions:
    - name: account_id
      typeSchema:
        inlineSchema:
          type: STRING
      description: ID of the customer account
  outputParameterDefinitions:
    - name: resolution_summary
      typeSchema:
        inlineSchema:
          type: STRING
      description: Summary of resolution
