apiVersion: dialogflow.cnrm.cloud.google.com/v1alpha1
kind: DialogflowCompanionAgent
metadata:
  name: dialogflowcompanionagent-max-${uniqueId}
spec:
  projectRef:
    external: projects/${projectId}
  location: global
  displayName: "Updated Max Agent ${uniqueId}"
  description: "Updated maximal description for companion agent"
  skillConfigs:
    - skillTriggeringEvent: AGENT_MESSAGE
      guidanceSkillConfig:
        overarchingGuidance: "Always provide accurate information."
        guidanceInstructions:
          - displayName: "Order status"
            displayDetails: "Help customer check order status"
            condition: "customer asks for status"
            triggerEvent: AGENT_MESSAGE
            disableSuggestedReply: false
            actions:
              - description: "Lookup order status in system"
    - skillTriggeringEvent: AGENT_MESSAGE
      translationSkillConfig:
        agentLanguageCode: "en-GB"
        customerLanguageCode: "fr"
