apiVersion: dialogflow.cnrm.cloud.google.com/v1alpha1
kind: DialogflowGeneratorEvaluation
metadata:
  name: dfgeneratoreval-max-${uniqueId}
spec:
  parentRef:
    name: dialogflowgenerator-${uniqueId}
  displayName: "Maximal Generator Evaluation ${uniqueId}"
  generatorEvaluationConfig:
    outputGCSBucketPath: gs://${projectId}-df-eval-max-${uniqueId}/eval
    summarizationConfig:
      evaluatorVersion: "2.0"
    inputDataConfig:
      sampleSize: 10
      summaryGenerationOption: ALWAYS_GENERATE
      agentAssistInputDataConfig:
        startTime: "2024-01-01T00:00:00Z"
        endTime: "2024-01-02T00:00:00Z"
  initialGenerator:
    description: "Maximal Dialogflow Generator ${uniqueId}"
    triggerEvent: END_OF_UTTERANCE
    publishedModel: text-bison
    inferenceParameter:
      maxOutputTokens: 200
      temperature: 0.5
      topK: 30
      topP: 0.9
    summarizationContext:
      summarizationSections:
        - type: SITUATION
