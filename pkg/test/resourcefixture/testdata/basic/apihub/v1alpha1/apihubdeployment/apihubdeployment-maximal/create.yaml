apiVersion: apihub.cnrm.cloud.google.com/v1alpha1
kind: APIHubDeployment
metadata:
  name: depl-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  displayName: "Maximal APIHubDeployment"
  description: "A comprehensive APIHubDeployment for E2E testing"
  documentation:
    externalURI: "https://example.com/docs"
  deploymentTypeRef:
    external: "apigee"
  resourceURI: "organizations/test-org/environments/test-env/apis/test-api"
  endpoints:
    - "https://api.example.com"
  sloRef:
    external: "99-9"
  environmentRef:
    external: "staging"
