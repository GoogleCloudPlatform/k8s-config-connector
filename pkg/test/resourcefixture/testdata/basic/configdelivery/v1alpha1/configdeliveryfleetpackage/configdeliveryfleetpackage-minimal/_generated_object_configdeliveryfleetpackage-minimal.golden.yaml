apiVersion: configdelivery.cnrm.cloud.google.com/v1alpha1
kind: ConfigDeliveryFleetPackage
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    cnrm-test: "true"
  name: cdfpackage-${uniqueId}
  namespace: ${uniqueId}
spec:
  location: us-central1
  projectRef:
    external: ${projectId}
  resourceBundleSelector:
    resourceBundle:
      resourceBundleRef:
        external: projects/${projectId}/locations/us-central1/resourceBundles/my-bundle
      tag: v1.0.0
  rolloutStrategy:
    rolling:
      maxConcurrent: 2
  target:
    fleet:
      projectRef:
        external: ${projectId}
  variantSelector:
    variantNameTemplate: default
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/locations/us-central1/fleetPackages/cdfpackage-${uniqueId}
  observedGeneration: 1
  observedState:
    createTime: "1970-01-01T00:00:00Z"
    updateTime: "1970-01-01T00:00:00Z"
