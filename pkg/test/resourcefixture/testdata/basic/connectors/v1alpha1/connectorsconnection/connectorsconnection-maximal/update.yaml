apiVersion: connectors.cnrm.cloud.google.com/v1alpha1
kind: ConnectorsConnection
metadata:
  name: connectorsconnection-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  connectorVersionRef:
    external: projects/${projectId}/locations/global/providers/gcp/connectors/gcs/versions/1
  serviceAccountRef:
    external: ${projectNumber}-compute@developer.gserviceaccount.com
  configVariables:
    - key: project_id
      stringValue: ${projectId}
  description: Maximal ConnectorsConnection update
  labels:
    label-one: value-two
  suspended: false
  nodeConfig:
    minNodeCount: 2
    maxNodeCount: 3
  lockConfig:
    locked: false
