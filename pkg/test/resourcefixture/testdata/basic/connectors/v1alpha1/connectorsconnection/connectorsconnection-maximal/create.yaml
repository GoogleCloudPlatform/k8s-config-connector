apiVersion: connectors.cnrm.cloud.google.com/v1alpha1
kind: ConnectorsConnection
metadata:
  name: conn-max-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  connectorVersionRef:
    external: projects/${projectId}/locations/global/providers/gcp/connectors/pubsub/versions/1
  serviceAccountRef:
    name: conn-sa-max-${uniqueId}
  labels:
    foo: bar
  description: "My connection description maximal"
  suspended: false
  nodeConfig:
    minNodeCount: 2
    maxNodeCount: 5
  configVariables:
    - key: "dummy_key"
      stringValue: "dummy_value"
  lockConfig:
    locked: false
    reason: "not locked"
