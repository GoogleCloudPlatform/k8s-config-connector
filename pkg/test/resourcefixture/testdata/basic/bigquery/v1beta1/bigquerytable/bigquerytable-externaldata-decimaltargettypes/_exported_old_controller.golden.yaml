apiVersion: bigquery.cnrm.cloud.google.com/v1beta1
kind: BigQueryTable
metadata:
  annotations:
    cnrm.cloud.google.com/project-id: ${projectId}
  labels:
    cnrm-test: "true"
    managed-by-cnrm: "true"
  name: bigquerytable-${uniqueId}
spec:
  datasetRef:
    external: bigquerydataset${uniqueId}
  description: An updated BigQuery table with decimalTargetTypes.
  externalDataConfiguration:
    autodetect: true
    compression: NONE
    decimalTargetTypes:
    - NUMERIC
    - BIGNUMERIC
    - STRING
    parquetOptions:
      enableListInference: true
      enumAsString: true
    sourceFormat: PARQUET
    sourceUris:
    - gs://cloud-samples-data/bigquery/us-states/us-states.parquet
  friendlyName: BigQuery Table with DecimalTargetTypes Updated
  resourceID: bigquerytable-${uniqueId}
  schema: '[{"mode":"NULLABLE","name":"name","type":"STRING"},{"mode":"NULLABLE","name":"post_abbr","type":"STRING"}]'
