apiVersion: networkconnectivity.cnrm.cloud.google.com/v1alpha1
kind: NetworkConnectivityPolicyBasedRoute
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    cnrm-test: "true"
    env: updated
  name: ncpbr-${uniqueId}
  namespace: ${uniqueId}
spec:
  description: minimal policy based route
  filter:
    ipProtocol: ALL
    protocolVersion: IPV4
  networkRef:
    name: ${networkID}
  nextHopOtherRoutes: DEFAULT_ROUTING
  projectRef:
    external: ${projectId}
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/locations/global/policyBasedRoutes/ncpbr-${uniqueId}
  observedGeneration: 1
  observedState:
    createTime: "1970-01-01T00:00:00Z"
    kind: networkconnectivity#policyBasedRoute
    updateTime: "1970-01-01T00:00:00Z"
