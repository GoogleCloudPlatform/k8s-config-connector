apiVersion: networkconnectivity.cnrm.cloud.google.com/v1alpha1
kind: NetworkConnectivityPolicyBasedRoute
metadata:
  name: ncpbr-${uniqueId}
  labels:
    env: updated
spec:
  projectRef:
    external: ${projectId}
  description: minimal policy based route
  networkRef:
    name: ncpbr-net-${uniqueId}
  filter:
    protocolVersion: IPV4
    ipProtocol: ALL
  nextHopOtherRoutes: DEFAULT_ROUTING
