apiVersion: networkconnectivity.cnrm.cloud.google.com/v1alpha1
kind: NetworkConnectivityServiceConnectionMap
metadata:
  name: scm-maximal-${uniqueId}
spec:
  projectRef:
    external: projects/${projectId}
  location: us-central1
  description: "An updated maximal test ServiceConnectionMap"
  labels:
    env: staging
    tier: standard
  token: "test-token-${uniqueId}"
  producerPSCConfigs:
  - serviceAttachmentRef:
      external: projects/${projectId}/regions/us-central1/serviceAttachments/sa-mock-${uniqueId}
    automatedDNSCreationSpec:
      dnsSuffix: "example.com."
      hostname: "myhost"
      ttl: "600s"
  consumerPSCConfigs:
  - consumerInstanceProjectRef:
      external: projects/${projectId}
    projectRef:
      external: projects/${projectId}
    networkRef:
      external: projects/${projectId}/global/networks/network-mock-${uniqueId}
    disableGlobalAccess: true
    ipVersion: "IPV4"
    producerInstanceMetadata:
      key1: "val2"
    state: "VALID"
    serviceAttachmentIPAddressMap:
      projects/${projectId}/regions/us-central1/serviceAttachments/sa-mock-${uniqueId}: "10.0.0.20"
