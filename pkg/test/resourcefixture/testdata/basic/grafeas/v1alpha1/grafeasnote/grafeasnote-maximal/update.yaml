apiVersion: grafeas.cnrm.cloud.google.com/v1alpha1
kind: GrafeasNote
metadata:
  name: grafeasnote-maximal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  shortDescription: "Updated Maximal Grafeas Note"
  longDescription: "An updated detailed description of the maximal Grafeas Note"
  relatedURL:
    - label: "Google Cloud Update"
      url: "https://cloud.google.com/update"
  attestation:
    hint:
      humanReadableName: "prod"
