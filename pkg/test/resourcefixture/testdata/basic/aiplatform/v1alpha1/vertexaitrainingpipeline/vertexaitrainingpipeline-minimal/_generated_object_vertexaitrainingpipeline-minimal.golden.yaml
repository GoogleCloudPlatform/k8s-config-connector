apiVersion: aiplatform.cnrm.cloud.google.com/v1alpha1
kind: VertexAITrainingPipeline
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    cnrm-test: "true"
  name: vertexaitrainingpipeline-minimal-${uniqueId}
  namespace: ${uniqueId}
spec:
  displayName: Minimal Training Pipeline
  location: us-central1
  projectRef:
    external: ${projectId}
  trainingTaskDefinition: gs://google-cloud-aiplatform/schema/trainingjob/definition/custom_task_1.0.0.yaml
  trainingTaskInputs:
    structValue:
      workerPoolSpecs:
      - containerSpec:
          imageUri: gcr.io/google-samples/hello-app:1.0
        machineSpec:
          machineType: n1-standard-4
        replicaCount: 1
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectNumber}/locations/us-central1/trainingPipelines/${trainingPipelineID}
  observedGeneration: 1
  observedState:
    createTime: "1970-01-01T00:00:00Z"
    name: projects/${projectNumber}/locations/us-central1/trainingPipelines/${trainingPipelineID}
    state: PIPELINE_STATE_PENDING
    updateTime: "1970-01-01T00:00:00Z"
