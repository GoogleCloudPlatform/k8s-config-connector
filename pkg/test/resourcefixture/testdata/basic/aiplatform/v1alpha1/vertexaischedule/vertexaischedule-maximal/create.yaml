apiVersion: aiplatform.cnrm.cloud.google.com/v1alpha1
kind: VertexAISchedule
metadata:
  annotations:
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
  name: vertexaischedule-maximal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  displayName: "Maximal Schedule"
  maxConcurrentRunCount: 1
  cron: "0 2 * * *"
  startTime: "2027-01-01T00:00:00Z"
  endTime: "2027-12-31T23:59:59Z"
  maxRunCount: 10
  allowQueueing: false
  createPipelineJobRequest:
    pipelineJob:
      projectRef:
        external: ${projectId}
      location: us-central1
      displayName: "Hello World Pipeline Job inside Schedule"
      runtimeConfig:
        gcsOutputDirectoryRef:
          name: vertexai-schedmax-bucket-${uniqueId}
      pipelineSpec:
        pipelineInfo:
          name: "hello-world-pipeline"
        schemaVersion: "2.1.0"
        root:
          dag:
            tasks:
              hello-world-task:
                taskInfo:
                  name: "hello-world-task"
                componentRef:
                  name: "hello-world-component"
                cachingOptions:
                  enableCache: true
        components:
          hello-world-component:
            executorLabel: "hello-world-executor"
        deploymentConfig:
          "@type": "type.googleapis.com/ml_pipelines.PipelineDeploymentConfig"
          executors:
            hello-world-executor:
              container:
                image: "alpine:latest"
                command:
                  - "echo"
                  - "Hello World"
