apiVersion: aiplatform.cnrm.cloud.google.com/v1alpha1
kind: VertexAISchedule
metadata:
  name: ${scheduleID}
spec:
  allowQueueing: true
  createPipelineJobRequest:
    parent: projects/${projectId}/locations/us-central1
    pipelineJob:
      displayName: Hello World Pipeline Job inside Schedule
      location: ""
      pipelineSpec:
        components:
          hello-world-component:
            executorLabel: hello-world-executor
        deploymentConfig:
          '@type': type.googleapis.com/ml_pipelines.PipelineDeploymentConfig
          executors:
            hello-world-executor:
              container:
                command:
                - echo
                - Hello World
                image: alpine:latest
        pipelineInfo:
          name: hello-world-pipeline
        root:
          dag:
            tasks:
              hello-world-task:
                cachingOptions:
                  enableCache: true
                componentRef:
                  name: hello-world-component
                taskInfo:
                  name: hello-world-task
        schemaVersion: 2.1.0
      projectRef: null
      runtimeConfig:
        gcsOutputDirectoryRef:
          external: gs://vertexai-schedmax-bucket-${uniqueId}
  cron: 0 2 * * *
  displayName: Maximal Schedule Updated
  endTime: "1970-01-01T00:00:00Z"
  location: us-central1
  maxConcurrentRunCount: 2
  maxRunCount: 10
  projectRef:
    name: ${projectNumber}
  resourceID: ${scheduleID}
  startTime: "1970-01-01T00:00:00Z"