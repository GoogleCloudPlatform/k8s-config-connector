apiVersion: aiplatform.cnrm.cloud.google.com/v1alpha1
kind: VertexAIStudy
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    cnrm-test: "true"
  name: vertexaistudy-maximal-${uniqueId}
  namespace: ${uniqueId}
spec:
  displayName: maximal_study_${uniqueId}
  location: us-central1
  projectRef:
    external: ${projectId}
  studySpec:
    algorithm: RANDOM_SEARCH
    measurementSelectionType: BEST_MEASUREMENT
    metrics:
    - goal: MAXIMIZE
      metricID: accuracy
    observationNoise: LOW
    parameters:
    - doubleValueSpec:
        maxValue: 0.1
        minValue: 0.0001
      parameterID: learning_rate
      scaleType: UNIT_LINEAR_SCALE
    - integerValueSpec:
        maxValue: 256
        minValue: 16
      parameterID: batch_size
      scaleType: UNIT_LINEAR_SCALE
    - categoricalValueSpec:
        values:
        - adam
        - sgd
      parameterID: optimizer
    - discreteValueSpec:
        values:
        - 128
        - 256
      parameterID: hidden_units
      scaleType: UNIT_LINEAR_SCALE
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectNumber}/locations/us-central1/studies/${studyID}
  observedGeneration: 1
  observedState:
    createTime: "1970-01-01T00:00:00Z"
    name: projects/${projectNumber}/locations/us-central1/studies/${studyID}
    state: ACTIVE
