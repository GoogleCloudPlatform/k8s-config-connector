apiVersion: aiplatform.cnrm.cloud.google.com/v1alpha1
kind: AIPlatformModelMonitor
metadata:
  name: aiplatformmodelmonitor-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  displayName: modelmonitor-upd-${uniqueId}
  modelMonitoringTarget:
    vertexModel:
      modelRef:
        name: model-${uniqueId}
      modelVersionID: "1"
  modelMonitoringSchema:
    featureFields:
    - name: feat1
      dataType: float
    predictionFields:
    - name: pred1
      dataType: float
  notificationSpec:
    emailConfig:
      userEmails:
      - alert-${uniqueId}@example.com
