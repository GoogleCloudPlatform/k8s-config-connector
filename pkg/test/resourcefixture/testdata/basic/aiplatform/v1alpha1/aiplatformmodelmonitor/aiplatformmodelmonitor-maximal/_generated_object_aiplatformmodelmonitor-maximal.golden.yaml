apiVersion: aiplatform.cnrm.cloud.google.com/v1alpha1
kind: AIPlatformModelMonitor
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 2
  labels:
    cnrm-test: "true"
  name: aiplatformmodelmonitor-max-${uniqueId}
  namespace: ${uniqueId}
spec:
  displayName: modelmonitor-upd-${uniqueId}
  location: us-central1
  modelMonitoringSchema:
    featureFields:
    - dataType: float
      name: feat1
    - dataType: categorical
      name: feat2
    predictionFields:
    - dataType: float
      name: pred1
  modelMonitoringTarget:
    vertexModel:
      modelRef:
        name: model-${uniqueId}
      modelVersionID: "1"
  notificationSpec:
    emailConfig:
      userEmails:
      - updated-${uniqueId}@example.com
    enableCloudLogging: true
  projectRef:
    external: ${projectId}
  tabularObjective:
    featureDriftSpec:
      defaultNumericAlertCondition:
        threshold: 0.5
      features:
      - feat1
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/locations/us-central1/modelMonitors/aiplatformmodelmonitor-max-${uniqueId}
  observedGeneration: 2
  observedState: {}
