apiVersion: aiplatform.cnrm.cloud.google.com/v1alpha1
kind: AIPlatformModelMonitor
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 2
  labels:
    cnrm-test: "true"
  name: modelmonitor-max-${uniqueId}
  namespace: ${uniqueId}
spec:
  displayName: modelmonitor-max-${uniqueId}-updated
  location: us-central1
  modelMonitoringSchema:
    featureFields:
    - dataType: string
      name: feature1
    - dataType: float
      name: feature2
    - dataType: integer
      name: feature3
    predictionFields:
    - dataType: float
      name: prediction1
  modelMonitoringTarget:
    vertexModel:
      modelRef:
        name: model-max-${uniqueId}
      modelVersionID: "1"
  notificationSpec:
    emailConfig:
      userEmails:
      - alerts-updated@example.com
    enableCloudLogging: false
  projectRef:
    external: projects/${projectId}
  tabularObjective:
    featureDriftSpec:
      categoricalMetricType: l_infinity
      defaultCategoricalAlertCondition:
        threshold: 0.2
      features:
      - feature1
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/locations/us-central1/modelMonitors/modelmonitor-max-${uniqueId}
  observedGeneration: 2
  observedState: {}
