apiVersion: aiplatform.cnrm.cloud.google.com/v1alpha1
kind: AIPlatformSchedule
metadata:
  annotations:
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 2
  labels:
    cnrm-test: "true"
  name: aiplatformschedule-maximal-${uniqueId}
  namespace: ${uniqueId}
spec:
  allowQueueing: true
  createPipelineJobRequest:
    pipelineJob:
      displayName: Hello World Pipeline Job inside Schedule
      labels:
        environment: test
      location: us-central1
      pipelineSpec:
        components:
          hello-world-component:
            executorLabel: hello-world-executor
        deploymentConfig:
          '@type': type.googleapis.com/ml_pipelines.PipelineDeploymentConfig
          executors:
            hello-world-executor:
              container:
                command:
                - echo
                - Hello World
                image: alpine:latest
        pipelineInfo:
          name: hello-world-pipeline
        root:
          dag:
            tasks:
              hello-world-task:
                cachingOptions:
                  enableCache: true
                componentRef:
                  name: hello-world-component
                taskInfo:
                  name: hello-world-task
        schemaVersion: 2.1.0
      preflightValidations: false
      projectRef:
        external: ${projectId}
      runtimeConfig:
        failurePolicy: PIPELINE_FAILURE_POLICY_FAIL_FAST
        gcsOutputDirectory: gs://vertexai-schedmax-bucket-${uniqueId}
  cron: 0 2 * * *
  displayName: Maximal Schedule Updated
  endTime: "1970-01-01T00:00:00Z"
  location: us-central1
  maxConcurrentRunCount: 2
  maxRunCount: 10
  projectRef:
    external: ${projectId}
  startTime: "1970-01-01T00:00:00Z"
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectNumber}/locations/us-central1/schedules/10982031432294162491
  observedGeneration: 2
  observedState:
    createPipelineJobRequest:
      pipelineJob: {}
    createTime: "1970-01-01T00:00:00Z"
    nextRunTime: "1970-01-01T00:00:00Z"
    state: ACTIVE
    updateTime: "1970-01-01T00:00:00Z"
