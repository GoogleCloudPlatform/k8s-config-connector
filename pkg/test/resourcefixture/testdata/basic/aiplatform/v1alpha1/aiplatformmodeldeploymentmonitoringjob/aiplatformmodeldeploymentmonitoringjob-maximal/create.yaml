apiVersion: aiplatform.cnrm.cloud.google.com/v1alpha1
kind: AIPlatformModelDeploymentMonitoringJob
metadata:
  annotations:
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
  name: aiplatformmodeldeploymentmonitoringjob-maximal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  displayName: "Maximal Model Deployment Monitoring Job ${uniqueId}"
  endpointRef:
    name: vertexaiendpoint-${uniqueId}
  modelDeploymentMonitoringObjectiveConfigs:
    - deployedModelID: "deployed-model-1"
      objectiveConfig:
        predictionDriftDetectionConfig:
          defaultDriftThreshold:
            value: 0.05
  modelDeploymentMonitoringScheduleConfig:
    monitorInterval: 3600s
    monitorWindow: 3600s
  loggingSamplingStrategy:
    randomSampleConfig:
      sampleRate: 0.5
  modelMonitoringAlertConfig:
    emailAlertConfig:
      userEmails:
        - "user@example.com"
    enableLogging: true
  enableMonitoringPipelineLogs: true
  labels:
    env: test
