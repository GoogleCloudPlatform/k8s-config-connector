apiVersion: aiplatform.cnrm.cloud.google.com/v1alpha1
kind: AIPlatformModelDeploymentMonitoringJob
metadata:
  annotations:
    cnrm.cloud.google.com/reconcile-interval-in-seconds: "0"
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 2
  labels:
    cnrm-test: "true"
  name: aiplatformmodeldeploymentmonitoringjob-minimal-${uniqueId}
  namespace: ${uniqueId}
spec:
  displayName: Minimal Model Deployment Monitoring Job Updated ${uniqueId}
  endpointRef:
    name: vertexaiendpoint-${uniqueId}
  location: us-central1
  loggingSamplingStrategy:
    randomSampleConfig:
      sampleRate: 0.8
  modelDeploymentMonitoringObjectiveConfigs:
  - deployedModelID: deployed-model-1
    objectiveConfig:
      predictionDriftDetectionConfig:
        defaultDriftThreshold:
          value: 0.1
  modelDeploymentMonitoringScheduleConfig:
    monitorInterval: 3600s
  projectRef:
    external: ${projectId}
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectNumber}/locations/us-central1/modelDeploymentMonitoringJobs/${modelDeploymentMonitoringJobID}
  observedGeneration: 2
  observedState:
    bigqueryTables:
    - bigqueryTablePath: bq://${projectId}.model_deployment_monitoring_vertexaiendpoint-${uniqueId}.serving_predict
      logSource: SERVING
      logType: PREDICT
    createTime: "1970-01-01T00:00:00Z"
    name: projects/${projectNumber}/locations/us-central1/modelDeploymentMonitoringJobs/${modelDeploymentMonitoringJobID}
    nextScheduleTime: "1970-01-01T00:00:00Z"
    scheduleState: OFFLINE
    state: JOB_STATE_RUNNING
    updateTime: "1970-01-01T00:00:00Z"
