apiVersion: aiplatform.cnrm.cloud.google.com/v1alpha1
kind: VertexAIExtension
metadata:
  name: extension-max-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  displayName: "Maximal Extension"
  description: "A maximal extension for testing"
  manifest:
    name: "maximal_extension"
    description: "A maximal extension for testing"
    apiSpec:
      openAPIYaml: |
        openapi: 3.0.0
        info:
          title: Maximal API
          version: 1.0.0
        servers:
          - url: https://example.com
        paths:
          /hello:
            get:
              summary: Says hello
              operationId: sayHello
              responses:
                '200':
                  description: A successful response
    authConfig:
      authType: "NO_AUTH"
