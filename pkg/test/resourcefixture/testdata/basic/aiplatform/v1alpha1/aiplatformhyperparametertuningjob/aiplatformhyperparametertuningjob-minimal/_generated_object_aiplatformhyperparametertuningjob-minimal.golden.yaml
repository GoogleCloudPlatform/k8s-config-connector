    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/locations/us-central1/hyperparameterTuningJobs/4195856845425868800
  observedGeneration: 1
  observedState:
    createTime: "1970-01-01T00:00:00Z"
    state: JOB_STATE_PENDING
    updateTime: "1970-01-01T00:00:00Z"
