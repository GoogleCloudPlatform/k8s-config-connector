apiVersion: aiplatform.cnrm.cloud.google.com/v1alpha1
kind: AIPlatformHyperparameterTuningJob
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    cnrm-test: "true"
  name: hptjob-minimal-${uniqueId}
  namespace: ${uniqueId}
spec:
  displayName: minimal-hptjob-${uniqueId}
  location: us-central1
  maxTrialCount: 1
  parallelTrialCount: 1
  projectRef:
    external: ${projectId}
  studySpec:
    metrics:
    - goal: MINIMIZE
      metricID: val_loss
    parameters:
