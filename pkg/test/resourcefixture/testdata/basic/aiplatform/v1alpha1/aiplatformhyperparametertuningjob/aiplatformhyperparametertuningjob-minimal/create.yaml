apiVersion: aiplatform.cnrm.cloud.google.com/v1alpha1
kind: AIPlatformHyperparameterTuningJob
metadata:
  name: hptjob-minimal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  displayName: minimal-hptjob-${uniqueId}
  maxTrialCount: 1
  parallelTrialCount: 1
  studySpec:
    metrics:
    - metricID: val_loss
      goal: MINIMIZE
    parameters:
    - parameterID: learning_rate
      doubleValueSpec:
        minValue: 0.001
        maxValue: 0.1
  trialJobSpec:
    workerPoolSpecs:
    - machineSpec:
        machineType: n1-standard-4
      replicaCount: 1
      containerSpec:
        imageURI: alpine:latest
        command: ["sh", "-c", "echo hello world"]
