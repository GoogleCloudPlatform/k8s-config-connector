apiVersion: aiplatform.cnrm.cloud.google.com/v1alpha1
kind: AIPlatformNasJob
metadata:
  name: nasjob-minimal-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  displayName: nasjob-minimal-${uniqueId}
  nasJobSpec:
    searchSpaceSpec: "test-search-space"
    multiTrialAlgorithmSpec:
      metric:
        metricID: val_loss
        goal: MINIMIZE
      searchTrialSpec:
        maxTrialCount: 1
        maxParallelTrialCount: 1
        searchTrialJobSpec:
          workerPoolSpecs:
          - machineSpec:
              machineType: n1-standard-4
            replicaCount: 1
            containerSpec:
              imageURI: alpine:latest
              command: ["sh", "-c", "echo hello world"]
