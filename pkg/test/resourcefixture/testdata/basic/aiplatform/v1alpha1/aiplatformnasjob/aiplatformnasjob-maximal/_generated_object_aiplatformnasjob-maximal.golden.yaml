apiVersion: aiplatform.cnrm.cloud.google.com/v1alpha1
kind: AIPlatformNasJob
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    cnrm-test: "true"
  name: nasjob-maximal-${uniqueId}
  namespace: ${uniqueId}
spec:
  displayName: nasjob-maximal-${uniqueId}
  location: us-central1
  nasJobSpec:
    multiTrialAlgorithmSpec:
      metric:
        goal: MAXIMIZE
        metricID: accuracy
      multiTrialAlgorithm: REINFORCEMENT_LEARNING
      searchTrialSpec:
        maxFailedTrialCount: 1
        maxParallelTrialCount: 1
        maxTrialCount: 2
        searchTrialJobSpec:
          serviceAccountRef:
            name: nasjob-sa-${uniqueId}
          workerPoolSpecs:
          - containerSpec:
              command:
              - sh
              - -c
              - echo maximal test
              imageURI: alpine:latest
            machineSpec:
              machineType: n1-standard-4
            replicaCount: 1
      trainTrialSpec:
        frequency: 1
        maxParallelTrialCount: 1
        trainTrialJobSpec:
          serviceAccountRef:
            name: nasjob-sa-${uniqueId}
          workerPoolSpecs:
          - containerSpec:
              command:
              - sh
              - -c
              - echo train test
              imageURI: alpine:latest
            machineSpec:
              machineType: n1-standard-4
            replicaCount: 1
    searchSpaceSpec: test-search-space
  projectRef:
    external: ${projectId}
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/locations/us-central1/nasJobs/2426236586107600896
  observedGeneration: 1
  observedState:
    createTime: "1970-01-01T00:00:00Z"
    state: JOB_STATE_PENDING
    updateTime: "1970-01-01T00:00:00Z"
