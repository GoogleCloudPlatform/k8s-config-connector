apiVersion: aiplatform.cnrm.cloud.google.com/v1alpha1
kind: AIPlatformPersistentResource
metadata:
  name: aip-pres-max-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  displayName: "Maximal Persistent Resource"
  labels:
    key1: val1
  resourcePools:
    - machineSpec:
        machineType: n1-standard-4
      replicaCount: 1
