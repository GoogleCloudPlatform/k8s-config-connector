apiVersion: aiplatform.cnrm.cloud.google.com/v1alpha1
kind: AIPlatformBatchPredictionJob
metadata:
  name: bpj-max-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  displayName: bpj-max-${uniqueId}
  unmanagedContainerModel:
    containerSpec:
      imageURI: us-docker.pkg.dev/vertex-ai/prediction/tf2-cpu.2-8:latest
  dedicatedResources:
    machineSpec:
      machineType: n1-standard-4
    startingReplicaCount: 1
    maxReplicaCount: 1
  manualBatchTuningParameters:
    batchSize: 10
  disableContainerLogging: true
  inputConfig:
    instancesFormat: jsonl
    gcsSource:
      uris:
      - gs://bpj-max-dep-${uniqueId}/input.jsonl
  outputConfig:
    predictionsFormat: jsonl
    gcsDestination:
      outputURIPrefix: gs://bpj-max-dep-${uniqueId}/output
