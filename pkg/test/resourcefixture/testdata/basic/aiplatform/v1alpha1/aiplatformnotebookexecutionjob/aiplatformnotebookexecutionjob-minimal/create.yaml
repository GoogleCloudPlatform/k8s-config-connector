apiVersion: aiplatform.cnrm.cloud.google.com/v1alpha1
kind: AIPlatformNotebookExecutionJob
metadata:
  name: aipnb-min-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  displayName: aipnb-min-${uniqueId}
  gcsOutputURI: gs://aipnb-min-dep-${uniqueId}
  directNotebookSource:
    content: eyJjZWxscyI6W10sIm1ldGFkYXRhIjp7fSwibmJmb3JtYXQiOjQsIm5iZm9ybWF0X21pbm9yIjoyfQ==
  customEnvironmentSpec:
    machineSpec:
      machineType: e2-standard-4
    persistentDiskSpec:
      diskType: pd-standard
      diskSizeGB: 100
    networkSpec:
      enableInternetAccess: true
  serviceAccountRef:
    external: ${projectNumber}-compute@developer.gserviceaccount.com
