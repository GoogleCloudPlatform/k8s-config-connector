  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    cnrm-test: "true"
  name: aipnb-max-${uniqueId}
  namespace: ${uniqueId}
spec:
