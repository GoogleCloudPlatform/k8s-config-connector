    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: projects/${projectId}/locations/us-central1/notebookExecutionJobs/aipnb-max-${uniqueId}
  observedGeneration: 1
  observedState:
    createTime: "1970-01-01T00:00:00Z"
    jobState: JOB_STATE_SUCCEEDED
    updateTime: "1970-01-01T00:00:00Z"
