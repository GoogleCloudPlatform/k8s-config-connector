  gcsOutputURI: gs://aipnb-max-dep-${uniqueId}
  location: us-central1
  projectRef:
    external: ${projectId}
  serviceAccountRef:
    external: ${projectNumber}-compute@developer.gserviceaccount.com
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
