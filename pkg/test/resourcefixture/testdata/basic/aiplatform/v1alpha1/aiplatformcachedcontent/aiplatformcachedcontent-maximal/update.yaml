apiVersion: aiplatform.cnrm.cloud.google.com/v1alpha1
kind: AIPlatformCachedContent
metadata:
  name: aiplatformcachedcontent-${uniqueId}
spec:
  projectRef:
    external: ${projectId}
  location: us-central1
  displayName: cachedcontent-${uniqueId}
  modelRef:
    external: projects/${projectId}/locations/us-central1/publishers/google/models/gemini-1.5-pro-001
  ttl: 600s
  systemInstruction:
    role: system
    parts:
    - text: You are a helpful assistant.
  contents:
  - role: user
    parts:
    - text: Detailed instructions and cached document content.
  toolConfig:
    functionCallingConfig:
      mode: AUTO
