apiVersion: gkehub.cnrm.cloud.google.com/v1alpha1
kind: GKEHubFleet
metadata:
  name: gkehubfleet-maximal-${uniqueId}
spec:
  projectRef:
    external: projects/${projectId}
  location: global
  resourceID: default
  displayName: "Maximal Fleet"
  labels:
    test-label: maximal
  defaultClusterConfig:
    securityPostureConfig:
      mode: "BASIC"
      vulnerabilityMode: "VULNERABILITY_BASIC"
    binaryAuthorizationConfig:
      evaluationMode: "DISABLED"
    compliancePostureConfig:
      mode: "DISABLED"
