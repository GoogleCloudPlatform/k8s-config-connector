apiVersion: vertexai.cnrm.cloud.google.com/v1alpha1
kind: VertexAIFeaturestoreEntityType
metadata:
  labels:
    label-one: two
    label-three: three
  name: entitytype${uniqueId}
spec:
  description: Test entity type
  featurestore: projects/${projectId}/locations/us-central1/featurestores/featurestore${uniqueId}
  monitoringConfig:
    categoricalThresholdConfig:
      value: 10
    importFeaturesAnalysis:
      anomalyDetectionBaseline: LATEST_STATS
      state: ENABLED
    numericalThresholdConfig:
      value: 0.8
    snapshotAnalysis:
      disabled: false
      monitoringIntervalDays: 1
      stalenessDays: 21
  offlineStorageTtlDays: 30
