    app.kubernetes.io/managed-by: config-connector-ha-setup
    cnrm.cloud.google.com/component: mcl-controller
  name: multiclusterlease-controller-manager
  namespace: cnrm-system
spec:
  minReadySeconds: 10
  replicas: 1
  selector:
    matchLabels:
      app: mcl-controller
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: mcl-controller
    spec:
      containers:
      - args:
        - --gcs-bucket=my-ha-bucket
        image: gcr.io/my-project/multiclusterlease:my-tag
        name: manager
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 300m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      serviceAccountName: kcc-mcl
      terminationGracePeriodSeconds: 10
