                               leaving the model unset would fall back to a platform default rather
                               than a backend-chosen model. Empty on every other surface, where
                               "Auto" is resolved server-side, and when none of the surface's ranked
                               models is available. When set, it is always one of the non-empty
                               `model_id`s present in `resolved_models`.
                            type: string
                          defaultModelID:
                            description: Output only. The `model_id` of the model
                              that should be selected by default in the model selector
                              when the end-user has not made an explicit choice. The
                              value is always one of the `model_id`s present in `resolved_models`.
                            type: string
                          resolvedModels:
                            description: Output only. The list of models that are
                              available to the end-user in the model selector, in
                              the order in which they should be displayed.
                            items:
                              properties:
                                adminView:
                                  description: Output only. Admin-surface metadata;
                                    populated only for the Console admin Feature Control
                                    page (see `AdminView`). Unset for end-user surfaces.
                                  properties:
                                    adminOverridable:
                                      description: Output only. Whether the admin
                                        can toggle this model's enabled/disabled state
                                        via `UiSettings.model_configs`. Derived from
                                        `MODEL_TAG_ADMIN_OVERRIDABLE`. When false,
                                        the model is "forced" and its state is governed
                                        by `enabled_by_default`.
                                      type: boolean
                                    enabledByDefault:
                                      description: Output only. Whether the model
                                        is enabled when the admin has set no explicit
                                        override in `UiSettings.model_configs`. Derived
                                        from `MODEL_TAG_ENABLED_BY_DEFAULT`.
                                      type: boolean
                                    regions:
                                      description: Output only. Regions where this
                                        model is launched.
                                      items:
                                        type: string
                                      type: array
                                  type: object
                                description:
                                  description: Output only. Localized description
                                    text (e.g. `State-of-the-art reasoning`). Localized
                                    using the same locale as `display_name`.
                                  type: string
                                displayName:
                                  description: Output only. Localized display name
                                    of the model (e.g. `Gemini 3.1 Pro`). Localized
                                    server-side based on the [LookupWidgetConfigRequest.language_code][google.cloud.discoveryengine.v1.LookupWidgetConfigRequest.language_code]
                                    and [LookupWidgetConfigRequest.region_code][google.cloud.discoveryengine.v1.LookupWidgetConfigRequest.region_code]
                                    of the request.
                                  type: string
                                family:
                                  description: |-
                                    Output only. Groups models that render together in the selector.
                                     Models sharing a value form one group; empty means the model belongs
                                     to no group.

                                     Compared for equality only -- never parsed, and never shown to a
                                     user, so it is not localized.
                                  type: string
                                icon:
                                  description: Output only. GM3-compatible icon token
                                    associated with the model (e.g. `rocket_launch`,
                                    `bolt`, `graph_5`).
                                  type: string
                                iconURL:
                                  description: |-
                                    Output only. Absolute URL of a brand mark to render instead of
                                     `icon`, for models whose vendor logo is not a GM3 glyph.

                                     `icon` stays populated as the fallback, so a client that does not
                                     render images, or that fails to fetch this one, shows the glyph
                                     instead of nothing.
                                  type: string
                                isPreview:
                                  description: Output only. Whether the model is currently
                                    in preview. Clients should surface this via a
                                    "Preview" badge in the selector UI.
                                  type: boolean
                                label:
                                  description: Output only. Short label shown in the
                                    compact selector bar chip (e.g. `3.x Flash`) as
                                    opposed to the full `display_name` (`Gemini 3.x
                                    Flash`). Falls back to `display_name` when the
                                    backend registry does not specify a distinct short
                                    label.
                                  type: string
                                modelID:
                                  description: |-
                                    Output only. Unique identifier of the model
                                     (e.g. `gemini-2.5-flash`, `gemini-3.1-pro-preview`).

                                     This is the same identifier that clients pass back to the assistant
                                     service to select this model. Virtual / "pseudo" models (e.g.
                                     `gemini-fast`) are also valid values here; they are resolved to the
                                     underlying concrete model on the backend.
                                  type: string
                                promoted:
                                  description: Output only. Whether this model should
                                    be promoted in the GE chat homepage banner.
                                  type: boolean
                              type: object
                            type: array
                        type: object
                      onedrivePickerEnabled:
                        description: |-
                          Output only. Whether the OneDrive file picker is available to end-users.
                           Computed by the backend from admin connector enablement (Business
                           edition) or attached OneDrive connectors (Enterprise edition), combined
                           with the existing `disable-onedrive-upload` admin feature.

                           Declared `optional` so an explicitly-computed `false` is serialized with
                           field presence. A plain proto3 `bool` drops a default `false` on the
                           wire, which prevented clients from distinguishing "picker disabled"
                           (`false`) from "field not populated" (unset).
                        type: boolean
                    type: object
                  updateTime:
                    description: Output only. Timestamp the [WidgetConfig][google.cloud.discoveryengine.v1.WidgetConfig]
                      was updated.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
