                                   If this is not specified, the default behavior is defined by gRPC.
                                type: string
                            type: object
                          httpGet:
                            description: HttpGetAction probes the health of a container
                              by sending an HTTP GET request.
                            properties:
                              host:
                                description: Host name to connect to, defaults to
                                  the model serving container's IP. You probably want
                                  to set "Host" in httpHeaders instead.
                                type: string
                              httpHeaders:
                                description: Custom headers to set in the request.
