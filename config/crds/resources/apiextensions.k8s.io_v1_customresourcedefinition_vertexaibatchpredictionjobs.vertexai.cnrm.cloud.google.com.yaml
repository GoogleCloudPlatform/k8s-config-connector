                  and [prediction_schema_uri][google.cloud.aiplatform.v1beta1.PredictSchemata.prediction_schema_uri].
                properties:
                  bigqueryDestination:
                    description: 'The BigQuery project or dataset location where the
                      output is to be written to. If project is provided, a new dataset
                      is created with name `prediction_<model-display-name>_<job-create-time>`
                      where <model-display-name> is made BigQuery-dataset-name compatible
                      (for example, most special characters become underscores), and
                      timestamp is in YYYY_MM_DDThh_mm_ss_sssZ "based on ISO-8601"
                      format. In the dataset two tables will be created, `predictions`,
                      and `errors`. If the Model has both [instance][google.cloud.aiplatform.v1beta1.PredictSchemata.instance_schema_uri]
                      and [prediction][google.cloud.aiplatform.v1beta1.PredictSchemata.parameters_schema_uri]
                      schemata defined then the tables have columns as follows: The
                      `predictions` table contains instances for which the prediction
                      succeeded, it has columns as per a concatenation of the Model''s
                      instance and prediction schemata. The `errors` table contains
                      rows for which the prediction has failed, it has instance columns,
                      as per the instance schema, followed by a single "errors" column,
                      which as values has [google.rpc.Status][google.rpc.Status] represented
                      as a STRUCT, and containing only `code` and `message`.'
                    properties:
                      outputURI:
                        description: |-
                          Required. BigQuery URI to a project or table, up to 2000 characters long.

                           When only the project is specified, the Dataset and Table is created.
                           When the full table reference is specified, the Dataset must exist and
                           table must not exist.

                           Accepted forms:

                           *  BigQuery path. For example:
                           `bq://projectId` or `bq://projectId.bqDatasetId` or
                           `bq://projectId.bqDatasetId.bqTableId`.
                        type: string
                    type: object
                  gcsDestination:
                    description: The Cloud Storage location of the directory where
                      the output is to be written to. In the given directory a new
                      directory is created. Its name is `prediction-<model-display-name>-<job-create-time>`,
                      where timestamp is in YYYY-MM-DDThh:mm:ss.sssZ ISO-8601 format.
                      Inside of it files `predictions_0001.<extension>`, `predictions_0002.<extension>`,
                      ..., `predictions_N.<extension>` are created where `<extension>`
                      depends on chosen [predictions_format][google.cloud.aiplatform.v1beta1.BatchPredictionJob.OutputConfig.predictions_format],
                      and N may equal 0001 and depends on the total number of successfully
                      predicted instances. If the Model has both [instance][google.cloud.aiplatform.v1beta1.PredictSchemata.instance_schema_uri]
                      and [prediction][google.cloud.aiplatform.v1beta1.PredictSchemata.parameters_schema_uri]
                      schemata defined then each such file contains predictions as
                      per the [predictions_format][google.cloud.aiplatform.v1beta1.BatchPredictionJob.OutputConfig.predictions_format].
                      If prediction for any instance failed (partially or completely),
                      then an additional `errors_0001.<extension>`, `errors_0002.<extension>`,...,
                      `errors_N.<extension>` files are created (N depends on total
                      number of failed predictions). These files contain the failed
