                        description: Optional. Month of year. Must be from 1 to 12,
                          or 0 if specifying a datetime without a month.
                        format: int32
                        type: integer
                      nanos:
                        description: Optional. Fractions of seconds in nanoseconds.
                          Must be from 0 to 999,999,999, defaults to 0.
                        format: int32
                        type: integer
                      seconds:
                        description: Optional. Seconds of minutes of the time. Must
                          normally be from 0 to 59, defaults to 0. An API may allow
                          the value 60 if it allows leap-seconds.
                        format: int32
                        type: integer
