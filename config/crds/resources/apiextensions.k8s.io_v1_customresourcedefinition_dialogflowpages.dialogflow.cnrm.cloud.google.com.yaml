                                 *   `sys.no-match-<N>`, where N can be from 1 to 6
                                 *   `sys.no-match-default`
                                 *   `sys.no-input-<N>`, where N can be from 1 to 6
                                 *   `sys.no-input-default`
                                 *   `sys.invalid-parameter`

