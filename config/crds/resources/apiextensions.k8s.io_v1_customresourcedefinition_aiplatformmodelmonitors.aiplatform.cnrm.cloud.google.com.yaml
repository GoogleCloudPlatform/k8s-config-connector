                                format: int32
                                type: integer
                            type: object
                          stepCount:
                            description: |-
                              Required. The number of steps for approximating the path integral.
                               A good value to start is 50 and gradually increase until the
                               sum to diff property is met within the desired error range.

                               Valid range of its value is [1, 100], inclusively.
                            format: int32
                            type: integer
                        type: object
                    type: object
                type: object
              location:
                description: The location of this resource.
                type: string
              modelMonitoringSchema:
                description: Monitoring Schema is to specify the model's features,
                  prediction outputs and ground truth properties.
                properties:
                  featureFields:
                    description: 'Feature names of the model. Vertex AI will try to
                      match the features from your dataset as follows: * For ''csv''
                      files, the header names are required, and we will extract the
                      corresponding feature values when the header names align with
                      the feature names. * For ''jsonl'' files, we will extract the
                      corresponding feature values if the key names match the feature
                      names. Note: Nested features are not supported, so please ensure
                      your features are flattened. Ensure the feature values are scalar
                      or an array of scalars. * For ''bigquery'' dataset, we will
                      extract the corresponding feature values if the column names
                      match the feature names. Note: The column type can be a scalar
                      or an array of scalars. STRUCT or JSON types are not supported.
                      You may use SQL queries to select or aggregate the relevant
                      features from your original table. However, ensure that the
                      ''schema'' of the query results meets our requirements. * For
                      the Vertex AI Endpoint Request Response Logging table or Vertex
                      AI Batch Prediction Job results. If the [instance_type][google.cloud.aiplatform.v1beta1.ModelMonitoringSchema.instance_type]
                      is an array, ensure that the sequence in [feature_fields][google.cloud.aiplatform.v1beta1.ModelMonitoringSchema.feature_fields]
                      matches the order of features in the prediction instance. We
                      will match the feature with the array in the order specified
                      in [feature_fields].'
                    items:
                      properties:
                        dataType:
                          description: 'Supported data types are: `float` `integer`
                            `boolean` `string` `categorical`'
                          type: string
                        name:
                          description: Field name.
                          type: string
                        repeated:
                          description: Describes if the schema field is an array of
                            given data type.
                          type: boolean
                      type: object
                    type: array
                  groundTruthFields:
                    description: Target /ground truth names of the model.
                    items:
                      properties:
                        dataType:
                          description: 'Supported data types are: `float` `integer`
                            `boolean` `string` `categorical`'
                          type: string
                        name:
                          description: Field name.
                          type: string
                        repeated:
                          description: Describes if the schema field is an array of
                            given data type.
                          type: boolean
                      type: object
                    type: array
                  predictionFields:
                    description: 'Prediction output names of the model. The requirements
                      are the same as the [feature_fields][google.cloud.aiplatform.v1beta1.ModelMonitoringSchema.feature_fields].
                      For AutoML Tables, the prediction output name presented in schema
                      will be: `predicted_{target_column}`, the `target_column` is
                      the one you specified when you train the model. For Prediction
                      output drift analysis: * AutoML Classification, the distribution
                      of the argmax label will be analyzed. * AutoML Regression, the
                      distribution of the value will be analyzed.'
                    items:
                      properties:
                        dataType:
                          description: 'Supported data types are: `float` `integer`
