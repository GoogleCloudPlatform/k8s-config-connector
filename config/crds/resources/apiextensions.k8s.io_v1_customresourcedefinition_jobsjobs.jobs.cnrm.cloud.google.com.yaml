                            description: The maximum amount of compensation. If left
                              empty, the value is set to a maximal compensation value
                              and the currency code is set to match the [currency
                              code][google.type.Money.currency_code] of min_compensation.
                            properties:
                              currencyCode:
                                description: The three-letter currency code defined
                                  in ISO 4217.
                                type: string
                              nanos:
                                description: Number of nano (10^-9) units of the amount.
                                  The value must be between -999,999,999 and +999,999,999
                                  inclusive. If `units` is positive, `nanos` must
                                  be positive or zero. If `units` is zero, `nanos`
                                  can be positive, zero, or negative. If `units` is
                                  negative, `nanos` must be negative or zero. For
                                  example $-1.75 is represented as `units`=-1 and
                                  `nanos`=-750,000,000.
                                format: int32
                                type: integer
                              units:
                                description: The whole units of the amount. For example
                                  if `currencyCode` is `"USD"`, then 1 unit is one
                                  US dollar.
                                format: int64
                                type: integer
                            type: object
                          minCompensation:
                            description: The minimum amount of compensation. If left
                              empty, the value is set to zero and the currency code
                              is set to match the [currency code][google.type.Money.currency_code]
                              of max_compensation.
                            properties:
                              currencyCode:
                                description: The three-letter currency code defined
                                  in ISO 4217.
                                type: string
                              nanos:
                                description: Number of nano (10^-9) units of the amount.
                                  The value must be between -999,999,999 and +999,999,999
                                  inclusive. If `units` is positive, `nanos` must
                                  be positive or zero. If `units` is zero, `nanos`
                                  can be positive, zero, or negative. If `units` is
                                  negative, `nanos` must be negative or zero. For
                                  example $-1.75 is represented as `units`=-1 and
                                  `nanos`=-750,000,000.
                                format: int32
                                type: integer
                              units:
                                description: The whole units of the amount. For example
                                  if `currencyCode` is `"USD"`, then 1 unit is one
