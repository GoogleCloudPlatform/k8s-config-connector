                                  negative, `nanos` must be negative or zero. For
                                  example $-1.75 is represented as `units`=-1 and
                                  `nanos`=-750,000,000.
                                format: int32
                                type: integer
                              units:
                                description: The whole units of the amount. For example
                                  if `currencyCode` is `"USD"`, then 1 unit is one
                                  US dollar.
                                format: int64
                                type: integer
                            type: object
                        type: object
                      annualizedTotalCompensationRange:
                        description: |-
                          Output only. Annualized total compensation range. Computed as all
                           compensation entries'
                           [CompensationEntry.amount][google.cloud.talent.v4.CompensationInfo.CompensationEntry.amount]
                           times
                           [CompensationEntry.expected_units_per_year][google.cloud.talent.v4.CompensationInfo.CompensationEntry.expected_units_per_year].

                           See
