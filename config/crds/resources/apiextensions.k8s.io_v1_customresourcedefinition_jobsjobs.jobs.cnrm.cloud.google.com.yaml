                    type: object
                  derivedInfo:
                    description: Output only. Derived details about the job posting.
                    properties:
                      jobCategories:
                        description: Job categories derived from [Job.title][google.cloud.talent.v4.Job.title]
                          and [Job.description][google.cloud.talent.v4.Job.description].
                        items:
                          type: string
                        type: array
                      locations:
                        description: |-
                          Structured locations of the job, resolved from
                           [Job.addresses][google.cloud.talent.v4.Job.addresses].

                           [locations][google.cloud.talent.v4.Job.DerivedInfo.locations] are exactly
                           matched to [Job.addresses][google.cloud.talent.v4.Job.addresses] in the
                           same order.
                        items:
                          properties:
                            latLng:
                              description: An object representing a latitude/longitude
                                pair.
                              properties:
                                latitude:
                                  description: The latitude in degrees. It must be
                                    in the range [-90.0, +90.0].
                                  type: number
                                longitude:
                                  description: The longitude in degrees. It must be
                                    in the range [-180.0, +180.0].
                                  type: number
                              type: object
                            locationType:
                              description: The type of a location, which corresponds
                                to the address lines field of [google.type.PostalAddress][google.type.PostalAddress].
                                For example, "Downtown, Atlanta, GA, USA" has a type
                                of [LocationType.NEIGHBORHOOD][google.cloud.talent.v4.Location.LocationType.NEIGHBORHOOD],
                                and "Kansas City, KS, USA" has a type of [LocationType.LOCALITY][google.cloud.talent.v4.Location.LocationType.LOCALITY].
                              type: string
                            postalAddress:
                              description: Postal address of the location that includes
                                human readable information, such as postal delivery
                                and payments addresses. Given a postal address, a
                                postal service can deliver items to a premises, P.O.
                                Box, or other delivery location.
                              properties:
                                addressLines:
                                  description: |-
                                    Unstructured address lines describing the lower levels of an address.

                                     Because values in address_lines do not have type information and may
                                     sometimes contain multiple values in a single field (e.g.
                                     "Austin, TX"), it is important that the line order is clear. The order of
                                     address lines should be "envelope order" for the country/region of the
                                     address. In places where this can vary (e.g. Japan), address_language is
                                     used to make it explicit (e.g. "ja" for large-to-small ordering and
                                     "ja-Latn" or "en" for small-to-large). This way, the most specific line of
                                     an address can be selected based on the language.

                                     The minimum permitted structural representation of an address consists
                                     of a region_code with all remaining information placed in the
                                     address_lines. It would be possible to format such an address very
                                     approximately without geocoding, but no semantic reasoning could be
                                     made about any of the address components until it was at least
                                     partially resolved.

                                     Creating an address only containing a region_code and address_lines, and
                                     then geocoding is the recommended way to handle completely unstructured
                                     addresses (as opposed to guessing which parts of the address should be
                                     localities or administrative areas).
                                  items:
                                    type: string
                                  type: array
                                administrativeArea:
                                  description: Optional. Highest administrative subdivision
                                    which is used for postal addresses of a country
                                    or region. For example, this can be a state, a
                                    province, an oblast, or a prefecture. Specifically,
                                    for Spain this is the province and not the autonomous
                                    community (e.g. "Barcelona" and not "Catalonia").
                                    Many countries don't use an administrative area
                                    in postal addresses. E.g. in Switzerland this
                                    should be left unpopulated.
                                  type: string
                                languageCode:
                                  description: |-
                                    Optional. BCP-47 language code of the contents of this address (if
                                     known). This is often the UI language of the input form or is expected
                                     to match one of the languages used in the address' country/region, or their
                                     transliterated equivalents.
                                     This can affect formatting in certain countries, but is not critical
                                     to the correctness of the data and will never affect any validation or
                                     other non-formatting related operations.

                                     If this value is not known, it should be omitted (rather than specifying a
                                     possibly incorrect default).

                                     Examples: "zh-Hant", "ja", "ja-Latn", "en".
                                  type: string
                                locality:
                                  description: 'Optional. Generally refers to the
                                    city/town portion of the address. Examples: US
                                    city, IT comune, UK post town. In regions of the
                                    world where localities are not well defined or
                                    do not fit into this structure well, leave locality
                                    empty and use address_lines.'
                                  type: string
                                organization:
                                  description: Optional. The name of the organization
                                    at the address.
                                  type: string
                                postalCode:
                                  description: Optional. Postal code of the address.
                                    Not all countries use or require postal codes
                                    to be present, but where they are used, they may
                                    trigger additional validation with other parts
                                    of the address (e.g. state/zip validation in the
                                    U.S.A.).
                                  type: string
                                recipients:
                                  description: Optional. The recipient at the address.
                                    This field may, under certain circumstances, contain
                                    multiline information. For example, it might contain
                                    "care of" information.
                                  items:
                                    type: string
                                  type: array
                                regionCode:
                                  description: 'Required. CLDR region code of the
                                    country/region of the address. This is never inferred
                                    and it is up to the user to ensure the value is
                                    correct. See http://cldr.unicode.org/ and http://www.unicode.org/cldr/charts/30/supplemental/territory_information.html
                                    for details. Example: "CH" for Switzerland.'
                                  type: string
                                revision:
                                  description: |-
                                    The schema revision of the `PostalAddress`. This must be set to 0, which is
                                     the latest revision.

                                     All new revisions **must** be backward compatible with old revisions.
                                  format: int32
                                  type: integer
                                sortingCode:
                                  description: Optional. Additional, country-specific,
                                    sorting code. This is not used in most regions.
                                    Where it is used, the value is either a string
                                    like "CEDEX", optionally followed by a number
                                    (e.g. "CEDEX 7"), or just a number alone, representing
                                    the "sector code" (Jamaica), "delivery area indicator"
                                    (Malawi) or "post office indicator" (e.g. Côte
                                    d'Ivoire).
                                  type: string
                                sublocality:
                                  description: Optional. Sublocality of the address.
                                    For example, this can be neighborhoods, boroughs,
                                    districts.
                                  type: string
                              type: object
                            radiusMiles:
                              description: Radius in miles of the job location. This
                                value is derived from the location bounding box in
                                which a circle with the specified radius centered
                                from [google.type.LatLng][google.type.LatLng] covers
                                the area associated with the job location. For example,
                                currently, "Mountain View, CA, USA" has a radius of
                                6.17 miles.
                              type: number
                          type: object
                        type: array
                    type: object
                  postingCreateTime:
                    description: Output only. The timestamp when this job posting
                      was created.
                    type: string
                  postingUpdateTime:
                    description: Output only. The timestamp when this job posting
                      was last updated.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
