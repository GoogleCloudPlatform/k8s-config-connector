    status: open
  - kind: CloudBuildBuild
    group: cloudbuild.cnrm.cloud.google.com
    field: .spec.steps[].secretEnv
    reason: possible-reference-by-name
    detail: SecretManagerSecretVersionRef
    status: open
  - kind: CloudBuildBuild
    group: cloudbuild.cnrm.cloud.google.com
    field: .status.observedState.sourceProvenance.fileHashes
    reason: message-map-derived
    detail: derived as map[string]FileHashes from proto google.devtools.cloudbuild.v1.FileHashes; verify Go type and mapping
    status: open
  - kind: CloudBuildBuild
    group: cloudbuild.cnrm.cloud.google.com
    field: .status.observedState.timing
