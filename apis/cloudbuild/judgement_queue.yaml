# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: CloudBuildBuild
    group: cloudbuild.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: resolved
    resolution: edited
    note: triaged all findings; updated parent to inlined *parent.ProjectAndLocationRef, confirmed server-generated identity, converted resource references to typed Refs, dropped deprecated workerPool, and verified documentation link
  - kind: CloudBuildBuild
    group: cloudbuild.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{project}/locations/{location}/builds/{build}" contains ancestor segment(s) locations/{location} with no matching reference or field on CloudBuildBuildSpec
    status: resolved
    resolution: edited
    note: replaced ProjectRef with inlined *parent.ProjectAndLocationRef
  - kind: CloudBuildBuild
    group: cloudbuild.cnrm.cloud.google.com
    reason: identity-server-generated-id
    detail: generated CloudBuildBuildIdentity implements identity.ServerGeneratedIdentity because the Create RPC has no *_id parameter; confirm whether the resource ID is truly server-generated or client-specified in .name
    status: resolved
    resolution: accepted
    note: confirmed resource ID is server-generated by Cloud Build API (Build has output-only id/name and CreateBuildRequest has no id parameter)
  - kind: CloudBuildBuild
    group: cloudbuild.cnrm.cloud.google.com
    reason: verify-resource-docs-link
    detail: 'none of these loaded as a page ending in /v1/projects.builds: https://docs.cloud.google.com/cloud-build/docs/reference/rest/v1/projects.builds'
    status: resolved
    resolution: edited
    note: updated resource docs link to valid URL
  - kind: CloudBuildBuild
    group: cloudbuild.cnrm.cloud.google.com
    field: .spec.artifacts.goModules[].repositoryProjectID
    reason: possible-reference-by-name
    detail: ProjectRef
    status: resolved
    resolution: edited
    note: converted to RepositoryProjectRef (*refsv1beta1.ProjectRef)
  - kind: CloudBuildBuild
    group: cloudbuild.cnrm.cloud.google.com
    field: .spec.artifacts.mavenArtifacts[].artifactID
    reason: possible-reference-by-name
    detail: the field name ends in ID/IDs; confirm whether it references another resource
    status: resolved
    resolution: not-applicable
    note: Maven artifactId coordinate, not a GCP resource reference
  - kind: CloudBuildBuild
    group: cloudbuild.cnrm.cloud.google.com
    field: .spec.artifacts.mavenArtifacts[].groupID
    reason: possible-reference-by-name
    detail: the field name ends in ID/IDs; confirm whether it references another resource
    status: resolved
    resolution: not-applicable
    note: Maven groupId coordinate, not a GCP resource reference
  - kind: CloudBuildBuild
    group: cloudbuild.cnrm.cloud.google.com
    field: .spec.artifacts.objects.location
    reason: reference-not-representable
    detail: 'gcs-path-decomposable-as-bucketref-plus-path: names another resource, but KCC cannot express it as a reference today, so it stays a string'
    status: resolved
    resolution: accepted
    note: GCS path decomposable as bucket + path cannot be expressed as a reference today, stays a string
  - kind: CloudBuildBuild
    group: cloudbuild.cnrm.cloud.google.com
    field: .spec.availableSecrets.inline[].envMap
    reason: unsupported-field-type
    detail: unsupported map type with key string and value bytes
    status: resolved
    resolution: deferred
    note: unsupported map type with key string and value bytes deferred pending custom mapper support
  - kind: CloudBuildBuild
    group: cloudbuild.cnrm.cloud.google.com
    field: .spec.availableSecrets.inline[].kmsKeyName
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to cloudkms.googleapis.com/CryptoKey (google.api.resource_reference); confirm whether it should be a KCC reference
    status: resolved
    resolution: edited
    note: converted to KMSKeyRef (*kmsv1beta1.KMSCryptoKeyRef)
  - kind: CloudBuildBuild
    group: cloudbuild.cnrm.cloud.google.com
