# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: WebsecurityscannerScanConfig
    group: websecurityscanner.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: WebsecurityscannerScanConfig
    group: websecurityscanner.cnrm.cloud.google.com
    reason: empty-observedstate
    detail: nothing was generated into status.observedState; the proto probably marks no field OUTPUT_ONLY, so output fields landed in the Spec. Decide what belongs in status
    status: open
  - kind: WebsecurityscannerScanConfig
    group: websecurityscanner.cnrm.cloud.google.com
    reason: identity-server-generated-id
    detail: generated WebsecurityscannerScanConfigIdentity implements identity.ServerGeneratedIdentity because the Create RPC has no *_id parameter; confirm whether the resource ID is truly server-generated or client-specified in .name
    status: open
  - kind: WebsecurityscannerScanConfig
    group: websecurityscanner.cnrm.cloud.google.com
    reason: verify-resource-docs-link
    detail: the proto declares no google.api.resource pattern, so the page for this resource could not be derived; this is a guess at the API's REST reference, find the resource in it
    status: open
  - kind: WebsecurityscannerScanConfig
    group: websecurityscanner.cnrm.cloud.google.com
    field: .spec.authentication.customAccount.password
    reason: sensitive-field
    detail: the name says this holds a password, and it is generated as a plain value. Leave this open until we settle how new Kinds take secrets
    status: open
  - kind: WebsecurityscannerScanConfig
    group: websecurityscanner.cnrm.cloud.google.com
    field: .spec.authentication.googleAccount
    reason: deprecated-field
    detail: the proto marks this field deprecated. It is kept because generated structs can be shared with other Kinds. Remove it by hand if no existing Kind uses it
    status: open
  - kind: WebsecurityscannerScanConfig
    group: websecurityscanner.cnrm.cloud.google.com
    field: .spec.authentication.googleAccount
    reason: deprecated-message
    detail: the proto marks message google.cloud.websecurityscanner.v1.ScanConfig.Authentication.GoogleAccount deprecated (option deprecated = true); confirm whether this field should be kept
    status: open
  - kind: WebsecurityscannerScanConfig
    group: websecurityscanner.cnrm.cloud.google.com
    field: .spec.authentication.googleAccount.password
    reason: sensitive-field
    detail: the name says this holds a password, and it is generated as a plain value. Leave this open until we settle how new Kinds take secrets
    status: open
  - kind: WebsecurityscannerScanConfig
    group: websecurityscanner.cnrm.cloud.google.com
    field: .spec.authentication.iapCredential.iapTestServiceAccountInfo.targetAudienceClientID
    reason: possible-reference-by-name
    detail: the field name ends in ID/IDs; confirm whether it references another resource
    status: open
  - kind: WebsecurityscannerScanConfig
    group: websecurityscanner.cnrm.cloud.google.com
    field: .spec.location
    reason: location-parent-unknown
    detail: the proto declares no google.api.resource, so the parent shape is unknown; drop location if the resource is not regional
    status: open
  - kind: WebsecurityscannerScanConfig
    group: websecurityscanner.cnrm.cloud.google.com
    field: .status.observedState.managedScan
    reason: possible-output-only-pattern-in-comment
    detail: 'proto comment mentions output only but doesn''t start with "Output only." or "[Output Only]", and there is no field_behavior annotation, so it was generated into the Spec at .spec.managedScan. The comment may be a typo, apply only some of the time, or mean something else. Move the field to .status.observedState.managedScan if it is confirmed output only. Proto comment: Whether the scan config is managed by Web Security Scanner, output only.'
    status: open
