# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: BigQueryDatasetAccess
    group: bigquery.cnrm.cloud.google.com
    reason: identity-not-in-cai
    detail: template "//bigquery.googleapis.com/projects/{project}/datasets/{dataset}/access/{access}" is not listed in docs/ai/metadata/cloudassetinventory_names.jsonl; verify the URL format or add an exception in pkg/gcpurls/registry_test.go
    status: resolved
    resolution: accepted
    note: BigQueryDatasetAccess is a subresource of BigQuery dataset access list, not indexed separately in CAI.
  - kind: BigQueryDatasetAccess
    group: bigquery.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: proto message google.cloud.bigquery.v2.Access declares no google.api.resource pattern; pass --pattern BigQueryDatasetAccess=<pattern> to generate-identity
    status: resolved
    resolution: accepted
    note: Used --pattern BigQueryDatasetAccess=projects/{project}/datasets/{dataset}/access/{access}
  - kind: BigQueryRowAccessPolicy
    group: bigquery.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: resolved
    resolution: edited
    note: modeled parent hierarchy as spec.parentRef (*BigQueryTableRef); removed projectRef, location, and rowAccessPolicyReference; locked identity pattern via --pattern
  - kind: BigQueryRowAccessPolicy
    group: bigquery.cnrm.cloud.google.com
    reason: identity-multi-pattern
    detail: proto message google.cloud.bigquery.v2.RowAccessPolicy declares 2 resource name patterns (projects/{project}/datasets/{data_set}/tables/{table}/rowAccessPolicies/{row_access_policy}, projects/{projectsid}/datasets/{datasetsid}/tables/{tablesid}/rowAccessPolicies/{rowaccesspoliciesid}) that tied on BigQueryRowAccessPolicySpec; generated identity defaulted to "projects/{project}/datasets/{data_set}/tables/{table}/rowAccessPolicies/{row_access_policy}" (pass --pattern BigQueryRowAccessPolicy=<pattern> to override)
    status: resolved
    resolution: accepted
    note: Used --pattern BigQueryRowAccessPolicy=projects/{project}/datasets/{dataset}/tables/{table}/rowAccessPolicies/{rowAccessPolicy}
  - kind: BigQueryRowAccessPolicy
    group: bigquery.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{project}/datasets/{data_set}/tables/{table}/rowAccessPolicies/{row_access_policy}" contains ancestor segment(s) datasets/{data_set}, tables/{table} with no matching reference or field on BigQueryRowAccessPolicySpec
    status: resolved
    resolution: edited
    note: modeled as spec.parentRef (*BigQueryTableRef); removed ProjectRef and Location
  - kind: BigQueryRowAccessPolicy
    group: bigquery.cnrm.cloud.google.com
    reason: verify-resource-docs-link
    detail: the proto declares no google.api.resource pattern, so the page for this resource could not be derived; this is a guess at the API's REST reference, find the resource in it
    status: resolved
    resolution: edited
    note: updated resource docs link to https://cloud.google.com/bigquery/docs/reference/rest/v2/rowAccessPolicies
  - kind: BigQueryRowAccessPolicy
    group: bigquery.cnrm.cloud.google.com
    field: .spec.location
    reason: location-parent-unknown
    detail: the proto declares no google.api.resource, so the parent shape is unknown; drop location if the resource is not regional
    status: resolved
    resolution: edited
    note: modeled parent as spec.parentRef (*BigQueryTableRef); removed Location and ProjectRef
  - kind: BigQueryRowAccessPolicy
    group: bigquery.cnrm.cloud.google.com
    field: .spec.rowAccessPolicyReference.datasetID
    reason: possible-reference-by-name
    detail: the field name ends in ID/IDs; confirm whether it references another resource
    status: resolved
    resolution: not-applicable
    note: removed rowAccessPolicyReference from spec as parent table and policy ID are modeled via parentRef and resourceID
  - kind: BigQueryRowAccessPolicy
    group: bigquery.cnrm.cloud.google.com
    field: .spec.rowAccessPolicyReference.policyID
    reason: possible-reference-by-name
    detail: the field name ends in ID/IDs; confirm whether it references another resource
    status: resolved
    resolution: not-applicable
    note: removed rowAccessPolicyReference from spec as parent table and policy ID are modeled via parentRef and resourceID
  - kind: BigQueryRowAccessPolicy
    group: bigquery.cnrm.cloud.google.com
    field: .spec.rowAccessPolicyReference.projectID
    reason: possible-reference-by-name
    detail: ProjectRef
    status: resolved
    resolution: not-applicable
    note: removed rowAccessPolicyReference from spec as parent table and policy ID are modeled via parentRef and resourceID
  - kind: BigQueryRowAccessPolicy
    group: bigquery.cnrm.cloud.google.com
    field: .spec.rowAccessPolicyReference.tableID
    reason: possible-reference-by-name
    detail: the field name ends in ID/IDs; confirm whether it references another resource
    status: resolved
    resolution: not-applicable
    note: removed rowAccessPolicyReference from spec as parent table and policy ID are modeled via parentRef and resourceID
