# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: BackupDRAutoProtectionPolicy
    group: backupdr.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: BackupDRAutoProtectionPolicy
    group: backupdr.cnrm.cloud.google.com
    reason: identity-server-generated-id
    detail: proto marks the resource .name field OUTPUT_ONLY; confirm whether the resource ID is server-generated or client-specified via a Create request *_id parameter
    status: open
  - kind: BackupDRAutoProtectionPolicy
    group: backupdr.cnrm.cloud.google.com
    field: .spec.backupPlanDetails[].backupPlan
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to backupdr.googleapis.com/BackupPlan (google.api.resource_reference); confirm whether it should be a KCC reference
    status: open
  - kind: BackupDRAutoProtectionPolicy
    group: backupdr.cnrm.cloud.google.com
    field: .spec.etag
    reason: etag-in-spec
    detail: etag was generated in the Spec because the proto does not mark it OUTPUT_ONLY; confirm whether it belongs in status.observedState
    status: open
  - kind: BackupDRAutoProtectionPolicy
    group: backupdr.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: parent.ProjectAndLocationRef in apis/common/parent, inlined, could replace projectRef and location; the CRD keeps the same keys
    status: open
  - kind: BackupDRAutoProtectionPolicy
    group: backupdr.cnrm.cloud.google.com
    field: .status.observedState.etag
    reason: well-known-output-only-pattern-in-comment
    detail: 'proto comment says output only but there is no field_behavior annotation, so it was generated into the Spec at .spec.etag. Move the field to .status.observedState.etag if it is confirmed output only. Proto comment: Output only. The etag for the policy. If this is provided on update, it must match the server''s etag.'
    status: open
  - kind: BackupDRRestoreVerificationPlan
    group: backupdr.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: resolved
    resolution: edited
    note: triaged all findings; replaced ProjectRef and Location with inlined *parent.ProjectAndLocationRef, removed top-level labels from Spec in favor of metadata, confirmed client-specified resource ID, verified CAI URL format, and resolved docs link
  - kind: BackupDRRestoreVerificationPlan
    group: backupdr.cnrm.cloud.google.com
    reason: identity-not-in-cai
    detail: template "//backupdr.googleapis.com/projects/{project}/locations/{location}/restoreVerificationPlans/{restoreVerificationPlan}" is not listed in docs/ai/metadata/cloudassetinventory_names.jsonl; verify the URL format or add an exception in pkg/gcpurls/registry_test.go
    status: resolved
    resolution: accepted
    note: verified template against proto google.api.resource pattern
  - kind: BackupDRRestoreVerificationPlan
    group: backupdr.cnrm.cloud.google.com
    reason: identity-server-generated-id
    detail: proto marks the resource .name field OUTPUT_ONLY; confirm whether the resource ID is server-generated or client-specified via a Create request *_id parameter
    status: resolved
    resolution: accepted
    note: 'client-specified: CreateRestoreVerificationPlanRequest defines required restore_verification_plan_id'
  - kind: BackupDRRestoreVerificationPlan
    group: backupdr.cnrm.cloud.google.com
    reason: verify-resource-docs-link
    detail: 'none of these loaded as a page ending in /v1/projects.locations.restoreVerificationPlans: https://docs.cloud.google.com/backup-disaster-recovery/docs/reference/rest/v1/projects.locations.restoreVerificationPlans'
    status: resolved
    resolution: edited
    note: removed unverified resource-docs URL as public page does not exist yet; removed guess marker
  - kind: BackupDRRestoreVerificationPlan
    group: backupdr.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: parent.ProjectAndLocationRef in apis/common/parent, inlined, could replace projectRef and location; the CRD keeps the same keys
    status: resolved
    resolution: edited
    note: replaced ProjectRef and Location with inlined *parent.ProjectAndLocationRef
