    group: bigtable.cnrm.cloud.google.com
    field: .spec.clusterConfig.clusterAutoscalingConfig.autoscalingLimits.minServeNodes
    reason: required-not-enforced
    detail: The proto marks this field REQUIRED, but the CRD leaves it optional. To enforce it, change BigtableClusterSpec.ClusterConfig in bigtablecluster_types.go from Cluster_ClusterConfig to Cluster_ClusterConfigWithRequired and run generate.sh again. BigtableCluster is alpha, so it may be enforced, but that breaks objects that leave the field out if the Kind has shipped.
    status: resolved
    resolution: accepted
    note: kept optional in KRM to avoid breaking configurations that omit autoscaling or leave fields unset
  - kind: BigtableCluster
    group: bigtable.cnrm.cloud.google.com
    field: .spec.clusterConfig.clusterAutoscalingConfig.autoscalingTargets
    reason: required-not-enforced
    detail: The proto marks this field REQUIRED, but the CRD leaves it optional. To enforce it, change BigtableClusterSpec.ClusterConfig in bigtablecluster_types.go from Cluster_ClusterConfig to Cluster_ClusterConfigWithRequired and run generate.sh again. BigtableCluster is alpha, so it may be enforced, but that breaks objects that leave the field out if the Kind has shipped.
    status: resolved
    resolution: accepted
    note: kept optional in KRM to avoid breaking configurations that omit autoscaling or leave fields unset
  - kind: BigtableCluster
    group: bigtable.cnrm.cloud.google.com
    field: .spec.encryptionConfig.kmsKeyName
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to cloudkms.googleapis.com/CryptoKey (google.api.resource_reference); confirm whether it should be a KCC reference
    status: resolved
    resolution: accepted
    note: already modeled as kmsKeyRef (*kmsv1beta1.KMSCryptoKeyRef) on Cluster_EncryptionConfig
  - kind: BigtableCluster
    group: bigtable.cnrm.cloud.google.com
    field: .spec.location
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to locations.googleapis.com/Location (google.api.resource_reference); confirm whether it should be a KCC reference
    status: resolved
    resolution: not-applicable
    note: locations.googleapis.com/Location is not managed by KCC; kept as plain string
  - kind: BigtableCluster
    group: bigtable.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: proto defines a location field in Spec; confirm whether it should be a reference, replaced by a parent reference, or kept as a plain string
    status: resolved
    resolution: accepted
    note: kept as plain string specifying the cluster zone; parent BigtableInstance is not regional/zonal
