# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: TranscoderJobTemplate
    group: transcoder.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: resolved
    resolution: edited
    note: replaced ProjectRef and Location with inlined *parent.ProjectAndLocationRef, removed top-level Labels from spec, and converted SecretVersion to SecretVersionRef
  - kind: TranscoderJobTemplate
    group: transcoder.cnrm.cloud.google.com
    field: .spec.config.encryptions[].secretManagerKeySource
    reason: possible-reference-by-name
    detail: SecretManagerSecretVersionRef
    status: resolved
    resolution: not-applicable
    note: secretManagerKeySource is a container message; its child field secretVersion is converted to secretVersionRef (*refsv1beta1.SecretManagerSecretVersionRef)
  - kind: TranscoderJobTemplate
    group: transcoder.cnrm.cloud.google.com
    field: .spec.config.encryptions[].secretManagerKeySource.secretVersion
    reason: possible-reference-by-description
    detail: the description has the resource-name template "projects/{project}/secrets/{secret_id}/versions/{version_number}"
    status: resolved
    resolution: edited
    note: converted to secretVersionRef (*refsv1beta1.SecretManagerSecretVersionRef) on TranscoderJobTemplate_Encryption_SecretManagerSource
  - kind: TranscoderJobTemplate
    group: transcoder.cnrm.cloud.google.com
    field: .spec.config.inputs[].uri
    reason: reference-not-representable
    detail: 'gcs-path-decomposable-as-bucketref-plus-path: names another resource, but KCC cannot express it as a reference today, so it stays a string'
    status: resolved
    resolution: accepted
  - kind: TranscoderJobTemplate
    group: transcoder.cnrm.cloud.google.com
    field: .spec.config.muxStreams[].encryptionID
    reason: possible-reference-by-name
    detail: the field name ends in ID/IDs; confirm whether it references another resource
    status: resolved
    resolution: not-applicable
    note: references an Encryption.id entry within the same JobConfig.encryptions list, not a separate GCP resource
  - kind: TranscoderJobTemplate
    group: transcoder.cnrm.cloud.google.com
    field: .spec.config.output.uri
    reason: reference-not-representable
    detail: 'gcs-path-decomposable-as-bucketref-plus-path: names another resource, but KCC cannot express it as a reference today, so it stays a string'
    status: resolved
    resolution: accepted
  - kind: TranscoderJobTemplate
    group: transcoder.cnrm.cloud.google.com
    field: .spec.config.overlays[].image.uri
    reason: reference-not-representable
    detail: 'gcs-path-decomposable-as-bucketref-plus-path: names another resource, but KCC cannot express it as a reference today, so it stays a string'
    status: resolved
    resolution: accepted
  - kind: TranscoderJobTemplate
    group: transcoder.cnrm.cloud.google.com
    field: .spec.config.pubsubDestination.topic
    reason: possible-reference-by-description
    detail: the description has the resource-name template "projects/{project}/topics/{topic}"
    status: resolved
    resolution: edited
    note: converted to topicRef (*pubsubv1beta1.PubSubTopicRef) on PubsubDestination
  - kind: TranscoderJobTemplate
    group: transcoder.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: parent.ProjectAndLocationRef in apis/common/parent, inlined, could replace projectRef and location; the CRD keeps the same keys
    status: resolved
    resolution: edited
    note: replaced ProjectRef and Location with inlined *parent.ProjectAndLocationRef
