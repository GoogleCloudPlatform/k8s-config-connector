# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other.

entries:
  - kind: GKEBackupRestoreChannel
    group: gkebackup.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: GKEBackupRestoreChannel
    group: gkebackup.cnrm.cloud.google.com
    field: .spec.destinationProject
    reason: possible-reference-by-description
    status: open
  - kind: GKEBackupRestoreChannel
    group: gkebackup.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: parent.ProjectAndLocationRef in apis/common/parent, inlined, could replace projectRef and location; the CRD keeps the same keys
    status: open
  - kind: GKEBackupBackupPlan
    group: gkebackup.cnrm.cloud.google.com
    field: .spec.backupSchedule.rpoConfig.targetRPOMinutes
    reason: required-not-enforced
    detail: The proto marks this field REQUIRED, but the CRD leaves it optional. To enforce it, add +required to RPOConfig.TargetRPOMinutes in gkebackupbackupplan_types.go. GKEBackupBackupPlan is alpha, so it may be enforced, but that breaks objects that leave the field out if the Kind has shipped.
    status: open
  - kind: GKEBackupRestore
    group: gkebackup.cnrm.cloud.google.com
    field: .spec.backupRef
    reason: required-not-enforced
    detail: The proto marks this field REQUIRED, but the CRD leaves it optional. To enforce it, add +required to GKEBackupRestoreSpec.BackupRef in gkebackuprestore_types.go. GKEBackupRestore is alpha, so it may be enforced, but that breaks objects that leave the field out if the Kind has shipped.
    status: open
  - kind: GKEBackupRestore
    group: gkebackup.cnrm.cloud.google.com
    field: .spec.volumeDataRestorePolicyOverrides[].policy
    reason: required-not-enforced
    detail: The proto marks this field REQUIRED, but the CRD leaves it optional. To enforce it, add +required to VolumeDataRestorePolicyOverride.Policy in gkebackuprestore_types.go. GKEBackupRestore is alpha, so it may be enforced, but that breaks objects that leave the field out if the Kind has shipped.
    status: open
