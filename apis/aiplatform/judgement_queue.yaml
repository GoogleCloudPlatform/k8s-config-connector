    status: open
  - kind: AIPlatformNotebookRuntimeTemplate
    group: aiplatform.cnrm.cloud.google.com
    field: .spec.encryptionSpec.kmsKeyRef
    reason: required-not-enforced
    detail: The proto marks this field REQUIRED, but the CRD leaves it optional. EncryptionSpec in vertexaischedule_types.go is also used by AIPlatformModel, AIPlatformPersistentResource, AIPlatformReasoningEngine, VertexAIFeatureOnlineStore, VertexAIPipelineJob, VertexAISchedule, VertexAITrainingPipeline, VertexAITuningJob. +required on EncryptionSpec.KmsKeyRef would apply there too. To enforce it for AIPlatformNotebookRuntimeTemplate only, give AIPlatformNotebookRuntimeTemplate its own copy of EncryptionSpec. AIPlatformNotebookRuntimeTemplate is alpha, so it may be enforced, but that breaks objects that leave the field out if the Kind has shipped.
    status: open
  - kind: AIPlatformNotebookRuntimeTemplate
    group: aiplatform.cnrm.cloud.google.com
