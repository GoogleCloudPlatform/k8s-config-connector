    detail: 'none of these loaded as a page ending in /v1/projects.locations.notebookRuntimeTemplates: https://docs.cloud.google.com/vertex-ai/docs/reference/rest/v1/projects.locations.notebookRuntimeTemplates, https://docs.cloud.google.com/ai-platform/docs/reference/rest/v1/projects.locations.notebookRuntimeTemplates'
