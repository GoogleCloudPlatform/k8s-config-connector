    detail: The proto marks this field REQUIRED, but the CRD leaves it optional. To enforce it, change AIPlatformNotebookRuntimeTemplateSpec.MachineSpec in aiplatformnotebookruntimetemplate_types.go from MachineSpec to MachineSpecWithRequired and run generate.sh again. AIPlatformNotebookRuntimeTemplate is alpha, so it may be enforced, but that breaks objects that leave the field out if the Kind has shipped.
