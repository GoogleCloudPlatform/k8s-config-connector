# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: DataformReleaseConfig
    group: dataform.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: DataformReleaseConfig
    group: dataform.cnrm.cloud.google.com
    field: .spec.codeCompilationConfig.assertionSchema
    reason: possible-reference-by-description-loose
    status: open
  - kind: DataformReleaseConfig
    group: dataform.cnrm.cloud.google.com
    field: .spec.codeCompilationConfig.defaultDatabase
    reason: possible-reference-by-description-loose
    status: open
  - kind: DataformReleaseConfig
    group: dataform.cnrm.cloud.google.com
    field: .spec.codeCompilationConfig.defaultNotebookRuntimeOptions.aiPlatformNotebookRuntimeTemplate
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to aiplatform.googleapis.com/NotebookRuntimeTemplate (google.api.resource_reference); confirm whether it should be a KCC reference
    status: open
  - kind: DataformReleaseConfig
    group: dataform.cnrm.cloud.google.com
    field: .spec.codeCompilationConfig.defaultNotebookRuntimeOptions.gcsOutputBucket
    reason: possible-reference-by-description
    detail: the field name has bucket and the description mentions Cloud Storage
    status: open
  - kind: DataformReleaseConfig
    group: dataform.cnrm.cloud.google.com
    field: .spec.codeCompilationConfig.defaultSchema
    reason: possible-reference-by-description-loose
    status: open
  - kind: DataformReleaseConfig
    group: dataform.cnrm.cloud.google.com
    field: .spec.releaseCompilationResult
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to dataform.googleapis.com/CompilationResult (google.api.resource_reference); confirm whether it should be a KCC reference
    status: open
  - kind: DataformWorkflowConfig
    group: dataform.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: DataformWorkflowConfig
    group: dataform.cnrm.cloud.google.com
    field: .spec.invocationConfig.includedTargets[].database
    reason: possible-reference-by-description-loose
    status: open
  - kind: DataformWorkflowConfig
    group: dataform.cnrm.cloud.google.com
    field: .spec.invocationConfig.includedTargets[].schema
    reason: possible-reference-by-description-loose
    status: open
  - kind: DataformWorkflowConfig
    group: dataform.cnrm.cloud.google.com
    field: .spec.invocationConfig.serviceAccount
    reason: possible-reference-by-description
    detail: the field name ends in serviceAccount
    status: open
  - kind: DataformWorkspace
    group: dataform.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
