    detail: the parent is projects/{project}/locations/{location}/reportConfigs/{report_config}, which already names the location; a reference to it could replace location and the root reference
    status: resolved
    resolution: edited
    note: modelled as spec.parentRef (*MigrationCenterReportConfigRef); removed ProjectRef and Location
  - kind: MigrationCenterReport
    group: migrationcenter.cnrm.cloud.google.com
    field: .spec.reportConfigRef
    reason: parent-ref-guessed
    detail: emitted as a reference to MigrationCenterReportConfigRef, read from the reportConfigs segment of projects/{project}/locations/{location}/reportConfigs/{report_config}/reports/{report}; the field name comes from the pattern rather than the proto, so confirm both the name and the target
    status: resolved
