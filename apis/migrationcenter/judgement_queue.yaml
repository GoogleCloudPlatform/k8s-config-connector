# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: MigrationCenterImportDataFile
    group: migrationcenter.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: MigrationCenterImportDataFile
    group: migrationcenter.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{project}/locations/{location}/importJobs/{import_job}/importDataFiles/{import_data_file}" contains ancestor segment(s) importJobs/{import_job} with no matching reference or field on MigrationCenterImportDataFileSpec
    status: open
  - kind: MigrationCenterImportDataFile
    group: migrationcenter.cnrm.cloud.google.com
    reason: identity-server-generated-id
    detail: proto marks the resource .name field OUTPUT_ONLY; confirm whether the resource ID is server-generated or client-specified via a Create request *_id parameter
    status: open
  - kind: MigrationCenterImportDataFile
    group: migrationcenter.cnrm.cloud.google.com
    field: .spec.importJobRef
    reason: parent-ref-guessed
    detail: emitted as a reference to MigrationCenterImportJobRef, read from the importJobs segment of projects/{project}/locations/{location}/importJobs/{import_job}/importDataFiles/{import_data_file}; the field name comes from the pattern rather than the proto, so confirm both the name and the target
    status: open
  - kind: MigrationCenterImportDataFile
    group: migrationcenter.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: the parent is projects/{project}/locations/{location}/importJobs/{import_job}, which already names the location; a reference to it could replace location and the root reference
    status: open
  - kind: MigrationCenterImportJob
    group: migrationcenter.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: resolved
    resolution: edited
    note: triaged all findings; replaced ProjectRef and Location with inlined *parent.ProjectAndLocationRef, converted assetSource to typed KCC reference, and confirmed client-specified resource ID
  - kind: MigrationCenterImportJob
    group: migrationcenter.cnrm.cloud.google.com
    reason: identity-server-generated-id
    detail: proto marks the resource .name field OUTPUT_ONLY; confirm whether the resource ID is server-generated or client-specified via a Create request *_id parameter
    status: resolved
    resolution: accepted
    note: CreateImportJobRequest specifies import_job_id parameter, so resource ID is client-specified
  - kind: MigrationCenterImportJob
    group: migrationcenter.cnrm.cloud.google.com
    field: .spec.assetSource
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to migrationcenter.googleapis.com/Source (google.api.resource_reference); confirm whether it should be a KCC reference
    status: resolved
    resolution: edited
    note: converted to AssetSourceRef (*MigrationCenterSourceRef)
  - kind: MigrationCenterImportJob
    group: migrationcenter.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: parent.ProjectAndLocationRef in apis/common/parent, inlined, could replace projectRef and location; the CRD keeps the same keys
    status: resolved
    resolution: edited
    note: replaced ProjectRef and Location with inlined *parent.ProjectAndLocationRef
  - kind: MigrationCenterReport
    group: migrationcenter.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: resolved
    resolution: edited
    note: triaged all findings; replaced ProjectRef, Location, and guessed ReportConfigRef with spec.parentRef (*MigrationCenterReportConfigRef), moved server-populated state to status.observedState.state, and confirmed client-specified resource ID
  - kind: MigrationCenterReport
    group: migrationcenter.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{project}/locations/{location}/reportConfigs/{report_config}/reports/{report}" contains ancestor segment(s) reportConfigs/{report_config} with no matching reference or field on MigrationCenterReportSpec
    status: resolved
    resolution: edited
    note: modelled as spec.parentRef (*MigrationCenterReportConfigRef); removed ProjectRef and Location
  - kind: MigrationCenterReport
    group: migrationcenter.cnrm.cloud.google.com
    reason: identity-server-generated-id
