# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: BigQueryAnalyticsHubQueryTemplate
    group: bigqueryanalyticshub.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: BigQueryAnalyticsHubQueryTemplate
    group: bigqueryanalyticshub.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{project}/locations/{location}/dataExchanges/{data_exchange}/queryTemplates/{query_template}" contains ancestor segment(s) dataExchanges/{data_exchange} with no matching reference or field on BigQueryAnalyticsHubQueryTemplateSpec
    status: open
  - kind: BigQueryAnalyticsHubQueryTemplate
    group: bigqueryanalyticshub.cnrm.cloud.google.com
    reason: verify-resource-docs-link
    detail: 'none of these loaded as a page ending in /v1/projects.locations.dataExchanges.queryTemplates: https://docs.cloud.google.com/bigquery/docs/analytics-hub-introduction/reference/rest/v1/projects.locations.dataExchanges.queryTemplates'
    status: open
  - kind: BigQueryAnalyticsHubQueryTemplate
    group: bigqueryanalyticshub.cnrm.cloud.google.com
    field: .spec.dataExchangeRef
    reason: parent-ref-guessed
    detail: emitted as a reference to BigQueryAnalyticsHubDataExchangeRef, read from the dataExchanges segment of projects/{project}/locations/{location}/dataExchanges/{data_exchange}/queryTemplates/{query_template}; the field name comes from the pattern rather than the proto, so confirm both the name and the target
    status: open
  - kind: BigQueryAnalyticsHubQueryTemplate
    group: bigqueryanalyticshub.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: the parent is projects/{project}/locations/{location}/dataExchanges/{data_exchange}, which already names the location; a reference to it could replace location and the root reference
    status: open
  - kind: BigQueryAnalyticsHubQueryTemplate
    group: bigqueryanalyticshub.cnrm.cloud.google.com
    field: .status.observedState.name
    reason: observedstate-identity-field-omitted
    detail: proto marks field OUTPUT_ONLY; resource name is represented by status.externalRef. Verify applicability for this resource
    status: open
