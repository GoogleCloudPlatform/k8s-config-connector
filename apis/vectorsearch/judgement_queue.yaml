# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: VectorSearchDataObject
    group: vectorsearch.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: VectorSearchDataObject
    group: vectorsearch.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{project}/locations/{location}/collections/{collection}/dataObjects/{dataObject}" contains ancestor segment(s) collections/{collection} with no matching reference or field on VectorSearchDataObjectSpec
    status: open
  - kind: VectorSearchDataObject
    group: vectorsearch.cnrm.cloud.google.com
    reason: verify-service-docs-link
    detail: neither the Discovery directory nor the service config names a docs page; add one
    status: open
  - kind: VectorSearchDataObject
    group: vectorsearch.cnrm.cloud.google.com
    field: .spec.collectionRef
    reason: parent-ref-guessed
    detail: emitted as a reference to VectorSearchCollectionRef, read from the collections segment of projects/{project}/locations/{location}/collections/{collection}/dataObjects/{dataObject}; the field name comes from the pattern rather than the proto, so confirm both the name and the target
    status: open
  - kind: VectorSearchDataObject
    group: vectorsearch.cnrm.cloud.google.com
    field: .spec.etag
    reason: etag-in-spec
    detail: etag was generated in the Spec because the proto does not mark it OUTPUT_ONLY; confirm whether it belongs in status.observedState
    status: open
  - kind: VectorSearchDataObject
    group: vectorsearch.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: the parent is projects/{project}/locations/{location}/collections/{collection}, which already names the location; a reference to it could replace location and the root reference
    status: open
  - kind: VectorSearchDataObject
    group: vectorsearch.cnrm.cloud.google.com
    field: .spec.vectors
    reason: message-map-derived
    detail: derived as map[string]Vector from proto google.cloud.vectorsearch.v1.Vector; verify Go type and mapping
    status: open
  - kind: VectorsearchIndex
    group: vectorsearch.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: resolved
    resolution: edited
    note: triaged parent, identity, and references; removed top-level labels; updated controller and fuzzer
  - kind: VectorsearchIndex
    group: vectorsearch.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{project}/locations/{location}/collections/{collection}/indexes/{index}" contains ancestor segment(s) collections/{collection} with no matching reference or field on VectorsearchIndexSpec
    status: resolved
    resolution: edited
    note: modelled as spec.parentRef (*VectorSearchCollectionRef) per the single-parent rule; removed projectRef and location
  - kind: VectorsearchIndex
    group: vectorsearch.cnrm.cloud.google.com
    reason: parent-ref-not-modelled
    detail: the parent is projects/{project}/locations/{location}/collections/{collection}, and no CollectionRef type exists to point at; add the parent resource first, then model this as a reference
    status: resolved
    resolution: edited
    note: modelled as spec.parentRef (*VectorSearchCollectionRef) per the single-parent rule; removed projectRef and location
  - kind: VectorsearchIndex
    group: vectorsearch.cnrm.cloud.google.com
    reason: verify-service-docs-link
    detail: neither the Discovery directory nor the service config names a docs page; add one
    status: resolved
    resolution: edited
    note: added service docs link for Vertex AI Vector Search
  - kind: VectorsearchIndex
    group: vectorsearch.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: the parent is projects/{project}/locations/{location}/collections/{collection}, which already names the location; a reference to it could replace location and the root reference
    status: resolved
    resolution: edited
    note: modelled as spec.parentRef (*VectorSearchCollectionRef) per the single-parent rule; removed projectRef and location
