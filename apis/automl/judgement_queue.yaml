# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: AutoMLModel
    group: automl.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: AutoMLModel
    group: automl.cnrm.cloud.google.com
    reason: identity-not-in-cai
    detail: template "//automl.googleapis.com/projects/{project}/locations/{location}/models/{model}" is not listed in docs/ai/metadata/cloudassetinventory_names.jsonl; verify the URL format or add an exception in pkg/gcpurls/registry_test.go
    status: open
  - kind: AutoMLModel
    group: automl.cnrm.cloud.google.com
    reason: identity-server-generated-id
    detail: generated AutoMLModelIdentity implements identity.ServerGeneratedIdentity because the Create RPC has no *_id parameter; confirm whether the resource ID is truly server-generated or client-specified in .name
    status: open
  - kind: AutoMLModel
    group: automl.cnrm.cloud.google.com
    reason: verify-resource-docs-link
    detail: found no docs root for this API; find the REST reference page by hand
    status: open
  - kind: AutoMLModel
    group: automl.cnrm.cloud.google.com
    reason: verify-service-docs-link
    detail: neither the Discovery directory nor the service config names a docs page; add one
    status: open
  - kind: AutoMLModel
    group: automl.cnrm.cloud.google.com
    field: .spec.datasetID
    reason: possible-reference-by-name
    detail: the field name ends in ID/IDs; confirm whether it references another resource
    status: open
  - kind: AutoMLModel
    group: automl.cnrm.cloud.google.com
    field: .spec.imageClassificationModelMetadata.baseModelID
    reason: possible-reference-by-name
    detail: the field name ends in ID/IDs; confirm whether it references another resource
    status: open
  - kind: AutoMLModel
    group: automl.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: parent.ProjectAndLocationRef in apis/common/parent, inlined, could replace projectRef and location; the CRD keeps the same keys
    status: open
  - kind: AutoMLModel
    group: automl.cnrm.cloud.google.com
    field: .spec.translationModelMetadata.baseModel
    reason: possible-reference-by-description
    detail: the description has the resource-name template "projects/{project_id}/locations/{location_id}/models/{model_id}"
    status: open
  - kind: AutoMLModel
    group: automl.cnrm.cloud.google.com
    field: .status.observedState.createTime
    reason: server-set-field-placed
    detail: 'moved to ObservedState because its name is on the server-set allowlist, not because the proto says so: no field on this message carries field_behavior. Confirm GCP sets this field instead of a user'
    status: open
  - kind: AutoMLModel
    group: automl.cnrm.cloud.google.com
    field: .status.observedState.deploymentState
    reason: well-known-output-only-pattern-in-comment
    detail: 'proto comment says output only but there is no field_behavior annotation, so it was generated into the Spec at .spec.deploymentState. Move the field to .status.observedState.deploymentState if it is confirmed output only. Proto comment: Output only. Deployment state of the model. A model can only serve prediction requests after it gets deployed.'
    status: open
  - kind: AutoMLModel
    group: automl.cnrm.cloud.google.com
    field: .status.observedState.etag
    reason: server-set-field-placed
    detail: 'moved to ObservedState because its name is on the server-set allowlist, not because the proto says so: no field on this message carries field_behavior. Confirm GCP sets this field instead of a user'
    status: open
  - kind: AutoMLModel
    group: automl.cnrm.cloud.google.com
    field: .status.observedState.textClassificationModelMetadata.classificationType
    reason: well-known-output-only-pattern-in-comment
    detail: 'proto comment says output only but there is no field_behavior annotation, so it was generated into the Spec at .spec.textClassificationModelMetadata.classificationType. Move the field to .status.observedState.textClassificationModelMetadata.classificationType if it is confirmed output only. Proto comment: Output only. Classification type of the dataset used to train this model.'
    status: open
  - kind: AutoMLModel
    group: automl.cnrm.cloud.google.com
    field: .status.observedState.translationModelMetadata.sourceLanguageCode
    reason: well-known-output-only-pattern-in-comment
    detail: 'proto comment says output only but there is no field_behavior annotation, so it was generated into the Spec at .spec.translationModelMetadata.sourceLanguageCode. Move the field to .status.observedState.translationModelMetadata.sourceLanguageCode if it is confirmed output only. Proto comment: Output only. Inferred from the dataset. The source language (The BCP-47 language code) that is used for training.'
    status: open
  - kind: AutoMLModel
    group: automl.cnrm.cloud.google.com
    field: .status.observedState.translationModelMetadata.targetLanguageCode
    reason: well-known-output-only-pattern-in-comment
    detail: 'proto comment says output only but there is no field_behavior annotation, so it was generated into the Spec at .spec.translationModelMetadata.targetLanguageCode. Move the field to .status.observedState.translationModelMetadata.targetLanguageCode if it is confirmed output only. Proto comment: Output only. The target language (The BCP-47 language code) that is used for training.'
    status: open
  - kind: AutoMLModel
    group: automl.cnrm.cloud.google.com
    field: .status.observedState.updateTime
    reason: server-set-field-placed
    detail: 'moved to ObservedState because its name is on the server-set allowlist, not because the proto says so: no field on this message carries field_behavior. Confirm GCP sets this field instead of a user'
    status: open
