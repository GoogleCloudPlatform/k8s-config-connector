# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: DiscoveryEngineACLConfig
    group: discoveryengine.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: DiscoveryEngineACLConfig
    group: discoveryengine.cnrm.cloud.google.com
    reason: empty-observedstate
    detail: nothing was generated into status.observedState; the proto probably marks no field OUTPUT_ONLY, so output fields landed in the Spec. Decide what belongs in status
    status: open
  - kind: DiscoveryEngineACLConfig
    group: discoveryengine.cnrm.cloud.google.com
    reason: verify-resource-docs-link
    detail: 'none of these loaded as a page ending in /v1/projects.locations.aclConfig: https://docs.cloud.google.com/generative-ai-app-builder/docs/reference/rest/v1/projects.locations.aclConfig'
    status: open
  - kind: DiscoveryEngineACLConfig
    group: discoveryengine.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: parent.ProjectAndLocationRef in apis/common/parent, inlined, could replace projectRef and location; the CRD keeps the same keys
    status: open
  - kind: DiscoveryEngineCMEKConfig
    group: discoveryengine.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: DiscoveryEngineCMEKConfig
    group: discoveryengine.cnrm.cloud.google.com
    reason: identity-multi-pattern
    detail: proto message google.cloud.discoveryengine.v1.CmekConfig declares 2 resource name patterns (projects/{project}/locations/{location}/cmekConfig, projects/{project}/locations/{location}/cmekConfigs/{cmek_config}) that tied on DiscoveryEngineCMEKConfigSpec; generated identity defaulted to "projects/{project}/locations/{location}/cmekConfig" (pass --pattern DiscoveryEngineCMEKConfig=<pattern> to override)
    status: open
  - kind: DiscoveryEngineCMEKConfig
    group: discoveryengine.cnrm.cloud.google.com
    reason: verify-resource-docs-link
    detail: 'none of these loaded as a page ending in /v1/projects.locations.cmekConfig: https://docs.cloud.google.com/generative-ai-app-builder/docs/reference/rest/v1/projects.locations.cmekConfig'
    status: open
  - kind: DiscoveryEngineCMEKConfig
    group: discoveryengine.cnrm.cloud.google.com
    field: .spec.kmsKey
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to cloudkms.googleapis.com/CryptoKeys (google.api.resource_reference); confirm whether it should be a KCC reference
    status: open
  - kind: DiscoveryEngineCMEKConfig
    group: discoveryengine.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: parent.ProjectAndLocationRef in apis/common/parent, inlined, could replace projectRef and location; the CRD keeps the same keys
    status: open
  - kind: DiscoveryEngineCMEKConfig
    group: discoveryengine.cnrm.cloud.google.com
    field: .spec.singleRegionKeys[].kmsKey
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to cloudkms.googleapis.com/CryptoKeys (google.api.resource_reference); confirm whether it should be a KCC reference
    status: open
  - kind: DiscoveryEngineWidgetConfig
    group: discoveryengine.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: resolved
    resolution: edited
    note: triaged judgement queue, configured spec.parentRef (*DiscoveryEngineDataStoreRef), removed projectRef and location, locked pattern in generate.sh, and regenerated identity via controllerbuilder
  - kind: DiscoveryEngineWidgetConfig
    group: discoveryengine.cnrm.cloud.google.com
    reason: identity-multi-pattern
    detail: proto message google.cloud.discoveryengine.v1.WidgetConfig declares 3 resource name patterns (projects/{project}/locations/{location}/dataStores/{data_store}/widgetConfigs/{widget_config}, projects/{project}/locations/{location}/collections/{collection}/dataStores/{data_store}/widgetConfigs/{widget_config}, projects/{project}/locations/{location}/collections/{collection}/engines/{engine}/widgetConfigs/{widget_config}) that tied on DiscoveryEngineWidgetConfigSpec; generated identity defaulted to "projects/{project}/locations/{location}/dataStores/{data_store}/widgetConfigs/{widget_config}" (pass --pattern DiscoveryEngineWidgetConfig=<pattern> to override)
    status: resolved
    resolution: accepted
    note: locked in 5-segment pattern projects/{project}/locations/{location}/collections/{collection}/dataStores/{dataStore}/widgetConfigs/{widgetConfig} via --pattern in generate.sh to align with parent DiscoveryEngineDataStore
  - kind: DiscoveryEngineWidgetConfig
    group: discoveryengine.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{project}/locations/{location}/dataStores/{dataStore}/widgetConfigs/{widgetConfig}" contains ancestor segment(s) dataStores/{dataStore} with no matching reference or field on DiscoveryEngineWidgetConfigSpec
    status: resolved
    resolution: edited
    note: resolved by modeling spec.parentRef (*DiscoveryEngineDataStoreRef) per Case B
  - kind: DiscoveryEngineWidgetConfig
    group: discoveryengine.cnrm.cloud.google.com
    field: .spec.dataStoreRef
    reason: parent-ref-guessed
    detail: emitted as a reference to DiscoveryEngineDataStoreRef, read from the dataStores segment of projects/{project}/locations/{location}/dataStores/{data_store}/widgetConfigs/{widget_config}; the field name comes from the pattern rather than the proto, so confirm both the name and the target
    status: resolved
    resolution: edited
    note: modelled parent hierarchy as spec.parentRef (*DiscoveryEngineDataStoreRef) per Case B
  - kind: DiscoveryEngineWidgetConfig
    group: discoveryengine.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: the parent is projects/{project}/locations/{location}/dataStores/{data_store}, which already names the location; a reference to it could replace location and the root reference
    status: resolved
    resolution: edited
    note: modelled parent hierarchy as spec.parentRef (*DiscoveryEngineDataStoreRef); removed projectRef and location per Case B
  - kind: DiscoveryEngineWidgetConfig
    group: discoveryengine.cnrm.cloud.google.com
