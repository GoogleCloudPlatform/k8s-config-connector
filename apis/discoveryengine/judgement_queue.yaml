# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: DiscoveryengineDocument
    group: discoveryengine.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: DiscoveryengineDocument
    group: discoveryengine.cnrm.cloud.google.com
    reason: identity-multi-pattern
    detail: proto message google.cloud.discoveryengine.v1.Document declares 2 resource name patterns (projects/{project}/locations/{location}/dataStores/{data_store}/branches/{branch}/documents/{document}, projects/{project}/locations/{location}/collections/{collection}/dataStores/{data_store}/branches/{branch}/documents/{document}) that tied on DiscoveryengineDocumentSpec; generated identity defaulted to "projects/{project}/locations/{location}/dataStores/{data_store}/branches/{branch}/documents/{document}" (pass --pattern DiscoveryengineDocument=<pattern> to override)
    status: open
  - kind: DiscoveryengineDocument
    group: discoveryengine.cnrm.cloud.google.com
    reason: identity-not-in-cai
    detail: template "//discoveryengine.googleapis.com/projects/{project}/locations/{location}/dataStores/{data_store}/branches/{branch}/documents/{document}" is not listed in docs/ai/metadata/cloudassetinventory_names.jsonl; verify the URL format or add an exception in pkg/gcpurls/registry_test.go
    status: open
  - kind: DiscoveryengineDocument
    group: discoveryengine.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{project}/locations/{location}/dataStores/{data_store}/branches/{branch}/documents/{document}" contains ancestor segment(s) dataStores/{data_store}, branches/{branch} with no matching reference or field on DiscoveryengineDocumentSpec
    status: open
  - kind: DiscoveryengineDocument
    group: discoveryengine.cnrm.cloud.google.com
    reason: parent-ref-not-modelled
    detail: the parent is projects/{project}/locations/{location}/dataStores/{data_store}/branches/{branch}, and no BranchRef type exists to point at; add the parent resource first, then model this as a reference
    status: open
  - kind: DiscoveryengineDocument
    group: discoveryengine.cnrm.cloud.google.com
    field: .spec.aclInfo.readers[].principals[].externalEntityID
    reason: possible-reference-by-name
    detail: the field name ends in ID/IDs; confirm whether it references another resource
    status: open
  - kind: DiscoveryengineDocument
    group: discoveryengine.cnrm.cloud.google.com
    field: .spec.aclInfo.readers[].principals[].groupID
    reason: possible-reference-by-name
    detail: the field name ends in ID/IDs; confirm whether it references another resource
    status: open
  - kind: DiscoveryengineDocument
    group: discoveryengine.cnrm.cloud.google.com
    field: .spec.aclInfo.readers[].principals[].userID
    reason: possible-reference-by-name
    detail: the field name ends in ID/IDs; confirm whether it references another resource
    status: open
  - kind: DiscoveryengineDocument
    group: discoveryengine.cnrm.cloud.google.com
    field: .spec.content.uri
    reason: reference-not-representable
    detail: 'gcs-path-decomposable-as-bucketref-plus-path: names another resource, but KCC cannot express it as a reference today, so it stays a string'
    status: open
  - kind: DiscoveryengineDocument
    group: discoveryengine.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: the parent is projects/{project}/locations/{location}/dataStores/{data_store}/branches/{branch}, which already names the location; a reference to it could replace location and the root reference
    status: open
  - kind: DiscoveryengineDocument
    group: discoveryengine.cnrm.cloud.google.com
    field: .spec.parentDocumentID
    reason: possible-reference-by-name
    detail: the field name ends in ID/IDs; confirm whether it references another resource
    status: open
  - kind: DiscoveryengineDocument
    group: discoveryengine.cnrm.cloud.google.com
    field: .spec.schemaID
    reason: possible-reference-by-name
    detail: the field name ends in ID/IDs; confirm whether it references another resource
    status: open
