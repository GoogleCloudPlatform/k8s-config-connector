# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: ObservabilityLink
    group: observability.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: resolved
    resolution: edited
    note: inlined *parent.ProjectAndLocationRef; modeled bucket and dataset as immutable strings; verified resource-docs link
  - kind: ObservabilityLink
    group: observability.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{project}/locations/{location}/buckets/{bucket}/datasets/{dataset}/links/{link}" contains ancestor segment(s) buckets/{bucket}, datasets/{dataset} with no matching reference or field on ObservabilityLinkSpec
    status: resolved
    resolution: edited
    note: modeled bucket and dataset ancestor segments as required immutable string fields in spec per maintainer decision
  - kind: ObservabilityLink
    group: observability.cnrm.cloud.google.com
    reason: parent-ref-not-modelled
    detail: the parent is projects/{project}/locations/{location}/buckets/{bucket}/datasets/{dataset}, and no DatasetRef type exists to point at; add the parent resource first, then model this as a reference
    status: resolved
    resolution: not-applicable
    note: ObservabilityDataset and ObservabilityBucket are read-only system-managed telemetry containers in GCP without standard CRUD/lifecycle endpoints; modeled bucket and dataset as plain strings
  - kind: ObservabilityLink
    group: observability.cnrm.cloud.google.com
    reason: verify-resource-docs-link
    detail: 'none of these loaded as a page ending in /v1/projects.locations.buckets.datasets.links: https://docs.cloud.google.com/stackdriver/docs/reference/rest/v1/projects.locations.buckets.datasets.links'
    status: resolved
    resolution: edited
    note: updated resource-docs URL to https://docs.cloud.google.com/stackdriver/docs/reference/observability/api/rest/v1/projects.locations.buckets.datasets.links
  - kind: ObservabilityLink
    group: observability.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: the parent is projects/{project}/locations/{location}/buckets/{bucket}/datasets/{dataset}, which already names the location; a reference to it could replace location and the root reference
    status: resolved
    resolution: edited
    note: replaced ProjectRef and Location with inlined *parent.ProjectAndLocationRef
  - kind: ObservabilityTraceScope
    group: observability.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: resolved
    resolution: edited
    note: inlined *parent.ProjectAndLocationRef; converted resourceNames to resourceNameRefs ([]refsv1beta1.ProjectRef)
  - kind: ObservabilityTraceScope
    group: observability.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: parent.ProjectAndLocationRef in apis/common/parent, inlined, could replace projectRef and location; the CRD keeps the same keys
    status: resolved
    resolution: edited
    note: replaced ProjectRef and Location with inlined *parent.ProjectAndLocationRef
  - kind: ObservabilityTraceScope
    group: observability.cnrm.cloud.google.com
    field: .spec.resourceNames
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to * (google.api.resource_reference); confirm whether it should be a KCC reference
    status: resolved
    resolution: edited
    note: converted resourceNames to resourceNameRefs ([]refsv1beta1.ProjectRef)
