# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: LustreInstance
    group: lustre.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: resolved
    resolution: edited
    note: inlined parent.ProjectAndLocationRef, converted network to NetworkRef, omitted deprecated gkeSupportEnabled, removed Spec.Labels
  - kind: LustreInstance
    group: lustre.cnrm.cloud.google.com
    field: .spec.gkeSupportEnabled
    reason: deprecated-field
    detail: the proto marks this field deprecated, so new Kinds leave it out of the Spec. If this Spec still has it, remove it by hand; add it back only if users still need it
    status: resolved
    resolution: accepted
    note: deprecated field omitted from Spec
  - kind: LustreInstance
    group: lustre.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: parent.ProjectAndLocationRef in apis/common/parent, inlined, could replace projectRef and location; the CRD keeps the same keys
    status: resolved
    resolution: edited
    note: replaced ProjectRef and Location with inlined *parent.ProjectAndLocationRef
  - kind: LustreInstance
    group: lustre.cnrm.cloud.google.com
    field: .spec.network
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to compute.googleapis.com/Network (google.api.resource_reference); confirm whether it should be a KCC reference
    status: resolved
    resolution: edited
    note: converted to networkRef (*computerefs.ComputeNetworkRef)
  - kind: LustreMirror
    group: lustre.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: LustreMirror
    group: lustre.cnrm.cloud.google.com
    reason: identity-not-in-cai
    detail: template "//lustre.googleapis.com/projects/{project}/locations/{location}/instances/{instance}/mirrors/{mirror}" is not listed in docs/ai/metadata/cloudassetinventory_names.jsonl; verify the URL format or add an exception in pkg/gcpurls/registry_test.go
    status: open
  - kind: LustreMirror
    group: lustre.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{project}/locations/{location}/instances/{instance}/mirrors/{mirror}" contains ancestor segment(s) instances/{instance} with no matching reference or field on LustreMirrorSpec
    status: open
  - kind: LustreMirror
    group: lustre.cnrm.cloud.google.com
    field: .spec.gcsPath
    reason: reference-not-representable
    detail: 'gcs-path-decomposable-as-bucketref-plus-path: names another resource, but KCC cannot express it as a reference today, so it stays a string'
    status: open
  - kind: LustreMirror
    group: lustre.cnrm.cloud.google.com
    field: .spec.gcsPath.uri
    reason: reference-not-representable
    detail: 'gcs-path-decomposable-as-bucketref-plus-path: names another resource, but KCC cannot express it as a reference today, so it stays a string'
    status: open
  - kind: LustreMirror
    group: lustre.cnrm.cloud.google.com
    field: .spec.instanceRef
    reason: parent-ref-guessed
    detail: emitted as a reference to LustreInstanceRef, read from the instances segment of projects/{project}/locations/{location}/instances/{instance}/mirrors/{mirror}; the field name comes from the pattern rather than the proto, so confirm both the name and the target
    status: open
  - kind: LustreMirror
    group: lustre.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: the parent is projects/{project}/locations/{location}/instances/{instance}, which already names the location; a reference to it could replace location and the root reference
    status: open
