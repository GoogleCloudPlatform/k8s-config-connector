# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: DatalineageRun
    group: datalineage.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: DatalineageRun
    group: datalineage.cnrm.cloud.google.com
    reason: empty-observedstate
    detail: nothing was generated into status.observedState; the proto probably marks no field OUTPUT_ONLY, so output fields landed in the Spec. Decide what belongs in status
    status: open
  - kind: DatalineageRun
    group: datalineage.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{project}/locations/{location}/processes/{process}/runs/{run}" contains ancestor segment(s) processes/{process} with no matching reference or field on DatalineageRunSpec
    status: open
  - kind: DatalineageRun
    group: datalineage.cnrm.cloud.google.com
    reason: identity-server-generated-id
    detail: generated DatalineageRunIdentity implements identity.ServerGeneratedIdentity because the Create RPC has no *_id parameter; confirm whether the resource ID is truly server-generated or client-specified in .name
    status: open
  - kind: DatalineageRun
    group: datalineage.cnrm.cloud.google.com
    field: .spec.attributes
    reason: message-map-derived
    detail: derived as map[string]Value from proto google.protobuf.Value; verify Go type and mapping
    status: open
  - kind: DatalineageRun
    group: datalineage.cnrm.cloud.google.com
    field: .spec.attributes
    reason: well-known-proto-type
    detail: field uses well-known protobuf type google.protobuf.Value, which was generated as struct Value; confirm KRM representation
    status: open
  - kind: DatalineageRun
    group: datalineage.cnrm.cloud.google.com
    field: .spec.endTime
    reason: possible-status-field-in-spec
    detail: endTime was generated in the Spec because the proto does not mark it OUTPUT_ONLY; confirm whether it is user-configurable desired state, a duplicate of spec.resourceID, or belongs in status.observedState
    status: open
  - kind: DatalineageRun
    group: datalineage.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: the parent is projects/{project}/locations/{location}/processes/{process}, which already names the location; a reference to it could replace location and the root reference
    status: open
  - kind: DatalineageRun
    group: datalineage.cnrm.cloud.google.com
    field: .spec.processRef
    reason: parent-ref-guessed
    detail: emitted as a reference to DataLineageProcessRef, read from the processes segment of projects/{project}/locations/{location}/processes/{process}/runs/{run}; the field name comes from the pattern rather than the proto, so confirm both the name and the target
    status: open
