# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: ConfigDeliveryRelease
    group: configdelivery.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: resolved
    resolution: edited
    note: Replaced ProjectRef and Location with ResourceBundleRef (*ConfigDeliveryResourceBundleRef) and removed Labels from Spec.
  - kind: ConfigDeliveryRelease
    group: configdelivery.cnrm.cloud.google.com
    reason: identity-not-in-cai
    detail: template "//configdelivery.googleapis.com/projects/{project}/locations/{location}/resourceBundles/{resource_bundle}/releases/{release}" is not listed in docs/ai/metadata/cloudassetinventory_names.jsonl; verify the URL format or add an exception in pkg/gcpurls/registry_test.go
    status: resolved
    resolution: accepted
    note: Verified URL format matches google.cloud.configdelivery.v1.Release google.api.resource pattern.
  - kind: ConfigDeliveryRelease
    group: configdelivery.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{project}/locations/{location}/resourceBundles/{resource_bundle}/releases/{release}" contains ancestor segment(s) resourceBundles/{resource_bundle} with no matching reference or field on ConfigDeliveryReleaseSpec
    status: resolved
    resolution: edited
    note: Uncommented ResourceBundleRef (*ConfigDeliveryResourceBundleRef) on ConfigDeliveryReleaseSpec.
  - kind: ConfigDeliveryRelease
    group: configdelivery.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: the parent is projects/{project}/locations/{location}/resourceBundles/{resource_bundle}, which already names the location; a reference to it could replace location and the root reference
    status: resolved
    resolution: edited
    note: Replaced ProjectRef and Location with ResourceBundleRef (*ConfigDeliveryResourceBundleRef).
  - kind: ConfigDeliveryRelease
    group: configdelivery.cnrm.cloud.google.com
    field: .spec.resourceBundleRef
    reason: parent-ref-guessed
    detail: emitted as a reference to ConfigDeliveryResourceBundleRef, read from the resourceBundles segment of projects/{project}/locations/{location}/resourceBundles/{resource_bundle}/releases/{release}; the field name comes from the pattern rather than the proto, so confirm both the name and the target
    status: resolved
    resolution: edited
    note: Confirmed and uncommented ResourceBundleRef (*ConfigDeliveryResourceBundleRef) as the required parent reference.
  - kind: ConfigdeliveryVariant
    group: configdelivery.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: resolved
    resolution: edited
    note: Replaced ProjectRef and Location with ReleaseRef (*ConfigDeliveryReleaseRef) and removed Labels from Spec.
  - kind: ConfigdeliveryVariant
    group: configdelivery.cnrm.cloud.google.com
    reason: identity-not-in-cai
    detail: template "//configdelivery.googleapis.com/projects/{project}/locations/{location}/resourceBundles/{resource_bundle}/releases/{release}/variants/{variant}" is not listed in docs/ai/metadata/cloudassetinventory_names.jsonl; verify the URL format or add an exception in pkg/gcpurls/registry_test.go
    status: resolved
    resolution: accepted
    note: Verified URL format matches google.cloud.configdelivery.v1.Variant google.api.resource pattern.
  - kind: ConfigdeliveryVariant
    group: configdelivery.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{project}/locations/{location}/resourceBundles/{resource_bundle}/releases/{release}/variants/{variant}" contains ancestor segment(s) resourceBundles/{resource_bundle}, releases/{release} with no matching reference or field on ConfigdeliveryVariantSpec
    status: resolved
    resolution: edited
    note: Added ReleaseRef (*ConfigDeliveryReleaseRef) on ConfigdeliveryVariantSpec.
  - kind: ConfigdeliveryVariant
    group: configdelivery.cnrm.cloud.google.com
    reason: parent-ref-not-modelled
    detail: the parent is projects/{project}/locations/{location}/resourceBundles/{resource_bundle}/releases/{release}, and no ReleaseRef type exists to point at; add the parent resource first, then model this as a reference
    status: resolved
    resolution: edited
    note: Modelled parent reference as ReleaseRef (*ConfigDeliveryReleaseRef).
  - kind: ConfigdeliveryVariant
    group: configdelivery.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: the parent is projects/{project}/locations/{location}/resourceBundles/{resource_bundle}/releases/{release}, which already names the location; a reference to it could replace location and the root reference
    status: resolved
    resolution: edited
    note: Replaced ProjectRef and Location with ReleaseRef (*ConfigDeliveryReleaseRef).
