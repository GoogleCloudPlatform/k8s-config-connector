# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: LoggingLogScope
    group: logging.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: resolved
    resolution: edited
    note: modeled optional parent references (projectRef, folderRef, organizationRef, billingAccountRef) alongside location on LoggingLogScopeSpec; generated multi-parent identity supporting all four parent scopes; accepted polymorphic resourceNames list
  - kind: LoggingLogScope
    group: logging.cnrm.cloud.google.com
    reason: identity-multi-pattern
    detail: proto message google.logging.v2.LogScope declares 4 resource name patterns (projects/{project}/locations/{location}/logScopes/{log_scope}, organizations/{organization}/locations/{location}/logScopes/{log_scope}, folders/{folder}/locations/{location}/logScopes/{log_scope}, billingAccounts/{billing_account}/locations/{location}/logScopes/{log_scope}); generated identity uses "projects/{project}/locations/{location}/logScopes/{log_scope}" (pass --pattern LoggingLogScope=<pattern> to override)
    status: resolved
    resolution: edited
    note: modeled optional projectRef, folderRef, organizationRef, and billingAccountRef on LoggingLogScopeSpec and generated multi-parent identity supporting project, folder, organization, and billing account scopes
  - kind: LoggingLogScope
    group: logging.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: parent.ProjectAndLocationRef in apis/common/parent, inlined, could replace projectRef and location; the CRD keeps the same keys
    status: resolved
    resolution: accepted
    note: kept separate location and parent references (projectRef, folderRef, organizationRef, billingAccountRef) because LoggingLogScope supports multiple root parent scopes and cannot embed ProjectAndLocationRef
  - kind: LoggingLogScope
    group: logging.cnrm.cloud.google.com
    field: .spec.resourceNames
    reason: possible-reference-by-description-loose
    status: resolved
    resolution: edited
    note: converted resourceNames to resourceRefs ([]LoggingLogScopeResourceRef) supporting references to either a Project (projectRef) or a LoggingLogView (logViewRef)
