# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: ChronicleDataTableRow
    group: chronicle.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: ChronicleDataTableRow
    group: chronicle.cnrm.cloud.google.com
    reason: identity-not-in-cai
    detail: template "//chronicle.googleapis.com/projects/{project}/locations/{location}/instances/{instance}/dataTables/{data_table}/dataTableRows/{data_table_row}" is not listed in docs/ai/metadata/cloudassetinventory_names.jsonl; verify the URL format or add an exception in pkg/gcpurls/registry_test.go
    status: open
  - kind: ChronicleDataTableRow
    group: chronicle.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{project}/locations/{location}/instances/{instance}/dataTables/{data_table}/dataTableRows/{data_table_row}" contains ancestor segment(s) instances/{instance}, dataTables/{data_table} with no matching reference or field on ChronicleDataTableRowSpec
    status: open
  - kind: ChronicleDataTableRow
    group: chronicle.cnrm.cloud.google.com
    reason: identity-server-generated-id
    detail: generated ChronicleDataTableRowIdentity implements identity.ServerGeneratedIdentity because the Create RPC has no *_id parameter; confirm whether the resource ID is truly server-generated or client-specified in .name
    status: open
  - kind: ChronicleDataTableRow
    group: chronicle.cnrm.cloud.google.com
    field: .spec.dataTableRef
    reason: parent-ref-guessed
    detail: emitted as a reference to ChronicleDataTableRef, read from the dataTables segment of projects/{project}/locations/{location}/instances/{instance}/dataTables/{data_table}/dataTableRows/{data_table_row}; the field name comes from the pattern rather than the proto, so confirm both the name and the target
    status: open
  - kind: ChronicleDataTableRow
    group: chronicle.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: the parent is projects/{project}/locations/{location}/instances/{instance}/dataTables/{data_table}, which already names the location; a reference to it could replace location and the root reference
    status: open
  - kind: ChronicleWatchlist
    group: chronicle.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: ChronicleWatchlist
    group: chronicle.cnrm.cloud.google.com
    reason: identity-not-in-cai
    detail: template "//chronicle.googleapis.com/projects/{project}/locations/{location}/instances/{instance}/watchlists/{watchlist}" is not listed in docs/ai/metadata/cloudassetinventory_names.jsonl; verify the URL format or add an exception in pkg/gcpurls/registry_test.go
    status: open
  - kind: ChronicleWatchlist
    group: chronicle.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{project}/locations/{location}/instances/{instance}/watchlists/{watchlist}" contains ancestor segment(s) instances/{instance} with no matching reference or field on ChronicleWatchlistSpec
    status: open
  - kind: ChronicleWatchlist
    group: chronicle.cnrm.cloud.google.com
    reason: parent-ref-not-modelled
    detail: the parent is projects/{project}/locations/{location}/instances/{instance}, and no InstanceRef type exists to point at; add the parent resource first, then model this as a reference
    status: open
  - kind: ChronicleWatchlist
    group: chronicle.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: the parent is projects/{project}/locations/{location}/instances/{instance}, which already names the location; a reference to it could replace location and the root reference
    status: open

