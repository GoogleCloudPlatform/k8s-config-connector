# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: AgentRegistryService
    group: agentregistry.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: resolved
    resolution: accepted
    note: triaged all findings; updated parent to inlined *parent.ProjectAndLocationRef, resolved docs link, and verified KRM types, identity, and references
  - kind: AgentRegistryService
    group: agentregistry.cnrm.cloud.google.com
    reason: verify-resource-docs-link
    detail: 'none of these loaded as a page ending in /v1/projects.locations.services: https://docs.cloud.google.com/agent-registry/overview/docs/reference/rest/v1/projects.locations.services'
    status: resolved
    resolution: edited
    note: updated service-docs link to valid cloud.google.com overview page, removed non-existent resource-docs URL and guess annotation
  - kind: AgentRegistryService
    group: agentregistry.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: parent.ProjectAndLocationRef in apis/common/parent, inlined, could replace projectRef and location; the CRD keeps the same keys
    status: resolved
    resolution: edited
    note: replaced ProjectRef and Location with inlined *parent.ProjectAndLocationRef
  - kind: AgentRegistrySkill
    group: agentregistry.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: resolved
    resolution: accepted
    note: triaged all findings; inlined *parent.ProjectAndLocationRef, resolved docs link, converted defaultRevision and publisher to references, moved SkillRevision to handwritten types without server identifier, and verified KRM types, identity, and references
  - kind: AgentRegistrySkill
    group: agentregistry.cnrm.cloud.google.com
    reason: verify-resource-docs-link
    detail: 'none of these loaded as a page ending in /v1/projects.locations.skills: https://docs.cloud.google.com/agent-registry/overview/docs/reference/rest/v1/projects.locations.skills'
    status: resolved
    resolution: edited
    note: updated service-docs link to valid cloud.google.com overview page, removed non-existent resource-docs URL and guess annotation
  - kind: AgentRegistrySkill
    group: agentregistry.cnrm.cloud.google.com
    field: .spec.defaultRevision
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to agentregistry.googleapis.com/SkillRevision (google.api.resource_reference); confirm whether it should be a KCC reference
    status: resolved
    resolution: edited
    note: converted to defaultRevisionRef (*AgentRegistrySkillRevisionRef)
  - kind: AgentRegistrySkill
    group: agentregistry.cnrm.cloud.google.com
    field: .spec.initialRevision.gcsSource.uri
    reason: reference-not-representable
    detail: 'gcs-path-decomposable-as-bucketref-plus-path: names another resource, but KCC cannot express it as a reference today, so it stays a string'
    status: resolved
    resolution: accepted
    note: GCS URI names a Cloud Storage object and cannot be represented as a typed reference in KCC today; stays a string
  - kind: AgentRegistrySkill
    group: agentregistry.cnrm.cloud.google.com
    field: .spec.initialRevision.name
    reason: possible-reference-by-description
    detail: the description has the resource-name template "projects/{project}/locations/{location}/skills/{skill}/revisions/{revision}"
    status: resolved
    resolution: edited
    note: removed server-assigned identifier field from nested initialRevision spec struct
  - kind: AgentRegistrySkill
    group: agentregistry.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: parent.ProjectAndLocationRef in apis/common/parent, inlined, could replace projectRef and location; the CRD keeps the same keys
    status: resolved
    resolution: edited
    note: replaced ProjectRef and Location with inlined *parent.ProjectAndLocationRef
  - kind: AgentRegistrySkill
    group: agentregistry.cnrm.cloud.google.com
    field: .spec.publisher
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to agentregistry.googleapis.com/Publisher (google.api.resource_reference); confirm whether it should be a KCC reference
    status: resolved
    resolution: edited
    note: converted to publisherRef (*AgentRegistryPublisherRef)
