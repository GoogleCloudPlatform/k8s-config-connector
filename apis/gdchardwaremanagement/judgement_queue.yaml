# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: GDCHardwareManagementHardware
    group: gdchardwaremanagement.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: GDCHardwareManagementHardware
    group: gdchardwaremanagement.cnrm.cloud.google.com
    field: .spec.order
    reason: possible-reference
    detail: the proto marks this field as a reference to gdchardwaremanagement.googleapis.com/Order (google.api.resource_reference); confirm whether it should be a KCC reference
    status: open
  - kind: GDCHardwareManagementHardware
    group: gdchardwaremanagement.cnrm.cloud.google.com
    field: .spec.site
    reason: possible-reference
    detail: the proto marks this field as a reference to gdchardwaremanagement.googleapis.com/Site (google.api.resource_reference); confirm whether it should be a KCC reference
    status: open
  - kind: GDCHardwareManagementHardware
    group: gdchardwaremanagement.cnrm.cloud.google.com
    field: .spec.zone
    reason: possible-reference
    detail: the proto marks this field as a reference to gdchardwaremanagement.googleapis.com/Zone (google.api.resource_reference); confirm whether it should be a KCC reference
    status: open
  - kind: GDCHardwareManagementHardware
    group: gdchardwaremanagement.cnrm.cloud.google.com
    field: .spec.order
    reason: possible-reference-by-description
    detail: the description has the resource-name template "projects/{project}/locations/{location}/orders/{order}"
    status: open
  - kind: GDCHardwareManagementHardware
    group: gdchardwaremanagement.cnrm.cloud.google.com
    field: .spec.site
    reason: possible-reference-by-description
    detail: the description has the resource-name template "projects/{project}/locations/{location}/sites/{site}"
    status: open
  - kind: GDCHardwareManagementHardware
    group: gdchardwaremanagement.cnrm.cloud.google.com
    field: .spec.config.sku
    reason: possible-reference
    detail: the proto marks this field as a reference to gdchardwaremanagement.googleapis.com/Sku (google.api.resource_reference); confirm whether it should be a KCC reference
    status: open
  - kind: GDCHardwareManagementHardware
    group: gdchardwaremanagement.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: parent.ProjectAndLocationRef in apis/common/parent, inlined, could replace projectRef and location; the CRD keeps the same keys
    status: open
  - kind: GDCHardwareManagementHardware
    group: gdchardwaremanagement.cnrm.cloud.google.com
    reason: identity-not-in-cai
    detail: template "//gdchardwaremanagement.googleapis.com/projects/{project}/locations/{location}/hardware/{hardware}" is not listed in docs/ai/metadata/cloudassetinventory_names.jsonl; verify the URL format or add an exception in pkg/gcpurls/registry_test.go
    status: open
