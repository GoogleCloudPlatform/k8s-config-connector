    detail: the parent is projects/{project}/locations/{location}/glossaries/{glossary}, and no GlossaryRef type exists to point at; add the parent resource first, then model this as a reference
    status: open
  - kind: TranslateGlossaryEntry
    group: translate.cnrm.cloud.google.com
