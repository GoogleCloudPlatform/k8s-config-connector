    status: open
  - kind: TranslateGlossary
    group: translate.cnrm.cloud.google.com
    reason: identity-server-generated-id
    detail: generated TranslateGlossaryIdentity implements identity.ServerGeneratedIdentity because the Create RPC has no *_id parameter; confirm whether the resource ID is truly server-generated or client-specified in .name
    status: open
  - kind: TranslateGlossary
    group: translate.cnrm.cloud.google.com
    reason: verify-resource-docs-link
    detail: 'none of these loaded as a page ending in /v3/projects.locations.glossaries: https://docs.cloud.google.com/translate/docs/quickstarts/reference/rest/v3/projects.locations.glossaries'
    status: open
  - kind: TranslateGlossary
    group: translate.cnrm.cloud.google.com
    field: .spec.inputConfig.gcsSource.inputURI
    reason: reference-not-representable
    detail: 'gcs-path-decomposable-as-bucketref-plus-path: names another resource, but KCC cannot express it as a reference today, so it stays a string'
    status: open
  - kind: TranslateGlossary
    group: translate.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: parent.ProjectAndLocationRef in apis/common/parent, inlined, could replace projectRef and location; the CRD keeps the same keys
    status: open
  - kind: TranslateGlossaryEntry
    group: translate.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: TranslateGlossaryEntry
    group: translate.cnrm.cloud.google.com
    reason: empty-observedstate
    detail: nothing was generated into status.observedState; the proto probably marks no field OUTPUT_ONLY, so output fields landed in the Spec. Decide what belongs in status
    status: open
  - kind: TranslateGlossaryEntry
    group: translate.cnrm.cloud.google.com
    reason: identity-not-in-cai
    detail: template "//translate.googleapis.com/projects/{project}/locations/{location}/glossaries/{glossary}/glossaryEntries/{glossary_entry}" is not listed in docs/ai/metadata/cloudassetinventory_names.jsonl; verify the URL format or add an exception in pkg/gcpurls/registry_test.go
    status: open
  - kind: TranslateGlossaryEntry
    group: translate.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{project}/locations/{location}/glossaries/{glossary}/glossaryEntries/{glossary_entry}" contains ancestor segment(s) glossaries/{glossary} with no matching reference or field on TranslateGlossaryEntrySpec
    status: open
  - kind: TranslateGlossaryEntry
    group: translate.cnrm.cloud.google.com
    reason: identity-server-generated-id
    detail: generated TranslateGlossaryEntryIdentity implements identity.ServerGeneratedIdentity because the Create RPC has no *_id parameter; confirm whether the resource ID is truly server-generated or client-specified in .name
    status: open
  - kind: TranslateGlossaryEntry
