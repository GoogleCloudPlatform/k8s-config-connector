# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: ConfigDeployment
    group: configdeployment.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: ConfigDeployment
    group: configdeployment.cnrm.cloud.google.com
    field: .spec.artifactsGCSBucket
    reason: possible-reference-by-description
    detail: the field name has bucket and the description mentions Cloud Storage
    status: open
  - kind: ConfigDeployment
    group: configdeployment.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: parent.ProjectAndLocationRef in apis/common/parent, inlined, could replace projectRef and location; the CRD keeps the same keys
    status: open
  - kind: ConfigDeployment
    group: configdeployment.cnrm.cloud.google.com
    field: .spec.serviceAccount
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to iam.googleapis.com/ServiceAccount (google.api.resource_reference); confirm whether it should be a KCC reference
    status: open
  - kind: ConfigDeployment
    group: configdeployment.cnrm.cloud.google.com
    field: .spec.terraformBlueprint.externalValues
    reason: message-map-derived
    detail: derived as map[string]ExternalValueSource from proto google.cloud.config.v1.ExternalValueSource; verify Go type and mapping
    status: open
  - kind: ConfigDeployment
    group: configdeployment.cnrm.cloud.google.com
    field: .spec.terraformBlueprint.externalValues.KEY.deploymentSource.deployment
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to config.googleapis.com/Deployment (google.api.resource_reference); confirm whether it should be a KCC reference
    status: open
  - kind: ConfigDeployment
    group: configdeployment.cnrm.cloud.google.com
    field: .spec.terraformBlueprint.gcsSource
    reason: reference-not-representable
    detail: 'gcs-path-decomposable-as-bucketref-plus-path: names another resource, but KCC cannot express it as a reference today, so it stays a string'
    status: open
  - kind: ConfigDeployment
    group: configdeployment.cnrm.cloud.google.com
    field: .spec.terraformBlueprint.inputValues
    reason: message-map-derived
    detail: derived as map[string]TerraformVariable from proto google.cloud.config.v1.TerraformVariable; verify Go type and mapping
    status: open
  - kind: ConfigDeployment
    group: configdeployment.cnrm.cloud.google.com
    field: .spec.terraformBlueprint.inputValues.KEY.inputValue
    reason: well-known-proto-type
    detail: field uses well-known protobuf type google.protobuf.Value, which was generated as struct Value; confirm KRM representation
    status: open
  - kind: ConfigDeployment
    group: configdeployment.cnrm.cloud.google.com
    field: .spec.workerPool
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to cloudbuild.googleapis.com/WorkerPool (google.api.resource_reference); confirm whether it should be a KCC reference
    status: open
  - kind: ConfigDeployment
    group: configdeployment.cnrm.cloud.google.com
    field: .status.observedState.deleteResults.outputs
    reason: message-map-derived
    detail: derived as map[string]TerraformOutput from proto google.cloud.config.v1.TerraformOutput; verify Go type and mapping
    status: open
  - kind: ConfigDeployment
    group: configdeployment.cnrm.cloud.google.com
    field: .status.observedState.deleteResults.outputs.KEY.value
    reason: well-known-proto-type
    detail: field uses well-known protobuf type google.protobuf.Value, which was generated as struct Value; confirm KRM representation
    status: open
