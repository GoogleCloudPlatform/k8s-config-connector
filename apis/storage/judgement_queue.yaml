# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: StorageRapidCache
    group: storage.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: StorageRapidCache
    group: storage.cnrm.cloud.google.com
    reason: identity-multi-pattern
    detail: proto message google.storage.control.v2.RapidCache declares 2 resource name patterns (projects/{project}/buckets/{bucket}/rapidCaches/{rapid_cache}, b/{bucket}/rapidCaches/{rapidcacheid}); generated identity uses "b/{bucket}/rapidCaches/{rapidcacheid}" (pass --pattern StorageRapidCache=<pattern> to override)
    status: open
  - kind: StorageRapidCache
    group: storage.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "b/{bucket}/rapidCaches/{rapidcacheid}" contains ancestor segment(s) b/{bucket} with no matching reference or field on StorageRapidCacheSpec
    status: open
  - kind: StorageRapidCache
    group: storage.cnrm.cloud.google.com
    reason: identity-server-generated-id
    detail: generated StorageRapidCacheIdentity implements identity.ServerGeneratedIdentity because the Create RPC has no *_id parameter; confirm whether the resource ID is truly server-generated or client-specified in .name
    status: open
  - kind: StorageRapidCache
    group: storage.cnrm.cloud.google.com
    reason: parent-ref-not-modelled
    detail: the parent is projects/{project}/buckets/{bucket}, and no BucketRef type exists to point at; add the parent resource first, then model this as a reference
    status: open
  - kind: StorageRapidCache
    group: storage.cnrm.cloud.google.com
    reason: verify-resource-docs-link
    detail: 'none of these loaded as a page ending in /v2/projects.buckets.rapidCaches: https://docs.cloud.google.com/storage/docs/apis/reference/rest/v2/projects.buckets.rapidCaches, https://docs.cloud.google.com/storage/docs/reference/rest/v2/projects.buckets.rapidCaches, https://docs.cloud.google.com/storage/docs/json_api/v2/projects.buckets.rapidCaches'
    status: open
  - kind: StorageRapidCache
    group: storage.cnrm.cloud.google.com
    field: .spec.zone
    reason: location-or-parent-ref
    detail: proto defines a zone field in Spec; confirm whether it should be a reference, replaced by a parent reference, or kept as a plain string
    status: open
