# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: MapmanagementMapContextConfig
    group: mapmanagement.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: resolved
    resolution: edited
    note: triaged spec refs, parent MapConfigRef, docs links, and server-generated identity
  - kind: MapmanagementMapContextConfig
    group: mapmanagement.cnrm.cloud.google.com
    reason: identity-not-in-cai
    detail: template "//mapmanagement.googleapis.com/projects/{project}/mapConfigs/{map_config}/mapContextConfigs/{map_context_config}" is not listed in docs/ai/metadata/cloudassetinventory_names.jsonl; verify the URL format or add an exception in pkg/gcpurls/registry_test.go
    status: resolved
    resolution: accepted
    note: verified template against proto google.api.resource pattern
  - kind: MapmanagementMapContextConfig
    group: mapmanagement.cnrm.cloud.google.com
    reason: identity-server-generated-id
    detail: generated MapmanagementMapContextConfigIdentity implements identity.ServerGeneratedIdentity because the Create RPC has no *_id parameter; confirm whether the resource ID is truly server-generated or client-specified in .name
    status: resolved
    resolution: accepted
    note: CreateMapContextConfigRequest has no map_context_config_id parameter and MapContextConfig.name is OUTPUT_ONLY
  - kind: MapmanagementMapContextConfig
    group: mapmanagement.cnrm.cloud.google.com
    reason: parent-ref-not-modelled
    detail: the parent is projects/{project}/mapConfigs/{map_config}, and no MapConfigRef type exists to point at; add the parent resource first, then model this as a reference
    status: resolved
    resolution: edited
    note: added MapManagementMapConfigRef and replaced ProjectRef and MapConfig with MapConfigRef
  - kind: MapmanagementMapContextConfig
    group: mapmanagement.cnrm.cloud.google.com
    reason: verify-resource-docs-link
    detail: found no docs root for this API; find the REST reference page by hand
    status: resolved
    resolution: edited
    note: added resource docs URL and removed guess annotation
  - kind: MapmanagementMapContextConfig
    group: mapmanagement.cnrm.cloud.google.com
    reason: verify-service-docs-link
    detail: neither the Discovery directory nor the service config names a docs page; add one
    status: resolved
    resolution: edited
    note: added service docs URL and removed guess annotation
  - kind: MapmanagementMapContextConfig
    group: mapmanagement.cnrm.cloud.google.com
    field: .spec.dataset
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to mapmanagement.googleapis.com/Dataset (google.api.resource_reference); confirm whether it should be a KCC reference
    status: resolved
    resolution: edited
    note: converted Dataset to DatasetRefs ([]MapManagementDatasetRef)
  - kind: MapmanagementMapContextConfig
    group: mapmanagement.cnrm.cloud.google.com
    field: .spec.mapConfig
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to mapmanagement.googleapis.com/MapConfig (google.api.resource_reference); confirm whether it should be a KCC reference
    status: resolved
    resolution: edited
    note: converted MapConfig to MapConfigRef (*MapManagementMapConfigRef)
  - kind: MapmanagementMapContextConfig
    group: mapmanagement.cnrm.cloud.google.com
    field: .spec.styleConfig
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to mapmanagement.googleapis.com/StyleConfig (google.api.resource_reference); confirm whether it should be a KCC reference
    status: resolved
    resolution: edited
    note: converted StyleConfig to StyleConfigRef (*MapManagementStyleConfigRef)
