# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: AppEngineAuthorizedCertificate
    group: appengine.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: AppEngineAuthorizedCertificate
    group: appengine.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "apps/{app}/authorizedCertificates/{authorized_certificate}" contains ancestor segment(s) apps/{app} with no matching reference or field on AppEngineAuthorizedCertificateSpec
    status: open
  - kind: AppEngineAuthorizedCertificate
    group: appengine.cnrm.cloud.google.com
    reason: identity-server-generated-id
    detail: generated AppEngineAuthorizedCertificateIdentity implements identity.ServerGeneratedIdentity because the Create RPC has no *_id parameter; confirm whether the resource ID is truly server-generated or client-specified in .name
    status: open
  - kind: AppEngineAuthorizedCertificate
    group: appengine.cnrm.cloud.google.com
    reason: verify-resource-docs-link
    detail: the proto declares no google.api.resource pattern, so the page for this resource could not be derived; this is a guess at the API's REST reference, find the resource in it
    status: open
  - kind: AppEngineAuthorizedCertificate
    group: appengine.cnrm.cloud.google.com
    field: .spec.location
    reason: location-parent-unknown
    detail: the proto declares no google.api.resource, so the parent shape is unknown; drop location if the resource is not regional
    status: open
  - kind: AppEngineAuthorizedCertificate
    group: appengine.cnrm.cloud.google.com
    field: .status.observedState.id
    reason: server-set-field-placed
    detail: 'moved to ObservedState because its name is on the server-set allowlist, not because the proto says so: no field on this message carries field_behavior. Confirm GCP sets this field instead of a user'
    status: open
  - kind: AppEngineDomainMapping
    group: appengine.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "apps/{app}/domainMappings/{domain_mapping}" contains ancestor segment(s) apps/{app} with no matching reference or field on AppEngineDomainMappingSpec
    status: open
  - kind: AppEngineDomainMapping
    group: appengine.cnrm.cloud.google.com
    reason: identity-server-generated-id
    detail: generated AppEngineDomainMappingIdentity implements identity.ServerGeneratedIdentity because the Create RPC has no *_id parameter; confirm whether the resource ID is truly server-generated or client-specified in .name
    status: open
  - kind: AppEngineFirewallRule
    group: appengine.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "apps/{app}/firewall/ingressRules/{ingress_rule}" contains ancestor segment(s) apps/{app} with no matching reference or field on AppEngineFirewallRuleSpec
    status: open
  - kind: AppEngineFlexibleAppVersion
    group: appengine.cnrm.cloud.google.com
    reason: identity-server-generated-id
    detail: generated AppEngineFlexibleAppVersionIdentity implements identity.ServerGeneratedIdentity because the Create RPC has no *_id parameter; confirm whether the resource ID is truly server-generated or client-specified in .name
    status: open
  - kind: AppEngineServiceSplitTraffic
    group: appengine.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "apps/{app}/services/{service}" contains ancestor segment(s) apps/{app} with no matching reference or field on AppEngineServiceSplitTrafficSpec
    status: open
  - kind: AppEngineStandardAppVersion
    group: appengine.cnrm.cloud.google.com
    reason: identity-server-generated-id
    detail: generated AppEngineStandardAppVersionIdentity implements identity.ServerGeneratedIdentity because the Create RPC has no *_id parameter; confirm whether the resource ID is truly server-generated or client-specified in .name
    status: resolved
    resolution: edited
    note: Resource ID is client-specified; defaults to metadata.name when spec.resourceID is unset. Implemented IdentityV2 instead of ServerGeneratedIdentity.
