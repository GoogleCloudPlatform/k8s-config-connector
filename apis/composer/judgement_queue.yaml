    detail: pattern "projects/{project}/locations/{location}/environments/{environment}/userWorkloadsSecrets/{user_workloads_secret}" contains ancestor segment(s) environments/{environment} with no matching reference or field on ComposerUserWorkloadsSecretSpec
    status: open
