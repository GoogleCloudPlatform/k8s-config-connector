# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: ComposerUserWorkloadsConfigMap
    group: composer.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: ComposerUserWorkloadsConfigMap
    group: composer.cnrm.cloud.google.com
    reason: empty-observedstate
    detail: nothing was generated into status.observedState; the proto probably marks no field OUTPUT_ONLY, so output fields landed in the Spec. Decide what belongs in status
    status: open
  - kind: ComposerUserWorkloadsConfigMap
    group: composer.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: the parent is projects/{project}/locations/{location}/environments/{environment}, which already names the location; a reference to it could replace location and the root reference
    status: open
  - kind: ComposerUserWorkloadsConfigMap
    group: composer.cnrm.cloud.google.com
    reason: parent-ref-not-modelled
    detail: the parent is projects/{project}/locations/{location}/environments/{environment}, and no EnvironmentRef type exists to point at; add the parent resource first, then model this as a reference
    status: open
  - kind: ComposerUserWorkloadsSecret
    group: composer.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: ComposerUserWorkloadsSecret
    group: composer.cnrm.cloud.google.com
    reason: empty-observedstate
    detail: nothing was generated into status.observedState; the proto probably marks no field OUTPUT_ONLY, so output fields landed in the Spec. Decide what belongs in status
    status: open
  - kind: ComposerUserWorkloadsSecret
    group: composer.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: the parent is projects/{project}/locations/{location}/environments/{environment}, which already names the location; a reference to it could replace location and the root reference
    status: open
  - kind: ComposerUserWorkloadsSecret
    group: composer.cnrm.cloud.google.com
    reason: parent-ref-not-modelled
    detail: the parent is projects/{project}/locations/{location}/environments/{environment}, and no EnvironmentRef type exists to point at; add the parent resource first, then model this as a reference
    status: open
  - kind: ComposerUserWorkloadsConfigMap
    group: composer.cnrm.cloud.google.com
    reason: identity-not-in-cai
    detail: template "//composer.googleapis.com/projects/{project}/locations/{location}/environments/{environment}/userWorkloadsConfigMaps/{user_workloads_config_map}" is not listed in docs/ai/metadata/cloudassetinventory_names.jsonl; verify the URL format or add an exception in pkg/gcpurls/registry_test.go
    status: open
  - kind: ComposerUserWorkloadsConfigMap
    group: composer.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{project}/locations/{location}/environments/{environment}/userWorkloadsConfigMaps/{user_workloads_config_map}" contains ancestor segment(s) environments/{environment} with no matching reference or field on ComposerUserWorkloadsConfigMapSpec
    status: open
  - kind: ComposerUserWorkloadsSecret
    group: composer.cnrm.cloud.google.com
    reason: identity-not-in-cai
    detail: template "//composer.googleapis.com/projects/{project}/locations/{location}/environments/{environment}/userWorkloadsSecrets/{user_workloads_secret}" is not listed in docs/ai/metadata/cloudassetinventory_names.jsonl; verify the URL format or add an exception in pkg/gcpurls/registry_test.go
    status: open
  - kind: ComposerUserWorkloadsSecret
    group: composer.cnrm.cloud.google.com
