    reason: required-not-enforced
    detail: The proto marks this field REQUIRED, but the CRD leaves it optional. CloudControlDetails in cloudsecuritycomplianceframework_types.go is also used by CloudSecurityComplianceFramework. +required on CloudControlDetails.MajorRevisionID would apply there too. To enforce it for CloudSecurityComplianceFrameworkDeployment only, give CloudSecurityComplianceFrameworkDeployment its own copy of CloudControlDetails. CloudSecurityComplianceFrameworkDeployment is alpha, so it may be enforced, but that breaks objects that leave the field out if the Kind has shipped.
