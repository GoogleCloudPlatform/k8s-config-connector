# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: BigLakeIcebergCatalog
    group: bigquerybiglake.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: resolved
    resolution: edited
    note: triaged all queue entries, verified projects/{project}/catalogs/{catalog} pattern, converted secretRef and serviceDirectoryRef references, resolved doc links and output-only comments
  - kind: BigLakeIcebergCatalog
    group: bigquerybiglake.cnrm.cloud.google.com
    reason: identity-multi-pattern
    detail: proto message google.cloud.biglake.v1.IcebergCatalog declares 2 resource name patterns (projects/{project}/catalogs/{catalog}, projects/{projectsid}/locations/{locationsid}/catalogs/{catalogsid}); generated identity uses "projects/{projectsid}/locations/{locationsid}/catalogs/{catalogsid}" (pass --pattern BigLakeIcebergCatalog=<pattern> to override)
    status: resolved
    resolution: edited
    note: selected canonical projects/{project}/catalogs/{catalog} pattern via --pattern in generate.sh
  - kind: BigLakeIcebergCatalog
    group: bigquerybiglake.cnrm.cloud.google.com
    reason: identity-not-in-cai
    detail: template "//biglake.googleapis.com/projects/{project}/catalogs/{catalog}" is not listed in docs/ai/metadata/cloudassetinventory_names.jsonl; verify the URL format or add an exception in pkg/gcpurls/registry_test.go
    status: resolved
    resolution: accepted
    note: verified template against proto google.api.resource pattern and added exception in pkg/gcpurls/registry_test.go
  - kind: BigLakeIcebergCatalog
    group: bigquerybiglake.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{projectsid}/locations/{locationsid}/catalogs/{catalogsid}" contains ancestor segment(s) locations/{locationsid} with no matching reference or field on BigLakeIcebergCatalogSpec
    status: resolved
    resolution: not-applicable
    note: overridden pattern projects/{project}/catalogs/{catalog} has no location segment; parent project is modeled by projectRef
  - kind: BigLakeIcebergCatalog
    group: bigquerybiglake.cnrm.cloud.google.com
    reason: verify-resource-docs-link
    detail: 'none of these loaded as a page ending in /v1/projects.catalogs: https://docs.cloud.google.com/products/lakehouse/docs/reference/rest/v1/projects.catalogs, https://docs.cloud.google.com/bigquery/docs/reference/rest/v1/projects.catalogs'
    status: resolved
    resolution: edited
    note: updated resource-docs URL to https://cloud.google.com/bigquery/docs/iceberg-rest-catalog-about
  - kind: BigLakeIcebergCatalog
    group: bigquerybiglake.cnrm.cloud.google.com
    field: .spec.defaultLocation
    reason: reference-not-representable
    detail: 'gcs-path-decomposable-as-bucketref-plus-path: names another resource, but KCC cannot express it as a reference today, so it stays a string'
    status: resolved
    resolution: accepted
    note: gcs path decomposable as bucketref plus path stays string
  - kind: BigLakeIcebergCatalog
    group: bigquerybiglake.cnrm.cloud.google.com
    field: .spec.federatedCatalogOptions.secretName
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to secretmanager.googleapis.com/Secret (google.api.resource_reference); confirm whether it should be a KCC reference
    status: resolved
    resolution: edited
    note: converted to secretRef (*secretmanagerv1beta1.SecretManagerSecretRef)
  - kind: BigLakeIcebergCatalog
    group: bigquerybiglake.cnrm.cloud.google.com
    field: .spec.federatedCatalogOptions.serviceDirectoryName
    reason: authoritative-proto-reference
    detail: the proto marks this field as a reference to servicedirectory.googleapis.com/Service (google.api.resource_reference); confirm whether it should be a KCC reference
    status: resolved
    resolution: edited
    note: converted to serviceDirectoryRef (*servicedirectoryv1beta1.ServiceDirectoryServiceRef)
  - kind: BigLakeIcebergCatalog
    group: bigquerybiglake.cnrm.cloud.google.com
    field: .spec.federatedCatalogOptions.unityCatalogInfo.servicePrincipalApplicationID
    reason: possible-reference-by-name
    detail: the field name ends in ID/IDs; confirm whether it references another resource
    status: resolved
    resolution: not-applicable
    note: Databricks service principal application UUID, not a GCP resource
  - kind: BigLakeIcebergCatalog
    group: bigquerybiglake.cnrm.cloud.google.com
    field: .spec.restrictedLocationsConfig.restrictedLocations
    reason: reference-not-representable
    detail: 'gcs-path-decomposable-as-bucketref-plus-path: names another resource, but KCC cannot express it as a reference today, so it stays a string'
    status: resolved
    resolution: accepted
    note: gcs path decomposable as bucketref plus path stays string
  - kind: BigLakeIcebergCatalog
    group: bigquerybiglake.cnrm.cloud.google.com
    field: .status.observedState.defaultLocation
    reason: possible-output-only-pattern-in-comment
    detail: 'proto comment mentions output only but doesn''t start with "Output only." or "[Output Only]", and there is no field_behavior annotation, so it was generated into the Spec at .spec.defaultLocation. The comment may be a typo, apply only some of the time, or mean something else. Move the field to .status.observedState.defaultLocation if it is confirmed output only. Proto comment: Optional. The default storage location for the catalog, e.g., `gs://my-bucket`. For Google Cloud Storage bucket catalogs, this is output only. For BigLake catalogs, this field must be provided and point to a Google Cloud Storage bucket or a path within that bucket. This path serves as the base directory for constructing the full path to a table''s data and metadata directories when a location is not specified at the namespace or table level. The full path is formed by appending the namespace and table identifiers to the default location.'
    status: resolved
    resolution: not-applicable
    note: field is user-configurable in Spec for BigLake catalogs (output-only applies only to GCS bucket catalogs)
  - kind: BigLakeIcebergNamespace
    group: bigquerybiglake.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: BigLakeIcebergNamespace
    group: bigquerybiglake.cnrm.cloud.google.com
    reason: empty-observedstate
    detail: nothing was generated into status.observedState; the proto probably marks no field OUTPUT_ONLY, so output fields landed in the Spec. Decide what belongs in status
    status: open
  - kind: BigLakeIcebergNamespace
    group: bigquerybiglake.cnrm.cloud.google.com
    reason: identity-not-in-cai
    detail: template "//biglake.googleapis.com/projects/{project}/catalogs/{catalog}/namespaces/{namespace}" is not listed in docs/ai/metadata/cloudassetinventory_names.jsonl; verify the URL format or add an exception in pkg/gcpurls/registry_test.go
    status: open
  - kind: BigLakeIcebergNamespace
    group: bigquerybiglake.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{project}/catalogs/{catalog}/namespaces/{namespace}" contains ancestor segment(s) catalogs/{catalog} with no matching reference or field on BigLakeIcebergNamespaceSpec
    status: open
  - kind: BigLakeIcebergNamespace
    group: bigquerybiglake.cnrm.cloud.google.com
    reason: identity-server-generated-id
    detail: generated BigLakeIcebergNamespaceIdentity implements identity.ServerGeneratedIdentity because the Create RPC has no *_id parameter; confirm whether the resource ID is truly server-generated or client-specified in .name
    status: open
  - kind: BigLakeIcebergNamespace
    group: bigquerybiglake.cnrm.cloud.google.com
    reason: verify-resource-docs-link
    detail: the proto declares no google.api.resource pattern, so the page for this resource could not be derived; this is a guess at the API's REST reference, find the resource in it
    status: open
  - kind: BigLakeIcebergNamespace
    group: bigquerybiglake.cnrm.cloud.google.com
    field: .spec.location
    reason: location-parent-unknown
    detail: the proto declares no google.api.resource, so the parent shape is unknown; drop location if the resource is not regional
    status: open
