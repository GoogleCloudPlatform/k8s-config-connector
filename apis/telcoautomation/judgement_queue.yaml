    reason: verify-resource-docs-link
    detail: 'none of these loaded as a page ending in /v1/projects.locations.orchestrationClusters.deployments: https://docs.cloud.google.com/telecom-network-automation/docs/reference/rest/v1/projects.locations.orchestrationClusters.deployments'
    status: open
  - kind: TelcoAutomationDeployment
