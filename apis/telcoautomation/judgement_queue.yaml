    status: open
  - kind: TelcoAutomationBlueprint
    group: telcoautomation.cnrm.cloud.google.com
    reason: identity-not-in-cai
    detail: template "//telcoautomation.googleapis.com/projects/{project}/locations/{location}/orchestrationClusters/{orchestration_cluster}/blueprints/{blueprint}" is not listed in docs/ai/metadata/cloudassetinventory_names.jsonl; verify the URL format or add an exception in pkg/gcpurls/registry_test.go
    status: open
  - kind: TelcoAutomationBlueprint
