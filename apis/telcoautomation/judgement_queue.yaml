    reason: location-or-parent-ref
    detail: the parent is projects/{project}/locations/{location}/orchestrationClusters/{orchestration_cluster}, which already names the location; a reference to it could replace location and the root reference
    status: open
  - kind: TelcoAutomationDeployment
