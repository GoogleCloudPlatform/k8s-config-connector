# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: ApihubSpec
    group: apihub.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: ApihubSpec
    group: apihub.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "projects/{project}/locations/{location}/apis/{api}/versions/{version}/specs/{spec}" contains ancestor segment(s) apis/{api}, versions/{version} with no matching reference or field on ApihubSpecSpec
    status: open
  - kind: ApihubSpec
    group: apihub.cnrm.cloud.google.com
    field: .spec.attributes
    reason: message-map-derived
    detail: derived as map[string]AttributeValues from proto google.cloud.apihub.v1.AttributeValues; verify Go type and mapping
    status: open
  - kind: ApihubSpec
    group: apihub.cnrm.cloud.google.com
    field: .spec.attributes
    reason: possible-reference-by-description
    detail: the description has the resource-name template "projects/{project}/locations/{location}/attributes/{attribute}"
    status: open
  - kind: ApihubSpec
    group: apihub.cnrm.cloud.google.com
    field: .spec.attributes.KEY.uriValues
    reason: reference-not-representable
    detail: 'gcs-path-decomposable-as-bucketref-plus-path: names another resource, but KCC cannot express it as a reference today, so it stays a string'
    status: open
  - kind: ApihubSpec
    group: apihub.cnrm.cloud.google.com
    field: .spec.location
    reason: location-or-parent-ref
    detail: the parent is projects/{project}/locations/{location}/apis/{api}/versions/{version}, which already names the location; a reference to it could replace location and the root reference
    status: open
  - kind: ApihubSpec
    group: apihub.cnrm.cloud.google.com
    field: .spec.specType
    reason: possible-reference-by-description
    detail: the description has the resource-name template "projects/{project}/locations/{location}/attributes/system-spec-type"
    status: open
  - kind: ApihubSpec
    group: apihub.cnrm.cloud.google.com
    field: .spec.specType.uriValues
    reason: reference-not-representable
    detail: 'gcs-path-decomposable-as-bucketref-plus-path: names another resource, but KCC cannot express it as a reference today, so it stays a string'
    status: open
  - kind: ApihubSpec
    group: apihub.cnrm.cloud.google.com
    field: .spec.versionRef
    reason: parent-ref-guessed
    detail: emitted as a reference to APIHubVersionRef, read from the versions segment of projects/{project}/locations/{location}/apis/{api}/versions/{version}/specs/{spec}; the field name comes from the pattern rather than the proto, so confirm both the name and the target
    status: open
